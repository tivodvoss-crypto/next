* { box-sizing: border-box; }
html, body { margin: 0; background: var(--grund); color: var(--text); }
body { font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

[hidden] { display: none !important; }

    s += `</g>`;
    // Level-Abzeichen
    s += `<g class="abzeichen"><circle cx="168" cy="190" r="22" fill="#111827" stroke="#fff" stroke-width="3"/><text x="168" y="197" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" font-family="system-ui,sans-serif">${level}</text></g>`;
    return s + `</svg>`;
  }

  return { TEILE, REIHENFOLGE, STANDARD, wahl, frei, neuAb, svg };
})();

</script>
<script>
// NEXT Spiel (Entwurf, 10.11.2026): dieselben Inhalte wie NEXT 4, aber als
// Spiel aufgezogen. Jackys Rückmeldung: zu kompliziert, zu verschachtelt.
//
// Der Kreislauf ist das ganze Spiel:
//   Quest-Karte wählen, im echten Leben machen, zurückkommen, Punkte
//   bekommen, die Figur wächst und schaltet Neues frei.
//
// Was bewusst NICHT im Spiel steckt:
//   - Hilfe und Notfall geben keine Punkte. Krisen sind kein Spielinhalt.
//   - Nichts geht verloren: keine Serien, die reißen, kein Abzug.
//   - Punkte gibt es nur für das Zurückmelden nach echtem Tun, nicht für
//     Zeit in der App.

(function () {
  "use strict";
  const B = window.NEXT_BESTAND, I = window.NEXT_INHALT, F = window.NEXT_FIGUR;
  const SPEICHER = "next-spiel-v1";

  // ---------------------------------------------------------------- Zustand

  function leer() {
    const st = {}; I.AESTE.forEach(a => { st[a.id] = 0; });
    return {
      version: 1, name: "", eingerichtet: false, figur: { ...F.STANDARD }, xp: 0, staerken: st, gefeiertBis: 1,
      heute: { datum: "", karten: [], erledigt: [], tausch: 0 }, laufend: null, log: [],
      morgen: { schritte: I.MORGEN.map(s => ({ ...s })) }, schule: { etappen: [], planB: { kontakt: "", ort: "", schritt: "" } },
      koffer: [], kontakte: [], warnzeichen: [], notfall: "", interessen: [], post: [], fach: { pin: "" }
    };
  }

  let S;
  function laden() {
    try { const r = localStorage.getItem(SPEICHER); if (r) return ergaenzen(JSON.parse(r)); } catch (e) { /* neu */ }
    const z = leer();
    try { const alt = localStorage.getItem("next-v4"); if (alt) uebernehmen(z, JSON.parse(alt)); } catch (e) { /* ohne */ }
    return z;
  }
  function ergaenzen(z) {
    const l = leer();
    for (const k of Object.keys(l)) if (z[k] === undefined || z[k] === null && l[k] !== null) z[k] = l[k];
    for (const a of I.AESTE) if (typeof z.staerken[a.id] !== "number") z.staerken[a.id] = 0;
    z.figur = Object.assign({}, F.STANDARD, z.figur);
    return z;
  }
  // Übernahme aus NEXT 4 (gleiche Adresse, gleicher Speicher im Browser).
  // Jede alte Knospe wird zu Punkten und zu einer Stärke.
  function uebernehmen(z, a) {
    if (!a || typeof a !== "object") return;
    if (a.profil && a.profil.name) z.name = a.profil.name;
    if (a.hilfe) {
      z.kontakte = (a.hilfe.kontakte || []).map(k => ({ id: k.id || neueId(), name: k.name, telefon: k.telefon || "", rolle: k.rolle || "" }));
      z.warnzeichen = (a.hilfe.warnzeichen || []).slice();
      z.notfall = (a.hilfe.stufen && a.hilfe.stufen.notfall) || "";
    }
    if (a.morgen && Array.isArray(a.morgen.schritte) && a.morgen.schritte.length) z.morgen.schritte = a.morgen.schritte;
    if (a.schule) { z.schule.etappen = a.schule.etappen || []; z.schule.planB = Object.assign(z.schule.planB, a.schule.planB || {}); }
    if (a.skills) z.koffer = [...new Set([].concat(a.skills.sos || [], a.skills.favoriten || []))];
    if (a.zukunft) z.interessen = (a.zukunft.interessen || []).slice();
    if (a.baum && Array.isArray(a.baum.knospen)) {
      for (const k of a.baum.knospen) { if (z.staerken[k.ast] !== undefined) z.staerken[k.ast] += 1; z.xp += 15; z.log.push({ id: neueId(), datum: k.datum, titel: k.text, ergebnis: "geschafft", xp: 15, ast: k.ast }); }
    }
    if (Array.isArray(a.post)) z.post = a.post.filter(p => !p.gelesen).map(p => ({ id: p.id, text: p.text, ast: p.ast, von: p.von, gelesen: false }));
    z.gefeiertBis = levelAus(z.xp).level;
  }
  function speichern() { try { localStorage.setItem(SPEICHER, JSON.stringify(S)); } catch (e) { /* privater Modus */ } }

  // ---------------------------------------------------------------- Helfer

  function neueId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function heute() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function datumKurz(iso) { try { return new Date(iso).toLocaleDateString("de-DE", { day: "numeric", month: "short" }); } catch (e) { return ""; } }
  function ast(id) { return I.AESTE.find(a => a.id === id) || I.AESTE[0]; }
  function kurzname(id) { return { mut: "Mut", selbst: "Selbstständig", fuersorge: "Selbstfürsorge", neustart: "Neustart", hilfe: "Hilfe holen", zukunft: "Zukunft", grenzen: "Grenzen", neugier: "Neugier" }[id] || id; }
  function tel(n) { return "tel:" + String(n || "").replace(/[^0-9+]/g, ""); }
  function alleSkills() {
    return B.skills.map(s => ({ ...s, ...(I.SKILL_ZUSATZ[s.id] || {}) })).concat(I.NEUE_SKILLS);
  }
  function skill(id) { return alleSkills().find(s => s.id === id); }

  // Level: jedes Level braucht etwas mehr als das vorige, damit die
  // ersten Aufstiege schnell kommen und es trotzdem weitergeht.
  function bedarf(level) { return 60 + level * 40; }
  function levelAus(xp) {
    let level = 1, rest = xp;
    while (rest >= bedarf(level)) { rest -= bedarf(level); level++; }
    return { level, rest, noetig: bedarf(level) };
  }
  // Ein Wert, der für jeden Tag gleich bleibt, damit die Karten des Tages
  // beim Neuladen nicht wechseln.
  function tagesZahl(salz) { let h = 7; for (const c of heute() + (salz || "")) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

  // ---------------------------------------------------------------- Quests

  function questPool() {
    const p = [];
    const std = new Date().getHours();
    const morgenErledigt = S.heute.erledigt.includes("morgen");
    if (std >= 5 && std < 12 && !morgenErledigt) p.push({ id: "morgen", art: "morgen", titel: "Morgen-Quest", text: "Schritt für Schritt in den Tag. Du bestimmst, wie klein.", ast: "selbst", xp: "bis 60" });
    const et = S.schule.etappen.find(e => !e.erledigt);
    if (et) p.push({ id: "schule:" + et.id, art: "echt", titel: "Schul-Etappe", text: et.text, ast: "mut", xp: 40 });
    if (std >= 18) p.push({ id: "abend", art: "abend", titel: "Abend-Quest", text: "Kurz den Tag abschließen und den Morgen leichter machen.", ast: "fuersorge", xp: "15 bis 33" });
    const ch = I.CHALLENGES3.map((c, i) => ({ id: "ch:" + i, art: "challenge", titel: c.titel, text: c.mini + " … oder größer?", ast: I.WELT_AST[c.welt] || "mut", xp: "20 bis 50", nr: i }));
    const sk = alleSkills().filter(s => !s.absprache).map(s => ({ id: "sk:" + s.id, art: "skill", titel: "Skill-Test: " + s.name, text: s.wann, ast: "fuersorge", xp: 25, skillId: s.id }));
    const zk = I.INTERESSEN.filter(i => S.interessen.includes(i.name)).flatMap(i => i.experimente).map((t, j) => ({ id: "zk:" + j + t.length, art: "echt", titel: "Zukunfts-Quest", text: t, ast: "zukunft", xp: 40 }));
    // Gemischt nach Tageszahl, damit jeder Tag anders aussieht.
    const mische = (l, salz) => l.map(x => [tagesZahl(salz + x.id), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    return p.concat(mische(ch, "c").slice(0, 6), mische(sk, "s").slice(0, 4), mische(zk, "z").slice(0, 2));
  }

  function karteFinden(id) { return questPool().find(q => q.id === id) || null; }

  // Die drei Karten des Tages: zuerst, was gerade dran ist (Morgen, Schule,
  // Abend), dann eine Challenge und ein Skill. Erledigte bleiben sichtbar.
  function tagesKarten() {
    if (S.heute.datum !== heute()) S.heute = { datum: heute(), karten: [], erledigt: [], tausch: 0 };
    const pool = questPool();
    const ids = S.heute.karten.filter(id => pool.some(q => q.id === id) || S.heute.erledigt.includes(id));
    const dazu = q => { if (ids.length < 3 && !ids.includes(q.id)) ids.push(q.id); };
    pool.filter(q => q.art === "morgen" || q.art === "abend" || q.id.startsWith("schule:")).forEach(dazu);
    const ch = pool.find(q => q.art === "challenge" && !ids.includes(q.id)); if (ch) dazu(ch);
    const zk = pool.find(q => q.id.startsWith("zk:") && !ids.includes(q.id)); if (zk && ids.length < 3) dazu(zk);
    pool.filter(q => q.art === "skill").forEach(dazu);
    pool.forEach(dazu);
    S.heute.karten = ids;
    speichern();
    return ids.map(id => karteFinden(id) || { id, art: "fertig", titel: "Erledigt", text: "", ast: "selbst", xp: 0 });
  }

  // ---------------------------------------------------------------- Navigation

  let ansicht = { seite: "start" };
  let flow = null;
  function geh(seite, extra) { ansicht = Object.assign({ seite }, extra || {}); flow = null; history.pushState({ s: seite }, ""); render(); }
  function zeigeFlow(f) { flow = f; history.pushState({ f: true }, ""); render(); }
  window.addEventListener("popstate", () => { if (flow) flow = null; else ansicht = { seite: "start" }; render(); });

  // ---------------------------------------------------------------- Zeichnen

  const app = () => document.getElementById("app");
  function render() {
    let html;
    if (!S.eingerichtet) html = einrichtung();
    else if (flow) html = flowSeite();
    else html = ({ start: startSeite, figur: figurSeite, hilfe: hilfeSeite, rucksack: rucksackSeite, fach: fachSeite, geschichte: geschichteSeite }[ansicht.seite] || startSeite)();
    app().innerHTML = html;
    window.scrollTo(0, 0);
    const z = app().querySelector("[data-zaehler]");
    if (z) zaehlen(z);
  }

  function kopf(titel, zurueck) {
    return `<header class="kopf">${zurueck ? `<button class="rund" data-a="heim" aria-label="Zurück">‹</button>` : `<span class="rund leer"></span>`}<h1>${esc(titel)}</h1><button class="hilfe-knopf" data-a="hilfe">Hilfe</button></header>`;
  }

  function xpBalken() {
    const l = levelAus(S.xp);
    return `<div class="xp"><div class="xp-voll" style="width:${Math.round(l.rest / l.noetig * 100)}%"></div></div><p class="xp-text">${l.rest} / ${l.noetig} XP bis Level ${l.level + 1}</p>`;
  }

  // ---- Einrichtung: Name, Figur bauen, drei Sätze Erklärung.
  let einr = 0, editorTeil = "haut";
  function einrichtung() {
    if (einr === 0) return `<main class="einr"><div class="logo">NEXT</div><p class="gross">Level up dein echtes Leben.</p>
      <p class="leise">Kleine Quests, die du draußen machst. Deine Figur wächst mit jeder davon.</p>
      <button class="knopf haupt" data-a="einr">Spiel starten</button></main>`;
    if (einr === 1) return `<main class="einr"><h2>Wie heißt du im Spiel?</h2>
      <input class="eingabe" data-f="name" maxlength="20" value="${esc(S.name)}" placeholder="Spitzname">
      <button class="knopf haupt" data-a="einr">Weiter</button></main>`;
    if (einr === 2) return `<main class="einr links"><h2>Bau deine Figur</h2>${editor(1)}<button class="knopf haupt" data-a="einr">Fertig</button></main>`;
    return `<main class="einr links"><h2>So geht's</h2>
      <div class="regel"><b>1</b><span>Such dir jeden Tag eine von drei Quest-Karten aus.</span></div>
      <div class="regel"><b>2</b><span>Mach sie im echten Leben. Dann komm zurück und sag, wie es lief.</span></div>
      <div class="regel"><b>3</b><span>Für jeden Versuch gibt es XP, auch wenn es nicht geklappt hat. Deine Figur steigt auf und schaltet Neues frei.</span></div>
      <div class="regel rot"><b>!</b><span>Wenn es dir schlecht geht: Oben rechts ist immer der Hilfe-Knopf.</span></div>
      <button class="knopf haupt" data-a="einr-fertig">Los geht's</button></main>`;
  }

  // ---- Figur-Baukasten. Gesperrtes zeigt, ab welchem Level es frei wird.
  function editor(level) {
    const t = F.TEILE[editorTeil];
    return `<div class="figur-gross">${F.svg(S.figur, level, 170)}</div>
      <div class="reiter">${F.REIHENFOLGE.map(k => `<button class="${k === editorTeil ? "an" : ""}" data-a="teil" data-z="${k}">${esc(F.TEILE[k].name)}</button>`).join("")}</div>
      <div class="auswahl">${t.wahl.map(w => {
        const zu = (w.ab || 1) > level;
        const an = S.figur[editorTeil] === w.id;
        return `<button class="wahl ${an ? "an" : ""} ${zu ? "zu" : ""}" data-a="${zu ? "gesperrt" : "waehle"}" data-z="${w.id}" ${w.ab ? `data-ab="${w.ab}"` : ""}>
          ${w.farbe ? `<span class="farbfleck" style="background:${w.farbe}"></span>` : ""}<span>${esc(w.name || "")}</span>${zu ? `<small>ab Level ${w.ab}</small>` : ""}</button>`;
      }).join("")}</div>`;
  }

  // ---- Start: Figur, drei Karten, sonst nichts.
  function startSeite() {
    const l = levelAus(S.xp);
    const karten = tagesKarten();
    let html = `<header class="kopf"><button class="rund" data-a="rucksack" aria-label="Rucksack">🎒</button><h1>NEXT</h1><button class="hilfe-knopf" data-a="hilfe">Hilfe</button></header><main>`;
    html += `<button class="held" data-a="figur">${F.svg(S.figur, l.level, 112)}<div class="held-text"><b>${esc(S.name || "Du")}</b><span>Level ${l.level}</span>${xpBalken()}</div></button>`;
    const post = S.post.find(p => !p.gelesen);
    if (post) html += `<button class="karte post" data-a="post"><span class="glanz">Überraschung</span><b>Du hast Stärkenpost bekommen</b><small>Tippen zum Öffnen, +20 XP</small></button>`;
    if (S.laufend) {
      html += `<button class="karte laufend" data-a="zurueck-melden"><span class="glanz">Läuft gerade</span><b>${esc(S.laufend.text)}</b><small>Tippen, wenn du es probiert hast</small></button>`;
    }
    html += `<h2 class="abschnitt">Deine Quests heute</h2>`;
    html += karten.map(q => {
      const fertig = S.heute.erledigt.includes(q.id);
      const a = ast(q.ast);
      return `<button class="karte quest ${fertig ? "fertig" : ""}" style="--f:${a.farbe}" data-a="${fertig ? "nichts" : "quest"}" data-z="${esc(q.id)}">
        <span class="quest-kopf"><span class="staerke">+1 ${esc(kurzname(q.ast))}</span><span class="xp-pille">${fertig ? "✓ erledigt" : esc(String(q.xp)) + " XP"}</span></span>
        <b>${esc(q.titel)}</b><small>${esc(q.text)}</small></button>`;
    }).join("");
    if (S.heute.tausch < 3 && karten.some(q => !S.heute.erledigt.includes(q.id))) html += `<button class="text-knopf" data-a="tausch">Eine Karte tauschen (${3 - S.heute.tausch} übrig)</button>`;
    if (S.heute.erledigt.length >= 1) html += `<p class="leise mitte">Gut gemacht heute. Mehr musst du nicht.</p>`;
    return html + `</main>`;
  }

  // ---- Figur und Stärken.
  function figurSeite() {
    const l = levelAus(S.xp);
    const naechste = F.neuAb(l.level + 1);
    let html = kopf("Deine Figur", true) + `<main>`;
    html += editor(l.level);
    html += xpBalken();
    if (naechste.length) html += `<p class="leise mitte">Bei Level ${l.level + 1} wird frei: ${esc(naechste.map(n => n.name).join(", "))}</p>`;
    const max = Math.max(5, ...Object.values(S.staerken));
    html += `<h2 class="abschnitt">Deine Stärken</h2><p class="leise">Wachsen mit jeder Quest. Sie waren schon immer da, hier siehst du, wie oft sie sich gezeigt haben.</p>`;
    html += I.AESTE.map(a => `<div class="stat"><span>${esc(kurzname(a.id))}</span><div class="stat-balken"><div style="width:${Math.round(S.staerken[a.id] / max * 100)}%;background:${a.farbe}"></div></div><b>${S.staerken[a.id]}</b></div>`).join("");
    html += `<button class="knopf" data-a="geschichte">Meine Geschichte ansehen</button>`;
    return html + `</main>`;
  }

  function geschichteSeite() {
    let html = kopf("Meine Geschichte", true) + `<main>`;
    html += S.log.length ? `<ul class="liste">${S.log.slice().reverse().map(e => `<li><span class="punkt" style="background:${ast(e.ast).farbe}"></span><div><b>${esc(e.titel)}</b><small>${esc(datumKurz(e.datum))} · ${esc({ geschafft: "Geschafft", versucht: "Versucht", zuviel: "Grenze gemerkt", hilfe: "Hilfe geholt" }[e.ergebnis] || "")} · +${e.xp} XP</small>${e.notiz ? `<small>${esc(e.notiz)}</small>` : ""}</div></li>`).join("")}</ul>`
      : `<p class="leise">Hier sammelt sich alles, was du im echten Leben gemacht hast.</p>`;
    return html + `</main>`;
  }

  // ---- Hilfe: zwei Tipps bis zum nächsten kleinen Schritt. Keine Punkte.
  const SOS = [["angespannt", "Ich bin angespannt oder habe Angst"], ["bett", "Ich komme nicht hoch"], ["schule", "Schule geht heute nicht"], ["ueberfordert", "Mir ist alles zu viel"], ["einsam", "Ich fühle mich allein"], ["streit", "Ich hatte Streit"], ["rueckschlag", "Ich hatte einen Rückschlag"], ["reden", "Ich will mit jemandem reden"]];
  function hilfeSeite() {
    let html = kopf("Hilfe", true) + `<main>`;
    html += `<button class="knopf notfall" data-a="notfall">Ich bin nicht sicher. Ich brauche jetzt jemanden.</button>`;
    html += `<h2 class="abschnitt">Was ist los?</h2><div class="kacheln">${SOS.map(([id, t]) => `<button class="kachel" data-a="sos" data-z="${id}">${esc(t)}</button>`).join("")}</div>`;
    return html + `</main>`;
  }
  function kontakteHtml() {
    return (S.kontakte.length ? S.kontakte.map(k => k.telefon ? `<a class="kontakt" href="${esc(tel(k.telefon))}"><b>${esc(k.name)}</b><small>${esc(k.rolle || k.telefon)}</small><span>Anrufen</span></a>` : `<div class="kontakt"><b>${esc(k.name)}</b><small>${esc(k.rolle)}</small></div>`).join("") : `<p class="leise">Noch keine Kontakte. Die kannst du im Rucksack eintragen.</p>`)
      + I.NOTRUF.map(n => `<a class="kontakt fest" href="${esc(tel(n.nummer))}"><b>${esc(n.name)}: ${esc(n.anzeige || n.nummer)}</b><small>${esc(n.hinweis)}</small><span>Anrufen</span></a>`).join("");
  }

  // ---- Rucksack: alles Ernste, aus dem Spiel herausgenommen.
  function rucksackSeite() {
    let html = kopf("Rucksack", true) + `<main>`;
    html += `<h2 class="abschnitt">Mein Skill-Koffer</h2>`;
    html += S.koffer.map(skill).filter(Boolean).map(s => `<button class="zeile" data-a="skill-zeigen" data-z="${s.id}"><b>${esc(s.name)}</b><small>${esc(s.wann || "")}</small></button>`).join("") || `<p class="leise">Skills, die dir bei einem Skill-Test geholfen haben, landen hier.</p>`;
    html += `<h2 class="abschnitt">Meine Menschen</h2>`;
    html += S.kontakte.map(k => `<div class="zeile"><b>${esc(k.name)}</b><small>${esc([k.rolle, k.telefon].filter(Boolean).join(" · "))}</small><button class="x" data-a="kontakt-weg" data-z="${k.id}">✕</button></div>`).join("");
    html += `<div class="form"><input class="eingabe" id="k-name" placeholder="Name" maxlength="40"><input class="eingabe" id="k-tel" placeholder="Telefon (freiwillig)" inputmode="tel" maxlength="25"><button class="knopf" data-a="kontakt-dazu">Hinzufügen</button></div>`;
    html += `<h2 class="abschnitt">Meine Warnzeichen</h2><p class="leise">Woran merke ich, dass es mir schlechter geht?</p>`;
    html += S.warnzeichen.map((w, i) => `<div class="zeile"><b>${esc(w)}</b><button class="x" data-a="warn-weg" data-z="${i}">✕</button></div>`).join("");
    html += `<div class="form reihe"><input class="eingabe" id="warn" placeholder="z. B. Ich schlafe schlecht" maxlength="60"><button class="knopf" data-a="warn-dazu">Dazu</button></div>`;
    html += `<h2 class="abschnitt">Mein Notfallplan</h2><textarea class="eingabe" data-f="notfall" rows="3" placeholder="Wen rufe ich an, wenn ich nicht mehr sicher bin?">${esc(S.notfall)}</textarea>`;
    html += `<h2 class="abschnitt">Sichern</h2><button class="knopf" data-a="sichern">Spielstand als Datei sichern</button><label class="knopf">Spielstand laden<input type="file" accept=".json" data-f="laden" hidden></label>`;
    html += `<button class="text-knopf" data-a="fach">Für Fachkräfte</button>`;
    return html + `</main>`;
  }

  // ---- Fachkräfte: nur das Nötigste.
  let fachOffen = false;
  function fachSeite() {
    if (!fachOffen) return kopf("Für Fachkräfte", true) + `<main><p class="leise">${S.fach.pin ? "PIN eingeben" : "PIN festlegen, damit niemand aus Versehen hier landet. Kein Schutz für vertrauliche Daten."}</p>
      <input class="eingabe" id="pin" type="password" inputmode="numeric" maxlength="8"><button class="knopf haupt" data-a="pin">${S.fach.pin ? "Öffnen" : "PIN festlegen"}</button></main>`;
    let html = kopf("Für Fachkräfte", true) + `<main>`;
    html += `<h2 class="abschnitt">Morgen-Quest</h2>` + S.morgen.schritte.map((s, i) => `<div class="zeile"><b>${esc(s.text)}</b><small>${s.mini ? "Kleiner: " + esc(s.mini) : ""}</small><button class="x" data-a="ms-weg" data-z="${i}">✕</button></div>`).join("");
    html += `<div class="form"><input class="eingabe" id="ms-text" placeholder="Neuer Schritt" maxlength="60"><input class="eingabe" id="ms-mini" placeholder="Kleinere Variante" maxlength="60"><button class="knopf" data-a="ms-dazu">Dazu</button></div>`;
    html += `<h2 class="abschnitt">Schul-Etappen</h2><p class="leise">Die erste offene Etappe erscheint als Quest.</p>` + S.schule.etappen.map((e, i) => `<div class="zeile"><b>${esc(e.text)}</b><small>${e.erledigt ? "geschafft" : "offen"}</small><button class="x" data-a="et-weg" data-z="${i}">✕</button></div>`).join("");
    html += `<div class="form reihe"><input class="eingabe" id="et" placeholder="Neue Etappe" maxlength="80"><button class="knopf" data-a="et-dazu">Dazu</button></div>`;
    html += `<label class="feld">Plan B: Wen spreche ich an?<input class="eingabe" data-f="planb" data-z="kontakt" value="${esc(S.schule.planB.kontakt)}"></label>`;
    html += `<h2 class="abschnitt">Stärkenpost</h2><p class="leise">Konkret beschreiben, was ihr beobachtet habt. Erscheint als Überraschung.</p>
      <div class="chips">${I.POST_VORLAGEN.slice(0, 6).map((p, i) => `<button class="chip" data-a="post-vorlage" data-z="${i}">${esc(p.text.slice(0, 34))}…</button>`).join("")}</div>
      <textarea class="eingabe" id="post-text" rows="3" maxlength="300"></textarea><select class="eingabe" id="post-ast">${I.AESTE.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select>
      <button class="knopf" data-a="post-senden">Hinterlegen</button>`;
    html += `<h2 class="abschnitt">Test</h2><button class="knopf" data-a="beispiel">Fiktive Testdaten laden</button><button class="knopf gefahr" data-a="loeschen">Alles löschen</button>`;
    return html + `</main>`;
  }

  // ---------------------------------------------------------------- Abläufe

  function fkopf(titel) { return `<header class="kopf"><button class="rund" data-a="flow-zu" aria-label="Schließen">✕</button><h1>${esc(titel)}</h1><button class="hilfe-knopf" data-a="hilfe">Hilfe</button></header>`; }

  const ERGEBNIS = [["geschafft", "Geschafft", 30], ["versucht", "Versucht", 20], ["zuviel", "War heute zu viel", 15], ["hilfe", "Hab mir Hilfe geholt", 20]];
  const STUFE_XP = { mini: 20, mittel: 35, gross: 50 };

  function flowSeite() {
    const f = flow;
    if (f.art === "quest") return questAnsicht(f);
    if (f.art === "los") return `<main class="mitte-voll"><div class="gross-zeichen">🚀</div><h2>Quest angenommen</h2><p class="gross">${esc(f.text)}</p><p class="leise">Leg das Handy weg und probier es. Komm zurück, wenn du es versucht hast. Die Quest wartet auf der Startseite.</p><button class="knopf haupt" data-a="heim">Okay</button></main>`;
    if (f.art === "melden") return fkopf("Wie lief's?") + `<main><p class="leise">${esc(f.text)}</p><h2>Wie lief's?</h2>${ERGEBNIS.map(([id, t, xp]) => `<button class="gross-wahl" data-a="ergebnis" data-z="${id}">${esc(t)}<span>+${f.stufe ? Math.max(xp, STUFE_XP[f.stufe] - (id === "geschafft" ? 0 : 10)) : xp} XP</span></button>`).join("")}<p class="leise mitte">Jede Antwort zählt. Auch abbrechen zeigt dir etwas.</p></main>`;
    if (f.art === "geholfen") return fkopf("Kurz noch") + `<main><h2>Was hat geholfen?</h2><p class="leise">Ein Tipp reicht. Oder überspringen.</p><div class="chips">${I.HILFREICH_CHIPS.map(c => `<button class="chip ${f.chips.includes(c) ? "an" : ""}" data-a="chip" data-z="${esc(c)}">${esc(c)}</button>`).join("")}</div><button class="knopf haupt" data-a="belohnen">Weiter</button><button class="text-knopf" data-a="belohnen">Überspringen</button></main>`;
    if (f.art === "belohnung") return belohnung(f);
    if (f.art === "levelup") return levelUp(f);
    if (f.art === "morgen") return morgenAnsicht(f);
    if (f.art === "skill") return skillAnsicht(f);
    if (f.art === "abend") return abendAnsicht(f);
    if (f.art === "sos") return sosAnsicht(f);
    if (f.art === "notfall") return fkopf("Hol dir jetzt Hilfe") + `<main><p class="gross">Du bist nicht allein. Ruf jemanden an.</p>${S.notfall ? `<div class="karte"><b>Mein Notfallplan</b><p>${esc(S.notfall)}</p></div>` : ""}${kontakteHtml()}<p class="leise">NEXT kann nicht einschätzen, wie gefährlich eine Lage ist. Bei Gefahr ruf die 112.</p></main>`;
    if (f.art === "post") return `<main class="mitte-voll"><div class="gross-zeichen">💌</div><p class="leise">Stärkenpost${f.post.von ? " von " + esc(f.post.von) : ""}</p><p class="gross">„${esc(f.post.text)}“</p><button class="knopf haupt" data-a="post-ok">+20 XP einsammeln</button></main>`;
    if (f.art === "skillzeigen") { const s = skill(f.skillId); return fkopf(s.name) + `<main><ol class="schritte">${(s.schritte || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol>${vorlesen((s.schritte || []).join(" "))}<button class="knopf haupt" data-a="flow-zu">Okay</button></main>`; }
    return "";
  }

  function questAnsicht(f) {
    const q = f.q, a = ast(q.ast);
    let html = fkopf("Quest") + `<main><div class="quest-gross" style="--f:${a.farbe}"><span class="staerke">+1 ${esc(kurzname(q.ast))}</span><h2>${esc(q.titel)}</h2>`;
    if (q.art === "challenge") {
      const c = I.CHALLENGES3[q.nr];
      html += `<p>Wie groß soll's heute sein?</p></div>` + [["mini", "Mini"], ["mittel", "Mittel"], ["gross", "Groß"]].map(([st, n]) => `<button class="stufe stufe-${st}" data-a="stufe" data-z="${st}"><span>${n} · ${STUFE_XP[st]} XP</span>${esc(c[st])}</button>`).join("");
      return html + `</main>`;
    }
    html += `<p class="gross">${esc(q.text)}</p><span class="xp-pille">${esc(String(q.xp))} XP</span></div>`;
    html += `<button class="knopf haupt" data-a="annehmen">${q.art === "echt" ? "Annehmen" : "Los"}</button><button class="text-knopf" data-a="flow-zu">Lieber eine andere</button>`;
    return html + `</main>`;
  }

  function morgenAnsicht(f) {
    const s = S.morgen.schritte[f.i];
    if (!s) { return belohnungVorbereiten({ titel: "Morgen-Quest", ast: "selbst", xp: 10 + f.gemacht * 5, ergebnis: f.gemacht ? "geschafft" : "versucht", questId: "morgen" }); }
    const punkte = S.morgen.schritte.map((x, i) => `<span class="${i < f.i ? "voll" : i === f.i ? "jetzt" : ""}"></span>`).join("");
    return fkopf("Morgen-Quest") + `<main><div class="schritt-punkte">${punkte}</div><p class="leise">Schritt ${f.i + 1} von ${S.morgen.schritte.length} · +5 XP</p>
      <h2 class="riesig">${esc(f.klein && s.mini ? s.mini : s.text)}</h2>${vorlesen(f.klein && s.mini ? s.mini : s.text)}
      <button class="knopf haupt" data-a="m-ja">Geschafft</button>
      ${s.mini && !f.klein ? `<button class="knopf" data-a="m-klein">Kleiner bitte</button>` : ""}
      <button class="knopf" data-a="m-ende">Für heute reicht's</button></main>`;
  }

  const GESICHTER = ["😌", "🙂", "😐", "😟", "😣"];
  function skillAnsicht(f) {
    const s = skill(f.skillId);
    if (f.schritt === 0) return fkopf("Skill-Test") + `<main><h2>Wie angespannt bist du gerade?</h2><div class="gesichter">${GESICHTER.map((g, i) => `<button data-a="gesicht" data-z="${i}">${g}</button>`).join("")}</div><p class="leise mitte">ganz ruhig ↔ sehr angespannt</p></main>`;
    if (f.schritt === 1) return fkopf(s.name) + `<main><h2>Jetzt im echten Leben</h2><ol class="schritte">${(s.schritte || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol>${vorlesen((s.schritte || []).join(" "))}<button class="knopf haupt" data-a="skill-weiter">Fertig</button></main>`;
    if (f.schritt === 2) return fkopf("Skill-Test") + `<main><h2>Und jetzt?</h2><div class="gesichter">${GESICHTER.map((g, i) => `<button data-a="gesicht" data-z="${i}">${g}</button>`).join("")}</div></main>`;
    return fkopf("Skill-Test") + `<main><h2>${f.nachher < f.vorher ? "Du bist ruhiger geworden." : "Danke fürs Ausprobieren."}</h2><p>Nimmst du ${esc(s.name)} in deinen Koffer?</p>
      <button class="knopf haupt" data-a="koffer" data-z="ja">Ja, in den Koffer</button><button class="knopf" data-a="koffer" data-z="nein">Nein, passt nicht zu mir</button><p class="leise mitte">Ein Versuch sagt noch nicht alles. Auch „passt nicht“ ist ein Ergebnis.</p></main>`;
  }

  function abendAnsicht(f) {
    return fkopf("Abend-Quest") + `<main><p class="leise">Tipp an, was du machst.</p>${I.ABEND.map(s => `<button class="abhaken ${f.an.includes(s.id) ? "an" : ""}" data-a="abend-tipp" data-z="${s.id}"><span></span>${esc(s.text)}</button>`).join("")}
      <input class="eingabe" id="gut" placeholder="Eine schöne Sache heute (freiwillig)" maxlength="100"><button class="knopf haupt" data-a="abend-fertig">Gute Nacht</button></main>`;
  }

  function sosAnsicht(f) {
    const sit = I.SITUATIONEN.find(s => s.id === f.id);
    if (f.hilfe == null) {
      const hilfen = []; sit.hindernisse.forEach(h => h.hilfen.forEach(x => { if (hilfen.length < 4 && !hilfen.some(y => y.text === x.text)) hilfen.push(x); }));
      f.hilfen = hilfen;
      return fkopf("Hilfe") + `<main><p class="gross">${esc(sit.satz)}</p><h2>Was könnte jetzt helfen?</h2>${hilfen.map((x, i) => `<button class="gross-wahl" data-a="sos-hilfe" data-z="${i}">${esc(x.text)}</button>`).join("")}</main>`;
    }
    const x = f.hilfen[f.hilfe];
    if (x.art === "notfall") { flow = { art: "notfall" }; return flowSeite(); }
    let html = fkopf("Hilfe") + `<main><p class="leise">Dein nächster kleiner Schritt</p><h2 class="riesig">${esc(x.schritt)}</h2>`;
    const koffer = S.koffer.map(skill).filter(Boolean).slice(0, 3);
    if (x.art === "skill" && koffer.length) html += `<p class="leise">Aus deinem Koffer:</p>` + koffer.map(s => `<button class="zeile" data-a="skill-zeigen" data-z="${s.id}"><b>${esc(s.name)}</b><small>${esc((s.schritte || [])[0] || "")}</small></button>`).join("");
    if (x.art === "kontakt" || x.art === "neustart") html += kontakteHtml();
    if (x.art === "morgen") html += `<button class="knopf" data-a="quest" data-z="morgen">Morgen-Quest öffnen</button>`;
    return html + `<button class="knopf haupt" data-a="flow-zu">Okay</button></main>`;
  }

  // ---- Belohnung: Zähler läuft hoch, Stärke steigt, bei Level-Aufstieg
  // eine eigene kurze Feier mit dem, was neu frei ist.
  function belohnungVorbereiten(b) {
    flow = { art: "geholfen", chips: [], b };
    return flowSeite();
  }
  function belohnung(f) {
    const a = ast(f.b.ast);
    return `<main class="mitte-voll"><div class="figur-feier">${F.svg(S.figur, levelAus(S.xp).level, 150)}</div>
      <p class="xp-gross">+<span data-zaehler="${f.b.xp}">0</span> XP</p><p class="staerke-gross" style="color:${a.farbe}">+1 ${esc(kurzname(a.id))}</p>
      ${xpBalken()}<p class="gross">${f.b.ergebnis === "zuviel" ? "Grenze gemerkt. Das ist auch eine Stärke." : f.b.ergebnis === "hilfe" ? "Hilfe holen ist stark." : "Stark gemacht."}</p>
      <button class="knopf haupt" data-a="nach-belohnung">Weiter</button></main>`;
  }
  function levelUp(f) {
    const neu = F.neuAb(f.level);
    return `<main class="mitte-voll levelup"><p class="glanz">Level up!</p><div class="figur-feier">${F.svg(S.figur, f.level, 170)}</div><h2>Level ${f.level}</h2>
      ${neu.length ? `<p>Neu freigeschaltet: <b>${esc(neu.map(n => n.name).join(", "))}</b></p><button class="knopf haupt" data-a="figur">Figur anpassen</button>` : `<p>Weiter so, in deinem Tempo.</p>`}
      <button class="knopf" data-a="heim">Fertig für jetzt</button><p class="leise">Leg das Handy weg, du hast Besseres vor.</p></main>`;
  }
  function zaehlen(el) {
    const ziel = Number(el.dataset.zaehler); let n = 0;
    const schritt = Math.max(1, Math.round(ziel / 20));
    const t = setInterval(() => { n = Math.min(ziel, n + schritt); el.textContent = n; if (n >= ziel) clearInterval(t); }, 30);
  }

  function vorlesen(text) {
    if (!("speechSynthesis" in window)) return "";
    return `<button class="text-knopf" data-a="vorlesen" data-z="${esc(text)}">🔊 Vorlesen</button>`;
  }

  // ---------------------------------------------------------------- Aktionen

  function wert(id) { const e = document.getElementById(id); return e ? e.value.trim() : ""; }

  function abschliessen(b, notiz) {
    const vorher = levelAus(S.xp).level;
    S.xp += b.xp;
    if (S.staerken[b.ast] !== undefined) S.staerken[b.ast] += 1;
    S.log.push({ id: neueId(), datum: new Date().toISOString(), titel: b.titel, ergebnis: b.ergebnis, xp: b.xp, ast: b.ast, notiz: notiz || "" });
    if (b.questId && !S.heute.erledigt.includes(b.questId)) S.heute.erledigt.push(b.questId);
    if (b.questId && b.questId.startsWith("schule:") && b.ergebnis === "geschafft") { const e = S.schule.etappen.find(x => "schule:" + x.id === b.questId); if (e) { e.erledigt = true; e.datum = new Date().toISOString(); } }
    speichern();
    const nachher = levelAus(S.xp).level;
    return nachher > vorher ? nachher : 0;
  }

  const A = {
    nichts: () => {},
    einr: () => { einr++; render(); },
    "einr-fertig": () => { S.eingerichtet = true; speichern(); ansicht = { seite: "start" }; render(); },
    heim: () => geh("start"),
    hilfe: () => geh("hilfe"),
    figur: () => geh("figur"),
    rucksack: () => geh("rucksack"),
    geschichte: () => geh("geschichte"),
    fach: () => geh("fach"),
    teil: z => { editorTeil = z; render(); },
    waehle: z => { S.figur[editorTeil] = z; speichern(); const y = scrollY; render(); scrollTo(0, y); },
    gesperrt: (z, el) => { el.classList.add("wackeln"); setTimeout(() => el.classList.remove("wackeln"), 400); },
    vorlesen: z => { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(z); u.lang = "de-DE"; u.rate = 0.92; speechSynthesis.speak(u); },
    "flow-zu": () => { flow = null; render(); },

    tausch: () => {
      const offen = S.heute.karten.filter(id => !S.heute.erledigt.includes(id));
      const raus = offen.find(id => id.startsWith("ch:") || id.startsWith("sk:") || id.startsWith("zk:")) || offen[0];
      const pool = questPool().filter(q => !S.heute.karten.includes(q.id) && q.art !== "morgen" && q.art !== "abend");
      if (!raus || !pool.length) return;
      const neu = pool[(tagesZahl("t" + S.heute.tausch) % pool.length)];
      S.heute.karten = S.heute.karten.map(id => id === raus ? neu.id : id);
      S.heute.tausch++; speichern(); render();
    },
    quest: z => {
      // Die Morgen-Quest geht immer, auch nachmittags aus der Hilfe heraus.
      if (z === "morgen") return zeigeFlow({ art: "morgen", i: 0, gemacht: 0, klein: false });
      const q = karteFinden(z);
      if (!q) return;
      if (q.art === "morgen") return zeigeFlow({ art: "morgen", i: 0, gemacht: 0, klein: false });
      if (q.art === "skill") return zeigeFlow({ art: "skill", skillId: q.skillId, schritt: 0, q });
      if (q.art === "abend") return zeigeFlow({ art: "abend", an: [] });
      zeigeFlow({ art: "quest", q });
    },
    stufe: z => {
      const q = flow.q, c = I.CHALLENGES3[q.nr];
      S.laufend = { questId: q.id, titel: q.titel, text: c[z], ast: q.ast, stufe: z, xp: STUFE_XP[z] };
      speichern(); flow = { art: "los", text: c[z] }; render();
    },
    annehmen: () => {
      const q = flow.q;
      S.laufend = { questId: q.id, titel: q.titel, text: q.text, ast: q.ast, xp: q.xp };
      speichern(); flow = { art: "los", text: q.text }; render();
    },
    "zurueck-melden": () => zeigeFlow({ art: "melden", text: S.laufend.text, stufe: S.laufend.stufe }),
    ergebnis: z => {
      const l = S.laufend; if (!l) return;
      const basis = ERGEBNIS.find(e => e[0] === z)[2];
      const xp = l.stufe ? Math.max(basis, STUFE_XP[l.stufe] - (z === "geschafft" ? 0 : 10)) : (typeof l.xp === "number" && z === "geschafft" ? l.xp : basis);
      const astId = z === "zuviel" ? "grenzen" : z === "hilfe" ? "hilfe" : l.ast;
      S.laufend = null; speichern();
      flow = { art: "geholfen", chips: [], b: { titel: l.text, ast: astId, xp, ergebnis: z, questId: l.questId } };
      render();
    },
    chip: z => { const i = flow.chips.indexOf(z); if (i >= 0) flow.chips.splice(i, 1); else flow.chips.push(z); render(); },
    belohnen: () => {
      const b = flow.b;
      const lvl = abschliessen(b, flow.chips.filter(c => c !== "Weiß ich nicht").join(", "));
      flow = { art: "belohnung", b, levelNeu: lvl }; render();
    },
    "nach-belohnung": () => {
      if (flow.levelNeu) { S.gefeiertBis = flow.levelNeu; speichern(); flow = { art: "levelup", level: flow.levelNeu }; render(); }
      else { flow = null; ansicht = { seite: "start" }; render(); }
    },

    "m-ja": () => { flow.i++; flow.gemacht++; flow.klein = false; render(); },
    "m-klein": () => { flow.klein = true; render(); },
    "m-ende": () => { flow.i = S.morgen.schritte.length; render(); },

    gesicht: z => { if (flow.schritt === 0) flow.vorher = Number(z); else flow.nachher = Number(z); flow.schritt++; render(); },
    "skill-weiter": () => { flow.schritt++; render(); },
    koffer: z => {
      const s = skill(flow.skillId);
      if (z === "ja" && !S.koffer.includes(s.id)) S.koffer.push(s.id);
      speichern();
      flow = { art: "geholfen", chips: [], b: { titel: "Skill-Test: " + s.name, ast: flow.nachher < flow.vorher ? "fuersorge" : "neugier", xp: 25, ergebnis: "geschafft", questId: "sk:" + s.id } };
      render();
    },
    "skill-zeigen": z => zeigeFlow({ art: "skillzeigen", skillId: z }),
    "abend-tipp": z => { const i = flow.an.indexOf(z); if (i >= 0) flow.an.splice(i, 1); else flow.an.push(z); render(); },
    "abend-fertig": () => {
      const gut = wert("gut");
      flow = { art: "geholfen", chips: [], b: { titel: gut ? "Schöne Sache heute: " + gut : "Abend-Quest", ast: "fuersorge", xp: 15 + flow.an.length * 3, ergebnis: "geschafft", questId: "abend" } };
      render();
    },

    sos: z => zeigeFlow({ art: "sos", id: z, hilfe: null }),
    "sos-hilfe": z => { flow.hilfe = Number(z); render(); },
    notfall: () => zeigeFlow({ art: "notfall" }),

    post: () => { const p = S.post.find(x => !x.gelesen); if (p) zeigeFlow({ art: "post", post: p }); },
    "post-ok": () => {
      const p = flow.post; p.gelesen = true;
      const lvl = abschliessen({ titel: "Stärkenpost: " + p.text, ast: p.ast || "mut", xp: 20, ergebnis: "geschafft" });
      flow = { art: "belohnung", b: { titel: p.text, ast: p.ast || "mut", xp: 20, ergebnis: "geschafft" }, levelNeu: lvl }; render();
    },

    "kontakt-dazu": () => { const n = wert("k-name"); if (n) { S.kontakte.push({ id: neueId(), name: n, telefon: wert("k-tel"), rolle: "" }); speichern(); render(); } },
    "kontakt-weg": z => { S.kontakte = S.kontakte.filter(k => k.id !== z); speichern(); render(); },
    "warn-dazu": () => { const t = wert("warn"); if (t) { S.warnzeichen.push(t); speichern(); render(); } },
    "warn-weg": z => { S.warnzeichen.splice(Number(z), 1); speichern(); render(); },
    sichern: () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: "NEXT-Spiel", daten: S })], { type: "application/json" }));
      a.download = "NEXT-Spielstand-" + heute() + ".json"; document.body.appendChild(a); a.click(); a.remove();
    },
    pin: () => { const p = wert("pin"); if (!p) return; if (!S.fach.pin) { S.fach.pin = p; speichern(); } if (p === S.fach.pin) { fachOffen = true; render(); } else alert("PIN stimmt nicht"); },
    "ms-weg": z => { S.morgen.schritte.splice(Number(z), 1); speichern(); render(); },
    "ms-dazu": () => { const t = wert("ms-text"); if (t) { S.morgen.schritte.push({ id: neueId(), text: t, mini: wert("ms-mini") }); speichern(); render(); } },
    "et-weg": z => { S.schule.etappen.splice(Number(z), 1); speichern(); render(); },
    "et-dazu": () => { const t = wert("et"); if (t) { S.schule.etappen.push({ id: neueId(), text: t, erledigt: false }); speichern(); render(); } },
    "post-vorlage": z => { const p = I.POST_VORLAGEN[Number(z)]; document.getElementById("post-text").value = p.text; document.getElementById("post-ast").value = p.ast; },
    "post-senden": () => { const t = wert("post-text"); if (t) { S.post.push({ id: neueId(), text: t, ast: wert("post-ast"), von: "Dein Team", gelesen: false }); speichern(); alert("Hinterlegt. Erscheint als Überraschung auf der Startseite."); } },
    beispiel: () => { if (!confirm("Fiktive Testdaten laden? Der Spielstand wird ersetzt.")) return; S = beispiel(); speichern(); fachOffen = false; geh("start"); },
    loeschen: () => { if (!confirm("Wirklich alles löschen?")) return; try { localStorage.removeItem(SPEICHER); } catch (e) { /* egal */ } S = leer(); S.eingerichtet = false; einr = 0; fachOffen = false; speichern(); geh("start"); }
  };

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-a]");
    if (!el) return;
    const fn = A[el.dataset.a];
    if (fn) { e.preventDefault(); fn(el.dataset.z, el); }
  });
  document.addEventListener("input", e => {
    const f = e.target.dataset && e.target.dataset.f;
    if (f === "name") { S.name = e.target.value.trim(); speichern(); }
    if (f === "notfall") { S.notfall = e.target.value; speichern(); }
    if (f === "planb") { S.schule.planB[e.target.dataset.z] = e.target.value; speichern(); }
  });
  document.addEventListener("change", e => {
    if (e.target.dataset.f !== "laden" || !e.target.files[0]) return;
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d || d.app !== "NEXT-Spiel") throw 0; S = ergaenzen(d.daten); speichern(); geh("start"); } catch (x) { alert("Das ist kein NEXT-Spielstand."); } };
    r.readAsText(e.target.files[0]);
  });

  function beispiel() {
    const z = leer();
    const tag = n => new Date(Date.now() - n * 86400000).toISOString();
    Object.assign(z, { name: "Alex", eingerichtet: true, figur: { haut: "h3", haare: "locken", haarfarbe: "dunkel", augen: "gross", outfit: "hoodie", farbe: "f2", extra: "kopfhoerer", hintergrund: "b2" } });
    const eintraege = [["Morgen-Quest", "selbst", 45, 6], ["Sag in einer kleinen Runde deine eigene Meinung", "mut", 35, 5], ["Skill-Test: 5-4-3-2-1", "fuersorge", 25, 4], ["Morgen-Quest", "selbst", 30, 3], ["Eine bekannte Strecke allein fahren", "grenzen", 15, 2], ["Stärkenpost: Du hast heute um Hilfe gebeten.", "hilfe", 20, 1]];
    for (const [t, a, xp, n] of eintraege) { z.xp += xp; z.staerken[a]++; z.log.push({ id: neueId(), datum: tag(n), titel: t, ergebnis: a === "grenzen" ? "zuviel" : "geschafft", xp, ast: a }); }
    z.xp += 60;
    z.gefeiertBis = levelAus(z.xp).level;
    z.koffer = ["54321", "box"];
    z.kontakte = [{ id: "c1", name: "Mama", telefon: "0151 0000000", rolle: "" }];
    z.schule.etappen = [{ id: "e1", text: "Bis zur Bushaltestelle gehen", erledigt: false }];
    z.interessen = ["Tiere"];
    z.post = [{ id: "p1", text: "Heute hast du dich in der Gruppe getraut, deine Meinung zu sagen.", ast: "mut", von: "Dein Team", gelesen: false }];
    return z;
  }

  S = laden();
  speichern();
  render();
  window.NEXT_SPIEL = { zustand: () => S };
})();
