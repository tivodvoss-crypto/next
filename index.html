<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>NEXT</title>
  <style>
    :root {
      --hintergrund: #f5f7fa;
      --karte: #ffffff;
      --text: #1b1f24;
      --text-leicht: #5b6472;
      --rand: #e2e7ee;
      --akzent: #2f6fde;
      --akzent-hell: #e6efff;
      --schatten: 0 2px 8px rgba(0, 0, 0, 0.05);
      --erfolg: #2e8b57;
      --warnung: #b43c8c;
      --radius: 18px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--hintergrund);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 17px;
      line-height: 1.45;
      overflow-x: hidden;
    }

    body.thema-nacht {
      --hintergrund: #14161c;
      --karte: #1f232c;
      --text: #eef0f4;
      --text-leicht: #aab2c0;
      --rand: #303642;
      --akzent: #8fa8ff;
      --akzent-hell: #262c3d;
      --schatten: 0 2px 8px rgba(0, 0, 0, 0.4);
      --erfolg: #7bc79a;
      --warnung: #e78cc4;
    }

    #app {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px 100px;
      overflow-wrap: anywhere;
    }

    h1, h2, h3 {
      margin: 0 0 8px;
      line-height: 1.2;
      font-weight: 700;
    }
    h1 { font-size: 1.7rem; }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1.1rem; }
    p { margin: 8px 0; }

    .kopf {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .kopf-titel { flex: 1; }
    .kopf-klein { color: var(--text-leicht); font-size: 0.95rem; margin-top: 2px; }

    .karte {
      background: var(--karte);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--schatten);
      border: 1px solid var(--rand);
    }

    .kachel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 360px) {
      .kachel-grid { grid-template-columns: 1fr; }
    }

    .kachel {
      background: var(--karte);
      border-radius: var(--radius);
      padding: 18px 12px;
      text-align: center;
      box-shadow: var(--schatten);
      border: 1px solid var(--rand);
      cursor: pointer;
      user-select: none;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 600;
      transition: transform 0.1s ease, background 0.2s;
    }
    .kachel:active { transform: scale(0.99); background: var(--akzent-hell); }
    .kachel-emoji { font-size: 2rem; line-height: 1; }

    button {
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      background: var(--akzent);
      color: #fff;
      width: 100%;
      text-align: center;
      border: 1px solid transparent;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn:active { opacity: 0.85; }
    .btn-zweit {
      background: var(--akzent-hell);
      color: var(--akzent);
    }
    .btn-ghost {
      background: transparent;
      color: var(--akzent);
      border: 1px solid var(--rand);
    }
    .btn-gefahr {
      background: var(--warnung);
      color: #fff;
    }
    .btn-klein {
      width: auto;
      min-height: 40px;
      padding: 8px 14px;
      font-size: 0.9rem;
    }

    input[type="text"], input[type="tel"], input[type="number"], textarea, select {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--rand);
      background: var(--karte);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    .feld { margin-bottom: 14px; }

    input[type="range"] {
      width: 100%;
      min-height: 44px;
      accent-color: var(--akzent);
    }
    .regler-wert {
      font-size: 2.2rem;
      font-weight: 800;
      text-align: center;
      margin: 6px 0;
      transition: color 0.3s;
    }

    .farb-zeile { display: flex; gap: 12px; flex-wrap: wrap; }
    .farb-knopf {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid transparent;
      box-shadow: 0 0 0 2px var(--rand);
      cursor: pointer;
      flex: 0 0 auto;
    }
    .farb-knopf.aktiv { border-color: #fff; box-shadow: 0 0 0 2px var(--akzent); }

    .chip-zeile {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--karte);
      border: 1px solid var(--rand);
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.aktiv {
      background: var(--akzent);
      color: #fff;
      border-color: var(--akzent);
    }

    .liste { list-style: none; padding: 0; margin: 0; }
    .liste-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: var(--karte);
      border: 1px solid var(--rand);
      border-radius: 14px;
      margin-bottom: 8px;
      box-shadow: var(--schatten);
      cursor: pointer;
    }
    .liste-item.graut { opacity: 0.5; pointer-events: none; }

    .klein { font-size: 0.85rem; color: var(--text-leicht); }
    .block { margin-top: 12px; }
    .fuss { text-align: center; color: var(--text-leicht); font-size: 0.9rem; margin-top: 20px; }

    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(84px + env(safe-area-inset-bottom));
      background: #1f232c;
      color: #fff;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      z-index: 120;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 90vw;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      /* Die Meldung liegt über den Knöpfen; Tipps sollen durchgehen, nur „Rückgängig“ bleibt antippbar. */
      pointer-events: none;
    }
    .toast button {
      pointer-events: auto;
      color: #8fa8ff;
      font-weight: 700;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .dialog {
      background: var(--karte);
      color: var(--text);
      border-radius: var(--radius);
      padding: 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .dialog-buttons {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    #leiste {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--karte);
      border-top: 1px solid var(--rand);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 env(safe-area-inset-bottom);
      z-index: 100;
      max-width: 520px;
      margin: 0 auto;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
    }
    #leiste.hidden { display: none; }
    .leiste-knopf {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 0.75rem;
      color: var(--text-leicht);
      background: none;
      border: none;
      min-width: 60px;
      cursor: pointer;
    }
    .leiste-knopf.aktiv { color: var(--akzent); font-weight: 700; }
    .leiste-emoji { font-size: 1.4rem; }

    .hinweis-ockergelb { background: #fff7e0; border-left: 4px solid #e0a800; padding: 10px 12px; border-radius: 10px; }
    body.thema-nacht .hinweis-ockergelb { background: #2a2416; border-left-color: #e0a800; }

    .zurueck {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      background: none;
      border: none;
      color: var(--akzent);
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      margin-bottom: 8px;
    }

    .schritte-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .schritt-item {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: flex-start;
    }
    .schritt-nr {
      flex: 0 0 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--akzent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .fortschritt-punkte {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .punkt {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--rand);
    }
    .punkt.aktiv { background: var(--akzent); width: 26px; border-radius: 5px; }

    .abzeichen-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .abzeichen-karte {
      background: var(--karte);
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
      border: 1px solid var(--rand);
      box-shadow: var(--schatten);
    }
    .abzeichen-emoji { font-size: 2.2rem; }
    .abzeichen-karte.grau { filter: grayscale(1); opacity: 0.55; }

    .skill-zeile {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--rand);
      gap: 8px;
      cursor: pointer;
    }
    .skill-zeile:last-child { border-bottom: none; }
    .versuch-zeile {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--karte);
      border: 1px solid var(--rand);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .balken {
      height: 8px;
      border-radius: 6px;
      background: var(--rand);
      position: relative;
      overflow: hidden;
      margin: 4px 0;
    }
    .balken-fuellung {
      position: absolute;
      height: 100%;
      border-radius: 6px;
      background: var(--akzent);
    }

    .zwei-spalten { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 400px) {
      .zwei-spalten { grid-template-columns: 1fr; }
    }
  </style>

</head>

      bereich: "niedrig",

  // Alle Standardskills erhalten quelle standard.
  STANDARD_SKILLS.forEach(s => { s.quelle = "standard"; });

  const THEMEN = {
    ozean:  { akzent: "#2f6fde", hell: "#e6efff" },
    wald:   { akzent: "#2e8b57", hell: "#e3f4ea" },
    sonne:  { akzent: "#e08a00", hell: "#fff2dc" },
    beere:  { akzent: "#b43c8c", hell: "#f9e4f2" },
    nacht:  { akzent: "#8fa8ff", hell: "#262c3d" }
  };

  const SITUATIONEN = ["Schule / Leistung", "Streit / Konflikt", "Alltag / Überforderung", "Grübeln", "Abends", "Ruhe / Freizeit", "Auf Station", "Anderes"];
  const BEREICHE = ["niedrig", "mittel", "hoch", "alle"];
  const HILFREICH_EMOJIS = ["😣", "🙁", "😐", "🙂", "😄"];
  const ANERKENNUNGEN = ["Ausprobieren ist schon ein Schritt.", "Jeder Versuch zeigt dir etwas über dich."];

  const STANDARD_ZUSTAND = {
    version: 1,
    profil: { name: "", thema: "ozean", eingerichtet: false, grenzeHoch: 70, grenzeMittel: 40 },
    eigeneSkills: [],
    fachSkills: [],
    ausgeblendet: [],
    versuche: [],
    koffer: { mittel: [], hoch: [], langfristig: [] },
    angesehen: [],
    plan: { text: "", kontakte: [] },
    kompass: [],
    gruppe: { titel: "", skillIds: [], datum: "" },
    fachPin: ""
  };

  /* ---------- Globaler Zustand ---------- */

  let zustand = null;
  let speicherProblem = false;
  let aktAnsicht = "einrichtung";
  let aktParam = null;

  // Versuchsablauf
  let versuchTemp = null;
  // Timer
  let timerInterval = null;
  let timerRestSekunden = 0;
  let timerLaeuft = false;

  function neueId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function esc(text) {
    if (text === null || typeof text === "undefined") return "";
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  /* ---------- Theme ---------- */

  function wendeThemeAn() {
    if (!zustand) return;
    const thema = zustand.profil.thema || "ozean";
    document.body.classList.toggle("thema-nacht", thema === "nacht");
    const farben = THEMEN[thema] || THEMEN.ozean;
    document.documentElement.style.setProperty("--akzent", farben.akzent);
    document.documentElement.style.setProperty("--akzent-hell", farben.hell);
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) {
      metaTheme.setAttribute("content", thema === "nacht" ? "#14161c" : "#f5f7fa");
    }
  }

  /* ---------- Zustand laden/speichern ---------- */

  function mergeStandard(geladen) {
    const z = JSON.parse(JSON.stringify(STANDARD_ZUSTAND));
    if (!geladen || typeof geladen !== "object") return z;
    z.version = 1;
    if (geladen.profil && typeof geladen.profil === "object") {
      z.profil = { ...z.profil, ...geladen.profil };
    }
    z.eigeneSkills = Array.isArray(geladen.eigeneSkills) ? geladen.eigeneSkills : [];
    z.fachSkills = Array.isArray(geladen.fachSkills) ? geladen.fachSkills : [];
    z.ausgeblendet = Array.isArray(geladen.ausgeblendet) ? geladen.ausgeblendet : [];
    z.versuche = Array.isArray(geladen.versuche) ? geladen.versuche : [];
    if (geladen.koffer && typeof geladen.koffer === "object") {
      z.koffer = { ...z.koffer, ...geladen.koffer };
      z.koffer.mittel = Array.isArray(z.koffer.mittel) ? z.koffer.mittel : [];
      z.koffer.hoch = Array.isArray(z.koffer.hoch) ? z.koffer.hoch : [];
      z.koffer.langfristig = Array.isArray(z.koffer.langfristig) ? z.koffer.langfristig : [];
    }
    z.angesehen = Array.isArray(geladen.angesehen) ? geladen.angesehen : [];
    if (geladen.plan && typeof geladen.plan === "object") {
      z.plan = { ...z.plan, ...geladen.plan };
      z.plan.kontakte = Array.isArray(z.plan.kontakte) ? z.plan.kontakte : [];
    }
    z.kompass = Array.isArray(geladen.kompass) ? geladen.kompass : [];
    if (geladen.gruppe && typeof geladen.gruppe === "object") {
      z.gruppe = { ...z.gruppe, ...geladen.gruppe };
      z.gruppe.skillIds = Array.isArray(z.gruppe.skillIds) ? z.gruppe.skillIds : [];
    }
    z.fachPin = typeof geladen.fachPin === "string" ? geladen.fachPin : "";
    return z;
  }

  function ladeZustand() {
    try {
      const roh = localStorage.getItem("next-v1");
      if (roh) {
        try {
          const geladen = JSON.parse(roh);
          zustand = mergeStandard(geladen);
          speicherProblem = false;
        } catch (e) {
          // Kaputtes JSON aufheben und mit leerem Zustand starten
          try {
            localStorage.setItem("next-v1-kaputt-" + Date.now(), roh);
          } catch (e2) {}
          zustand = JSON.parse(JSON.stringify(STANDARD_ZUSTAND));
          speicherProblem = false;
        }
      } else {
        zustand = JSON.parse(JSON.stringify(STANDARD_ZUSTAND));
        speicherProblem = false;
      }
    } catch (e) {
      // localStorage nicht verfügbar, Arbeitsspeicher verwenden
      zustand = JSON.parse(JSON.stringify(STANDARD_ZUSTAND));
      speicherProblem = true;
    }
  }

  function speichereZustand() {
    if (!zustand) return;
    try {
      localStorage.setItem("next-v1", JSON.stringify(zustand));
      speicherProblem = false;
    } catch (e) {
      speicherProblem = true;
    }
  }

  /* ---------- Navigation ---------- */

  function aktualisiereLeiste() {
    const leiste = document.getElementById("leiste");
    if (!leiste) return;
    const versteckt = ["einrichtung", "fachLogin", "fach", "versuch", "skillForm"].includes(aktAnsicht);
    leiste.classList.toggle("hidden", versteckt);
    if (!versteckt) {
      leiste.querySelectorAll("[data-nav]").forEach(btn => {
        const ziel = btn.getAttribute("data-nav");
        btn.classList.toggle("aktiv", ziel === aktAnsicht && !aktParam);
      });
    }
  }

  function zeige(ansicht, param, pushHistory) {
    stoppeTimer();
    aktAnsicht = ansicht;
    aktParam = param;
    renderApp();
    wendeThemeAn();
    aktualisiereLeiste();
    if (pushHistory !== false) {
      try {
        history.pushState({ ansicht, param }, "");
      } catch (e) {}
    }
  }

  window.addEventListener("popstate", function (e) {
    if (e.state && e.state.ansicht) {
      zeige(e.state.ansicht, e.state.param, false);
    } else {
      zeige("start", null, false);
    }
  });

  /* ---------- Toast und Dialog ---------- */

  function zeigeToast(text, aktionText, aktionCallback) {
    const bereich = document.getElementById("toast-bereich");
    bereich.innerHTML = "";
    const toast = document.createElement("div");
    toast.className = "toast";
    const span = document.createElement("span");
    span.textContent = text;
    toast.appendChild(span);
    if (aktionText && aktionCallback) {
      const btn = document.createElement("button");
      btn.textContent = aktionText;
      btn.addEventListener("click", () => {
        aktionCallback();
        toast.remove();
      });
      toast.appendChild(btn);
    }
    bereich.appendChild(toast);
    setTimeout(() => {
      toast.remove();
    }, aktionText ? 4000 : 2500);
  }

  function schliesseDialog() {
    document.getElementById("dialog-bereich").innerHTML = "";
  }

  function zeigeDialog({ inhalt, knopfOk, knopfAbbrechen, onOk, onAbbrechen }) {
    const bereich = document.getElementById("dialog-bereich");
    bereich.innerHTML = "";
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay && knopfAbbrechen !== false) {
        schliesseDialog();
        if (onAbbrechen) onAbbrechen();
      }
    });
    const dialog = document.createElement("div");
    dialog.className = "dialog";
    const inhaltDiv = document.createElement("div");
    inhaltDiv.innerHTML = inhalt;
    dialog.appendChild(inhaltDiv);
    const buttons = document.createElement("div");
    buttons.className = "dialog-buttons";
    if (knopfOk !== false) {
      const okBtn = document.createElement("button");
      okBtn.className = "btn";
      okBtn.textContent = knopfOk || "OK";
      okBtn.setAttribute("data-test", "ok");
      okBtn.addEventListener("click", () => {
        schliesseDialog();
        if (onOk) onOk(dialog);
      });
      buttons.appendChild(okBtn);
    }
    if (knopfAbbrechen && knopfAbbrechen !== false) {
      const abbrBtn = document.createElement("button");
      abbrBtn.className = "btn btn-ghost";
      abbrBtn.textContent = knopfAbbrechen;
      abbrBtn.addEventListener("click", () => {
        schliesseDialog();
        if (onAbbrechen) onAbbrechen();
      });
      buttons.appendChild(abbrBtn);
    }
    dialog.appendChild(buttons);
    overlay.appendChild(dialog);
    bereich.appendChild(overlay);
  }

  /* ---------- Skills finden ---------- */

  function alleStandardSkills() {
    return STANDARD_SKILLS.filter(s => !zustand.ausgeblendet.includes(s.id));
  }

  function alleSichtbarenSkills() {
    return [...alleStandardSkills(), ...zustand.fachSkills, ...zustand.eigeneSkills];
  }

  function findSkill(id) {
    if (!id) return null;
    const standard = STANDARD_SKILLS.find(s => s.id === id);
    if (standard) return standard;
    return zustand.fachSkills.find(s => s.id === id) || zustand.eigeneSkills.find(s => s.id === id) || null;
  }

  function skillNameOderGeloescht(id) {
    const s = findSkill(id);
    return s ? s.name : "(gelöschter Skill)";
  }

  function kategorieEmoji(katId) {
    const k = KATEGORIEN.find(c => c.id === katId);
    return k ? k.emoji : "🧩";
  }
  function kategorieName(katId) {
    const k = KATEGORIEN.find(c => c.id === katId);
    return k ? k.name : katId;
  }

  function versuchAnzahl(skillId) {
    return zustand.versuche.filter(v => v.skillId === skillId).length;
  }

  function istImKoffer(skillId) {
    return zustand.koffer.mittel.includes(skillId) || zustand.koffer.hoch.includes(skillId) || zustand.koffer.langfristig.includes(skillId);
  }

  function bereichAusWert(wert) {
    const gM = Number(zustand.profil.grenzeMittel) || 40;
    const gH = Number(zustand.profil.grenzeHoch) || 70;
    if (wert < gM) return "niedrig";
    if (wert < gH) return "mittel";
    return "hoch";
  }

  function formatDatum(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
    } catch (e) { return ""; }
  }
  function formatKurz(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
    } catch (e) { return ""; }
  }

  function durchschnittsSenkung(versuche) {
    if (!versuche || versuche.length === 0) return null;
    const summe = versuche.reduce((sum, v) => sum + (Number(v.vorher) - Number(v.nachher)), 0);
    return summe / versuche.length;
  }

  function versucheZuSkill(skillId) {
    return zustand.versuche
      .filter(v => v.skillId === skillId)
      .sort((a, b) => new Date(a.datum) - new Date(b.datum));
  }

  function alleVersucheSortiertNeu() {
    return [...zustand.versuche].sort((a, b) => new Date(b.datum) - new Date(a.datum));
  }

  function abzeichenBerechnen() {
    const angesehenEinzeln = new Set(zustand.angesehen).size;
    const versuche = zustand.versuche;
    const verschiedeneSkills = new Set(versuche.map(v => v.skillId)).size;
    const skillHaeufigkeit = {};
    versuche.forEach(v => { skillHaeufigkeit[v.skillId] = (skillHaeufigkeit[v.skillId] || 0) + 1; });
    const hat3MalGleicher = Object.values(skillHaeufigkeit).some(n => n >= 3);
    const kategorien = new Set();
    versuche.forEach(v => {
      const s = findSkill(v.skillId);
      if (s) kategorien.add(s.kategorie);
    });
    const kofferAnzahl = zustand.koffer.mittel.length + zustand.koffer.hoch.length + zustand.koffer.langfristig.length;
    const notizVersuche = versuche.filter(v => v.notiz && v.notiz.trim()).length;
    const besprechenVersuche = versuche.filter(v => v.besprechen).length;
    const hatPlan = (zustand.plan.text && zustand.plan.text.trim()) || zustand.plan.kontakte.length > 0;
    return [
      { id: "neugierig", emoji: "👀", name: "Neugierig", satz: "3 verschiedene Skills angesehen", erreicht: angesehenEinzeln >= 3 },
      { id: "erster", emoji: "🧪", name: "Erster Versuch", satz: "1 Versuch gespeichert", erreicht: versuche.length >= 1 },
      { id: "entdecker", emoji: "🧭", name: "Entdecker", satz: "3 verschiedene Skills ausprobiert", erreicht: verschiedeneSkills >= 3 },
      { id: "forscher", emoji: "🔬", name: "Forscher", satz: "6 verschiedene Skills ausprobiert", erreicht: verschiedeneSkills >= 6 },
      { id: "dranbleiber", emoji: "🔁", name: "Dranbleiber", satz: "Denselben Skill 3-mal ausprobiert", erreicht: hat3MalGleicher },
      { id: "weltenbummler", emoji: "🌍", name: "Weltenbummler", satz: "Skills aus 4 verschiedenen Kategorien ausprobiert", erreicht: kategorien.size >= 4 },
      { id: "erfinder", emoji: "💡", name: "Erfinder", satz: "Eigenen Skill angelegt", erreicht: zustand.eigeneSkills.length >= 1 },
      { id: "koffer", emoji: "🧳", name: "Koffer gepackt", satz: "Mindestens 3 Skills im Koffer", erreicht: kofferAnzahl >= 3 },
      { id: "ehrlich", emoji: "📝", name: "Ehrlich zu mir", satz: "3 Versuche mit Notiz", erreicht: notizVersuche >= 3 },
      { id: "mutig", emoji: "🗣️", name: "Mutig gefragt", satz: "1 Versuch zum Besprechen markiert", erreicht: besprechenVersuche >= 1 },
      { id: "planer", emoji: "🛟", name: "Planer", satz: "Plan mit mindestens einem Kontakt oder Text", erreicht: hatPlan },
      { id: "selbstkenner", emoji: "🪞", name: "Selbstkenner", satz: "2 Kompass-Sätze", erreicht: zustand.kompass.length >= 2 }
    ];
  }

  /* ---------- Timer ---------- */

  function starteTimer(sekunden) {
    stoppeTimer();
    timerRestSekunden = sekunden;
    timerLaeuft = true;
    timerInterval = setInterval(() => {
      timerRestSekunden--;
      if (timerRestSekunden <= 0) {
        timerRestSekunden = 0;
        stoppeTimer();
        if (navigator.vibrate) try { navigator.vibrate(200); } catch (e) {}
        zeigeToast("Zeit um.");
        renderApp();
      } else {
        renderTimerAnzeige();
      }
    }, 1000);
    renderApp();
  }

  function stoppeTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    timerLaeuft = false;
    timerRestSekunden = 0;
  }

  function renderTimerAnzeige() {
    const el = document.getElementById("timer-anzeige");
    if (!el) return;
    const min = Math.floor(timerRestSekunden / 60);
    const sek = timerRestSekunden % 60;
    el.textContent = min + ":" + String(sek).padStart(2, "0");
  }

  function leseDauerSekunden(skill) {
    if (!skill || !skill.dauer) return 120;
    const zahl = parseInt(skill.dauer, 10);
    if (!isNaN(zahl)) return zahl * 60;
    return 120;
  }

  /* ---------- Rendering: Hauptweiche ---------- */

  function renderApp() {
    const app = document.getElementById("app");
    if (!app) return;
    if (speicherProblem) {
      const hinweis = document.createElement("div");
      hinweis.className = "hinweis-ockergelb";
      hinweis.style.marginBottom = "10px";
      hinweis.textContent = "Achtung: Dieses Gerät speichert gerade nicht. Deine Einträge sind nach dem Schließen weg.";
      app.innerHTML = "";
      app.appendChild(hinweis);
      const rest = document.createElement("div");
      rest.innerHTML = renderHauptinhalt();
      while (rest.firstChild) app.appendChild(rest.firstChild);
    } else {
      app.innerHTML = renderHauptinhalt();
    }
    aktualisiereLeiste();
    // Event-Listener für dynamische Elemente nach dem Rendern binden
    bindEvents();
  }

  function renderHauptinhalt() {
    if (!zustand) return "";
    if (aktAnsicht === "einrichtung") return renderEinrichtung();
    if (aktAnsicht === "start") return renderStart();
    if (aktAnsicht === "fest") return renderFest();
    if (aktAnsicht === "hilfe") return renderHilfe();
    if (aktAnsicht === "skills") return renderSkills();
    if (aktAnsicht === "skill") return renderSkillDetail(aktParam);
    if (aktAnsicht === "skillForm") return renderSkillForm(aktParam);
    if (aktAnsicht === "versuch") return renderVersuch();
    if (aktAnsicht === "versuchWahl") return renderVersuchWahl();
    if (aktAnsicht === "pass") return renderPass();
    if (aktAnsicht === "weg") return renderWeg();
    if (aktAnsicht === "koffer") return renderKoffer();
    if (aktAnsicht === "kofferAuswahl") return renderKofferAuswahl(aktParam);
    if (aktAnsicht === "plan") return renderPlan();
    if (aktAnsicht === "einstellungen") return renderEinstellungen();
    if (aktAnsicht === "fachLogin") return renderFachLogin();
    if (aktAnsicht === "fach") return renderFach();
    return renderStart();
  }

  /* ---------- Ich stecke fest ---------- */

  function renderFest() {

      return `

          <button class="btn btn-gefahr" data-fest="hoch">Sehr stark</button>
        </div>`;
    }
    const niveau = aktParam;
    const isHoch = niveau === "hoch";
    const isMittel = niveau === "mittel";
    let skills = [];
    if (isHoch) {
      const kIds = zustand.koffer.hoch.slice(0, 3);
      if (kIds.length > 0) {
        skills = kIds.map(id => findSkill(id)).filter(Boolean);
      } else {
        skills = alleSichtbarenSkills().filter(s => s.kategorie === "hoch").slice(0, 3);
      }
    } else if (isMittel) {
      const kIds = zustand.koffer.mittel.slice(0, 4);
      if (kIds.length > 0) {
        skills = kIds.map(id => findSkill(id)).filter(Boolean);
      } else {
        skills = alleSichtbarenSkills().filter(s => s.kategorie === "mittel").slice(0, 4);
      }
    } else {
      // niedrig
      const kIds = zustand.koffer.langfristig.slice(0, 4);
      const langfristig = kIds.map(id => findSkill(id)).filter(Boolean);
      const ablenkungAchtsam = alleSichtbarenSkills().filter(s => s.kategorie === "ablenkung" || s.kategorie === "achtsam").slice(0, 4);
      skills = [...langfristig];
      ablenkungAchtsam.forEach(s => { if (!skills.some(x => x.id === s.id)) skills.push(s); });
      skills = skills.slice(0, 4);
    }
    const niveauText = isHoch ? "Atme einmal aus. Du musst jetzt nur eine Sache tun." : "Wähle einen kleinen Schritt.";
    return `
      <button class="zurueck" data-zurueck-fest>← Zurück</button>
      <h1>${isHoch ? "Sehr stark" : isMittel ? "Ziemlich stark" : "Geht so"}</h1>

      <div class="karte">
        ${skills.length > 0 ? skills.map(s => `

      <div id="fest-zu-viel-text" style="display:none; margin-bottom:12px;" class="karte">
        <p>Okay. Dann nur das: Stell beide Füße auf den Boden und atme dreimal langsam aus. Mehr musst du gerade nicht.</p>
        <button class="btn btn-gefahr" data-hilfe>Ich brauche jemanden</button>
      </div>
      <button class="btn btn-gefahr" data-hilfe>Ich brauche jemanden</button>`;
  }

  function renderErfahrungen(skill) {
    const versuche = versucheZuSkill(skill.id);
    return `
      <div class="karte">

        ${versuche.map(v => `

          </button>`).join("")}
        ${renderAuswertung(skill.id).map(z => `<p class="klein">${esc(z)}</p>`).join("")}
        <p class="klein" style="margin-top:8px;">Das sind deine eigenen Erfahrungen, keine Messung. Ein Skill kann auch helfen, wenn die Zahl nicht sinkt, zum Beispiel wenn du dadurch handlungsfähig bleibst.</p>
      </div>`;
  }

  function renderAuswertung(skillId) {
    const versuche = versucheZuSkill(skillId);
    const bereiche = {};
    versuche.forEach(v => {
      const b = bereichAusWert(Number(v.vorher));
      if (!bereiche[b]) bereiche[b] = [];
      bereiche[b].push(v);
    });
    const zeilen = [];
    Object.keys(bereiche).forEach(b => {
      const list = bereiche[b];
      const durchschnitt = durchschnittsSenkung(list);
      const anzahl = list.length;
      const bname = b === "niedrig" ? "niedriger" : b === "mittel" ? "mittlerer" : "sehr hoher";
      const schnitt = Math.round(durchschnitt);
      const veraenderung = schnitt > 0 ? `${schnitt} Punkte weniger` : schnitt < 0 ? `${Math.abs(schnitt)} Punkte mehr` : "gleich";
      let zeile = `${anzahl} Versuch${anzahl === 1 ? "" : "e"} bei ${bname} Anspannung, im Schnitt ${veraenderung}.`;
      if (anzahl >= 2) {
        if (durchschnitt >= 15) {
          zeile += ` Bei ${bname} Anspannung war dieser Skill für dich in mehreren Versuchen hilfreich.`;
        } else if (b === "hoch" && durchschnitt < 10) {
          zeile += ` Bei sehr hoher Anspannung hat er dir bisher weniger geholfen. Dann ist vielleicht dein Plan oder eine andere Strategie dran.`;
        }
      }
      zeilen.push(zeile);
    });
    return zeilen;
  }

  function farbeFuerWert(wert) {
    if (wert <= 30) return "#2e8b57";
    if (wert <= 60) return "#d9a400";
    if (wert <= 85) return "#e07b00";
    return "#c0392b";
  }

  function wortFuerWert(wert) {
    if (wert <= 20) return "ganz ruhig";
    if (wert <= 45) return "etwas angespannt";
    if (wert <= 65) return "ziemlich angespannt";
    if (wert <= 85) return "sehr angespannt";
    return "kaum auszuhalten";
  }

  function reglerVorherGeaendert(input) {
    versuchTemp.vorher = Number(input.value);
    versuchTemp.veraendert = true;
    const wertEl = document.getElementById("vorher-wert");
    const wortEl = document.getElementById("vorher-wort");
    if (wertEl) {
      wertEl.textContent = input.value;
      wertEl.style.color = farbeFuerWert(Number(input.value));
    }
    if (wortEl) wortEl.textContent = wortFuerWert(Number(input.value));
  }

  function reglerNachherGeaendert(input) {
    const nachher = Number(input.value);
    versuchTemp.nachher = nachher;
    versuchTemp.veraendert = true;
    const vorher = Number(versuchTemp.vorher);
    const diff = vorher - nachher;
    let veraenderung;
    if (diff > 0) veraenderung = `Um ${diff} gesunken.`;
    else if (diff === 0) veraenderung = "Gleich geblieben. Das ist auch eine wichtige Erfahrung.";
    else veraenderung = `Um ${Math.abs(diff)} gestiegen. Gut, dass du das weißt.`;
    const wertEl = document.getElementById("nachher-wert");
    const wortEl = document.getElementById("nachher-wort");
    const textEl = document.getElementById("veraenderung-text");
    if (wertEl) {
      wertEl.textContent = nachher;
      wertEl.style.color = farbeFuerWert(nachher);
    }
    if (wortEl) wortEl.textContent = wortFuerWert(nachher);
    if (textEl) textEl.textContent = veraenderung;
  }

  /* ---------- Koffer ---------- */

  /* ---------- Event-Binding ---------- */

  function bindEvents() {
    // Zurück-Buttons
    document.querySelectorAll("[data-zurueck]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        history.back();
      });
    });

    // Allgemeine data-nav Buttons (z. B. Kacheln)
    document.querySelectorAll("[data-nav]").forEach(btn => {
      if (btn.closest("#leiste")) return; // Leiste wird separat gebunden
      btn.addEventListener("click", () => {
        const ziel = btn.getAttribute("data-nav");
        zeige(ziel, null);
      });
    });

    // Einrichtung
    if (aktAnsicht === "einrichtung") {
      const nameInput = document.getElementById("name");
      if (nameInput) nameInput.addEventListener("input", () => {
        zustand.profil.name = nameInput.value;
      });
      document.querySelectorAll("#farb-zeile [data-thema]").forEach(btn => {
        btn.addEventListener("click", () => {
          zustand.profil.thema = btn.getAttribute("data-thema");
          wendeThemeAn();
          zeige("einrichtung", null, false);
        });
      });
      document.getElementById("einrichtung-los")?.addEventListener("click", () => {
        zustand.profil.eingerichtet = true;
        speichereZustand();
        zeige("start");
      });
    }

    // Start
    if (aktAnsicht === "start") {
      document.getElementById("btn-einstellungen")?.addEventListener("click", () => zeige("einstellungen"));
      document.querySelectorAll("[data-skill]").forEach(el => {
        el.addEventListener("click", () => zeige("skill", el.getAttribute("data-skill")));
      });
    }

    // Fest
    if (aktAnsicht === "fest") {
      document.querySelectorAll("[data-fest]").forEach(btn => {
        btn.addEventListener("click", () => zeige("fest", btn.getAttribute("data-fest")));
      });
      document.getElementById("fest-zu-viel")?.addEventListener("click", () => {
        document.getElementById("fest-zu-viel-text").style.display = "block";
      });
      document.querySelectorAll("[data-hilfe]").forEach(btn => {
        btn.addEventListener("click", () => zeige("hilfe"));
      });
      document.querySelectorAll("[data-versuch-start]").forEach(el => {
        el.addEventListener("click", () => {
          starteVersuch(el.getAttribute("data-versuch-start"));
        });
      });
    }

    // Hilfe
    if (aktAnsicht === "hilfe") {
      document.getElementById("hilfe-zum-plan")?.addEventListener("click", () => zeige("plan"));
    }

    // Skills
    if (aktAnsicht === "skills") {
      const suchfeld = document.getElementById("suchfeld");
      suchfeld?.addEventListener("input", () => {
        skillsFilter.suche = suchfeld.value;
        renderSkillListe();
      });
      document.querySelectorAll("#skill-chips [data-kat]").forEach(chip => {
        chip.addEventListener("click", () => {
          skillsFilter.kategorie = chip.getAttribute("data-kat");
          // Chips aktualisieren
          document.querySelectorAll("#skill-chips [data-kat]").forEach(c => c.classList.remove("aktiv"));
          chip.classList.add("aktiv");
          renderSkillListe();
        });
      });
      document.getElementById("btn-eigen-anlegen")?.addEventListener("click", () => zeige("skillForm", { quelle: "eigen" }));
      // Delegation für Skill-Karten und "Eigenen Skill anlegen" in der leeren Liste
      document.getElementById("ergebnis-liste")?.addEventListener("click", (e) => {
        const karte = e.target.closest("[data-skill-card]");
        if (karte) { zeige("skill", karte.getAttribute("data-skill-card")); return; }
        if (e.target.closest("#btn-eigen-anlegen-list")) zeige("skillForm", { quelle: "eigen" });
      });
      renderSkillListe();
    }

    // Skill Detail
    if (aktAnsicht === "skill") {
      const id = aktParam;
      angesehenHinzufuegen(id);
      document.querySelectorAll("[data-versuch-start]").forEach(el => {
        el.addEventListener("click", () => starteVersuch(el.getAttribute("data-versuch-start")));
      });
      document.getElementById("btn-in-koffer")?.addEventListener("click", () => kofferDialog(id));
      document.getElementById("btn-skill-bearbeiten")?.addEventListener("click", () => zeige("skillForm", { id: id }));
      document.getElementById("btn-skill-loeschen")?.addEventListener("click", () => {
        zeigeDialog({
          inhalt: "<p>Diesen Skill wirklich löschen?</p>",
          knopfOk: "Löschen", knopfAbbrechen: "Abbrechen",
          onOk: () => {
            loescheSkill(id);
            zeige("skills");
          }
        });
      });

  /* ---------- Aktionen ---------- */

  function starteVersuch(skillId) {
    const skill = findSkill(skillId);
    if (!skill) {
      zeigeToast("Skill nicht gefunden.");
      return;
    }
    versuchTemp = {
      skillId,
      schritt: "A",
      vorher: 50,
      nachher: null,
      situation: "",
      situationAnderes: "",
      hilfreich: null,
      angenehm: null,
      nochmal: null,
      notiz: "",
      besprechen: false,
      erwartung: "",
      veraendert: false,
      neueAbzeichen: []
    };
    zeige("versuch", skillId);
  }

  function versuchZurueck() {
    if (!versuchTemp) return;
    const reihenfolge = ["A", "B", "C", "D", "E", "F"];
    const index = reihenfolge.indexOf(versuchTemp.schritt);
    if (index > 0) {
      versuchTemp.schritt = reihenfolge[index - 1];
      renderApp();
    } else {
      // Schritt A: verwerfen oder zurück
      if (versuchTemp.veraendert) {
        zeigeDialog({
          inhalt: "<p>Versuch verwerfen?</p>",
          knopfOk: "Verwerfen", knopfAbbrechen: "Abbrechen",
          onOk: () => {
            versuchTemp = null;
            history.back();
          }
        });
      } else {
        versuchTemp = null;
        history.back();
      }
    }
  }

  function speichereVersuch() {
    if (!versuchTemp) return;
    const vorherAbzeichen = abzeichenBerechnen().filter(a => a.erreicht).map(a => a.id);
    const situation = versuchTemp.situation === "Anderes"
      ? (versuchTemp.situationAnderes || "Anderes")
      : versuchTemp.situation;
    const versuch = {
      id: neueId(),
      skillId: versuchTemp.skillId,
      datum: new Date().toISOString(),
      vorher: Number(versuchTemp.vorher),
      nachher: Number(versuchTemp.nachher !== null ? versuchTemp.nachher : versuchTemp.vorher),
      situation: situation || "",
      hilfreich: versuchTemp.hilfreich || null,
      angenehm: versuchTemp.angenehm || null,
      notiz: versuchTemp.notiz || "",
      nochmal: versuchTemp.nochmal || null,
      besprechen: !!versuchTemp.besprechen,
      erwartung: versuchTemp.erwartung || ""
    };
    zustand.versuche.push(versuch);
    speichereZustand();
    const neue = abzeichenBerechnen().filter(a => a.erreicht && !vorherAbzeichen.includes(a.id));
    versuchTemp.neueAbzeichen = neue;
    versuchTemp.schritt = "F";
    renderApp();
  }

  function kofferDialog(skillId) {
    const mittel = zustand.koffer.mittel.includes(skillId);
    const hoch = zustand.koffer.hoch.includes(skillId);
    const lang = zustand.koffer.langfristig.includes(skillId);
    const inhalt = `
      <h3>In welches Fach?</h3>
      <label style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
        <input type="checkbox" data-test="fach-mittel" class="fach-check" data-fach="mittel" ${mittel ? 'checked' : ''}> Bei mittlerer Anspannung
      </label>
      <label style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
        <input type="checkbox" data-test="fach-hoch" class="fach-check" data-fach="hoch" ${hoch ? 'checked' : ''}> Bei sehr hoher Anspannung
      </label>
      <label style="display:flex; gap:8px; align-items:center;">
        <input type="checkbox" data-test="fach-langfristig" class="fach-check" data-fach="langfristig" ${lang ? 'checked' : ''}> Was mir langfristig guttut
      </label>`;
    zeigeDialog({
      inhalt,
      knopfOk: "Speichern",
      knopfAbbrechen: "Abbrechen",
      onOk: (dialogEl) => {
        const checks = dialogEl.querySelectorAll(".fach-check:checked");
        ["mittel", "hoch", "langfristig"].forEach(fach => {
          zustand.koffer[fach] = zustand.koffer[fach].filter(id => id !== skillId);
        });
        checks.forEach(cb => {
          const fach = cb.getAttribute("data-fach");
          if (!zustand.koffer[fach].includes(skillId)) {
            zustand.koffer[fach].push(skillId);
          }
        });
        speichereZustand();
        zeigeToast("Koffer aktualisiert.");
        if (aktAnsicht === "versuch" && versuchTemp) {
          renderApp();
        } else if (aktAnsicht === "skill") {
          renderApp();
        } else {
          zeige("koffer");
        }
      }
    });
  }

  function kofferSchieben(fach, id, richtung) {
    const arr = zustand.koffer[fach] || [];
    const index = arr.indexOf(id);
    if (index < 0) return;
    const neuerIndex = index + richtung;
    if (neuerIndex < 0 || neuerIndex >= arr.length) return;
    [arr[index], arr[neuerIndex]] = [arr[neuerIndex], arr[index]];
    speichereZustand();
    renderApp();
  }

  function kofferEntfernen(fach, id) {
    const arr = zustand.koffer[fach] || [];
    const index = arr.indexOf(id);
    if (index < 0) return;
    const skillN = skillNameOderGeloescht(id);
    arr.splice(index, 1);
    speichereZustand();
    zeigeToast(`"${skillN}" entfernt.`, "Rückgängig", () => {
      zustand.koffer[fach].splice(index, 0, id);
      speichereZustand();
      renderApp();
    });
    renderApp();
  }

  function loescheSkill(id) {
    zustand.eigeneSkills = zustand.eigeneSkills.filter(s => s.id !== id);
    zustand.fachSkills = zustand.fachSkills.filter(s => s.id !== id);
    // Aus Koffer entfernen
    ["mittel", "hoch", "langfristig"].forEach(fach => {
      zustand.koffer[fach] = zustand.koffer[fach].filter(kid => kid !== id);
    });
    // Versuche bleiben erhalten und zeigen dann gelöschter Skill
    speichereZustand();
  }

  function skillFormSpeichern() {
    const name = document.getElementById("sf-name").value.trim();
    if (!name) {
      document.getElementById("sf-name-fehler").style.display = "block";
      return;
    }
    const kategorie = document.getElementById("sf-kategorie").value;
    const dauer = document.getElementById("sf-dauer").value.trim();
    const material = document.getElementById("sf-material").value.trim();
    const wann = document.getElementById("sf-wann").value.trim();
    const schritteText = document.getElementById("sf-schritte").value;
    const bereich = document.getElementById("sf-bereich").value;
    const schritte = schritteText.split("\n").map(z => z.trim()).filter(Boolean);

    if (aktParam && aktParam.id) {
      // Bearbeiten
      const zielSammlung = findSkill(aktParam.id)?.quelle === "fach" ? zustand.fachSkills : zustand.eigeneSkills;
      const zuBearbeiten = zielSammlung.find(s => s.id === aktParam.id);
      if (zuBearbeiten) {
        Object.assign(zuBearbeiten, { name, kategorie, dauer, material, wann, schritte, bereich });
      }
      speichereZustand();
      zeige("skill", aktParam.id);
    } else {
      const quelle = aktParam && aktParam.quelle === "fach" ? "fach" : "eigen";
      const neuerSkill = {
        id: neueId(),
        name,
        kategorie,
        dauer,
        material,
        wann,
        schritte,
        bereich,
        quelle
      };
      if (quelle === "fach") {
        zustand.fachSkills.push(neuerSkill);
        speichereZustand();
        zeige("fach");
      } else {
        zustand.eigeneSkills.push(neuerSkill);
        speichereZustand();
        zeigeToast("Dein Skill ist gespeichert.");
        zeigeDialog({
          inhalt: "<p>Gleich in den Koffer?</p>",
          knopfOk: "Ja", knopfAbbrechen: "Später",
          onOk: () => {
            kofferDialog(neuerSkill.id);
          },
          onAbbrechen: () => {
            zeige("skills");
          }
        });
      }
    }
  }

  function versuchDetailDialog(vid) {
    const v = zustand.versuche.find(item => item.id === vid);
    if (!v) return;
    const inhalt = `
      <h3>Versuch</h3>
      <p><strong>Skill:</strong> ${esc(skillNameOderGeloescht(v.skillId))}</p>
      <p><strong>Datum:</strong> ${formatDatum(v.datum)}</p>
      <p><strong>Situation:</strong> ${esc(v.situation || "Keine")}</p>
      <p><strong>Erwartung:</strong> ${esc(v.erwartung || "Keine")}</p>
      <p><strong>Notiz:</strong> ${esc(v.notiz || "Keine")}</p>
      <p><strong>Besprechen:</strong> ${v.besprechen ? "ja" : "nein"}</p>
      <button class="btn btn-zweit" id="vd-besprechen-toggle">${v.besprechen ? "Nicht mehr besprechen" : "Zum Besprechen markieren"}</button>
      <button class="btn btn-gefahr" id="vd-loeschen">Löschen</button>`;
    zeigeDialog({
      inhalt,
      knopfOk: "Schließen",
      knopfAbbrechen: false,
      onOk: () => {}
    });
    document.getElementById("vd-besprechen-toggle")?.addEventListener("click", () => {
      v.besprechen = !v.besprechen;
      speichereZustand();
      schliesseDialog();
      renderApp();
      zeigeToast("Aktualisiert.");
    });
    document.getElementById("vd-loeschen")?.addEventListener("click", () => {
      schliesseDialog();
      zeigeDialog({
        inhalt: "<p>Versuch wirklich löschen?</p>",
        knopfOk: "Löschen", knopfAbbrechen: "Abbrechen",
        onOk: () => {
          zustand.versuche = zustand.versuche.filter(item => item.id !== vid);
          speichereZustand();
          renderApp();
          zeigeToast("Versuch gelöscht.");
        }
      });
    });
  }

  function kompassVorschlag() {
    const versuche = zustand.versuche;
    if (versuche.length < 2) {
      zeigeToast("Probier erst ein paar Skills aus.");
      return;
    }
    const nachSkill = {};
    versuche.forEach(v => {
      if (!nachSkill[v.skillId]) nachSkill[v.skillId] = [];
      nachSkill[v.skillId].push(v);
    });
    let besterSkill = null;
    let besteSenkung = -Infinity;
    Object.keys(nachSkill).forEach(skillId => {
      const list = nachSkill[skillId];
      if (list.length >= 2) {
        const senkung = durchschnittsSenkung(list);
        if (senkung !== null && senkung > besteSenkung) {
          besteSenkung = senkung;
          besterSkill = skillId;
        }
      }
    });
    if (!besterSkill) {
      zeigeToast("Probier erst ein paar Skills aus.");
      return;
    }
    const skill = findSkill(besterSkill);
    const situationen = nachSkill[besterSkill].map(v => v.situation).filter(Boolean);
    const haeufigsteSituation = situationen.sort((a, b) =>
      situationen.filter(s => s === a).length - situationen.filter(s => s === b).length
    ).pop() || "ich grübele";
    document.getElementById("kompass-wenn").value = haeufigsteSituation;
    document.getElementById("kompass-dann").value = skill ? skill.name : "ein Spaziergang";
  }

  function rucksackSichern() {
    try {
      const daten = JSON.stringify(zustand, null, 2);
      const name = zustand.profil.name || "du";
      const datum = new Date().toISOString().slice(0, 10);
      const dateiName = `NEXT-Rucksack-${name}-${datum}.json`;
      const blob = new Blob([daten], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = dateiName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      zeigeToast("Rucksack gesichert.");
    } catch (e) {
      // Fallback: JSON in Textfeld anzeigen
      const daten = JSON.stringify(zustand, null, 2);
      zeigeDialog({
        inhalt: `<p>Automatisches Herunterladen ging nicht. Kopiere den Text:</p><textarea style="min-height:150px;">${esc(daten)}</textarea>`,
        knopfOk: "Schließen",
        knopfAbbrechen: false
      });
    }
  }

  function rucksackLaden(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data || typeof data !== "object" || !("version" in data)) {
          zeigeToast("Diese Datei ist kein NEXT-Rucksack.");
          return;
        }
        zeigeDialog({
          inhalt: "<p>Rucksack laden? Deine aktuellen Daten werden ersetzt.</p>",
          knopfOk: "Laden", knopfAbbrechen: "Abbrechen",
          onOk: () => {
            zustand = mergeStandard(data);
            speichereZustand();
            wendeThemeAn();
            zeige("start");
            zeigeToast("Rucksack geladen.");
          }
        });
      } catch (err) {
        zeigeToast("Diese Datei ist kein NEXT-Rucksack.");
      }
    };
    reader.readAsText(file);
  }

  function skillPaketExportieren() {
    try {
      const paket = {
        typ: "next-skillpaket",
        version: 1,
        fachSkills: zustand.fachSkills,
        ausgeblendet: zustand.ausgeblendet,
        gruppe: zustand.gruppe
      };
      const daten = JSON.stringify(paket, null, 2);
      const datum = new Date().toISOString().slice(0, 10);
      const blob = new Blob([daten], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `NEXT-Skillpaket-${datum}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      zeigeToast("Skill-Paket exportiert.");
    } catch (e) {
      zeigeToast("Export fehlgeschlagen.");
    }
  }

  function skillPaketImportieren(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const paket = JSON.parse(e.target.result);
        if (!paket || paket.typ !== "next-skillpaket") {
          zeigeToast("Das ist kein Skill-Paket.");
          return;
        }
        // Zusammenführen
        if (Array.isArray(paket.fachSkills)) {
          paket.fachSkills.forEach(skill => {
            const index = zustand.fachSkills.findIndex(s => s.id === skill.id);
            if (index >= 0) zustand.fachSkills[index] = skill;
            else zustand.fachSkills.push(skill);
          });
        }
        if (Array.isArray(paket.ausgeblendet)) {
          zustand.ausgeblendet = paket.ausgeblendet;
        }
        if (paket.gruppe) {
          zustand.gruppe = { ...zustand.gruppe, ...paket.gruppe };
        }
        speichereZustand();
        zeigeToast("Skill-Paket importiert.");
        renderApp();
      } catch (err) {
        zeigeToast("Das ist kein Skill-Paket.");
      }
    };
    reader.readAsText(file);
  }

      <button class="leiste-knopf" data-nav="weg"><span class="leiste-emoji">🧭</span><span>Mein Weg</span></button>`;
  }
  renderLeiste();
  // Einmalige Delegation für die Leiste
  document.getElementById("leiste")?.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-nav]");
    if (btn) {
      const ziel = btn.getAttribute("data-nav");
      zeige(ziel, null);
    }
  });
  aktualisiereLeiste();

  // Startansicht
  if (zustand.profil.eingerichtet) {
    zeige("start", null, false);
  } else {
    zeige("einrichtung", null, false);
  }
  if (window.history && history.replaceState) {
    try { history.replaceState({ ansicht: aktAnsicht, param: aktParam }, ""); } catch (e) {}
  }

  // Test-API
  window.NEXT = {
    zustand: () => zustand,
    zeige
  };
