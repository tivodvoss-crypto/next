  }
  if (window.history && history.replaceState) {
    try { history.replaceState({ ansicht: aktAnsicht, param: aktParam }, ""); } catch (e) {}
  }

  // Test-API
  window.NEXT = {
    zustand: () => zustand,
    zeige,
    ladeBeispiel: () => { zustand = beispielZustand(); speichereZustand(); wendeThemeAn(); zeige("start"); }
  };
  </script>
<script>
/* Effekte: Bewegung und Spielerei, rein ergänzend. */
(function() {
  "use strict";

  window.NEXT_EFFEKTE = { version: 2 };

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rafId = null;

  function tryOr(fn) {
    try { return fn(); } catch (e) { return null; }
  }

  /* Aurora Hintergrund einmalig einfügen */
  function auroraEinfuegen() {
    if (document.querySelector('.aurora')) return;
    var div = document.createElement('div');
    div.className = 'aurora';
    div.setAttribute('aria-hidden', 'true');
    for (var i = 0; i < 3; i++) {
      var span = document.createElement('span');
      div.appendChild(span);
    }
    document.body.insertBefore(div, document.body.firstChild);
  }

  if (document.body) {
    tryOr(auroraEinfuegen);
  } else {
    document.addEventListener('DOMContentLoaded', function() {
      tryOr(auroraEinfuegen);
    });
  }

  /* Verzierungen, die nach jedem Rendern und bei DOM-Änderungen laufen */
  function verzierungenAusfuehren() {
    kategorieSymboleFaerben();
    startDekos();
    reglerStartwerteSetzen();
  }

  /* MutationObserver auf #app: bündelt Änderungen per rAF */
  function observerEinrichten() {
    var app = document.getElementById('app');
    if (!app) return false;
    var observer = new MutationObserver(function(mutationen) {
      if (rafId) return;
      rafId = requestAnimationFrame(function() {
        rafId = null;
        verzierungenAusfuehren();
      });
    });
    observer.observe(app, { childList: true, subtree: true });
    return true;
  }

  if (!observerEinrichten()) {
    document.addEventListener('DOMContentLoaded', function() {
      observerEinrichten();
    });
  }

  /* Kategorie-Emojis färben: nur reine Emoji-Spans */
  function kategorieSymboleFaerben() {
    var emojiMap = {
      '🔥': ['#ff6b6b', '#f97316'],
      '🌊': ['#38bdf8', '#3b82f6'],
      '🍃': ['#34d399', '#10b981'],
      '💬': ['#a78bfa', '#8b5cf6'],
      '🎧': ['#f472b6', '#ec4899'],
      '🌱': ['#a3e635', '#22c55e']
    };

    var kandidaten = document.querySelectorAll('.liste-item span:first-child, .skill-zeile span:first-child');
    kandidaten.forEach(function(span) {
      var text = span.textContent.trim();
      var found = null;
      for (var key in emojiMap) {
        if (text === key || text === key + '\uFE0F') {
          found = key;
          break;
        }
      }
      if (found) {
        var farben = emojiMap[found];
        span.classList.add('kat-symbol');
        span.style.setProperty('--k1', farben[0]);
        span.style.setProperty('--k2', farben[1]);
      }
    });
  }

  /* Startseite: Winken hinter das h1, Tageszeit ergänzen */
  function startDekos() {
    var startH1 = document.querySelector('#app .kopf-titel h1');
    if (!startH1) return;
    var kopfTitel = startH1.closest('.kopf-titel') || startH1.parentElement;
    if (!kopfTitel || !kopfTitel.classList.contains('kopf-titel')) return;

    if (!kopfTitel.querySelector('.winken')) {
      var wink = document.createElement('span');
      wink.className = 'winken';
      wink.textContent = '👋';
      wink.setAttribute('aria-hidden', 'true');
      startH1.insertAdjacentElement('afterend', wink);
    }

    var kopfKlein = kopfTitel.querySelector('.kopf-klein');
    if (kopfKlein && !kopfKlein.parentElement.querySelector('.tageszeit')) {
      var tageszeit = document.createElement('span');
      tageszeit.className = 'tageszeit';
      tageszeit.setAttribute('aria-hidden', 'true');
      var stunde = new Date().getHours();
      if (stunde >= 5 && stunde < 10) tageszeit.textContent = 'Guten Morgen ☀️';
      else if (stunde >= 10 && stunde < 17) tageszeit.textContent = 'Schön, dass du da bist ✨';
      else if (stunde >= 17 && stunde < 22) tageszeit.textContent = 'Guten Abend 🌙';
      else tageszeit.textContent = 'Auch nachts ist das okay 🌌';
      kopfKlein.parentElement.appendChild(tageszeit);
    }
  }

  /* Regler-Startwert: --wert aus aktuellem Wert setzen */
  function reglerStartwerteSetzen() {
    var regler = document.querySelectorAll('#app input[type="range"]');
    regler.forEach(function(input) {
      var wert = Number(input.value);
      var min = Number(input.min) || 0;
      var max = Number(input.max) || 100;
      var prozent = ((wert - min) / (max - min)) * 100;
      input.style.setProperty('--wert', prozent);
    });
  }

  /* Ansichtswechsel: gestaffeltes Einblenden */
  var letzterRenderKey = null;

  function animiereAnsicht(e) {
    var detail = e.detail || {};
    var ansicht = detail.ansicht || '';
    var schritt = detail.schritt !== undefined ? detail.schritt : null;
    var key = ansicht + '|' + (schritt === null ? '' : schritt);
    if (key !== letzterRenderKey) {
      letzterRenderKey = key;
      var app = document.getElementById('app');
      if (app) {
        var indexMax = 12;

        function setzeIndex(el, i) {
          el.classList.add('rein');
          el.style.setProperty('--i', i < indexMax ? i : indexMax - 1);
        }

        var kinder = Array.prototype.slice.call(app.children);
        kinder.forEach(function(el, i) { setzeIndex(el, i); });

        var kacheln = app.querySelectorAll('.kachel-grid .kachel');
        kacheln.forEach(function(el, i) { setzeIndex(el, i); });

        var listen = app.querySelectorAll('.liste-item, .skill-zeile, .versuch-zeile, .abzeichen-karte');
        listen.forEach(function(el, i) { setzeIndex(el, i); });

        setTimeout(function() {
          kinder.forEach(function(el) { el.classList.remove('rein'); });
          kacheln.forEach(function(el) { el.classList.remove('rein'); });
          listen.forEach(function(el) { el.classList.remove('rein'); });
        }, 800);

        /* Forscherpass: erreichte Abzeichen animieren */
        if (ansicht === 'pass') {
          animierePassAbzeichen();
        }
      }
    }

    /* Verzierungen unabhängig vom key immer ausführen */
    verzierungenAusfuehren();
  }

  function animierePassAbzeichen() {
    var badges = document.querySelectorAll('#app .abzeichen-karte:not(.grau)');
    badges.forEach(function(badge, index) {
      setTimeout(function() {
        try {
          badge.classList.add('rein');
          badge.style.setProperty('--i', index < 12 ? index : 11);
          setTimeout(function() { badge.classList.remove('rein'); }, 600);
        } catch (e) {}
      }, index * 80);
    });
  }

  /* Druck-Feedback: Welle und Vibration */
  document.addEventListener('pointerdown', function(e) {
    try {
      var ziel = e.target.closest('.btn, .kachel, .chip, .liste-item, .leiste-knopf, .skill-zeile, .versuch-zeile');
      if (!ziel) return;
      var rect = ziel.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;
      var welle = document.createElement('span');
      welle.className = 'welle';
      welle.style.left = x + 'px';
      welle.style.top = y + 'px';
      welle.setAttribute('aria-hidden', 'true');
      ziel.appendChild(welle);
      setTimeout(function() {
        try { welle.remove(); } catch (e) {}
      }, 450);
      if (navigator.vibrate) {
        try { navigator.vibrate(8); } catch (e) {}
      }
    } catch (e) {}
  }, { passive: true });

  /* Regler: Huepf und Farbvariable */
  document.addEventListener('input', function(e) {
    try {
      var input = e.target;
      if (input.matches && input.matches('input[type="range"]')) {
        var wert = Number(input.value);
        var min = Number(input.min) || 0;
        var max = Number(input.max) || 100;
        var prozent = ((wert - min) / (max - min)) * 100;
        input.style.setProperty('--wert', prozent);

        var wertEl = null;
        var parent = input.parentElement;
        if (parent) {
          var alle = parent.querySelectorAll('.regler-wert');
          if (alle.length > 0) wertEl = alle[0];
        }
        if (!wertEl && input.nextElementSibling && input.nextElementSibling.classList.contains('regler-wert')) {
          wertEl = input.nextElementSibling;
        }
        if (wertEl) {
          wertEl.classList.remove('huepf');
          void wertEl.offsetWidth;
          wertEl.classList.add('huepf');
        }
      }
    } catch (e) {}
  });

  /* Timer: Atemkreis und Ring */
  document.addEventListener('next:timer', function(e) {
    try {
      var detail = e.detail || {};
      var rest = detail.rest || 0;
      var gesamt = detail.gesamt || 1;
      var skillId = detail.skillId || '';

      var feld = document.getElementById('timer-feld');
      if (!feld) return;

      var ring = feld.querySelector('.timer-ring');
      if (!ring) {
        ring = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        ring.setAttribute('class', 'timer-ring');
        ring.setAttribute('viewBox', '0 0 220 220');
        ring.setAttribute('width', '220');
        ring.setAttribute('height', '220');
        ring.setAttribute('aria-hidden', 'true');

        var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        var grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
        grad.setAttribute('id', 'timerGrad');
        grad.setAttribute('x1', '0%');
        grad.setAttribute('y1', '0%');
        grad.setAttribute('x2', '100%');
        grad.setAttribute('y2', '100%');
        var stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
        stop1.setAttribute('offset', '0%');
        stop1.style.stopColor = 'var(--akzent)';
        var stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
        stop2.setAttribute('offset', '100%');
        stop2.style.stopColor = 'var(--akzent2)';
        grad.appendChild(stop1);
        grad.appendChild(stop2);
        defs.appendChild(grad);
        ring.appendChild(defs);

        var hintergrund = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hintergrund.setAttribute('cx', '110');
        hintergrund.setAttribute('cy', '110');
        hintergrund.setAttribute('r', '90');
        hintergrund.setAttribute('fill', 'none');
        hintergrund.setAttribute('stroke', 'rgba(255,255,255,0.1)');
        hintergrund.setAttribute('stroke-width', '10');
        ring.appendChild(hintergrund);

        var fortschritt = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        fortschritt.setAttribute('cx', '110');
        fortschritt.setAttribute('cy', '110');
        fortschritt.setAttribute('r', '90');
        fortschritt.setAttribute('fill', 'none');
        fortschritt.setAttribute('stroke', 'url(#timerGrad)');
        fortschritt.setAttribute('stroke-width', '10');
        fortschritt.setAttribute('stroke-linecap', 'round');
        var umfang = 2 * Math.PI * 90;
        fortschritt.setAttribute('stroke-dasharray', umfang.toString());
        fortschritt.setAttribute('stroke-dashoffset', umfang.toString());
        fortschritt.style.transition = 'stroke-dashoffset 1s linear';
        fortschritt.classList.add('timer-progress');
        ring.appendChild(fortschritt);

        feld.appendChild(ring);
      }

      var progress = 1 - (rest / gesamt);
      var umfang = 2 * Math.PI * 90;
      var circle = feld.querySelector('.timer-progress');
      if (circle) {
        circle.style.strokeDashoffset = (umfang * (1 - progress)).toString();
      }

      var atem = feld.querySelector('.atem');
      if (!atem) {
        atem = document.createElement('div');
        atem.className = 'atem';
        atem.setAttribute('aria-hidden', 'true');
        atem.style.animationDelay = -(gesamt - rest) + 's';
        feld.appendChild(atem);
      }

      var atemText = feld.querySelector('.atem-text');
      if (!atemText) {
        atemText = document.createElement('div');
        atemText.className = 'atem-text';
        atemText.setAttribute('aria-hidden', 'true');
        feld.appendChild(atemText);
      }

      if (atemText) {
        var elapsed = gesamt - rest;
        if (skillId === 'box') {
          var phase = Math.floor(elapsed / 4) % 4;
          var texte = ['Einatmen', 'Halten', 'Ausatmen', 'Halten'];
          atemText.textContent = texte[phase];
          atem.classList.add('box');
        } else {
          var phaseNormal = Math.floor(elapsed / 4) % 2;
          atemText.textContent = phaseNormal === 0 ? 'Einatmen' : 'Ausatmen';
          atem.classList.remove('box');
        }
        atemText.classList.remove('wechsel');
        void atemText.offsetWidth;
        atemText.classList.add('wechsel');
      }
    } catch (e) {}
  });

  /* Timer fertig: Glanz-Puls */
  document.addEventListener('next:timer-fertig', function(e) {
    try {
      var feld = document.getElementById('timer-feld');
      if (feld) {
        feld.classList.add('puls');
        setTimeout(function() {
          try { feld.classList.remove('puls'); } catch (e) {}
        }, 800);
      }
    } catch (e) {}
  });

  /* Speichern: Konfetti und Abzeichen-Popup */
  document.addEventListener('next:gespeichert', function(e) {
    try {
      var detail = e.detail || {};
      if (reduceMotion) {
        abzeichenPopup(detail.abzeichen);
        return;
      }
      konfettiZeigen(detail.abzeichen);
    } catch (e) {}
  });

  function konfettiZeigen(abzeichen) {
    var canvas = document.createElement('canvas');
    canvas.className = 'konfetti-canvas';
    canvas.setAttribute('aria-hidden', 'true');
    canvas.style.position = 'fixed';
    canvas.style.inset = '0';
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.pointerEvents = 'none';
    canvas.style.zIndex = '400';
    document.body.appendChild(canvas);

    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var breite = window.innerWidth;
    var hoehe = window.innerHeight;
    canvas.width = breite * dpr;
    canvas.height = hoehe * dpr;
    canvas.style.width = breite + 'px';
    canvas.style.height = hoehe + 'px';
    ctx.scale(dpr, dpr);

    var akzent = getComputedStyle(document.documentElement).getPropertyValue('--akzent').trim() || '#38bdf8';
    var akzent2 = getComputedStyle(document.documentElement).getPropertyValue('--akzent2').trim() || '#6366f1';

    var teilchen = [];
    for (var i = 0; i < 90; i++) {
      var farbe;
      var rand = Math.random();
      if (rand < 0.4) farbe = akzent;
      else if (rand < 0.7) farbe = akzent2;
      else farbe = '#ffffff';
      teilchen.push({
        x: breite / 2,
        y: hoehe * 0.3,
        vx: (Math.random() - 0.5) * 12,
        vy: -(7 + Math.random() * 9),
        winkel: Math.random() * Math.PI * 2,
        drehung: (Math.random() - 0.5) * 0.3,
        groesse: 6 + Math.random() * 8,
        farbe: farbe,
        leben: 1,
        form: Math.random() < 0.5 ? 'rechteck' : 'kreis'
      });
    }

    var start = performance.now();
    var dauer = 1600;

    function zeichnen(jetzt) {
      var vergangen = jetzt - start;
      var fortschritt = Math.min(vergangen / dauer, 1);

      ctx.clearRect(0, 0, breite, hoehe);

      for (var i = 0; i < teilchen.length; i++) {
        var t = teilchen[i];
        t.vy += 0.32; // Schwerkraft
        t.x += t.vx;
        t.y += t.vy;
        t.winkel += t.drehung;

        var alpha = 1 - fortschritt;
        if (alpha < 0) alpha = 0;

        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.rotate(t.winkel);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = t.farbe;
        if (t.form === 'kreis') {
          ctx.beginPath();
          ctx.arc(0, 0, t.groesse / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillRect(-t.groesse / 2, -t.groesse / 2, t.groesse, t.groesse);
        }
        ctx.restore();
      }

      if (fortschritt < 1) {
        requestAnimationFrame(zeichnen);
      } else {
        try { canvas.remove(); } catch (e) {}
      }
    }

    requestAnimationFrame(zeichnen);

    abzeichenPopup(abzeichen);
  }

  function abzeichenPopup(abzeichen) {
    if (!abzeichen || abzeichen.length === 0) return;
    var pop = document.createElement('div');
    pop.className = 'abzeichen-pop';
    pop.setAttribute('aria-hidden', 'true');

    var emoji = document.createElement('div');
    emoji.className = 'pop-emoji';
    emoji.textContent = abzeichen[0].emoji;

    var titel = document.createElement('div');
    titel.className = 'pop-titel';
    titel.textContent = 'Neues Abzeichen';

    var name = document.createElement('div');
    name.className = 'pop-name';
    name.textContent = abzeichen[0].name;

    pop.appendChild(emoji);
    pop.appendChild(titel);
    pop.appendChild(name);

    document.body.appendChild(pop);

    var timer = setTimeout(function() {
      try { pop.remove(); } catch (e) {}
    }, 2400);

    pop.addEventListener('click', function() {
      clearTimeout(timer);
      try { pop.remove(); } catch (e) {}
    });
  }

  /* Event Listener registrieren */
  document.addEventListener('next:gerendert', function(e) {
    try { animiereAnsicht(e); } catch (e) {}
  });
})();

</script>

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
