  // --------------------------------------------------------------------
  // Abschnitt: start (Check-in)
  // --------------------------------------------------------------------
  const startAbschnittHtml = () => {
    const rucksack = zustand.welt.rucksack;
    if (!rucksack.checkinAn || checkinHeuteAusgeblendet) return "";
    const letzter = rucksack.checkins[rucksack.checkins.length - 1];
    const vor7Tagen = new Date(Date.now() - 7 * 86400000);
    if (letzter && new Date(letzter.datum) > vor7Tagen) return "";
    return `<div class="karte"><h3>Kurzer Check-in? Ganz freiwillig.</h3><button class="btn" data-wb-checkin-ja>Ja, kurz</button><button class="btn btn-ghost" data-wb-checkin-heute-nicht>Heute nicht</button></div>`;
  };

  const startAbschnittBinden = () => {
    document.querySelector("[data-wb-checkin-ja]")?.addEventListener("click", () => zeige("checkin"));
    document.querySelector("[data-wb-checkin-heute-nicht]")?.addEventListener("click", () => {
      checkinHeuteAusgeblendet = true;
      renderApp();
    });
  };

  // --------------------------------------------------------------------
  // Ansicht: checkin
  // --------------------------------------------------------------------
  const checkinErgebnisHtml = () => {
    const letzter = zustand.welt.rucksack.checkins[zustand.welt.rucksack.checkins.length - 1];
    const istSchwer = letzter && (letzter.wie === "schwer" || letzter.warnzeichen.length > 0);
    if (istSchwer) {
      return `<div class="karte"><h3>Gut, dass du hinschaust. Das ist genau der richtige Moment für deinen Plan.</h3><button class="btn" data-nav="plan">Mein Plan</button><button class="btn btn-zweit" data-nav="koffer">Meine Skills</button><button class="btn btn-zweit" data-nav="hilfe">Jemanden erreichen</button><button class="btn btn-zweit" data-nav="fest">Ich stecke fest</button></div>`;
    }
    return `<div class="karte"><h3>Danke. Schön, dass du auf dich achtest.</h3><button class="btn" data-wb-checkin-start>Zur Startseite</button></div>`;
  };

  const checkinSpeichern = (wie, warnzeichen) => {
    zustand.welt.rucksack.checkins.push({ id: neueId(), datum: new Date().toISOString(), wie, warnzeichen });
    NEXTWELT.belohnen("checkin", "Check-in gemacht");
    wbspeichern();
    checkinSchritt = 2;
    renderApp();
  };

  const checkinRender = () => {
    // Ergebnis nur direkt nach dem Speichern zeigen; später beginnt ein neuer Check-in.
    if (checkinSchritt === 2) {
      const liste = zustand.welt.rucksack.checkins;
      const letzter = liste[liste.length - 1];
      if (!letzter || Date.now() - new Date(letzter.datum).getTime() > 30 * 60000) {
        checkinSchritt = 0; checkinWie = ""; checkinWarnzeichen = [];
      }
    }
    if (checkinSchritt === 0) {
      return `<div class="karte wb-frage"><h3>Wie war deine Woche?</h3><div class="chip-zeile"><button class="chip" data-wb-checkin-wie="gut">Gut</button><button class="chip" data-wb-checkin-wie="mittel">Gemischt</button><button class="chip" data-wb-checkin-wie="schwer">Schwer</button></div></div>`;
    } else if (checkinSchritt === 1) {
      const warnzeichen = zustand.welt.rucksack.warnzeichen;
      if (warnzeichen.length === 0) {
        return `<div class="karte wb-frage"><h3>Danke.</h3><button class="btn" data-wb-checkin-keins>Speichern</button></div>`;
      }
      let html = `<div class="karte wb-frage"><h3>Bemerkst du gerade eines deiner Warnzeichen?</h3><div class="chip-zeile">`;
      for (const wz of warnzeichen) {
        const aktiv = checkinWarnzeichen.includes(wz);
        html += `<button class="chip ${aktiv ? "aktiv" : ""}" data-wb-checkin-warnzeichen="${esc(wz)}">${esc(wz)}</button>`;
      }
      html += `</div>${checkinWarnzeichen.length ? `<button class="btn" data-wb-checkin-weiter>Weiter</button>` : ""}<button class="btn btn-zweit" data-wb-checkin-keins>Keins davon</button></div>`;
      return html;
    } else {
      let html = checkinErgebnisHtml();
      html += `<p class="klein">Der Check-in meldet niemandem etwas. Bei Gefahr: 112.</p>`;
      return html;
    }
  };

  const checkinBinden = () => {
    if (checkinSchritt === 0) {
      document.querySelectorAll("[data-wb-checkin-wie]").forEach(el => {
        el.addEventListener("click", () => {
          checkinWie = el.getAttribute("data-wb-checkin-wie");
          if (zustand.welt.rucksack.warnzeichen.length === 0) {
            checkinSpeichern(checkinWie, []);
          } else {
            checkinSchritt = 1;
            checkinWarnzeichen = [];
            renderApp();
          }
        });
      });
    } else if (checkinSchritt === 1) {
      document.querySelectorAll("[data-wb-checkin-warnzeichen]").forEach(el => {
        el.addEventListener("click", () => {
          const wert = el.getAttribute("data-wb-checkin-warnzeichen");
          if (checkinWarnzeichen.includes(wert)) checkinWarnzeichen = checkinWarnzeichen.filter(x => x !== wert);
          else checkinWarnzeichen.push(wert);
          renderApp();
        });
      });
      document.querySelector("[data-wb-checkin-keins]")?.addEventListener("click", () => {
        checkinSpeichern(checkinWie, []);
      });
      document.querySelector("[data-wb-checkin-weiter]")?.addEventListener("click", () => {
        checkinSpeichern(checkinWie, checkinWarnzeichen.slice());
      });
    } else {
      document.querySelector("[data-wb-checkin-start]")?.addEventListener("click", () => {
        zeige("start");
        checkinSchritt = 0;
        checkinWie = "";
        checkinWarnzeichen = [];
      });
    }
  };

  // --------------------------------------------------------------------
  // Ansicht: rucksack
  // --------------------------------------------------------------------
  const rucksackRender = () => {
    const rucksack = zustand.welt.rucksack;
    const skills = kofferSkills(999);
    let html = `<h1>Mein Rucksack</h1><p>Alles, was dir hilft, an einem Ort. Für die Zeit nach der Station.</p>`;

    html += `<div class="karte"><h3>🧳 Meine wichtigsten Skills</h3>`;
    if (skills.length) {
      for (const skill of skills) html += `<div class="skill-zeile"><span>${esc(skill.name)}</span><span class="klein">${esc(skill.kategorie || "")}</span></div>`;
    } else html += `<p class="klein">Noch keine Skills im Koffer.</p>`;
    html += `<button class="btn btn-zweit" data-nav="koffer">Skills ansehen</button></div>`;

    const getrautLetzte = [...zustand.welt.weg.getraut].slice(-3).reverse();
    html += `<div class="karte"><h3>🌟 Meine Stärken und Erfahrungen</h3>`;
    if (zustand.welt.weg.staerken.length || getrautLetzte.length) {
      if (zustand.welt.weg.staerken.length) {
        html += `<div class="chip-zeile">`;
        for (const s of zustand.welt.weg.staerken) html += `<span class="chip">${esc(s)}</span>`;
        html += `</div>`;
      }
      for (const g of getrautLetzte) html += `<p class="klein">${esc(g.text)}</p>`;
    } else {
      html += `<p class="klein">Noch keine Einträge.</p>`;
    }
    html += `<button class="btn btn-zweit" data-nav="weg">Mein Weg</button></div>`;

    html += `<div class="karte"><h3>🚦 Meine Warnzeichen</h3>`;
    if (rucksack.warnzeichen.length) {
      for (const wz of rucksack.warnzeichen) {
        html += `<div class="skill-zeile"><span>${esc(wz)}</span><button class="btn btn-klein" data-wb-rs-warn-loeschen="${esc(wz)}">Löschen</button></div>`;
      }
    } else {
      html += `<p class="klein">z. B. Ich ziehe mich zurück. Ich schlafe schlecht. Ich gehe nicht mehr raus.</p>`;
    }
    html += `<div class="feld"><input type="text" id="wb-rs-warn-eingabe" placeholder="Neues Warnzeichen"><button class="btn btn-zweit" data-wb-rs-warn-dazu>Dazu</button></div><p class="klein">Am besten mit deinem Team zusammen sammeln.</p></div>`;

    const plan = zustand.plan;
    html += `<div class="karte"><h3>🆘 Mein Krisenplan und Kontakte</h3>`;
    if (plan.text) html += `<p>${esc(plan.text)}</p>`;
    else html += `<p class="klein">Noch kein Text gespeichert.</p>`;
    if (plan.kontakte.length) {
      for (const k of plan.kontakte) html += `<p class="klein">${esc(k.name)}: ${esc(k.telefon)}</p>`;
    }
    html += `<button class="btn btn-zweit" data-nav="plan">Bearbeiten</button><button class="btn btn-ghost" data-nav="hilfe">Hilfe</button></div>`;

    const schule = zustand.welt.schule || {};
    const etappen = schule.etappen || [];
    html += `<div class="karte"><h3>🏫 Schulplan und Morgenroutine</h3>`;
    if (etappen.length) {
      const offen = etappen.find(e => !e.erledigt);
      if (offen) html += `<p>Nächste Etappe: ${esc(offen.text)}</p>`;
      else html += `<p>Alle Etappen geschafft.</p>`;
    }
    const morgenschritte = (schule.morgen?.schritte || []).length;
    html += `<p class="klein">${morgenschritte} Morgenschritte.</p><button class="btn btn-zweit" data-nav="schule">Schulplan</button><button class="btn btn-ghost" data-nav="morgen">Morgenroutine</button></div>`;

    html += `<div class="karte"><h3>🔭 Ziele und nächste Challenges</h3>`;
    if (zustand.welt.ziele.length) {
      for (const z of zustand.welt.ziele) {
        const next = z.schritte.find(s => !s.erledigt);
        if (next) html += `<p class="klein">Ziel: ${esc(z.wunsch)} · Nächster: ${esc(next.text)}</p>`;
      }
    } else html += `<p class="klein">Noch keine Ziele.</p>`;
    if (zustand.welt.challenges.aktiv.length) {
      for (const a of zustand.welt.challenges.aktiv) html += `<p class="klein">Challenge: ${esc(a.text)}</p>`;
    }
    html += `<button class="btn btn-zweit" data-nav="zukunft">Zukunftskompass</button><button class="btn btn-ghost" data-nav="challenges">Challenges</button></div>`;

    const mutmacher = zustand.welt.mutmacher?.eigene || [];
    html += `<div class="karte"><h3>✨ Meine Mutmacher</h3>`;
    if (mutmacher.length) {
      for (const m of mutmacher) html += `<p class="klein">${esc(m)}</p>`;
    } else html += `<p class="klein">Noch keine Mutmacher.</p>`;
    html += `</div>`;

    html += `<div class="karte"><h3>🧭 Mein Kompass</h3>`;
    if (zustand.kompass.length) {
      for (const k of zustand.kompass) html += `<p class="klein">Wenn ${esc(k.wenn)}, hilft mir ${esc(k.dann)}.</p>`;
    } else html += `<p class="klein">Noch kein Kompass.</p>`;
    html += `</div>`;

    html += `<div class="karte"><h3>✅ Packliste vor der Entlassung</h3>`;
    const packPunkte = [
      { id: "skills", label: "Meine wichtigsten Skills sind im Koffer" },
      { id: "warn", label: "Meine Warnzeichen sind eingetragen" },
      { id: "plan", label: "Mein Krisenplan ist ausgefüllt" },
      { id: "kontakte", label: "Wichtige Kontakte sind drin" },
      { id: "schule", label: "Schulplan und Morgenroutine passen" },
      { id: "ziele", label: "Ich habe ein nächstes Ziel" },
      { id: "mut", label: "Ich habe meine Mutmacher" },
      { id: "gesichert", label: "Ich habe den Rucksack auf mein Gerät übertragen" }
    ];
    for (const p of packPunkte) {
      const checked = rucksack.packliste[p.id] ? "checked" : "";
      html += `<label class="wb-pack"><input type="checkbox" data-wb-rs-pack="${p.id}" ${checked}> ${esc(p.label)}</label>`;
    }
    html += `</div>`;

    html += `<div class="karte"><h3>📲 Auf mein eigenes Gerät</h3><p>Sichere den Rucksack als Datei und lade ihn auf deinem Handy in NEXT unter Einstellungen. Die App braucht danach keine Verbindung zur Klinik.</p><button class="btn" data-wb-rs-sichern>Rucksack sichern</button></div>`;

    html += `<div class="karte"><h3>💭 Kurzer Check-in</h3><label class="wb-pack"><input type="checkbox" data-wb-rs-checkin ${rucksack.checkinAn ? "checked" : ""}> Freiwilligen Check-in einmal pro Woche anbieten</label></div>`;

    return html;
  };

  const rucksackBinden = () => {
    document.querySelector("[data-wb-rs-warn-dazu]")?.addEventListener("click", () => {
      const text = document.getElementById("wb-rs-warn-eingabe").value.trim();
      if (text) {
        zustand.welt.rucksack.warnzeichen.push(text);
        wbspeichern();
        renderApp();
      }
    });
    document.querySelectorAll("[data-wb-rs-warn-loeschen]").forEach(el => {
      el.addEventListener("click", () => {
        const wert = el.getAttribute("data-wb-rs-warn-loeschen");
        zeigeDialog({
          inhalt: `Warnzeichen „${esc(wert)}“ löschen?`,
          knopfOk: "Ja, löschen",
          knopfAbbrechen: "Abbrechen",
          onOk: () => {
            zustand.welt.rucksack.warnzeichen = zustand.welt.rucksack.warnzeichen.filter(x => x !== wert);
            wbspeichern();
            schliesseDialog();
            renderApp();
          },
          onAbbrechen: schliesseDialog
        });
      });
    });
    document.querySelectorAll("[data-wb-rs-pack]").forEach(el => {
      el.addEventListener("change", () => {
        const id = el.getAttribute("data-wb-rs-pack");
        zustand.welt.rucksack.packliste[id] = el.checked;
        wbspeichern();
      });
    });
    document.querySelector("[data-wb-rs-sichern]")?.addEventListener("click", () => rucksackSichern());
    document.querySelector("[data-wb-rs-checkin]")?.addEventListener("change", (e) => {
      zustand.welt.rucksack.checkinAn = e.currentTarget.checked;
      wbspeichern();
    });
  };

  // --------------------------------------------------------------------
  // Abschnitt: plan
  // --------------------------------------------------------------------
  const planAbschnittHtml = () => {
    const warnzeichen = zustand.welt.rucksack.warnzeichen;
    let html = `<div class="karte"><h3>🚦 Meine Warnzeichen</h3>`;
    if (warnzeichen.length) {
      for (const wz of warnzeichen) html += `<p class="klein">${esc(wz)}</p>`;
    } else html += `<p class="klein">Noch keine Warnzeichen.</p>`;
    html += `<button class="btn btn-zweit" data-nav="rucksack">Bearbeiten</button></div>`;
    return html;
  };

  // --------------------------------------------------------------------
  // Abschnitt: fach
  // --------------------------------------------------------------------
  const fachAbschnittHtml = () => {
    const vorschlaege = zustand.welt.challenges.vorschlaege;
    let html = `<div class="karte"><h3>🎲 Challenges für diese:n Jugendliche:n auswählen</h3>`;
    for (const welt of CHALLENGE_WELTEN) {
      html += `<h3>${esc(welt.emoji)} ${esc(welt.name)}</h3>`;
      for (const c of CHALLENGES.filter(ch => ch.welt === welt.id)) {
        const checked = vorschlaege.includes(c.id) ? "checked" : "";
        html += `<label class="wb-pack"><input type="checkbox" data-wb-fach-vorschlag="${esc(c.id)}" ${checked}> ${esc(c.text)} <span class="chip wb-stufe-${esc(c.stufe)}">${stufeText(c.stufe)}</span></label>`;
      }
    }
    html += `<p class="klein">Die Jugendlichen sehen sie als Vorschlag unter Vom Team für dich und entscheiden selbst.</p>`;
    html += `<h3>Eigene Team-Challenge</h3><div class="feld"><input type="text" id="wb-fach-eigene-text" placeholder="Challenge-Text"></div><div class="feld"><select id="wb-fach-eigene-welt">`;
    for (const welt of CHALLENGE_WELTEN) html += `<option value="${esc(welt.id)}">${esc(welt.emoji)} ${esc(welt.name)}</option>`;
    html += `</select></div><div class="feld"><select id="wb-fach-eigene-stufe"><option value="mini">Mini</option><option value="mittel">Mittel</option><option value="gross">Groß</option></select></div><button class="btn" data-wb-fach-eigene-anlegen>Anlegen und vorschlagen</button></div>`;
    html += `<div class="karte"><h3>🎲 Gruppen-Challenge</h3><p class="klein">Für mehrere Geräte: Challenges hier auswählen, dann über Skill-Paket teilen ist für später geplant.</p></div>`;
    return html;
  };

  const fachAbschnittBinden = () => {
    document.querySelectorAll("[data-wb-fach-vorschlag]").forEach(el => {
      el.addEventListener("change", () => {
        const id = el.getAttribute("data-wb-fach-vorschlag");
        const vorschlaege = zustand.welt.challenges.vorschlaege;
        if (el.checked) {
          if (!vorschlaege.includes(id)) vorschlaege.push(id);
        } else {
          zustand.welt.challenges.vorschlaege = vorschlaege.filter(v => v !== id);
        }
        wbspeichern();
      });
    });
    document.querySelector("[data-wb-fach-eigene-anlegen]")?.addEventListener("click", () => {
      const text = document.getElementById("wb-fach-eigene-text").value.trim();
      const welt = document.getElementById("wb-fach-eigene-welt").value;
      const stufe = document.getElementById("wb-fach-eigene-stufe").value;
      if (!text) { zeigeToast("Bitte Challenge-Text eingeben."); return; }
      const id = neueId();
      zustand.welt.challenges.eigene.push({ id, welt, stufe, text, vonTeam: true });
      zustand.welt.challenges.vorschlaege.push(id);
      wbspeichern();
      renderApp();
    });
  };

  // --------------------------------------------------------------------
  // Kacheln
  // --------------------------------------------------------------------
  const startKachelnHtml = () => {
    return `<button class="kachel" data-nav="challenges"><span class="kachel-emoji">🎲</span>Challenges</button>`;
  };

  const questKachelnHtml = () => {
    return `<button class="kachel" data-nav="challenges"><span class="kachel-emoji">🎲</span>Challenges</button>
      <button class="kachel" data-nav="zukunft"><span class="kachel-emoji">🔭</span>Zukunftskompass</button>
      <button class="kachel" data-nav="rucksack"><span class="kachel-emoji">🎒</span>Mein Rucksack</button>`;
  };

  // --------------------------------------------------------------------
  // Registrierung
  // --------------------------------------------------------------------
  NEXTWELT.normalisierer.push(normalisiereWeltB);
  NEXTWELT.beispielBauer.push(beispielBauerB);

  NEXTWELT.abschnitt("festStart", { html: festStartHtml, binden: festStartBinden });
  NEXTWELT.abschnitt("startKacheln", { html: startKachelnHtml, binden: function () {} });
  NEXTWELT.abschnitt("questKacheln", { html: questKachelnHtml, binden: function () {} });
  NEXTWELT.abschnitt("weg", { html: wegAbschnittHtml, binden: wegAbschnittBinden });
  NEXTWELT.abschnitt("fach", { html: fachAbschnittHtml, binden: fachAbschnittBinden });
  NEXTWELT.abschnitt("plan", { html: planAbschnittHtml, binden: function () {} });
  NEXTWELT.abschnitt("start", { html: startAbschnittHtml, binden: startAbschnittBinden });

  NEXTWELT.registriere("situation", { render: situationRender, binden: situationBinden });
  NEXTWELT.registriere("challenges", { render: challengesRender, binden: challengesBinden });
  NEXTWELT.registriere("challengeReflexion", { render: challengeReflexionRender, binden: challengeReflexionBinden, ohneLeiste: true });
  NEXTWELT.registriere("zukunft", { render: zukunftRender, binden: zukunftBinden });
  NEXTWELT.registriere("zielNeu", { render: zielNeuRender, binden: zielNeuBinden, ohneLeiste: true });
  NEXTWELT.registriere("ziel", { render: zielRender, binden: zielBinden });
  NEXTWELT.registriere("rucksack", { render: rucksackRender, binden: rucksackBinden });
  NEXTWELT.registriere("checkin", { render: checkinRender, binden: checkinBinden, ohneLeiste: true });

})();

</script>

  function welt() { return typeof window.NEXTWELT === "object" && window.NEXTWELT ? window.NEXTWELT : null; }
  function weltAbschnitte(ort) { try { return welt() ? NEXTWELT.abschnitteHtml(ort) : ""; } catch (e) { return ""; } }

  function neueId() {

  function esc(text) {
    if (text === null || typeof text === "undefined") return "";
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  /* ---------- Theme ---------- */

  function wendeThemeAn() {
    if (!zustand) return;
    // Alte Spielstände mit "nacht" landen auf ozean.
    const thema = THEMEN[zustand.profil.thema] ? zustand.profil.thema : "ozean";
    Object.keys(THEMEN).forEach(t => document.body.classList.toggle("thema-" + t, t === thema));
    const farben = THEMEN[thema];
    const wurzel = document.documentElement.style;
    wurzel.setProperty("--akzent", farben.akzent);
    wurzel.setProperty("--akzent2", farben.akzent2);
    wurzel.setProperty("--akzent-hell", farben.hell);
    wurzel.setProperty("--grund", farben.grund);
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) metaTheme.setAttribute("content", farben.grund);
  }

  /* ---------- Zustand laden/speichern ---------- */

  function mergeStandard(geladen) {
    const z = JSON.parse(JSON.stringify(STANDARD_ZUSTAND));
    if (!geladen || typeof geladen !== "object") return z;
    z.version = 1;
    if (geladen.profil && typeof geladen.profil === "object") {
      z.profil = { ...z.profil, ...geladen.profil };
    }
    z.eigeneSkills = Array.isArray(geladen.eigeneSkills) ? geladen.eigeneSkills : [];
    z.fachSkills = Array.isArray(geladen.fachSkills) ? geladen.fachSkills : [];
    z.ausgeblendet = Array.isArray(geladen.ausgeblendet) ? geladen.ausgeblendet : [];
    z.versuche = Array.isArray(geladen.versuche) ? geladen.versuche : [];
    if (geladen.koffer && typeof geladen.koffer === "object") {
      z.koffer = { ...z.koffer, ...geladen.koffer };
      z.koffer.mittel = Array.isArray(z.koffer.mittel) ? z.koffer.mittel : [];
      z.koffer.hoch = Array.isArray(z.koffer.hoch) ? z.koffer.hoch : [];
      z.koffer.langfristig = Array.isArray(z.koffer.langfristig) ? z.koffer.langfristig : [];
    }
    z.angesehen = Array.isArray(geladen.angesehen) ? geladen.angesehen : [];
    if (geladen.plan && typeof geladen.plan === "object") {
      z.plan = { ...z.plan, ...geladen.plan };
      z.plan.kontakte = Array.isArray(z.plan.kontakte) ? z.plan.kontakte : [];
    }
    z.kompass = Array.isArray(geladen.kompass) ? geladen.kompass : [];
    if (geladen.gruppe && typeof geladen.gruppe === "object") {
      z.gruppe = { ...z.gruppe, ...geladen.gruppe };
      z.gruppe.skillIds = Array.isArray(z.gruppe.skillIds) ? z.gruppe.skillIds : [];
    }
    z.fachPin = typeof geladen.fachPin === "string" ? geladen.fachPin : "";
    // Erweiterungen (Quests, Challenges, Zukunft ...) pflegen ihren Teil selbst.
    z.welt = (geladen.welt && typeof geladen.welt === "object") ? geladen.welt : {};
    return z;
  }

  function ladeZustand() {
    try {
      const roh = localStorage.getItem("next-v1");
      if (roh) {
        try {
          const geladen = JSON.parse(roh);
          zustand = mergeStandard(geladen);
          speicherProblem = false;
        } catch (e) {
          // Kaputtes JSON aufheben und mit leerem Zustand starten
          try {
            localStorage.setItem("next-v1-kaputt-" + Date.now(), roh);
          } catch (e2) {}
          zustand = JSON.parse(JSON.stringify(STANDARD_ZUSTAND));
          speicherProblem = false;
        }
      } else {
        zustand = JSON.parse(JSON.stringify(STANDARD_ZUSTAND));
        speicherProblem = false;
      }
    } catch (e) {
      // localStorage nicht verfügbar, Arbeitsspeicher verwenden
      zustand = JSON.parse(JSON.stringify(STANDARD_ZUSTAND));
      speicherProblem = true;
    }
  }

  function speichereZustand() {
    if (!zustand) return;
    try {
      localStorage.setItem("next-v1", JSON.stringify(zustand));
      speicherProblem = false;
    } catch (e) {
      speicherProblem = true;
    }
  }

  /* ---------- Navigation ---------- */

  function aktualisiereLeiste() {
    const leiste = document.getElementById("leiste");
    if (!leiste) return;
    const versteckt = ["einrichtung", "fachLogin", "fach", "versuch", "skillForm"].includes(aktAnsicht)
      || !!(welt() && NEXTWELT.ansichten[aktAnsicht] && NEXTWELT.ansichten[aktAnsicht].ohneLeiste);
    leiste.classList.toggle("hidden", versteckt);
    if (!versteckt) {
      leiste.querySelectorAll("[data-nav]").forEach(btn => {
        const ziel = btn.getAttribute("data-nav");
        btn.classList.toggle("aktiv", ziel === aktAnsicht && !aktParam);
      });
    }
  }

  function zeige(ansicht, param, pushHistory) {
    stoppeTimer();
    aktAnsicht = ansicht;
    aktParam = param;
    renderApp();
    // Neue Ansicht beginnt oben, sonst landet man mitten in der Seite.
    try { window.scrollTo(0, 0); } catch (e) {}
    wendeThemeAn();
    aktualisiereLeiste();
    if (pushHistory !== false) {
      try {
        history.pushState({ ansicht, param }, "");
      } catch (e) {}
    }
  }

  window.addEventListener("popstate", function (e) {
    if (e.state && e.state.ansicht) {
      zeige(e.state.ansicht, e.state.param, false);
    } else {
      zeige("start", null, false);
    }
  });

  /* ---------- Toast und Dialog ---------- */

  function zeigeToast(text, aktionText, aktionCallback) {
    const bereich = document.getElementById("toast-bereich");
    bereich.innerHTML = "";
    const toast = document.createElement("div");
    toast.className = "toast";
    const span = document.createElement("span");
    span.textContent = text;
    toast.appendChild(span);
    if (aktionText && aktionCallback) {
      const btn = document.createElement("button");
      btn.textContent = aktionText;
      btn.addEventListener("click", () => {
        aktionCallback();
        toast.remove();
      });
      toast.appendChild(btn);
    }
    bereich.appendChild(toast);
    setTimeout(() => {
      toast.remove();
    }, aktionText ? 4000 : 2500);
  }

  function schliesseDialog() {
    document.getElementById("dialog-bereich").innerHTML = "";
  }

  function zeigeDialog({ inhalt, knopfOk, knopfAbbrechen, onOk, onAbbrechen }) {
    const bereich = document.getElementById("dialog-bereich");
    bereich.innerHTML = "";
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay && knopfAbbrechen !== false) {
        schliesseDialog();
        if (onAbbrechen) onAbbrechen();
      }
    });
    const dialog = document.createElement("div");
    dialog.className = "dialog";
    const inhaltDiv = document.createElement("div");
    inhaltDiv.innerHTML = inhalt;
    dialog.appendChild(inhaltDiv);
    const buttons = document.createElement("div");
    buttons.className = "dialog-buttons";
    if (knopfOk !== false) {
      const okBtn = document.createElement("button");
      okBtn.className = "btn";
      okBtn.textContent = knopfOk || "OK";
      okBtn.setAttribute("data-test", "ok");
      okBtn.addEventListener("click", () => {
        schliesseDialog();
        if (onOk) onOk(dialog);
      });
      buttons.appendChild(okBtn);
    }
    if (knopfAbbrechen && knopfAbbrechen !== false) {
      const abbrBtn = document.createElement("button");
      abbrBtn.className = "btn btn-ghost";
      abbrBtn.textContent = knopfAbbrechen;
      abbrBtn.addEventListener("click", () => {
        schliesseDialog();
        if (onAbbrechen) onAbbrechen();
      });
      buttons.appendChild(abbrBtn);
    }
    dialog.appendChild(buttons);
    overlay.appendChild(dialog);
    bereich.appendChild(overlay);
  }

  /* ---------- Skills finden ---------- */

  function alleStandardSkills() {
    return STANDARD_SKILLS.filter(s => !zustand.ausgeblendet.includes(s.id));
  }

  function alleSichtbarenSkills() {
    return [...alleStandardSkills(), ...zustand.fachSkills, ...zustand.eigeneSkills];
  }

  function findSkill(id) {
    if (!id) return null;
    const standard = STANDARD_SKILLS.find(s => s.id === id);
    if (standard) return standard;
    return zustand.fachSkills.find(s => s.id === id) || zustand.eigeneSkills.find(s => s.id === id) || null;
  }

  function skillNameOderGeloescht(id) {
    const s = findSkill(id);
    return s ? s.name : "(gelöschter Skill)";
  }

  function kategorieEmoji(katId) {
    const k = KATEGORIEN.find(c => c.id === katId);
    return k ? k.emoji : "🧩";
  }
  function kategorieName(katId) {
    const k = KATEGORIEN.find(c => c.id === katId);
    return k ? k.name : katId;
  }

  function versuchAnzahl(skillId) {
    return zustand.versuche.filter(v => v.skillId === skillId).length;
  }

  function istImKoffer(skillId) {
    return zustand.koffer.mittel.includes(skillId) || zustand.koffer.hoch.includes(skillId) || zustand.koffer.langfristig.includes(skillId);
  }

  function bereichAusWert(wert) {
    const gM = Number(zustand.profil.grenzeMittel) || 40;
    const gH = Number(zustand.profil.grenzeHoch) || 70;
    if (wert < gM) return "niedrig";
    if (wert < gH) return "mittel";
    return "hoch";
  }

  function formatDatum(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
    } catch (e) { return ""; }
  }
  function formatKurz(iso) {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
    } catch (e) { return ""; }
  }

  function durchschnittsSenkung(versuche) {
    if (!versuche || versuche.length === 0) return null;
    const summe = versuche.reduce((sum, v) => sum + (Number(v.vorher) - Number(v.nachher)), 0);
    return summe / versuche.length;
  }

  function versucheZuSkill(skillId) {
    return zustand.versuche
      .filter(v => v.skillId === skillId)
      .sort((a, b) => new Date(a.datum) - new Date(b.datum));
  }

  function alleVersucheSortiertNeu() {
    return [...zustand.versuche].sort((a, b) => new Date(b.datum) - new Date(a.datum));
  }

  function abzeichenBerechnen() {
    const angesehenEinzeln = new Set(zustand.angesehen).size;
    const versuche = zustand.versuche;
    const verschiedeneSkills = new Set(versuche.map(v => v.skillId)).size;
    const skillHaeufigkeit = {};
    versuche.forEach(v => { skillHaeufigkeit[v.skillId] = (skillHaeufigkeit[v.skillId] || 0) + 1; });
    const hat3MalGleicher = Object.values(skillHaeufigkeit).some(n => n >= 3);
    const kategorien = new Set();
    versuche.forEach(v => {
      const s = findSkill(v.skillId);
      if (s) kategorien.add(s.kategorie);
    });
    const kofferAnzahl = zustand.koffer.mittel.length + zustand.koffer.hoch.length + zustand.koffer.langfristig.length;
    const notizVersuche = versuche.filter(v => v.notiz && v.notiz.trim()).length;
    const besprechenVersuche = versuche.filter(v => v.besprechen).length;
    const hatPlan = (zustand.plan.text && zustand.plan.text.trim()) || zustand.plan.kontakte.length > 0;
    return [
      { id: "neugierig", emoji: "👀", name: "Neugierig", satz: "3 verschiedene Skills angesehen", erreicht: angesehenEinzeln >= 3 },
      { id: "erster", emoji: "🧪", name: "Erster Versuch", satz: "1 Versuch gespeichert", erreicht: versuche.length >= 1 },
      { id: "entdecker", emoji: "🧭", name: "Entdecker", satz: "3 verschiedene Skills ausprobiert", erreicht: verschiedeneSkills >= 3 },
      { id: "forscher", emoji: "🔬", name: "Forscher", satz: "6 verschiedene Skills ausprobiert", erreicht: verschiedeneSkills >= 6 },
      { id: "dranbleiber", emoji: "🔁", name: "Dranbleiber", satz: "Denselben Skill 3-mal ausprobiert", erreicht: hat3MalGleicher },
      { id: "weltenbummler", emoji: "🌍", name: "Weltenbummler", satz: "Skills aus 4 verschiedenen Kategorien ausprobiert", erreicht: kategorien.size >= 4 },
      { id: "erfinder", emoji: "💡", name: "Erfinder", satz: "Eigenen Skill angelegt", erreicht: zustand.eigeneSkills.length >= 1 },
      { id: "koffer", emoji: "🧳", name: "Koffer gepackt", satz: "Mindestens 3 Skills im Koffer", erreicht: kofferAnzahl >= 3 },

  /* ---------- Timer ---------- */

  function starteTimer(sekunden) {
    stoppeTimer();
    timerRestSekunden = sekunden;
    timerGesamtSekunden = sekunden;
    timerLaeuft = true;
    timerInterval = setInterval(() => {
      timerRestSekunden--;
      if (timerRestSekunden <= 0) {
        timerRestSekunden = 0;
        stoppeTimer();
        if (navigator.vibrate) try { navigator.vibrate(200); } catch (e) {}
        zeigeToast("Zeit um.");
        melde("next:timer-fertig", {});
        renderApp();
      } else {
        renderTimerAnzeige();
      }
    }, 1000);
    renderApp();
  }

  function stoppeTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    timerLaeuft = false;
    timerRestSekunden = 0;
  }

  function renderTimerAnzeige() {
    const el = document.getElementById("timer-anzeige");
    if (!el) return;
    const min = Math.floor(timerRestSekunden / 60);
    const sek = timerRestSekunden % 60;
    el.textContent = min + ":" + String(sek).padStart(2, "0");
    melde("next:timer", { rest: timerRestSekunden, gesamt: timerGesamtSekunden, skillId: versuchTemp ? versuchTemp.skillId : null });
  }

  function leseDauerSekunden(skill) {
    if (!skill || !skill.dauer) return 120;
    const zahl = parseInt(skill.dauer, 10);
    if (!isNaN(zahl)) return zahl * 60;
    return 120;
  }

  /* ---------- Rendering: Hauptweiche ---------- */

  function renderApp() {
    const app = document.getElementById("app");
    if (!app) return;
    if (speicherProblem) {
      const hinweis = document.createElement("div");
      hinweis.className = "hinweis-ockergelb";
      hinweis.style.marginBottom = "10px";
      hinweis.textContent = "Achtung: Dieses Gerät speichert gerade nicht. Deine Einträge sind nach dem Schließen weg.";
      app.innerHTML = "";
      app.appendChild(hinweis);
      const rest = document.createElement("div");
      rest.innerHTML = renderHauptinhalt();
      while (rest.firstChild) app.appendChild(rest.firstChild);
    } else {
      app.innerHTML = renderHauptinhalt();
    }
    aktualisiereLeiste();
    // Event-Listener für dynamische Elemente nach dem Rendern binden
    bindEvents();
    try { if (welt()) NEXTWELT.binde(aktAnsicht, aktParam); } catch (e) { console.error(e); }
    // Anschluss für die Animationen (effekte): wer welche Ansicht gerade sieht.
    melde("next:gerendert", { ansicht: aktAnsicht, schritt: versuchTemp ? versuchTemp.schritt : null });
  }

  // Kleine Ereignisse für die Animationsschicht; Fehler dort dürfen die App nie stören.
  function melde(name, detail) {
    try { document.dispatchEvent(new CustomEvent(name, { detail: detail })); } catch (e) {}
  }

  function renderHauptinhalt() {
    if (!zustand) return "";
    if (aktAnsicht === "einrichtung") return renderEinrichtung();
    if (aktAnsicht === "start") return renderStart();
    if (aktAnsicht === "fest") return renderFest();
    if (aktAnsicht === "hilfe") return renderHilfe();
    if (aktAnsicht === "skills") return renderSkills();
    if (aktAnsicht === "skill") return renderSkillDetail(aktParam);
    if (aktAnsicht === "skillForm") return renderSkillForm(aktParam);
    if (aktAnsicht === "versuch") return renderVersuch();
    if (aktAnsicht === "versuchWahl") return renderVersuchWahl();
    if (aktAnsicht === "pass") return renderPass();
    if (aktAnsicht === "weg") return renderWeg();
    if (aktAnsicht === "koffer") return renderKoffer();
    if (aktAnsicht === "kofferAuswahl") return renderKofferAuswahl(aktParam);
    if (aktAnsicht === "plan") return renderPlan();
    if (aktAnsicht === "einstellungen") return renderEinstellungen();
    if (aktAnsicht === "fachLogin") return renderFachLogin();
    if (aktAnsicht === "fach") return renderFach();
    if (welt() && NEXTWELT.ansichten[aktAnsicht]) return NEXTWELT.ansichten[aktAnsicht].render(aktParam);
    return renderStart();
  }

  function renderErfahrungen(skill) {
    const versuche = versucheZuSkill(skill.id);
    return `
      <div class="karte">
        <h3>Meine Erfahrungen</h3>
        ${versuche.map(v => `
          <button class="versuch-zeile" data-versuch-detail="${esc(v.id)}">

          </button>`).join("")}
        ${renderAuswertung(skill.id).map(z => `<p class="klein">${esc(z)}</p>`).join("")}
        <p class="klein" style="margin-top:8px;">Das sind deine eigenen Erfahrungen, keine Messung. Ein Skill kann auch helfen, wenn die Zahl nicht sinkt, zum Beispiel wenn du dadurch handlungsfähig bleibst.</p>
      </div>`;
  }

  function renderAuswertung(skillId) {
    const versuche = versucheZuSkill(skillId);
    const bereiche = {};
    versuche.forEach(v => {
      const b = bereichAusWert(Number(v.vorher));
      if (!bereiche[b]) bereiche[b] = [];
      bereiche[b].push(v);
    });
    const zeilen = [];
    Object.keys(bereiche).forEach(b => {
      const list = bereiche[b];
      const durchschnitt = durchschnittsSenkung(list);
      const anzahl = list.length;
      const bname = b === "niedrig" ? "niedriger" : b === "mittel" ? "mittlerer" : "sehr hoher";
      const schnitt = Math.round(durchschnitt);
      const veraenderung = schnitt > 0 ? `${schnitt} Punkte weniger` : schnitt < 0 ? `${Math.abs(schnitt)} Punkte mehr` : "gleich";
      let zeile = `${anzahl} Versuch${anzahl === 1 ? "" : "e"} bei ${bname} Anspannung, im Schnitt ${veraenderung}.`;
      if (anzahl >= 2) {
        if (durchschnitt >= 15) {
          zeile += ` Bei ${bname} Anspannung war dieser Skill für dich in mehreren Versuchen hilfreich.`;
        } else if (b === "hoch" && durchschnitt < 10) {
          zeile += ` Bei sehr hoher Anspannung hat er dir bisher weniger geholfen. Dann ist vielleicht dein Plan oder eine andere Strategie dran.`;
        }
      }
      zeilen.push(zeile);
    });
    return zeilen;
  }

    else if (schritt === "D") inhalt = renderVersuchSchrittD();

  function renderVersuchSchrittA() {
    return `

  function farbeFuerWert(wert) {
    if (wert <= 30) return "#2e8b57";
    if (wert <= 60) return "#d9a400";
    if (wert <= 85) return "#e07b00";
    return "#c0392b";
  }

  function wortFuerWert(wert) {
    if (wert <= 20) return "ganz ruhig";
    if (wert <= 45) return "etwas angespannt";
    if (wert <= 65) return "ziemlich angespannt";
    if (wert <= 85) return "sehr angespannt";
    return "kaum auszuhalten";
  }

  function reglerVorherGeaendert(input) {
    versuchTemp.vorher = Number(input.value);
    versuchTemp.veraendert = true;
    const wertEl = document.getElementById("vorher-wert");
    const wortEl = document.getElementById("vorher-wort");
    if (wertEl) {
      wertEl.textContent = input.value;
      wertEl.style.color = farbeFuerWert(Number(input.value));
    }
    if (wortEl) wortEl.textContent = wortFuerWert(Number(input.value));
  }

  function reglerNachherGeaendert(input) {
    const nachher = Number(input.value);
    versuchTemp.nachher = nachher;
    versuchTemp.veraendert = true;
    const vorher = Number(versuchTemp.vorher);
    const diff = vorher - nachher;
    let veraenderung;
    if (diff > 0) veraenderung = `Um ${diff} gesunken.`;
    else if (diff === 0) veraenderung = "Gleich geblieben. Das ist auch eine wichtige Erfahrung.";
    else veraenderung = `Um ${Math.abs(diff)} gestiegen. Gut, dass du das weißt.`;
    const wertEl = document.getElementById("nachher-wert");
    const wortEl = document.getElementById("nachher-wort");
    const textEl = document.getElementById("veraenderung-text");
    if (wertEl) {
      wertEl.textContent = nachher;
      wertEl.style.color = farbeFuerWert(nachher);
    }
    if (wortEl) wortEl.textContent = wortFuerWert(nachher);
    if (textEl) textEl.textContent = veraenderung;
  }

  /* ---------- Event-Binding ---------- */

  function bindEvents() {
    // Zurück-Buttons
    document.querySelectorAll("[data-zurueck]").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        history.back();
      });
    });

    // Allgemeine data-nav Buttons (z. B. Kacheln)
    document.querySelectorAll("[data-nav]").forEach(btn => {
      if (btn.closest("#leiste")) return; // Leiste wird separat gebunden
      btn.addEventListener("click", () => {
        const ziel = btn.getAttribute("data-nav");
        zeige(ziel, null);
      });
    });

    // Einrichtung
    if (aktAnsicht === "einrichtung") {
      const nameInput = document.getElementById("name");
      if (nameInput) nameInput.addEventListener("input", () => {
        zustand.profil.name = nameInput.value;
      });
      document.querySelectorAll("#farb-zeile [data-thema]").forEach(btn => {
        btn.addEventListener("click", () => {
          zustand.profil.thema = btn.getAttribute("data-thema");
          wendeThemeAn();
          zeige("einrichtung", null, false);
        });
      });
      document.getElementById("einrichtung-los")?.addEventListener("click", () => {
        zustand.profil.eingerichtet = true;
        speichereZustand();
        zeige("start");
      });
    }

    // Start
    if (aktAnsicht === "start") {
      document.getElementById("btn-einstellungen")?.addEventListener("click", () => zeige("einstellungen"));
      document.querySelectorAll("[data-skill]").forEach(el => {
        el.addEventListener("click", () => zeige("skill", el.getAttribute("data-skill")));
      });
    }

    // Fest
    if (aktAnsicht === "fest") {
      document.querySelectorAll("[data-fest]").forEach(btn => {
        btn.addEventListener("click", () => zeige("fest", btn.getAttribute("data-fest")));
      });
      document.getElementById("fest-zu-viel")?.addEventListener("click", () => {
        document.getElementById("fest-zu-viel-text").style.display = "block";
      });
      document.querySelectorAll("[data-hilfe]").forEach(btn => {
        btn.addEventListener("click", () => zeige("hilfe"));
      });
      document.querySelectorAll("[data-versuch-start]").forEach(el => {
        el.addEventListener("click", () => {
          starteVersuch(el.getAttribute("data-versuch-start"));
        });
      });
    }

    // Hilfe
    if (aktAnsicht === "hilfe") {
      document.getElementById("hilfe-zum-plan")?.addEventListener("click", () => zeige("plan"));
    }

    // Skills
    if (aktAnsicht === "skills") {
      const suchfeld = document.getElementById("suchfeld");
      suchfeld?.addEventListener("input", () => {
        skillsFilter.suche = suchfeld.value;
        renderSkillListe();
      });
      document.querySelectorAll("#skill-chips [data-kat]").forEach(chip => {
        chip.addEventListener("click", () => {
          skillsFilter.kategorie = chip.getAttribute("data-kat");
          // Chips aktualisieren
          document.querySelectorAll("#skill-chips [data-kat]").forEach(c => c.classList.remove("aktiv"));
          chip.classList.add("aktiv");
          renderSkillListe();
        });
      });
      document.getElementById("btn-eigen-anlegen")?.addEventListener("click", () => zeige("skillForm", { quelle: "eigen" }));
      // Delegation für Skill-Karten und "Eigenen Skill anlegen" in der leeren Liste
      document.getElementById("ergebnis-liste")?.addEventListener("click", (e) => {
        const karte = e.target.closest("[data-skill-card]");
        if (karte) { zeige("skill", karte.getAttribute("data-skill-card")); return; }
        if (e.target.closest("#btn-eigen-anlegen-list")) zeige("skillForm", { quelle: "eigen" });
      });
      renderSkillListe();
    }

    // Skill Detail
    if (aktAnsicht === "skill") {
      const id = aktParam;
      angesehenHinzufuegen(id);
      document.querySelectorAll("[data-versuch-start]").forEach(el => {
        el.addEventListener("click", () => starteVersuch(el.getAttribute("data-versuch-start")));
      });
      document.getElementById("btn-in-koffer")?.addEventListener("click", () => kofferDialog(id));
      document.getElementById("btn-skill-bearbeiten")?.addEventListener("click", () => zeige("skillForm", { id: id }));
      document.getElementById("btn-skill-loeschen")?.addEventListener("click", () => {
        zeigeDialog({
          inhalt: "<p>Diesen Skill wirklich löschen?</p>",
          knopfOk: "Löschen", knopfAbbrechen: "Abbrechen",
          onOk: () => {
            loescheSkill(id);
            zeige("skills");
          }
        });
      });
      document.querySelectorAll("[data-versuch-detail]").forEach(el => {
        el.addEventListener("click", () => {
          const vid = el.getAttribute("data-versuch-detail");
          versuchDetailDialog(vid);
        });
      });
    }

    // Versuch
    if (aktAnsicht === "versuch") {
      document.getElementById("versuch-zurueck")?.addEventListener("click", () => versuchZurueck());
      if (versuchTemp && versuchTemp.schritt === "A") {
        document.getElementById("versuch-weiter-a")?.addEventListener("click", () => {
          versuchTemp.schritt = "B";
          renderApp();
        });
      }
      if (versuchTemp && versuchTemp.schritt === "B") {
        document.getElementById("timer-starten")?.addEventListener("click", () => {
          const skill = findSkill(versuchTemp.skillId);
          starteTimer(leseDauerSekunden(skill));
        });
        document.getElementById("timer-abbrechen")?.addEventListener("click", () => {
          stoppeTimer();
          renderApp();
        });
        document.getElementById("versuch-weiter-b")?.addEventListener("click", () => {
          stoppeTimer();
          versuchTemp.schritt = "C";
          versuchTemp.nachher = versuchTemp.nachher !== null ? versuchTemp.nachher : versuchTemp.vorher;
          renderApp();
        });
        renderTimerAnzeige();
      }
      if (versuchTemp && versuchTemp.schritt === "C") {
        document.getElementById("versuch-weiter-c")?.addEventListener("click", () => {
          versuchTemp.schritt = "D";
          renderApp();
        });
      }
      if (versuchTemp && versuchTemp.schritt === "D") {
        document.querySelectorAll("[data-situation]").forEach(btn => {
          btn.addEventListener("click", () => {
            versuchTemp.situation = btn.getAttribute("data-situation");
            versuchTemp.veraendert = true;
            renderApp();
          });
        });
        document.getElementById("versuch-weiter-d")?.addEventListener("click", () => {
          versuchTemp.schritt = "E";
          renderApp();
        });
      }
      if (versuchTemp && versuchTemp.schritt === "E") {
        document.querySelectorAll("[data-hilfreich]").forEach(btn => {
          btn.addEventListener("click", () => {
            versuchTemp.hilfreich = Number(btn.getAttribute("data-hilfreich"));
            versuchTemp.veraendert = true;
            renderApp();
          });
        });
        document.querySelectorAll("[data-umgang]").forEach(btn => {
          btn.addEventListener("click", () => {
            versuchTemp.umgang = btn.getAttribute("data-umgang");
            versuchTemp.veraendert = true;
            renderApp();
          });
        });
        document.querySelectorAll("[data-angenehm]").forEach(btn => {
          btn.addEventListener("click", () => {
            versuchTemp.angenehm = Number(btn.getAttribute("data-angenehm"));
            versuchTemp.veraendert = true;
            renderApp();
          });
        });
        document.querySelectorAll("[data-nochmal]").forEach(btn => {
          btn.addEventListener("click", () => {
            versuchTemp.nochmal = btn.getAttribute("data-nochmal");
            versuchTemp.veraendert = true;
            renderApp();
          });
        });
        document.getElementById("versuch-speichern")?.addEventListener("click", () => speichereVersuch());
      }
      if (versuchTemp && versuchTemp.schritt === "F") {
        document.getElementById("ergebnis-in-koffer")?.addEventListener("click", () => kofferDialog(versuchTemp.skillId));
        document.getElementById("ergebnis-erfahrungen")?.addEventListener("click", () => zeige("skill", versuchTemp.skillId));
        document.getElementById("ergebnis-start")?.addEventListener("click", () => zeige("start"));
      }
    }

    // Versuch Wahl
    if (aktAnsicht === "versuchWahl") {
      document.querySelectorAll("[data-versuch-start]").forEach(el => {
        el.addEventListener("click", () => starteVersuch(el.getAttribute("data-versuch-start")));
      });
    }

    // Koffer
    if (aktAnsicht === "koffer") {
      document.querySelectorAll("[data-koffer-add]").forEach(btn => {
        btn.addEventListener("click", () => zeige("kofferAuswahl", btn.getAttribute("data-koffer-add")));
      });
      document.querySelectorAll("[data-koffer-hoch-schieben]").forEach(btn => {
        btn.addEventListener("click", () => {
          const fach = btn.getAttribute("data-fach");
          const id = btn.getAttribute("data-koffer-hoch-schieben");
          kofferSchieben(fach, id, -1);
        });
      });
      document.querySelectorAll("[data-koffer-runter-schieben]").forEach(btn => {
        btn.addEventListener("click", () => {
          const fach = btn.getAttribute("data-fach");
          const id = btn.getAttribute("data-koffer-runter-schieben");
          kofferSchieben(fach, id, 1);
        });
      });
      document.querySelectorAll("[data-koffer-entfernen]").forEach(btn => {
        btn.addEventListener("click", () => {
          const fach = btn.getAttribute("data-fach");
          const id = btn.getAttribute("data-koffer-entfernen");
          kofferEntfernen(fach, id);
        });
      });
      document.querySelectorAll("[data-skill-detail]").forEach(el => {
        el.addEventListener("click", () => zeige("skill", el.getAttribute("data-skill-detail")));
      });
      document.getElementById("zum-plan")?.addEventListener("click", () => zeige("plan"));
      document.getElementById("grenze-mittel")?.addEventListener("input", event => {
        const wert = Number(event.target.value);
        zustand.profil.grenzeMittel = wert;
        if (wert >= Number(zustand.profil.grenzeHoch)) {
          zustand.profil.grenzeHoch = Math.min(90, wert + 10);
          document.getElementById("grenze-hoch").value = zustand.profil.grenzeHoch;
        }
        document.getElementById("grenze-mittel-wert").textContent = wert;
        document.getElementById("grenze-hoch-wert").textContent = zustand.profil.grenzeHoch;
        speichereZustand();
      });
      document.getElementById("grenze-hoch")?.addEventListener("input", event => {
        const wert = Number(event.target.value);
        zustand.profil.grenzeHoch = wert;
        if (wert <= Number(zustand.profil.grenzeMittel)) {
          zustand.profil.grenzeMittel = Math.max(10, wert - 10);
          document.getElementById("grenze-mittel").value = zustand.profil.grenzeMittel;
        }
        document.getElementById("grenze-hoch-wert").textContent = wert;
        document.getElementById("grenze-mittel-wert").textContent = zustand.profil.grenzeMittel;
        speichereZustand();
      });
    }

    // Koffer Auswahl
    if (aktAnsicht === "kofferAuswahl") {
      document.querySelectorAll("[data-koffer-waehlen]").forEach(el => {
        el.addEventListener("click", () => {
          const fach = el.getAttribute("data-fach");
          const id = el.getAttribute("data-koffer-waehlen");
          if (!zustand.koffer[fach].includes(id)) {
            zustand.koffer[fach].push(id);
            speichereZustand();
            zeigeToast("In den Koffer gelegt.");
          }
          zeige("koffer");
        });
      });
      document.getElementById("koffer-auswahl-eigen")?.addEventListener("click", () => zeige("skillForm", { quelle: "eigen" }));
    }

    // Plan
    if (aktAnsicht === "plan") {
      document.getElementById("kontakt-hinzufuegen")?.addEventListener("click", () => {
        const name = document.getElementById("kontakt-name").value.trim();
        const tel = document.getElementById("kontakt-telefon").value.trim();
        if (!name || !tel) {
          zeigeToast("Bitte Name und Telefon ausfüllen.");
          return;
        }
        zustand.plan.kontakte.push({ name, telefon: tel });
        document.getElementById("kontakt-name").value = "";
        document.getElementById("kontakt-telefon").value = "";
        renderApp();
      });
      document.querySelectorAll("[data-kontakt-loeschen]").forEach(btn => {
        btn.addEventListener("click", () => {
          const index = Number(btn.getAttribute("data-kontakt-loeschen"));
          zustand.plan.kontakte.splice(index, 1);
          renderApp();
        });
      });
      document.getElementById("plan-speichern")?.addEventListener("click", () => {
        const text = document.getElementById("plan-text").value;
        zustand.plan.text = text;
        speichereZustand();
        zeigeToast("Plan gespeichert.");
      });
    }

    // Skill Form
    if (aktAnsicht === "skillForm") {
      document.querySelectorAll("[data-bereich]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.getElementById("sf-bereich").value = btn.getAttribute("data-bereich");
          document.querySelectorAll("[data-bereich]").forEach(b => b.classList.remove("aktiv"));
          btn.classList.add("aktiv");
        });
      });
      document.getElementById("sf-speichern")?.addEventListener("click", () => {
        skillFormSpeichern();
      });
    }

    // Pass
    if (aktAnsicht === "pass") {
      // keine zusätzlichen Events
    }

    // Weg
    if (aktAnsicht === "weg") {
      document.querySelectorAll("[data-v-besprechen]").forEach(btn => {
        btn.addEventListener("click", () => {
          const vid = btn.getAttribute("data-v-besprechen");
          const v = zustand.versuche.find(item => item.id === vid);
          if (v) {
            v.besprechen = false;
            speichereZustand();
            renderApp();
          }
        });
      });
      document.querySelectorAll("[data-kompass-loeschen]").forEach(btn => {
        btn.addEventListener("click", () => {
          const index = Number(btn.getAttribute("data-kompass-loeschen"));
          zustand.kompass.splice(index, 1);
          speichereZustand();
          renderApp();
        });
      });
      document.getElementById("kompass-hinzufuegen")?.addEventListener("click", () => {
        const wenn = document.getElementById("kompass-wenn").value.trim();
        const dann = document.getElementById("kompass-dann").value.trim();
        if (!wenn || !dann) {
          zeigeToast("Bitte beide Felder ausfüllen.");
          return;
        }
        zustand.kompass.push({ wenn, dann });
        speichereZustand();
        renderApp();
      });
      document.getElementById("kompass-vorschlag")?.addEventListener("click", () => {
        kompassVorschlag();
      });
      document.querySelectorAll("[data-versuch-detail]").forEach(el => {
        el.addEventListener("click", () => {
          versuchDetailDialog(el.getAttribute("data-versuch-detail"));
        });
      });
    }

    // Einstellungen
    if (aktAnsicht === "einstellungen") {
      document.querySelectorAll("[data-thema-ew]").forEach(btn => {
        btn.addEventListener("click", () => {
          zustand.profil.thema = btn.getAttribute("data-thema-ew");
          wendeThemeAn();
          document.querySelectorAll("[data-thema-ew]").forEach(b => b.classList.remove("aktiv"));
          btn.classList.add("aktiv");
          speichereZustand();
        });
      });
      document.getElementById("ein-speichern")?.addEventListener("click", () => {
        const name = document.getElementById("ein-name").value;
        zustand.profil.name = name;
        speichereZustand();
        zeigeToast("Gespeichert.");
      });
      document.getElementById("rucksack-sichern")?.addEventListener("click", () => {
        rucksackSichern();
      });
      document.getElementById("rucksack-laden-btn")?.addEventListener("click", () => {
        document.getElementById("rucksack-datei").click();
      });

      });

        zeigeDialog({
          inhalt: "<p>Beispieldaten laden? Deine aktuellen Daten werden ersetzt.</p>",
          knopfOk: "Laden", knopfAbbrechen: "Abbrechen",
          onOk: () => {
            zustand = beispielZustand();
            speichereZustand();
            wendeThemeAn();
            zeige("start");
          }
        });
      });
      document.getElementById("alles-loeschen")?.addEventListener("click", () => {
        zeigeDialog({
          inhalt: "<p>Wirklich alles löschen?</p>",
          knopfOk: "Weiter", knopfAbbrechen: "Abbrechen",
          onOk: () => {
            zeigeDialog({
              inhalt: "<p>Bist du sicher? Das kann nicht rückgängig gemacht werden.</p>",
              knopfOk: "Alles löschen", knopfAbbrechen: "Abbrechen",
              onOk: () => {

                speichereZustand();
                zeige("einrichtung");

          }
        });

    if (aktAnsicht === "fachLogin") {

          zeigeToast("Bitte genau vier Ziffern.");
          return;

        zustand.fachPin = pin1;
        speichereZustand();
        zeige("fach");

          zeige("fach");

          zeigeToast("Falsche PIN.");
        }
      });

      zeigeToast("Skill nicht gefunden.");
      return;
    }
    versuchTemp = {
      skillId,
      schritt: "A",

      nachher: null,

      hilfreich: null,
      angenehm: null,
      nochmal: null,
      notiz: "",

      erwartung: "",
      veraendert: false,
      neueAbzeichen: []
    };

  function versuchZurueck() {
    if (!versuchTemp) return;
    const reihenfolge = ["A", "B", "C", "D", "E", "F"];
    const index = reihenfolge.indexOf(versuchTemp.schritt);
    if (index > 0) {
      versuchTemp.schritt = reihenfolge[index - 1];
      renderApp();
    } else {
      // Schritt A: verwerfen oder zurück
      if (versuchTemp.veraendert) {
        zeigeDialog({
          inhalt: "<p>Versuch verwerfen?</p>",
          knopfOk: "Verwerfen", knopfAbbrechen: "Abbrechen",
          onOk: () => {
            versuchTemp = null;
            history.back();
          }
        });
      } else {
        versuchTemp = null;
        history.back();
      }
    }
  }

  function speichereVersuch() {
    if (!versuchTemp) return;
    const vorherAbzeichen = abzeichenBerechnen().filter(a => a.erreicht).map(a => a.id);
    const situation = versuchTemp.situation === "Anderes"
      ? (versuchTemp.situationAnderes || "Anderes")
      : versuchTemp.situation;
    const versuch = {
      id: neueId(),
      skillId: versuchTemp.skillId,
      datum: new Date().toISOString(),
      vorher: Number(versuchTemp.vorher),
      nachher: Number(versuchTemp.nachher !== null ? versuchTemp.nachher : versuchTemp.vorher),
      situation: situation || "",
      hilfreich: versuchTemp.hilfreich || null,
      angenehm: versuchTemp.angenehm || null,
      notiz: versuchTemp.notiz || "",
      nochmal: versuchTemp.nochmal || null,
      besprechen: !!versuchTemp.besprechen,
      erwartung: versuchTemp.erwartung || "",
      umgang: versuchTemp.umgang || null
    };
    zustand.versuche.push(versuch);
    speichereZustand();
    const neue = abzeichenBerechnen().filter(a => a.erreicht && !vorherAbzeichen.includes(a.id));
    versuchTemp.neueAbzeichen = neue;
    try { if (welt()) NEXTWELT.belohnen("skill", "Skill ausprobiert: " + skillNameOderGeloescht(versuch.skillId)); } catch (e) {}
    versuchTemp.schritt = "F";
    renderApp();
    melde("next:gespeichert", { abzeichen: neue.map(a => ({ name: a.name, emoji: a.emoji })), vorher: versuch.vorher, nachher: versuch.nachher });
  }

  function kofferSchieben(fach, id, richtung) {
    const arr = zustand.koffer[fach] || [];
    const index = arr.indexOf(id);
    if (index < 0) return;
    const neuerIndex = index + richtung;
    if (neuerIndex < 0 || neuerIndex >= arr.length) return;
    [arr[index], arr[neuerIndex]] = [arr[neuerIndex], arr[index]];
    speichereZustand();
    renderApp();
  }

  function kofferEntfernen(fach, id) {
    const arr = zustand.koffer[fach] || [];
    const index = arr.indexOf(id);
    if (index < 0) return;
    const skillN = skillNameOderGeloescht(id);
    arr.splice(index, 1);
    speichereZustand();
    zeigeToast(`"${skillN}" entfernt.`, "Rückgängig", () => {
      zustand.koffer[fach].splice(index, 0, id);
      speichereZustand();
      renderApp();
    });
    renderApp();
  }

  function loescheSkill(id) {
    zustand.eigeneSkills = zustand.eigeneSkills.filter(s => s.id !== id);
    zustand.fachSkills = zustand.fachSkills.filter(s => s.id !== id);

    ["mittel", "hoch", "langfristig"].forEach(fach => {
      zustand.koffer[fach] = zustand.koffer[fach].filter(kid => kid !== id);
    });
    // Versuche bleiben erhalten und zeigen dann gelöschter Skill
    speichereZustand();

  function kompassVorschlag() {
    const versuche = zustand.versuche;
    if (versuche.length < 2) {
      zeigeToast("Probier erst ein paar Skills aus.");
      return;
    }
    const nachSkill = {};
    versuche.forEach(v => {
      if (!nachSkill[v.skillId]) nachSkill[v.skillId] = [];
      nachSkill[v.skillId].push(v);
    });
    let besterSkill = null;
    let besteSenkung = -Infinity;
    Object.keys(nachSkill).forEach(skillId => {
      const list = nachSkill[skillId];
      if (list.length >= 2) {
        const senkung = durchschnittsSenkung(list);
        if (senkung !== null && senkung > besteSenkung) {
          besteSenkung = senkung;
          besterSkill = skillId;
        }
      }
    });
    if (!besterSkill) {
      zeigeToast("Probier erst ein paar Skills aus.");
      return;
    }
    const skill = findSkill(besterSkill);
    const situationen = nachSkill[besterSkill].map(v => v.situation).filter(Boolean);
    const haeufigsteSituation = situationen.sort((a, b) =>
      situationen.filter(s => s === a).length - situationen.filter(s => s === b).length
    ).pop() || "ich grübele";
    document.getElementById("kompass-wenn").value = haeufigsteSituation;
    document.getElementById("kompass-dann").value = skill ? skill.name : "ein Spaziergang";
  }

  function rucksackSichern() {
    try {
      const daten = JSON.stringify(zustand, null, 2);
      const name = zustand.profil.name || "du";
      const datum = new Date().toISOString().slice(0, 10);
      const dateiName = `NEXT-Rucksack-${name}-${datum}.json`;
      const blob = new Blob([daten], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = dateiName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      zeigeToast("Rucksack gesichert.");
    } catch (e) {
      // Fallback: JSON in Textfeld anzeigen
      const daten = JSON.stringify(zustand, null, 2);
      zeigeDialog({
        inhalt: `<p>Automatisches Herunterladen ging nicht. Kopiere den Text:</p><textarea style="min-height:150px;">${esc(daten)}</textarea>`,
        knopfOk: "Schließen",
        knopfAbbrechen: false
      });
    }
  }

  function rucksackLaden(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data || typeof data !== "object" || !("version" in data)) {
          zeigeToast("Diese Datei ist kein NEXT-Rucksack.");
          return;
        }
        zeigeDialog({
          inhalt: "<p>Rucksack laden? Deine aktuellen Daten werden ersetzt.</p>",
          knopfOk: "Laden", knopfAbbrechen: "Abbrechen",
          onOk: () => {
            zustand = mergeStandard(data);
            speichereZustand();
            wendeThemeAn();
            zeige("start");
            zeigeToast("Rucksack geladen.");
          }
        });
      } catch (err) {
        zeigeToast("Diese Datei ist kein NEXT-Rucksack.");
      }
    };
    reader.readAsText(file);
  }

  function skillPaketExportieren() {
    try {

        typ: "next-skillpaket",
        version: 1,
        fachSkills: zustand.fachSkills,
        ausgeblendet: zustand.ausgeblendet,
        gruppe: zustand.gruppe
      };
      const daten = JSON.stringify(paket, null, 2);

      const blob = new Blob([daten], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `NEXT-Skillpaket-${datum}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

  }

  function skillPaketImportieren(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const paket = JSON.parse(e.target.result);
        if (!paket || paket.typ !== "next-skillpaket") {
          zeigeToast("Das ist kein Skill-Paket.");
          return;
        }
        // Zusammenführen
        if (Array.isArray(paket.fachSkills)) {
          paket.fachSkills.forEach(skill => {
            const index = zustand.fachSkills.findIndex(s => s.id === skill.id);
            if (index >= 0) zustand.fachSkills[index] = skill;
            else zustand.fachSkills.push(skill);
          });
        }
        if (Array.isArray(paket.ausgeblendet)) {
          zustand.ausgeblendet = paket.ausgeblendet;
        }
        if (paket.gruppe) {
          zustand.gruppe = { ...zustand.gruppe, ...paket.gruppe };
        }
        speichereZustand();
        zeigeToast("Skill-Paket importiert.");
        renderApp();
      } catch (err) {
        zeigeToast("Das ist kein Skill-Paket.");
      }
    };
    reader.readAsText(file);
  }
