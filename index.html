<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>NEXT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* NEXT Fassung 4: ruhig, klar, eine Hauptaktion je Bildschirm.
   Zwei Looks: "ruhig" (hell) und "nacht" (dunkel). Keine Verläufe,
   keine Glitzereffekte, nur eine kurze Animation, wenn eine Knospe wächst. */

:root {
  --grund: #f6f5f1;
  --flaeche: #ffffff;
  --flaeche2: #eeece6;
  --text: #1c2321;
  --leise: #5d6662;
  --linie: #dedbd2;
  --akzent: #0f766e;
  --akzent-text: #ffffff;
  --akzent-hell: #d7efe9;
  --notfall: #b4233a;
  --warnung-grund: #fff4dc;
  --warnung-text: #7a4d00;
  --schatten: 0 1px 2px rgba(20, 30, 25, .06), 0 4px 16px rgba(20, 30, 25, .05);
  --rund: 18px;
  color-scheme: light;
}
:root[data-look="nacht"] {
  --grund: #10151a;
  --flaeche: #19212a;
  --flaeche2: #222c37;
  --text: #eef2f1;
  --leise: #9aa8a6;
  --linie: #2c3844;
  --akzent: #5eead4;
  --akzent-text: #062b27;
  --akzent-hell: #163a37;
  --notfall: #f87171;
  --warnung-grund: #3a2e14;
  --warnung-text: #fcd58a;
  --schatten: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--grund);
  color: var(--text);
  font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: 96px; }
main { padding: 4px 16px 24px; }
h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 22px; line-height: 1.3; margin: 6px 0 12px; letter-spacing: -.01em; }
h3 { font-size: 15px; margin: 28px 0 8px; color: var(--leise); font-weight: 600; }
p { margin: 0 0 10px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }

.sym { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sym.klein { width: 18px; height: 18px; color: var(--leise); }

/* Kopf */
.kopf { display: flex; align-items: center; gap: 8px; padding: 14px 12px 10px; position: sticky; top: 0; background: var(--grund); z-index: 5; }
.kopf h1 { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kopf-knopf { border: 0; background: transparent; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.kopf-knopf:active { background: var(--flaeche2); }
.kopf-platz { width: 44px; }
.heute-kopf { padding: 22px 16px 8px; align-items: flex-start; }
.heute-kopf > div { flex: 1; }
.heute-kopf h1 { text-align: left; font-size: 26px; white-space: normal; }
.heute-kopf .leise { margin: 0; }
.hilfe-klein { width: auto; padding: 0 10px; gap: 4px; display: flex; color: var(--notfall); font-size: 14px; font-weight: 600; }
.hilfe-klein .sym { width: 20px; height: 20px; }

/* Leiste unten */
.leiste {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  display: flex; justify-content: center;
  background: var(--flaeche); border-top: 1px solid var(--linie);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.leiste button { flex: 1; max-width: 112px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 12px; color: var(--leise); border-radius: 12px; }
.leiste button.aktiv { color: var(--akzent); font-weight: 600; }
.leiste button.aktiv .sym { stroke-width: 2.2; }

/* Karten und Zeilen */
.karte { background: var(--flaeche); border-radius: var(--rund); padding: 18px; margin: 12px 0; box-shadow: var(--schatten); border: 1px solid var(--linie); }
.naechster { border: 2px solid var(--akzent); }
.naechster-text { font-size: 19px; }
.etikett { font-size: 13px; font-weight: 700; text-transform: none; letter-spacing: .02em; color: var(--akzent); margin: 0 0 4px; }
.einleitung { color: var(--leise); margin: 6px 0 14px; }
.leise { color: var(--leise); font-size: 15px; }
.leer { color: var(--leise); font-size: 15px; padding: 12px 0; margin: 0; }
.gross { font-size: 20px; font-weight: 600; }
.abschnitt { margin-top: 4px; }
.zeile {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
  background: var(--flaeche); border: 1px solid var(--linie); border-radius: 14px;
  padding: 14px; margin: 8px 0; min-height: 64px;
}
.zeile-sym { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--akzent-hell); color: var(--akzent); flex: none; }
.zeile-text { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.zeile-text small { color: var(--leise); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post-zeile { border-color: var(--akzent); }
.post-zeile > .sym { color: var(--akzent); }
.mutmacher { font-size: 17px; font-style: italic; color: var(--leise); text-align: center; margin: 22px 8px; }

/* Knöpfe */
.knopf {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 52px; padding: 12px 16px; margin: 8px 0;
  border-radius: 14px; border: 1px solid var(--linie); background: var(--flaeche);
  font-weight: 600; font-size: 16px; text-align: center;
}
.knopf:active { transform: scale(.985); }
.knopf.haupt { background: var(--akzent); color: var(--akzent-text); border-color: var(--akzent); font-size: 17px; min-height: 56px; }
.knopf.an { background: var(--akzent-hell); border-color: var(--akzent); color: var(--akzent); }
.knopf.leise-knopf { background: transparent; }
.knopf.gefahr { color: var(--notfall); }
.knopf .sym { width: 20px; height: 20px; }
.knopf.steck { margin-top: 24px; background: transparent; border: 2px solid var(--linie); }
.knopf.notfall { background: var(--notfall); border-color: var(--notfall); color: #fff; min-height: 60px; font-size: 18px; }
:root[data-look="nacht"] .knopf.notfall { color: #2a0909; }
.knopf-reihe { display: flex; gap: 8px; }
.knopf-reihe .knopf { flex: 1; font-size: 15px; padding: 10px 8px; }
.knopf-reihe.drei .knopf { font-size: 14px; }
.text-knopf { display: block; margin: 10px auto; background: none; border: 0; color: var(--akzent); font-weight: 600; font-size: 15px; padding: 10px; text-align: center; }
.mini-knopf { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--linie); background: var(--flaeche); flex: none; }
.mini-knoepfe { display: flex; gap: 6px; }
.datei-knopf { cursor: pointer; }

.wahl-karte {
  display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left;
  background: var(--flaeche); border: 1px solid var(--linie); border-radius: 14px;
  padding: 16px; margin: 8px 0; font-size: 17px; min-height: 56px;
}
.wahl-karte small { color: var(--leise); font-size: 14px; }
.wahl-karte:active { border-color: var(--akzent); }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
.chip { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 999px; padding: 8px 14px; font-size: 15px; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; margin: 0; }
.chip.aktiv { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-text); }
.chip.an { background: var(--akzent-hell); border-color: transparent; }
.chip.farbe.aktiv { background: var(--f); border-color: var(--f); color: #fff; }
.chip-weg { border: 0; background: none; padding: 0 0 0 4px; color: var(--leise); }
main > .chip { margin: 4px 4px 4px 0; }

/* Eingaben */
.eingabe { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--linie); background: var(--flaeche); font-size: 16px; margin: 6px 0; }
textarea.eingabe { resize: vertical; }
.feld { display: block; margin: 12px 0; font-weight: 600; font-size: 15px; }
.feld small { display: block; color: var(--leise); font-weight: 400; }
.feld-titel { font-weight: 600; font-size: 15px; margin-top: 16px; }
.formular { margin: 10px 0; }
.formular.reihe { display: flex; gap: 8px; align-items: center; }
.formular.reihe .knopf { width: auto; flex: none; margin: 6px 0; }
.schalter { display: flex; align-items: center; gap: 10px; margin: 16px 0; font-size: 16px; }
.schalter input { width: 22px; height: 22px; accent-color: var(--akzent); }
.suche { margin-bottom: 12px; }
.bearbeiten-zeile { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linie); }
.bearbeiten-zeile > span:first-child { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.bearbeiten-zeile small { color: var(--leise); font-size: 14px; }
.stufe { border-left: 4px solid var(--linie); padding-left: 12px; }
.stufe-1 { border-color: #10b981; } .stufe-2 { border-color: #f59e0b; } .stufe-3 { border-color: #f97316; } .stufe-4 { border-color: var(--notfall); }

.warnung { background: var(--warnung-grund); color: var(--warnung-text); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.zitat { color: var(--leise); font-style: italic; }

/* Reiter in Skills */
.reiter { display: flex; background: var(--flaeche2); border-radius: 12px; padding: 4px; margin: 4px 0 8px; }
.reiter button { flex: 1; border: 0; background: transparent; padding: 10px; border-radius: 9px; font-weight: 600; color: var(--leise); }
.reiter button.aktiv { background: var(--flaeche); color: var(--text); box-shadow: var(--schatten); }

.skill-karte { display: flex; flex-direction: column; width: 100%; text-align: left; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 14px; padding: 14px 16px; margin: 8px 0; }
.skill-karte small { color: var(--leise); font-size: 14px; }
.skill-meta { font-size: 13px; color: var(--leise); margin-top: 4px; }
.skill-meta em { color: var(--akzent); font-style: normal; font-weight: 600; }
.fakten { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.fakten span { background: var(--flaeche2); border-radius: 8px; padding: 4px 10px; font-size: 14px; }
.schritte { padding-left: 22px; margin: 8px 0 16px; }
.schritte li { margin: 8px 0; padding-left: 4px; }

.verlauf { list-style: none; padding: 0; margin: 6px 0; }
.verlauf li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--linie); font-size: 15px; }
.verlauf li span:first-child { color: var(--leise); }

/* Schul-Treppe */
.treppe { list-style: none; padding: 0; margin: 20px 0; }
.treppe li { position: relative; padding: 12px 14px 12px 40px; margin: 6px 0; border-radius: 12px; background: var(--flaeche); border: 1px solid var(--linie); }
.treppe li::before { content: ""; position: absolute; left: 14px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; border: 2px solid var(--linie); }
.treppe li.fertig::before { background: var(--akzent); border-color: var(--akzent); }
.treppe li.fertig { color: var(--leise); }
.treppe li.jetzt { border: 2px solid var(--akzent); font-weight: 600; }
.treppe li.jetzt::before { border-color: var(--akzent); }
.treppe li small { display: block; font-size: 13px; color: var(--leise); font-weight: 400; }
.treppe li:nth-child(1) { margin-left: 0; }

/* Hilfe */
.situationen { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.situation { text-align: left; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 14px; padding: 14px; font-size: 15px; font-weight: 600; min-height: 72px; line-height: 1.3; }
.kontakt { display: flex; align-items: center; gap: 12px; padding: 14px; margin: 8px 0; border-radius: 14px; background: var(--flaeche); border: 1px solid var(--linie); color: inherit; text-decoration: none; }
.kontakt > .sym { color: var(--akzent); }
.kontakt span { display: flex; flex-direction: column; }
.kontakt small { color: var(--leise); font-size: 14px; }
.kontakt.fest > .sym { color: var(--notfall); }

/* Abläufe: großer Schritt, viel Luft */
.flow { padding-top: 16px; }
.schritt-gross { font-size: 30px; line-height: 1.2; margin: 8px 0 18px; }
.fortschritt { display: flex; gap: 5px; margin: 0 0 18px; }
.fortschritt span { flex: 1; height: 5px; border-radius: 3px; background: var(--linie); }
.fortschritt .fertig { background: var(--akzent); }
.fortschritt .jetzt { background: var(--akzent); opacity: .45; }
.flow .text-knopf:first-of-type { text-align: left; margin-left: 0; padding-left: 0; }
.frage { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--linie); }
.ja-nein { display: flex; gap: 6px; }
.ja-nein button { flex: 1; border: 1px solid var(--linie); background: var(--flaeche); border-radius: 10px; padding: 9px; font-size: 15px; }
.ja-nein button.aktiv { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-text); font-weight: 600; }
.regler { display: block; margin: 16px 0 22px; }
.regler input { width: 100%; accent-color: var(--akzent); height: 36px; }
.regler-wert { display: block; text-align: center; font-size: 15px; color: var(--leise); }
.regler-wert b { font-size: 34px; color: var(--text); }
.regler-skala { display: flex; justify-content: space-between; font-size: 13px; color: var(--leise); }

.feier { text-align: center; padding-top: 32px; }
.feier .gross { margin: 22px 0; }

/* Baum */
.baum { display: block; width: 100%; max-width: 420px; margin: 0 auto; }
.baum.klein { max-width: 240px; }
.baum .stamm { fill: #8a6a4f; }
:root[data-look="nacht"] .baum .stamm { fill: #a0826a; }
.baum .ast { fill: none; stroke: #8a6a4f; stroke-width: 6; stroke-linecap: round; }
:root[data-look="nacht"] .baum .ast { stroke: #a0826a; }
.baum .boden { fill: var(--flaeche2); }
.baum .knospe { stroke: var(--grund); stroke-width: 2; }
.baum .knospe.neu { animation: wachsen .9s cubic-bezier(.3, 1.6, .5, 1) both; transform-box: fill-box; transform-origin: center; }
.baum .krone circle { fill: #cfe8d6; }
:root[data-look="nacht"] .baum .krone circle { fill: #1d3a2e; }
.baum .knospe-leer { fill: none; stroke: var(--leise); stroke-width: 1.5; opacity: .5; }
.legende { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 12px; }
.legende button { display: flex; align-items: center; gap: 8px; text-align: left; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 12px; padding: 10px 12px; font-size: 14px; min-height: 48px; }
.legende button span:nth-child(2) { flex: 1; line-height: 1.25; }
.legende .punkt { width: 12px; height: 12px; border-radius: 50%; flex: none; }
@keyframes wachsen { from { transform: scale(0); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .baum .knospe.neu { animation: none; } }
.knospen-liste { list-style: none; padding: 0; }
.knospen-liste li { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--linie); }
.knospen-liste .punkt { width: 14px; height: 14px; border-radius: 50%; flex: none; margin-top: 5px; }
.knospen-liste small { display: block; color: var(--leise); font-size: 13px; }
.post { margin: 10px 0; padding: 14px 16px; border-left: 4px solid var(--akzent); background: var(--flaeche); border-radius: 0 12px 12px 0; }
.post small { display: block; color: var(--leise); font-size: 13px; margin-top: 6px; }
.post.gross { font-size: 21px; text-align: left; }

/* Einrichtung */
.einrichtung { display: flex; flex-direction: column; justify-content: center; min-height: 92vh; text-align: center; gap: 8px; }
.logo { font-size: 56px; font-weight: 800; letter-spacing: .12em; color: var(--akzent); margin-bottom: 16px; }
.wahl-zwei { display: flex; gap: 12px; margin: 12px 0; }
.look-wahl { flex: 1; border: 2px solid var(--linie); background: var(--flaeche); border-radius: 16px; padding: 12px; font-weight: 600; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.look-wahl.aktiv { border-color: var(--akzent); }
.look-bild { width: 100%; height: 64px; border-radius: 10px; border: 1px solid var(--linie); }
.look-bild.ruhig { background: linear-gradient(#f6f5f1 0 60%, #0f766e 60% 75%, #f6f5f1 75%); }
.look-bild.nacht { background: linear-gradient(#10151a 0 60%, #5eead4 60% 75%, #10151a 75%); }

/* Dialog */
.dialog-grund { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: grid; place-items: end center; z-index: 50; padding: 16px; }
.dialog { background: var(--flaeche); color: var(--text); border-radius: 20px; padding: 20px; width: 100%; max-width: 520px; max-height: 85vh; overflow: auto; }
.hinweis-leiste { position: fixed; top: 0; left: 0; right: 0; background: var(--warnung-grund); color: var(--warnung-text); padding: 8px 16px; font-size: 14px; text-align: center; z-index: 40; }

@media (min-width: 700px) {
  .dialog-grund { place-items: center; }
}

/* Fassung 4.1 */
.klein-knopf { width: auto; min-height: 40px; padding: 6px 12px; margin: 0; font-size: 14px; flex: none; }
.klein-knopf[disabled] { opacity: .8; }
.beweis { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.beweis .punkt { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 7px; }
.brief { white-space: pre-wrap; }
.treppe li[data-a] { cursor: pointer; }
[hidden] { display: none !important; }

/* Fassung 4.2 */
.wahl-drei .look-wahl { padding: 10px 6px; font-size: 15px; }
.look-bild.neon { background: linear-gradient(#0d0b1e 0 60%, #c084fc 60% 68%, #22d3ee 68% 75%, #0d0b1e 75%); }
.chips.mitte { justify-content: center; }
.vorlesen { text-align: left; margin: -8px 0 8px; padding-left: 0; }
.marke { font-style: normal; font-size: 12px; font-weight: 600; color: var(--akzent); background: var(--akzent-hell); border-radius: 6px; padding: 1px 6px; margin-left: 4px; }
.stufe-knopf { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--flaeche2); border: 1px solid transparent; border-radius: 12px; padding: 12px; margin: 6px 0; font-size: 15px; }
.stufe-knopf span { flex: none; width: 54px; font-weight: 700; font-size: 13px; padding-top: 1px; }
.stufe-mini span { color: #10b981; } .stufe-mittel span { color: #f59e0b; } .stufe-gross span { color: #ef4444; }
.abend-schritt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 14px; padding: 14px; margin: 8px 0; font-size: 16px; }
.abend-schritt .haken { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--linie); flex: none; }
.abend-schritt.fertig .haken { background: var(--akzent); border-color: var(--akzent); box-shadow: inset 0 0 0 4px var(--flaeche); }
.abend-schritt.fertig { color: var(--leise); }
.ton-zeile { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--linie); }
.ton-zeile > div { flex: 1 1 120px; display: flex; flex-direction: column; }
.ton-zeile small { color: var(--leise); font-size: 13px; }
.ton-zeile audio { flex: 1 1 200px; height: 40px; }
.teilen-zeile { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--linie); }
.teilen-zeile input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--akzent); flex: none; }
.teilen-zeile span { display: flex; flex-direction: column; }
.teilen-zeile small { color: var(--leise); font-size: 14px; }
.unten-fest { position: sticky; bottom: 84px; padding-top: 8px; background: linear-gradient(transparent, var(--grund) 30%); }
.zeigen-eintrag { padding: 14px 0; border-bottom: 1px solid var(--linie); }
.chip input { accent-color: var(--akzent); }

/* Neon: der etwas spielerischere Look für alle, die es bunter mögen. */
:root[data-look="neon"] {
  --grund: #0d0b1e;
  --flaeche: #17142e;
  --flaeche2: #221d42;
  --text: #f3f0ff;
  --leise: #a49fc7;
  --linie: #2f2858;
  --akzent: #c084fc;
  --akzent-text: #1a0b2e;
  --akzent-hell: #2e2152;
  --notfall: #fb7185;
  --warnung-grund: #3a2a12;
  --warnung-text: #fcd58a;
  --schatten: 0 0 0 1px rgba(192, 132, 252, .08), 0 6px 24px rgba(34, 211, 238, .06);

      }
    }
    if (!Array.isArray(z.morgen.schritte) || !z.morgen.schritte.length) z.morgen.schritte = leer.morgen.schritte;
    return z;
  }

  // Übernahme aus Fassung 1 bis 3 (Schlüssel next-v1): Name, Skill-Versuche,
  // Koffer, eigene Skills, Kontakte, Morgenroutine, Schul-Treppe,
  // Warnzeichen, eigene Mutmacher. XP, Münzen und Zimmer fallen bewusst weg.
  function uebernehmeAlt(z, a) {
    if (!a || typeof a !== "object") return;
    const p = a.profil || {};
    if (p.name) z.profil.name = String(p.name);
    if (p.eingerichtet) z.profil.eingerichtet = true;
    if (p.thema === "hell") z.profil.look = "ruhig"; else if (p.thema) z.profil.look = "nacht";
    if (Array.isArray(a.versuche)) {
      z.skills.versuche = a.versuche.filter(v => v && v.skillId).map(v => ({
        id: v.id || neueId(), skillId: v.skillId, datum: v.datum || new Date().toISOString(),
        situation: v.situation || "", vorher: zahl(v.vorher), nachher: zahl(v.nachher),
        wirkung: {}, ergebnisse: [], notiz: v.notiz || v.beobachtung || ""
      }));
    }
    const k = a.koffer || {};
    const fav = [].concat(k.mittel || [], k.langfristig || [], k.hoch || []);
    z.skills.favoriten = [...new Set(fav)];
    z.skills.sos = [...new Set(k.hoch || [])].slice(0, 3);
    const eigene = [].concat(a.eigeneSkills || [], a.fachSkills || []);
    z.skills.eigene = eigene.filter(s => s && s.id && s.name).map(s => ({
      id: s.id, name: s.name, wann: s.wann || "", dauer: s.dauer || "", material: s.material || "",
      schritte: Array.isArray(s.schritte) ? s.schritte : [], ziele: [], eigen: true
    }));
    if (a.plan && Array.isArray(a.plan.kontakte)) {
      z.hilfe.kontakte = a.plan.kontakte.filter(c => c && c.name).map(c => ({ id: neueId(), name: c.name, telefon: c.telefon || "", rolle: "" }));
    }
    if (a.plan && a.plan.text) z.hilfe.stufen.schwer = String(a.plan.text);
    const w = a.welt || {};
    if (w.morgen && Array.isArray(w.morgen.schritte) && w.morgen.schritte.length) {
      z.morgen.schritte = w.morgen.schritte.filter(s => s && s.text).map(s => {
        const vorlage = I.MORGEN.find(m => m.id === s.id);
        return { id: s.id || neueId(), text: s.text, mini: s.kleiner || (vorlage ? vorlage.mini : ""), start: vorlage ? !!vorlage.start : false };
      });
    }
    if (w.schule && Array.isArray(w.schule.etappen)) {
      z.schule.etappen = w.schule.etappen.filter(e => e && e.text).map(e => ({ id: e.id || neueId(), text: e.text, erledigt: !!e.erledigt, datum: e.datum || null }));
    }
    if (w.rucksack && Array.isArray(w.rucksack.warnzeichen)) z.hilfe.warnzeichen = w.rucksack.warnzeichen.filter(x => typeof x === "string");
    if (w.mutmacher && Array.isArray(w.mutmacher.eigene)) z.mutmacher.eigene = w.mutmacher.eigene.filter(x => typeof x === "string");
    if (w.mutmacher && w.mutmacher.an === false) z.profil.mutmacherAn = false;
  }

  function speichern() {
    try { localStorage.setItem(SPEICHER, JSON.stringify(S)); speicherKaputt = false; }
    catch (e) { speicherKaputt = true; }
  }

  // ---------------------------------------------------------------- Helfer

  function neueId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function zahl(x) { const n = Number(x); return Number.isFinite(n) ? Math.max(0, Math.min(100, Math.round(n))) : null; }
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function heuteIso() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function istHeute(iso) { return typeof iso === "string" && iso.slice(0, 10) === heuteIso(); }
  function datumKurz(iso) {
    try { return new Date(iso).toLocaleDateString("de-DE", { day: "numeric", month: "short" }); } catch (e) { return ""; }
  }
  function telLink(nummer) { return "tel:" + String(nummer || "").replace(/[^0-9+]/g, ""); }
  function ast(id) { return I.AESTE.find(a => a.id === id) || I.AESTE[0]; }

  function alleSkills() {
    const bestand = B.skills.map(s => {
      const z = I.SKILL_ZUSATZ[s.id] || {};
      return { ...s, ziele: z.ziele || [], absprache: !!z.absprache };
    });
    return bestand.concat(I.NEUE_SKILLS.map(s => ({ ...s, absprache: false })), S.skills.team.map(s => ({ ...s, team: true })), S.skills.eigene.map(s => ({ ...s, eigen: true })));
  }
  function skill(id) { return alleSkills().find(s => s.id === id) || null; }
  function versucheZu(id) { return S.skills.versuche.filter(v => v.skillId === id); }

  // Skills, die in einem Moment angeboten werden: zuerst die eigenen
  // Notfall-Skills, dann Favoriten mit passendem Ziel, dann allgemeine
  // Skills mit passendem Ziel. Nie mehr als drei, damit es bei hoher
  // Anspannung nicht überfordert (Konzept, Punkt 5C). Skills mit starkem
  // Reiz kommen nur, wenn sie selbst in den Koffer gelegt wurden.
  function skillVorschlaege(ziel) {
    const liste = [];
    const dazu = id => { const s = skill(id); if (s && !liste.find(x => x.id === s.id)) liste.push(s); };
    S.skills.sos.forEach(dazu);
    S.skills.favoriten.forEach(id => { const s = skill(id); if (s && (!ziel || s.ziele.includes(ziel))) dazu(id); });
    if (liste.length < 3 && ziel) alleSkills().filter(s => s.ziele.includes(ziel) && !s.absprache).forEach(s => dazu(s.id));
    return liste.slice(0, 3);
  }

  function mutmacherHeute() {
    const alle = S.mutmacher.eigene.concat(B.mutmacher);
    if (!alle.length) return "";
    const d = new Date();
    const tag = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
    return alle[tag % alle.length];
  }

  function aktuelleEtappe() { return S.schule.etappen.find(e => !e.erledigt) || null; }
  function morgenHeuteFertig() { return S.morgen.laeufe.some(l => istHeute(l.datum)); }
  function ungelesenePost() { return S.post.filter(p => !p.gelesen); }

  // ---------------------------------------------------------------- Symbole

  const SYM = {
    heute: '<path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/>',
    missionen: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
    skills: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
    baum: '<path d="M12 22v-8M12 14l-4-3M12 12l4-3"/><path d="M12 2a6 6 0 0 0-6 6c0 1 .2 1.8.6 2.6A4.5 4.5 0 0 0 8 19h8a4.5 4.5 0 0 0 1.4-8.4c.4-.8.6-1.6.6-2.6a6 6 0 0 0-6-6z"/>',
    hilfe: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/>',
    zurueck: '<path d="M15 18l-6-6 6-6"/>',
    weiter: '<path d="M9 18l6-6-6-6"/>',
    telefon: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
    zahnrad: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    stern: '<path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    post: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    treppe: '<path d="M3 20h5v-5h5v-5h5V5h3"/>',
    sonne: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>',
    liste: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
    kompass: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
    flamme: '<path d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-5 5-5 8-1-1-2-2-2-4-2 2-2 5-2 8 0 4 3 7 7 7z"/>'
  };
  function sym(name, extra) { return `<svg class="sym ${extra || ""}" viewBox="0 0 24 24" aria-hidden="true">${SYM[name] || ""}</svg>`; }

  // ---------------------------------------------------------------- Navigation

  // Adresse im Hash, damit die Zurück-Taste des Handys funktioniert.
  // Form: #bereich/seite/param
  let flow = null; // laufender Ablauf im Speicher (nicht gespeichert, außer Morgen)

  function weg() {
    const teile = (location.hash || "#heute").slice(1).split("/");
    return { bereich: teile[0] || "heute", seite: teile[1] || "", param: decodeURIComponent(teile.slice(2).join("/")) };
  }
  function geh(ziel) {
    if (location.hash === "#" + ziel) render(); else location.hash = ziel;
  }
  function starteFlow(f) {
    flow = f;
    geh("flow/" + f.art + "/" + Date.now().toString(36));
  }
  window.addEventListener("hashchange", () => {
    // Zurück aus einem Ablauf: Ablauf verwerfen. Der Morgen bleibt
    // gespeichert und lässt sich fortsetzen.
    if (weg().bereich !== "flow") flow = null;
    render();
  });

  const BEREICHE = [
    { id: "heute", name: "Heute" },
    { id: "missionen", name: "Missionen" },
    { id: "skills", name: "Skills" },
    { id: "baum", name: "Mein Baum" },
    { id: "hilfe", name: "Hilfe" }
  ];

  // ---------------------------------------------------------------- Bausteine

  function kopf(titel, zurueck, rechts) {
    return `<header class="kopf">
      ${zurueck ? `<button class="kopf-knopf" data-a="geh" data-z="${esc(zurueck)}" aria-label="Zurück">${sym("zurueck")}</button>` : `<span class="kopf-platz"></span>`}
      <h1>${esc(titel)}</h1>
      ${rechts || `<span class="kopf-platz"></span>`}
    </header>`;
  }
  function hilfeKnopfKlein() {
    return `<button class="kopf-knopf hilfe-klein" data-a="geh" data-z="hilfe" aria-label="Hilfe">${sym("hilfe")}<span>Hilfe</span></button>`;
  }
  function leiste(aktiv) {
    return `<nav class="leiste">${BEREICHE.map(b => `<button class="${b.id === aktiv ? "aktiv" : ""}" data-a="geh" data-z="${b.id}">${sym(b.id)}<span>${b.name}</span></button>`).join("")}</nav>`;
  }
  function karte(inhalt, klasse) { return `<section class="karte ${klasse || ""}">${inhalt}</section>`; }
  function zeile(titel, unter, aktion, z, symbol) {
    return `<button class="zeile" data-a="${aktion}" data-z="${esc(z || "")}">
      ${symbol ? `<span class="zeile-sym">${sym(symbol)}</span>` : ""}
      <span class="zeile-text"><b>${esc(titel)}</b>${unter ? `<small>${esc(unter)}</small>` : ""}</span>${sym("weiter", "klein")}</button>`;
  }
  function leer(text) { return `<p class="leer">${esc(text)}</p>`; }

  // ---------------------------------------------------------------- Render

  const app = () => document.getElementById("app");

  function render() {
    document.documentElement.dataset.look = S.profil.look;
    const w = weg();
    let html;
    try {
      if (!S.profil.eingerichtet) html = seiteEinrichtung();
      else if (w.bereich === "flow") html = flow ? seiteFlow() : (geh("heute"), "");
      else html = seite(w) + leiste(w.bereich === "einstellungen" || w.bereich === "fach" ? "" : w.bereich);
    } catch (e) {
      console.error(e);
      html = kopf("Hoppla") + `<main>${karte(`<p>Da ist etwas schiefgelaufen. Deine Einträge sind sicher gespeichert.</p><button class="knopf" data-a="geh" data-z="heute">Zurück zu Heute</button>`)}</main>`;
    }
    if (speicherKaputt) html += `<div class="hinweis-leiste">Speichern geht gerade nicht. Ist der private Modus an?</div>`;
    app().innerHTML = html;
    window.scrollTo(0, 0);
    if (KANN_AUFNEHMEN) toeneEinhaengen();
    const fokus = app().querySelector("[data-fokus]");
    if (fokus) fokus.focus();
  }

  function seite(w) {
    switch (w.bereich) {
      case "heute": return seiteHeute();
      case "missionen":
        if (w.seite === "morgen") return seiteMorgen();
        if (w.seite === "schule") return seiteSchule();
        if (w.seite === "challenge") return seiteChallenges(w.param);
        if (w.seite === "life") return seiteLife(w.param);
        if (w.seite === "abend") return seiteAbend();
        if (w.seite === "zukunft") { const t = w.param.split("/"); return seiteZukunft(t[0], t[1]); }
        return seiteMissionen();
      case "skills":
        if (w.seite === "s") return seiteSkill(w.param);
        if (w.seite === "entdecken") return seiteEntdecken();
        if (w.seite === "neu") return seiteEigenerSkill();
        return seiteKoffer();
      case "baum":
        if (w.seite === "ast") return seiteAst(w.param);
        if (w.seite === "ich") return seiteIch();
        if (w.seite === "beweise") return seiteBeweise();
        if (w.seite === "entwicklung") return seiteEntwicklung();
        return seiteBaum();
      case "hilfe":
        if (w.seite === "notfall") return seiteNotfall();
        if (w.seite === "plan") return seitePlan();
        if (w.seite === "rucksack") return seiteRucksack();
        if (w.seite === "kontakte") return seiteKontakte();
        if (w.seite === "brief") return seiteBrief();
        if (w.seite === "teilen") return seiteTeilen();
        return seiteHilfe();
      case "einstellungen": return seiteEinstellungen();
      case "fach": return seiteFach(w.seite);
      default: return seiteHeute();
    }
  }

  // ---------------------------------------------------------------- Einrichtung

  let einrichtungSchritt = 0;
  function seiteEinrichtung() {
    if (einrichtungSchritt === 0) {
      return `<main class="einrichtung">
        <div class="logo">NEXT</div>
        <p class="gross">Dein Leben. Dein Tempo.<br>Dein nächster Schritt.</p>
        <p class="leise">Du musst nicht alles schaffen. Nur deinen nächsten Schritt finden.</p>
        <button class="knopf haupt" data-a="einr-weiter" data-fokus>Los geht's</button>
      </main>`;
    }
    if (einrichtungSchritt === 1) {
      return `<main class="einrichtung">
        <h2>Wie sollen wir dich nennen?</h2>
        <p class="leise">Ein Spitzname reicht. Du kannst das auch leer lassen.</p>
        <input class="eingabe" data-f="einr-name" maxlength="30" value="${esc(S.profil.name)}" placeholder="Dein Name" autocomplete="off">
        <button class="knopf haupt" data-a="einr-weiter">Weiter</button>
      </main>`;
    }
    if (einrichtungSchritt === 2) {
      return `<main class="einrichtung">
        <h2>Was interessiert dich?</h2>
        <p class="leise">Freiwillig. Du kannst das später jederzeit ändern.</p>
        <div class="chips mitte">${I.INTERESSEN.map(i => `<button class="chip ${S.zukunft.interessen.includes(i.name) ? "aktiv" : ""}" data-a="einr-interesse" data-z="${esc(i.name)}">${esc(i.name)}</button>`).join("")}</div>
        <button class="knopf haupt" data-a="einr-weiter">Weiter</button>
      </main>`;
    }
    return `<main class="einrichtung">
      <h2>Wie soll NEXT aussehen?</h2>
      <div class="wahl-zwei wahl-drei">
        <button class="look-wahl ${S.profil.look === "ruhig" ? "aktiv" : ""}" data-a="look" data-z="ruhig"><span class="look-bild ruhig"></span>Hell und ruhig</button>
        <button class="look-wahl ${S.profil.look === "nacht" ? "aktiv" : ""}" data-a="look" data-z="nacht"><span class="look-bild nacht"></span>Dunkel</button>
        <button class="look-wahl ${S.profil.look === "neon" ? "aktiv" : ""}" data-a="look" data-z="neon"><span class="look-bild neon"></span>Neon</button>
      </div>
      <p class="leise">Alles, was du einträgst, bleibt nur auf diesem Handy.</p>
      <button class="knopf haupt" data-a="einr-fertig">Fertig</button>
    </main>`;
  }

  // ---------------------------------------------------------------- Heute

  // Der nächste Schritt: genau eine Sache, je nach Tageszeit und Stand.
  function naechsterSchritt() {
    const lauf = S.morgen.lauf;
    if (lauf && istHeute(lauf.datum)) {
      const s = laufSchritte(lauf)[lauf.index];
      if (s) return { titel: "Weiter mit deinem Morgen", text: s.text, knopf: "Weitermachen", a: "morgen-weiter" };
    }
    const stunde = new Date().getHours();
    if (stunde >= 5 && stunde < 11 && !morgenHeuteFertig()) {
      return { titel: "Dein Morgen", text: "Ein Schritt nach dem anderen. Du entscheidest, wie klein.", knopf: "Morgen starten", a: "geh", z: "missionen/morgen" };
    }
    const etappe = aktuelleEtappe();
    if (etappe && stunde < 14) {
      return { titel: "Deine Schul-Treppe", text: etappe.text, knopf: "Ansehen", a: "geh", z: "missionen/schule" };
    }
    const ga = S.skills.gruppenAufgabe;
    if (ga) return { titel: "Aufgabe aus der Gruppe", text: ga.text, knopf: ga.skillId && skill(ga.skillId) ? "Skill öffnen" : "Erledigt", a: ga.skillId && skill(ga.skillId) ? "geh" : "ga-erledigt", z: ga.skillId ? "skills/s/" + ga.skillId : "" };
    const ch = S.challenges.laufend;
    if (ch) return { titel: "Deine Challenge", text: ch.text, knopf: "Wie lief's?", a: "challenge-auswerten" };
    if (stunde >= 19 && !abendHeute()) return { titel: "Dein Abend", text: "Kurz den Tag abschließen und den Morgen leichter machen.", knopf: "Abendroutine", a: "geh", z: "missionen/abend" };
    const life = S.life.aufgaben.find(a => !a.fertig && a.schritte.some(x => !x.erledigt));
    if (life) return { titel: life.titel, text: life.schritte.find(x => !x.erledigt).text, knopf: "Ansehen", a: "geh", z: "missionen/life/" + life.id };
    if (S.skills.skillDerWoche && skill(S.skills.skillDerWoche)) {
      const s = skill(S.skills.skillDerWoche);
      return { titel: "Skill der Woche", text: s.name, knopf: "Ausprobieren", a: "geh", z: "skills/s/" + s.id };
    }
    if (!S.skills.versuche.length) return { titel: "Probier einen Skill aus", text: "Finde heraus, was dir hilft, wenn es eng wird.", knopf: "Skills entdecken", a: "geh", z: "skills/entdecken" };
    return { titel: "Kleine Challenge?", text: "Etwas Neues im echten Leben ausprobieren, in deinem Tempo.", knopf: "Challenge aussuchen", a: "geh", z: "missionen/challenge" };
  }

  function seiteHeute() {
    const n = naechsterSchritt();
    const stunde = new Date().getHours();
    const gruss = stunde < 11 ? "Guten Morgen" : stunde < 18 ? "Hallo" : "Guten Abend";
    const post = ungelesenePost();
    let html = `<header class="kopf heute-kopf"><div><p class="leise">${esc(new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" }))}</p>
      <h1>${gruss}${S.profil.name ? ", " + esc(S.profil.name) : ""}</h1></div>
      <button class="kopf-knopf" data-a="geh" data-z="einstellungen" aria-label="Einstellungen">${sym("zahnrad")}</button></header><main>`;
    html += `<section class="karte naechster">
      <p class="etikett">Dein nächster Schritt</p>
      <h2>${esc(n.titel)}</h2><p class="naechster-text">${esc(n.text)}</p>
      <button class="knopf haupt" data-a="${n.a}" data-z="${esc(n.z || "")}">${esc(n.knopf)}</button></section>`;
    if (post.length) {

  // ---------------------------------------------------------------- Baum

  // Der Baum: Stamm, eine weiche Krone und acht Äste. Knospen sitzen
  // entlang ihres Astes, nach dem goldenen Schnitt verteilt, damit auch
  // viele Knospen nicht übereinander liegen. Ohne Knospen zeigen graue
  // Spitzen, wo etwas wachsen kann. Der Baum wird nie kleiner.
  function baumSvg(klein) {
    const W = 400, H = 400, mx = 200, gabel = 262;
    let aeste = "", knospen = "";
    I.AESTE.forEach((a, i) => {
      const wi = (-162 + i * (144 / 7)) * Math.PI / 180;
      const laenge = 150 - Math.abs(i - 3.5) * 6;
      const ex = mx + Math.cos(wi) * laenge * 1.08, ey = gabel + Math.sin(wi) * laenge;
      const kx = mx + Math.cos(wi) * laenge * 0.35, ky = gabel + Math.sin(wi) * laenge * 0.75 - 20;
      const punkt = t => [(1 - t) * (1 - t) * mx + 2 * (1 - t) * t * kx + t * t * ex, (1 - t) * (1 - t) * gabel + 2 * (1 - t) * t * ky + t * t * ey];
      aeste += `<path d="M${mx} ${gabel} Q${kx.toFixed(1)} ${ky.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" class="ast" />`;
      const meine = S.baum.knospen.filter(k => k.ast === a.id);
      if (!meine.length) knospen += `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4" class="knospe-leer" />`;
      meine.forEach((k, j) => {
        const t = 0.42 + 0.58 * ((j * 0.618 + 0.55) % 1);
        const [px, py] = punkt(t);
        const [qx, qy] = punkt(Math.min(1, t + 0.02));
        const nx = -(qy - py), ny = qx - px, nl = Math.hypot(nx, ny) || 1;
        const ab = (j % 2 ? 1 : -1) * (9 + (j % 3) * 4);
        const cx = px + nx / nl * ab, cy = py + ny / nl * ab;
        const r = k.quelle === "post" ? 9 : 7;
        knospen += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="${a.farbe}" class="knospe ${k.neu ? "neu" : ""}" />`;
      });
    });
    const krone = [[200, 150, 120], [118, 196, 74], [282, 196, 74], [150, 104, 70], [250, 104, 70], [200, 72, 64]]
      .map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" />`).join("");
    return `<svg class="baum ${klein ? "klein" : ""}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dein Stärkenbaum mit ${S.baum.knospen.length} Knospen">
      <g class="krone">${krone}</g>
      <ellipse cx="${mx}" cy="${H - 14}" rx="110" ry="10" class="boden"/>
      <path d="M${mx - 18} ${H - 16} C${mx - 10} ${H - 70} ${mx - 9} ${gabel + 40} ${mx - 4} ${gabel} L${mx + 4} ${gabel} C${mx + 9} ${gabel + 40} ${mx + 10} ${H - 70} ${mx + 18} ${H - 16} Z" class="stamm"/>
      ${aeste}${knospen}</svg>`;
  }

  function baumLegende() {
    return `<div class="legende">${I.AESTE.map(a => {
      const n = S.baum.knospen.filter(k => k.ast === a.id).length;
      return `<button data-a="geh" data-z="baum/ast/${a.id}"><span class="punkt" style="background:${a.farbe}"></span><span>${esc(a.name)}</span><b>${n || ""}</b></button>`;
    }).join("")}</div>`;

  function seiteBaum() {
    const n = S.baum.knospen.length;

    let html = kopf("Mein Baum") + "<main>";
    html += baumSvg(false);
    html += `<p class="einleitung">${n ? `${n} ${n === 1 ? "Knospe" : "Knospen"}. Jede ist etwas, das du wirklich erlebt hast.` : "Deine Stärken sind schon da. Jede echte Erfahrung lässt hier eine Knospe wachsen."}</p>`;
    html += baumLegende();
    html += `<p class="leise">Dein Baum wird nie kleiner, auch nicht an schweren Tagen.</p>`;
    html += `<button class="knopf haupt" data-a="knospe-eigene">Eine Erfahrung eintragen</button>`;
    html += ueberMichHtml();

    return html + "</main>";

  // ---------------------------------------------------------------- Abläufe

  // Ein Ablauf zeigt einen Bildschirm nach dem anderen, ohne Leiste unten.
  // Oben steht immer "Hilfe", damit sie nie hinter einem Schritt verschwindet.
  function flowKopf(titel, abbrechen) {
    return `<header class="kopf flow-kopf">
      <button class="kopf-knopf" data-a="${abbrechen || "flow-ende"}" aria-label="Schließen">✕</button>
      <h1>${esc(titel)}</h1>${hilfeKnopfKlein()}</header>`;
  }

  function seiteFlow() {
    const f = flow;
    switch (f.art) {
      case "morgen": return flowMorgen();
      case "schule": return flowSchule();
      case "steck": return flowSteck();
      case "test": return flowTest();
      case "challenge": return flowChallenge();
      case "neustart": return flowNeustart();
      case "ziel": return flowZiel();
      case "gedanke": return flowGedanke();
      case "zeigen": return flowZeigen();
      case "knospe": return flowKnospe();
      case "post": return flowPost();
      default: flow = null; return seiteHeute();
    }
  }

  // ---- Morgen-Quest: genau ein Schritt pro Bildschirm.

  function flowMorgen() {
    const f = flow;
    if (f.ansicht === "rueck") return rueckschau("Morgen-Quest", "Was hat dir heute geholfen?", "morgen-merken");
    const lauf = S.morgen.lauf;
    if (!lauf) { flow = null; return seiteMorgen(); }
    const schritte = laufSchritte(lauf);
    const s = schritte[lauf.index];
    if (f.ansicht === "steck") return steckGruende(s, "Morgen-Quest", "morgen");
    if (f.ansicht === "grund") return steckAntwort(s, f.grund, "Morgen-Quest", "morgen");
    if (f.ansicht === "hilfe") return unterstuetzung("Morgen-Quest", "morgen");
    if (f.ansicht === "mini") {
      return flowKopf("Morgen-Quest", "morgen-pause") + `<main class="flow">
        <p class="etikett">Kleiner geht auch</p><h2 class="schritt-gross">${esc(s.mini)}</h2>
        <p class="leise">Nur das. Dann zählt es.</p>
        <button class="knopf haupt" data-a="morgen-rueck" data-z="anders" data-fokus>Hab ich gemacht</button>
        <button class="knopf" data-a="morgen-pause">Erst mal Pause</button></main>`;
    }
    if (!s) return morgenEnde();
    const punkte = schritte.map((x, i) => `<span class="${i < lauf.index ? "fertig" : i === lauf.index ? "jetzt" : ""}"></span>`).join("");
    return flowKopf("Morgen-Quest", "morgen-pause") + `<main class="flow">
      <div class="fortschritt">${punkte}</div>
      <p class="etikett">Schritt ${lauf.index + 1} von ${schritte.length}</p>
      <h2 class="schritt-gross">${esc(s.text)}</h2>
      ${vorlesenKnopf(s.text)}
      ${s.mini ? `<button class="text-knopf" data-a="morgen-mini">Zu viel? Dann erst: ${esc(s.mini)}</button>` : ""}
      <button class="knopf haupt" data-a="morgen-rueck" data-z="geschafft" data-fokus>Geschafft</button>
      <div class="knopf-reihe drei">
        <button class="knopf" data-a="morgen-rueck" data-z="versucht">Versucht</button>
        <button class="knopf" data-a="morgen-rueck" data-z="anders">Anders gelöst</button>
        <button class="knopf" data-a="morgen-rueck" data-z="zuviel">Gerade zu viel</button></div>
      <div class="knopf-reihe">
        <button class="knopf leise-knopf" data-a="flow-ansicht" data-z="steck">Ich stecke fest</button>
        <button class="knopf leise-knopf" data-a="flow-ansicht" data-z="hilfe">Ich brauche Unterstützung</button></div>
      <button class="text-knopf" data-a="morgen-pause">Pause, später weiter</button></main>`;
  }

  function morgenEnde() {
    const lauf = S.morgen.lauf;
    const werte = Object.values(lauf.ergebnisse);
    const gemacht = werte.filter(v => v === "geschafft" || v === "anders" || v === "versucht").length;
    const naechste = aktuelleEtappe();
    return flowKopf("Morgen-Quest") + `<main class="flow">
      <p class="etikett">Dein Morgen</p>
      <h2 class="schritt-gross">${gemacht ? `${gemacht} ${gemacht === 1 ? "Schritt" : "Schritte"} gemacht.` : "Du hast es versucht."}</h2>
      <p>${werte.includes("zuviel") ? "Du hast auch gemerkt, wann etwas zu viel war. Das gehört dazu." : "Das hast du selbst gemacht."}</p>
      <button class="knopf haupt" data-a="morgen-abschluss" data-fokus>Weiter</button>
      ${naechste ? `<p class="leise">Danach kommt deine Schul-Etappe: ${esc(naechste.text)}</p>` : ""}</main>`;
  }

  // Gemeinsame Bildschirme für "Ich stecke fest" mitten in einem Schritt.
  function steckGruende(s, titel, art) {
    const gruende = art === "schule" ? I.SCHUL_GRUENDE : I.STECK_GRUENDE;
    return flowKopf(titel, "flow-zurueck") + `<main class="flow">
      <p class="etikett">${esc(s ? s.text : "")}</p><h2>Was macht es gerade schwer?</h2>
      ${gruende.map(g => `<button class="wahl-karte" data-a="steck-grund" data-z="${g.id}">${esc(g.text)}</button>`).join("")}
      <button class="text-knopf" data-a="flow-schritt">Doch weiter</button></main>`;
  }

  function steckAntwort(s, grundId, titel, art) {
    const gruende = art === "schule" ? I.SCHUL_GRUENDE : I.STECK_GRUENDE;
    const g = gruende.find(x => x.id === grundId) || gruende[0];
    const skills = g.skillZiel ? skillVorschlaege(g.skillZiel) : [];
    const mini = art === "morgen" && s && s.mini ? s.mini : (art === "schule" ? S.schule.planB.schritt : "");
    let html = flowKopf(titel, "flow-zurueck") + `<main class="flow"><h2>${esc(g.antwort)}</h2>`;
    if (g.nichtDraengen) html += `<p class="warnung">Deine Sicherheit geht vor. Heute musst du diesen Schritt nicht machen.</p>`;
    if (mini && !g.nichtDraengen && !g.nurKontakt) html += karte(`<p class="etikett">Kleinerer Schritt</p><p class="naechster-text">${esc(mini)}</p>
      <button class="knopf haupt" data-a="${art}-rueck" data-z="anders">Den mache ich</button>`);
    if (g.aktion === "morgen" && art === "schule") html += `<button class="knopf haupt" data-a="morgen-start" data-z="mini">Mini-Start der Morgen-Quest</button>`;
    if (skills.length) html += `<p class="etikett">Ein Skill, der passen könnte</p>` + skills.map(sk => `<button class="wahl-karte" data-a="skill-kurz" data-z="${esc(sk.id)}"><b>${esc(sk.name)}</b><small>${esc((sk.schritte || [])[0] || "")}</small></button>`).join("");
    if (art === "schule" && (S.schule.planB.kontakt || S.schule.planB.ort)) html += karte(`<p class="etikett">Dein Plan B</p>${S.schule.planB.kontakt ? `<p>Sprich an: <b>${esc(S.schule.planB.kontakt)}</b></p>` : ""}${S.schule.planB.ort ? `<p>Rückzugsort: <b>${esc(S.schule.planB.ort)}</b></p>` : ""}`);
    html += `<p class="etikett">Jemand, der helfen kann</p>` + kontaktListe();
    html += `<div class="knopf-reihe"><button class="knopf" data-a="flow-schritt">Zurück zum Schritt</button><button class="knopf" data-a="${art}-rueck" data-z="${g.nichtDraengen || g.nurKontakt ? "hilfe" : "zuviel"}">${g.nichtDraengen || g.nurKontakt ? "Ich hole mir Hilfe" : "Heute nicht"}</button></div>`;
    return html + "</main>";
  }

  function unterstuetzung(titel, art) {
    return flowKopf(titel, "flow-zurueck") + `<main class="flow">
      <h2>Gut, dass du dir Unterstützung holst.</h2><p>Das ist stark, nicht schwach.</p>
      ${art === "schule" && S.schule.planB.kontakt ? karte(`<p class="etikett">Dein Plan B</p><p><b>${esc(S.schule.planB.kontakt)}</b></p>`) : ""}
      ${kontaktListe()}
      <button class="knopf haupt" data-a="${art}-rueck" data-z="hilfe">Ich habe jemandem Bescheid gesagt</button>
      <button class="text-knopf" data-a="flow-schritt">Zurück zum Schritt</button></main>`;
  }

  // ---- Schul-Etappe: ein Versuch, dieselben Rückmeldungen wie am Morgen.

  function flowSchule() {
    const f = flow;
    const e = S.schule.etappen.find(x => x.id === f.etappeId);
    if (!e) { flow = null; return seiteSchule(); }
    const s = { text: e.text, mini: S.schule.planB.schritt };
    if (f.ansicht === "steck") return steckGruende(s, "Schul-Treppe", "schule");
    if (f.ansicht === "grund") return steckAntwort(s, f.grund, "Schul-Treppe", "schule");
    if (f.ansicht === "hilfe") return unterstuetzung("Schul-Treppe", "schule");
    if (f.ansicht === "rueck") return rueckschau("Schul-Treppe", f.status === "zuviel" ? "Was hat es heute schwer gemacht?" : "Was hat geholfen?", "schule-merken");
    if (f.ansicht === "abhaken") {
      return flowKopf("Schul-Treppe") + `<main class="flow"><h2>Stark. Sitzt diese Etappe schon?</h2>
        <p class="leise">Du kannst sie auch noch ein paar Mal üben, bevor die nächste dran ist.</p>
        <button class="knopf haupt" data-a="schule-abhaken" data-z="ja">Ja, nächste Etappe</button>
        <button class="knopf" data-a="schule-abhaken" data-z="nein">Noch weiter üben</button></main>`;
    }
    return flowKopf("Schul-Treppe") + `<main class="flow">
      <p class="etikett">Deine Etappe heute</p><h2 class="schritt-gross">${esc(e.text)}</h2>
      <p class="leise">Mach es im echten Leben. Komm danach zurück und sag kurz, wie es war.</p>
      <button class="knopf haupt" data-a="schule-rueck" data-z="geschafft" data-fokus>Geschafft</button>
      <div class="knopf-reihe drei">
        <button class="knopf" data-a="schule-rueck" data-z="versucht">Versucht</button>
        <button class="knopf" data-a="schule-rueck" data-z="anders">Anders gelöst</button>
        <button class="knopf" data-a="schule-rueck" data-z="zuviel">Heute zu viel</button></div>
      <div class="knopf-reihe">
        <button class="knopf leise-knopf" data-a="flow-ansicht" data-z="steck">Ich stecke fest</button>
        <button class="knopf leise-knopf" data-a="flow-ansicht" data-z="hilfe">Ich brauche Unterstützung</button></div></main>`;
  }

  // ---- Kurze Rückschau nach Morgen, Schule, Challenge, "Ich stecke fest".
  // Alles freiwillig, ein Tipp reicht, Überspringen ist immer da.

  function rueckschau(titel, frage, weiterAktion) {
    const f = flow;
    f.hilfreich = f.hilfreich || [];
    return flowKopf(titel) + `<main class="flow">
      <h2>${esc(frage)}</h2><p class="leise">Freiwillig. Ein Tipp reicht.</p>
      <div class="chips">${I.HILFREICH_CHIPS.map(c => `<button class="chip ${f.hilfreich.includes(c) ? "aktiv" : ""}" data-a="hilfreich" data-z="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <textarea class="eingabe" id="rueck-notiz" rows="2" placeholder="Eigene Worte (freiwillig)" maxlength="200">${esc(f.notiz || "")}</textarea>
      <button class="knopf haupt" data-a="${weiterAktion}" data-z="ja">Merken</button>
      <button class="text-knopf" data-a="${weiterAktion}" data-z="nein">Überspringen</button></main>`;
  }

  // ---- "Ich stecke fest" aus dem Bereich Hilfe.

  function flowSteck() {
    const f = flow;
    const sit = I.SITUATIONEN.find(s => s.id === f.situation);
    if (f.ansicht === "rueck") return rueckschau("Ich stecke fest", "Was hat geholfen?", "steck-merken");
    if (f.hindernis == null) {
      return flowKopf("Ich stecke fest", "flow-ende") + `<main class="flow">
        <p class="etikett">${esc(sit.titel)}</p><h2>${esc(sit.satz)}</h2><p>Was macht es gerade schwer?</p>
        ${sit.hindernisse.map((h, i) => `<button class="wahl-karte" data-a="steck-hindernis" data-z="${i}">${esc(h.text)}</button>`).join("")}</main>`;
    }
    const h = sit.hindernisse[f.hindernis];
    if (f.hilfe == null) {
      let html = flowKopf("Ich stecke fest", "flow-zurueck") + `<main class="flow"><p class="etikett">${esc(h.text)}</p><h2>Was könnte jetzt helfen?</h2>`;
      if (h.nichtDraengen) html += `<p class="warnung">Deine Sicherheit geht vor. Du musst da jetzt nicht durch.</p>`;
      html += h.hilfen.map((x, i) => `<button class="wahl-karte" data-a="steck-hilfe" data-z="${i}">${esc(x.text)}</button>`).join("");
      return html + "</main>";
    }
    const x = h.hilfen[f.hilfe];
    let html = flowKopf("Ich stecke fest", "flow-zurueck") + `<main class="flow">`;
    if (x.art === "notfall") return html + `<h2>Hol dir jetzt Hilfe.</h2>${kontaktListe()}<h3>Immer erreichbar</h3>` + I.NOTRUF.map(n => `<a class="kontakt fest" href="${esc(telLink(n.nummer))}">${sym("telefon")}<span><b>${esc(n.name)}: ${esc(n.anzeige || n.nummer)}</b><small>${esc(n.hinweis)}</small></span></a>`).join("") + "</main>";
    html += `<p class="etikett">Dein nächster kleiner Schritt</p><h2 class="schritt-gross">${esc(x.schritt)}</h2>`;
    if (x.art === "skill") html += skillVorschlaege(x.ziel).map(sk => `<button class="wahl-karte" data-a="skill-kurz" data-z="${esc(sk.id)}"><b>${esc(sk.name)}</b><small>${esc((sk.schritte || [])[0] || "")}</small></button>`).join("");
    if (x.art === "kontakt") html += kontaktListe();
    if (x.art === "morgen") html += `<button class="knopf" data-a="morgen-start" data-z="mini">Mini-Start öffnen</button>`;
    if (x.art === "schule") html += `<button class="knopf" data-a="geh" data-z="missionen/schule">Schul-Treppe und Plan B öffnen</button>`;
    if (x.art === "neustart") html += `<button class="knopf" data-a="neustart-start">Neustart öffnen</button>`;
    html += `<p class="leise">Leg das Handy weg und mach diesen Schritt. Komm gern danach zurück.</p>
      <button class="knopf haupt" data-a="steck-gemacht">Hab ich gemacht</button>
      <button class="text-knopf" data-a="flow-ende">Später</button></main>`;
    return html;
  }

  // ---- Skill testen: Situation, vorher, Skill machen, nachher, Wirkung.

  const WIRKUNG = [
    { id: "ruhiger", frage: "Wurdest du ruhiger?" },
    { id: "aushalten", frage: "Konntest du das Gefühl besser aushalten?" },
    { id: "weitermachen", frage: "Konntest du danach weitermachen?" },
    { id: "angenehm", frage: "War der Skill angenehm?" },
    { id: "wieder", frage: "Würdest du ihn wieder nutzen?" }
  ];
  const TEST_SITUATIONEN = ["Schule", "Streit", "Überforderung", "Grübeln", "Abends", "Auf Station", "Zu Hause", "In Ruhe ausprobiert"];
  const TEST_ERGEBNISSE = ["Hat nicht geholfen", "Anspannung wurde höher", "Ich brauchte Unterstützung"];

  function regler(name, wert, frage) {
    return `<label class="regler"><span>${esc(frage)}</span>
      <input type="range" min="0" max="100" step="5" value="${wert == null ? 50 : wert}" data-f="regler" data-z="${name}">
      <span class="regler-wert"><b id="rw-${name}">${wert == null ? 50 : wert}</b> von 100</span>
      <span class="regler-skala"><span>ganz ruhig</span><span>sehr angespannt</span></span></label>`;
  }

  function flowTest() {
    const f = flow;
    const s = skill(f.skillId);
    if (!s) { flow = null; return seiteKoffer(); }
    const t = "Skill testen";
    if (f.schritt === 0) {
      return flowKopf(t) + `<main class="flow"><p class="etikett">${esc(s.name)}</p><h2>Wo bist du gerade?</h2>
        <div class="chips">${TEST_SITUATIONEN.map(x => `<button class="chip ${f.situation === x ? "aktiv" : ""}" data-a="test-situation" data-z="${esc(x)}">${esc(x)}</button>`).join("")}</div>
        <button class="knopf haupt" data-a="test-weiter">Weiter</button></main>`;
    }
    if (f.schritt === 1) {
      return flowKopf(t) + `<main class="flow"><p class="etikett">${esc(s.name)}</p><h2>Wie angespannt bist du jetzt?</h2>
        ${regler("vorher", f.vorher, "Vorher")}<button class="knopf haupt" data-a="test-weiter">Weiter</button></main>`;
    }
    if (f.schritt === 2) {
      return flowKopf(t) + `<main class="flow"><p class="etikett">Jetzt im echten Leben</p><h2>${esc(s.name)}</h2>
        ${s.absprache ? `<p class="warnung">${esc(I.HINWEIS_ABSPRACHE)}</p>` : ""}
        <ol class="schritte">${(s.schritte || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol>
        ${vorlesenKnopf((s.schritte || []).join(" "))}
        <button class="knopf haupt" data-a="test-weiter">Fertig</button></main>`;
    }
    if (f.schritt === 3) {
      return flowKopf(t) + `<main class="flow"><h2>Und jetzt?</h2>${regler("nachher", f.nachher != null ? f.nachher : f.vorher, "Nachher")}
        <button class="knopf haupt" data-a="test-weiter">Weiter</button></main>`;
    }
    if (f.schritt === 4) {
      f.wirkung = f.wirkung || {};
      return flowKopf(t) + `<main class="flow"><h2>Wie war es?</h2><p class="leise">Jede Antwort hilft dir, deine Skills besser kennenzulernen.</p>
        ${WIRKUNG.map(w => `<div class="frage"><span>${esc(w.frage)}</span><div class="ja-nein">${["ja", "etwas", "nein"].map(o => `<button class="${f.wirkung[w.id] === o ? "aktiv" : ""}" data-a="wirkung" data-z="${w.id}:${o}">${o === "etwas" ? "etwas" : o}</button>`).join("")}</div></div>`).join("")}
        <div class="chips">${TEST_ERGEBNISSE.map(x => `<button class="chip ${(f.ergebnisse || []).includes(x) ? "aktiv" : ""}" data-a="test-ergebnis" data-z="${esc(x)}">${esc(x)}</button>`).join("")}</div>
        <textarea class="eingabe" id="test-notiz" rows="2" placeholder="Was ist dir aufgefallen? (freiwillig)" maxlength="200">${esc(f.notiz || "")}</textarea>
        <button class="knopf haupt" data-a="test-speichern">Speichern</button></main>`;
    }
    return "";
  }

  // ---- Challenge: Vorher-Gedanke, im echten Leben, Rückschau.

  function flowChallenge() {
    const f = flow;
    if (f.ansicht === "start") {
      return flowKopf("Challenge dich!") + `<main class="flow"><p class="etikett">Deine Challenge</p><h2 class="schritt-gross">${esc(f.text)}</h2>
        <p>Was befürchtest du? Was erwartest du?</p>
        <textarea class="eingabe" id="ch-vorher" rows="2" placeholder="Ich glaube, dass … (freiwillig)" maxlength="200"></textarea>
        <button class="knopf haupt" data-a="challenge-los">Los, im echten Leben</button>
        ${f.gruppe != null && f.stufe !== "mini" ? `<button class="text-knopf" data-a="ch3" data-z="${f.gruppe}:${f.stufe === "gross" ? "mittel" : "mini"}">Eine Nummer kleiner: ${esc(I.CHALLENGES3[f.gruppe][f.stufe === "gross" ? "mittel" : "mini"])}</button>` : ""}
        <p class="leise">Wenn es zu groß wirkt, nimm lieber eine kleinere. Das ist kein Rückzieher, sondern klug.</p></main>`;
    }
    if (f.ansicht === "los") {
      return `<main class="flow feier"><h2>Viel Erfolg.</h2><p class="gross">Handy weg, ab ins echte Leben.</p><p class="leise">Wenn du zurückkommst, steht deine Challenge auf der Startseite.</p><button class="knopf haupt" data-a="flow-ende" data-fokus>Okay</button></main>`;
    }
    if (f.ansicht === "wie") {
      return flowKopf("Challenge dich!") + `<main class="flow"><p class="etikett">${esc(f.text)}</p><h2>Wie lief's?</h2>
        ${[["geschafft", "Geschafft"], ["versucht", "Versucht"], ["anders", "Anders gemacht"], ["abgebrochen", "Abgebrochen"], ["nicht", "Doch nicht gemacht"]].map(([id, t]) => `<button class="wahl-karte" data-a="challenge-wie" data-z="${id}">${t}</button>`).join("")}
        <p class="leise">Jede Antwort ist okay. Auch ein Abbruch zeigt dir etwas.</p></main>`;
    }
    if (f.ansicht === "nachher") {
      return flowKopf("Challenge dich!") + `<main class="flow"><h2>Was ist tatsächlich passiert?</h2>
        ${f.vorher ? `<p class="zitat">Vorher dachtest du: „${esc(f.vorher)}“</p>` : ""}
        <textarea class="eingabe" id="ch-nachher" rows="3" placeholder="Tatsächlich war … (freiwillig)" maxlength="300"></textarea>
        <button class="knopf haupt" data-a="challenge-fertig" data-z="ja">Weiter</button></main>`;
    }
    return "";
  }

  // ---- Neustart nach einem Rückschlag. Kein Reset, keine Schuld.

  const NEUSTART_FRAGEN = [
    { id: "was", frage: "Was ist passiert?", chips: ["Ich habe etwas nicht geschafft", "Es ging mir schlechter", "Alte Muster kamen zurück", "Etwas anderes"] },
    { id: "versucht", frage: "Was hast du schon versucht?", chips: ["Einen Skill", "Mit jemandem geredet", "Pause gemacht", "Noch nichts"] },
    { id: "hilft", frage: "Was könnte jetzt helfen?", chips: ["Ein kleinerer Schritt", "Ein Skill", "Mit jemandem reden", "Ausruhen"] },
    { id: "wer", frage: "Wen kannst du ansprechen?", chips: [] },
    { id: "schritt", frage: "Welcher nächste Schritt passt noch?", chips: [] }
  ];

  function flowNeustart() {
    const f = flow;
    const q = NEUSTART_FRAGEN[f.schritt];
    if (!q) {
      return flowKopf("Neustart") + `<main class="flow"><h2>Neu anfangen ist eine Stärke.</h2>
        ${f.antworten.schritt ? `<p class="etikett">Dein nächster Schritt</p><p class="naechster-text">${esc(f.antworten.schritt)}</p>` : ""}
        <p>Dein Baum bleibt, wie er ist. Nichts geht verloren.</p>
        <button class="knopf haupt" data-a="neustart-fertig">Weiter</button></main>`;
    }
    let html = flowKopf("Neustart") + `<main class="flow"><p class="etikett">${f.schritt + 1} von ${NEUSTART_FRAGEN.length}</p><h2>${esc(q.frage)}</h2>`;
    if (q.chips.length) html += `<div class="chips">${q.chips.map(c => `<button class="chip ${f.antworten[q.id] === c ? "aktiv" : ""}" data-a="neustart-chip" data-z="${esc(c)}">${esc(c)}</button>`).join("")}</div>`;
    if (q.id === "wer") html += kontaktListe();
    html += `<textarea class="eingabe" id="ns-text" rows="2" placeholder="Eigene Worte (freiwillig)" maxlength="200">${esc(q.chips.includes(f.antworten[q.id]) ? "" : (f.antworten[q.id] || ""))}</textarea>
      <button class="knopf haupt" data-a="neustart-weiter">Weiter</button><button class="text-knopf" data-a="neustart-weiter" data-z="leer">Überspringen</button></main>`;
    return html;
  }

  // ---- Knospe anbieten: nur nach echten Erfahrungen, immer freiwillig.

  function knospeAnbieten(vorschlag) {
    flow = { art: "knospe", ast: vorschlag.ast, text: vorschlag.text, quelle: vorschlag.quelle };
    render();
  }

  function flowKnospe() {
    const f = flow;
    if (f.fertig) {
      const a = ast(f.ast);
      return `<main class="flow feier">${baumSvg(true)}
        <p class="etikett" style="color:${a.farbe}">${esc(a.name)}</p><h2>Eine neue Knospe.</h2>
        <p>${esc(a.satz)}</p>
        <p class="gross">Fertig für jetzt. Leg das Handy weg.</p>
        <button class="knopf haupt" data-a="flow-ende" data-fokus>Okay</button></main>`;
    }
    return flowKopf(f.eigen ? "Erfahrung eintragen" : "In deinen Baum?") + `<main class="flow">
      <h2>${f.eigen ? "Was hast du erlebt?" : "Soll das als Knospe in deinen Baum?"}</h2>
      <textarea class="eingabe" id="kn-text" rows="2" maxlength="140" placeholder="z. B. Ich habe mich in der Gruppe gemeldet">${esc(f.text || "")}</textarea>
      <p class="leise">Welche Stärke hat sich gezeigt?</p>
      <div class="chips">${I.AESTE.map(a => `<button class="chip farbe ${f.ast === a.id ? "aktiv" : ""}" style="--f:${a.farbe}" data-a="kn-ast" data-z="${a.id}">${esc(a.name)}</button>`).join("")}</div>
      <button class="knopf haupt" data-a="kn-ja">In meinen Baum</button>
      <button class="text-knopf" data-a="flow-ende">${f.eigen ? "Abbrechen" : "Nein danke"}</button></main>`;
  }

  // ---- Stärkenpost lesen, Jugendlicher entscheidet über das Behalten.

  function flowPost() {
    const p = S.post.find(x => !x.gelesen);
    if (!p) { flow = null; return seiteHeute(); }
    const a = ast(p.ast);
    return `<main class="flow feier"><p class="etikett">Stärkenpost</p>
      <blockquote class="post gross">${esc(p.text)}<small>${esc(p.von || "Dein Team")}</small></blockquote>
      <p class="leise">Gehört zum Ast ${esc(a.name)}.</p>
      <button class="knopf haupt" data-a="post-behalten" data-z="ja">In meinem Baum behalten</button>
      <button class="knopf" data-a="post-behalten" data-z="nein">Gelesen, nicht behalten</button></main>`;
  }

  // ---------------------------------------------------------------- Fassung 4.1
  // Life Quest, Zukunftskompass, Selbstwert, erweiterter Rucksack
  // (Konzept, Punkte 7, 10, 11, 12).

  // ---- Life Quest: eine große Aufgabe, immer nur der nächste Schritt.

  function seiteLife(id) {
    if (id) return seiteLifeAufgabe(id);
    let html = kopf("Life Quest", "missionen") + "<main>";
    html += `<p class="einleitung">Große Alltagsaufgaben in kleine Schritte teilen. Dann immer nur den nächsten.</p>`;
    const offen = S.life.aufgaben.filter(a => !a.fertig);
    html += offen.length ? offen.map(a => zeile(a.titel, a.schritte.filter(x => x.erledigt).length + " von " + a.schritte.length + " Schritten", "geh", "missionen/life/" + a.id, "liste")).join("")
      : leer("Noch keine Aufgabe. Such dir unten eine aus oder leg eine eigene an.");
    html += `<h3>Neue Aufgabe</h3><div class="chips">${I.LIFE_VORLAGEN.map((v, i) => `<button class="chip" data-a="life-vorlage" data-z="${i}">${esc(v.titel)}</button>`).join("")}</div>`;
