  // ---------------------------------------------------------------- Fassung 4.2
  // Vorlesen, Sprachnachricht, Abendroutine, Skills und Impulse vom Team,
  // gezielt zeigen.

  // ---- Vorlesen über die Sprachausgabe des Handys. Läuft auf dem Gerät,
  // es geht nichts ins Netz.
  const KANN_VORLESEN = typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined";
  function vorlesenKnopf(text) {
    if (!KANN_VORLESEN || !text) return "";
    return `<button class="text-knopf vorlesen" data-a="vorlesen" data-z="${esc(text)}">Vorlesen</button>`;
  }
  function vorlesen(text) {
    if (!KANN_VORLESEN) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE"; u.rate = 0.92;
    const de = speechSynthesis.getVoices().find(v => /^de/i.test(v.lang));
    if (de) u.voice = de;
    speechSynthesis.speak(u);
  }

  // ---- Sprachnachrichten liegen in IndexedDB, weil localStorage für Ton
  // zu klein ist. Im Zustand steht nur, welche es gibt.
  const KANN_AUFNEHMEN = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder && window.indexedDB);
  function tonDb() {
    return new Promise((ok, fehler) => {
      const r = indexedDB.open("next-ton", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("ton");
      r.onsuccess = () => ok(r.result);
      r.onerror = () => fehler(r.error);
    });
  }
  async function tonSchreiben(id, blob) {
    const db = await tonDb();
    await new Promise((ok, fehler) => { const t = db.transaction("ton", "readwrite"); t.objectStore("ton").put(blob, id); t.oncomplete = ok; t.onerror = () => fehler(t.error); });
  }
  async function tonLesen(id) {
    const db = await tonDb();
    return new Promise((ok, fehler) => { const r = db.transaction("ton").objectStore("ton").get(id); r.onsuccess = () => ok(r.result || null); r.onerror = () => fehler(r.error); });
  }
  async function tonLoeschen(id) {
    const db = await tonDb();
    await new Promise(ok => { const t = db.transaction("ton", "readwrite"); t.objectStore("ton").delete(id); t.oncomplete = ok; t.onerror = ok; });
  }
  function blobZuText(blob) { return new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(blob); }); }
  async function textZuBlob(daten) { const a = await fetch(daten); return a.blob(); }

  // Nach jedem Zeichnen die Abspieler mit ihrem Ton füllen.
  function toeneEinhaengen() {
    app().querySelectorAll("audio[data-ton]").forEach(async el => {
      try { const b = await tonLesen(el.dataset.ton); if (b) el.src = URL.createObjectURL(b); else el.replaceWith(Object.assign(document.createElement("p"), { className: "leise", textContent: "Diese Aufnahme liegt nicht auf diesem Gerät." })); }
      catch (e) { /* ohne Ton weiter */ }
    });
  }

  let aufnahme = null; // { recorder, teile, start, timer }
  function sprachHtml(bearbeiten) {
    const liste = S.selbst.sprach;
    let html = liste.map(t => `<div class="ton-zeile"><div><b>${esc(t.titel || "Sprachnachricht")}</b><small>${esc(datumKurz(t.datum))}${t.sekunden ? " · " + t.sekunden + " Sek." : ""}</small></div>
      <audio controls preload="none" data-ton="${esc(t.id)}"></audio>${bearbeiten ? `<button class="mini-knopf" data-a="ton-weg" data-z="${esc(t.id)}" aria-label="Löschen">✕</button>` : ""}</div>`).join("");
    if (!bearbeiten) return html;
    if (!KANN_AUFNEHMEN) return html + `<p class="leise">Aufnehmen geht in diesem Browser leider nicht.</p>`;
    html += aufnahme
      ? `<button class="knopf notfall" data-a="ton-stopp">Aufnahme beenden</button><p class="leise">Höchstens 2 Minuten.</p>`
      : `<button class="knopf" data-a="ton-start">Sprachnachricht aufnehmen</button><p class="leise">Die Aufnahme bleibt nur auf diesem Handy.</p>`;
    return html;
  }

  // ---- Abendroutine: kurze Liste, kein Ablauf mit Bildschirmen.
  function abendHeute() {
    let t = S.abend.tage.find(x => istHeute(x.datum));
    return t || null;
  }
  function seiteAbend() {
    const t = abendHeute() || { erledigt: [], gut: "" };
    let html = kopf("Abendroutine", "missionen") + "<main>";
    html += `<p class="einleitung">Kurz den Tag abschließen und den Morgen leichter machen. Tipp an, was du gemacht hast.</p>`;
    html += S.abend.schritte.map(s => `<button class="abend-schritt ${t.erledigt.includes(s.id) ? "fertig" : ""}" data-a="abend-tipp" data-z="${esc(s.id)}"><span class="haken"></span>${esc(s.text)}</button>`).join("");
    html += `<label class="feld">Eine schöne Sache heute (freiwillig)<input class="eingabe" id="abend-gut" maxlength="120" value="${esc(t.gut || "")}" placeholder="Auch an schweren Tagen gibt es eine kleine"></label>`;
    html += `<button class="knopf haupt" data-a="abend-fertig">Gute Nacht</button>`;
    return html + "</main>";
  }

  // ---- Gezielt zeigen: der Jugendliche wählt, was eine Fachkraft sehen darf.
  function teilbareEintraege() {
    const l = [];
    S.baum.knospen.slice().reverse().forEach(k => l.push({ id: "k:" + k.id, gruppe: "Knospen", text: k.text, unter: ast(k.ast).name + ", " + datumKurz(k.datum) }));
    S.skills.versuche.slice().reverse().forEach(v => { const s = skill(v.skillId); l.push({ id: "v:" + v.id, gruppe: "Skill-Tests", text: (s ? s.name : "Skill") + (v.vorher != null ? `: Anspannung ${v.vorher} → ${v.nachher}` : ""), unter: [v.situation, datumKurz(v.datum), v.notiz].filter(Boolean).join(", ") }); });
    S.challenges.erledigt.slice().reverse().forEach((c, i) => l.push({ id: "c:" + i + c.datum, gruppe: "Challenges", text: c.text, unter: [c.vorher && "Vorher: " + c.vorher, c.nachher && "Tatsächlich: " + c.nachher].filter(Boolean).join(" · ") }));
    S.selbst.gedanken.slice().reverse().forEach(g => l.push({ id: "g:" + g.id, gruppe: "Stimmt das wirklich?", text: g.gedanke, unter: g.neu ? "Anders gesagt: " + g.neu : "" }));
    S.hilfe.erkenntnisse.slice().reverse().forEach(e => l.push({ id: "e:" + e.id, gruppe: "Was mir geholfen hat", text: e.text, unter: datumKurz(e.datum) }));
    S.zukunft.ziele.forEach(z => l.push({ id: "z:" + z.id, gruppe: "Ziele", text: z.titel, unter: z.ersterSchritt ? "Nächster Schritt: " + z.ersterSchritt : "" }));
    if (S.hilfe.warnzeichen.length) l.push({ id: "w:alle", gruppe: "Mein Plan", text: "Meine Warnzeichen", unter: S.hilfe.warnzeichen.join(", ") });
    return l;
  }
  let teilenAuswahl = [];
  function seiteTeilen() {
    const l = teilbareEintraege();
    let html = kopf("Etwas zeigen", "hilfe/rucksack") + "<main>";
    html += `<p class="einleitung">Du entscheidest, was jemand sehen darf. Nur das, was du hier antippst, wird angezeigt.</p>`;
    if (!l.length) return html + leer("Noch nichts da, was du zeigen könntest.") + "</main>";
    let gruppe = "";
    for (const e of l) {
      if (e.gruppe !== gruppe) { gruppe = e.gruppe; html += `<h3>${esc(gruppe)}</h3>`; }
      html += `<label class="teilen-zeile"><input type="checkbox" data-f="teilen" data-z="${esc(e.id)}" ${teilenAuswahl.includes(e.id) ? "checked" : ""}><span><b>${esc(e.text)}</b>${e.unter ? `<small>${esc(e.unter)}</small>` : ""}</span></label>`;
    }
    html += `<div class="unten-fest"><button class="knopf haupt" data-a="teilen-zeigen">Auswahl anzeigen</button></div>`;
    return html + "</main>";
  }
  function flowZeigen() {
    const l = teilbareEintraege().filter(e => teilenAuswahl.includes(e.id));
    const kannTeilen = typeof navigator.share === "function";
    return flowKopf("Das möchte ich zeigen", "flow-ende") + `<main class="flow zeigen">
      ${l.map(e => `<div class="zeigen-eintrag"><p class="etikett">${esc(e.gruppe)}</p><p class="gross">${esc(e.text)}</p>${e.unter ? `<p>${esc(e.unter)}</p>` : ""}</div>`).join("") || leer("Nichts ausgewählt.")}
      ${kannTeilen && l.length ? `<button class="knopf" data-a="teilen-senden">Als Text teilen</button>` : ""}
      <button class="knopf haupt" data-a="flow-ende">Fertig</button></main>`;
  }

  // ---- Fachkräfte: Skills fürs Team, Gruppenimpulse, Gruppenaufgabe.
  function fachSkills() {
    let html = kopf("Skills vom Team", "fach") + "<main>";
    html += `<p class="einleitung">Geprüfte Skills, die ihr in der Gruppe verwendet. Sie erscheinen bei „Entdecken“ mit dem Vermerk „vom Team“.</p>`;
    html += S.skills.team.map(s => `<div class="bearbeiten-zeile"><span><b>${esc(s.name)}</b><small>${esc(s.wann || "")}</small></span><button class="mini-knopf" data-a="team-skill-weg" data-z="${esc(s.id)}" aria-label="Löschen">✕</button></div>`).join("") || leer("Noch keine eigenen Team-Skills.");
    html += `<h3>Neuer Skill</h3>
      <label class="feld">Name<input class="eingabe" id="ts-name" maxlength="40"></label>
      <label class="feld">Wann hilft er?<input class="eingabe" id="ts-wann" maxlength="100"></label>
      <label class="feld">Dauer und Material<input class="eingabe" id="ts-dauer" maxlength="40" placeholder="z. B. 3 Minuten"><input class="eingabe" id="ts-material" maxlength="60" placeholder="z. B. Nichts"></label>
      <p class="feld-titel">Wobei hilft er?</p><div class="chips">${I.ZIELE.map(z => `<label class="chip"><input type="checkbox" class="ts-ziel" value="${z.id}"> ${esc(z.name)}</label>`).join("")}</div>
      <label class="feld">Schritte (einer pro Zeile)<textarea class="eingabe" id="ts-schritte" rows="4"></textarea></label>
      <label class="schalter"><input type="checkbox" id="ts-absprache"> Starker Reiz, nur nach Absprache</label>
      <button class="knopf haupt" data-a="team-skill-dazu">Speichern</button>`;
    return html + "</main>";
  }
  function fachImpulse() {
    let html = kopf("Impulse für die Gruppe", "fach") + "<main>";
    html += `<p class="einleitung">Acht Vorschläge für Gruppeneinheiten, jeweils mit Bezug zur App. Entwurf ohne fachliche Prüfung.</p>`;
    html += I.GRUPPEN_IMPULSE.map((g, i) => karte(`<p class="etikett">${esc(g.gruppe)} · ${esc(g.dauer)}</p><h2>${esc(g.titel)}</h2><p>${esc(g.ziel)}</p>
      <ol class="schritte">${g.ablauf.map(x => `<li>${esc(x)}</li>`).join("")}</ol>
      <p class="leise">Aufgabe danach: ${esc(g.aufgabe)}</p>
      <button class="knopf" data-a="impuls-aufgabe" data-z="${i}">Als Gruppenaufgabe auf „Heute“ zeigen</button>`)).join("");
    return html + "</main>";
  }
  function fachAufgabe() {
    const g = S.skills.gruppenAufgabe;
    let html = kopf("Gruppenaufgabe", "fach") + "<main>";
    html += `<p class="einleitung">Erscheint auf der Startseite, bis der Jugendliche sie erledigt oder ihr sie entfernt.</p>`;
    html += `<label class="feld">Aufgabe<textarea class="eingabe" id="ga-text" rows="3" maxlength="200">${esc(g ? g.text : "")}</textarea></label>
      <label class="feld">Passender Skill (freiwillig)<select class="eingabe" id="ga-skill"><option value="">Keiner</option>${alleSkills().map(s => `<option value="${esc(s.id)}" ${g && g.skillId === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></label>
      <button class="knopf haupt" data-a="ga-speichern">Auf Heute zeigen</button>
      ${g ? `<button class="knopf leise-knopf" data-a="ga-weg">Aufgabe entfernen</button>` : ""}`;
    return html + "</main>";
  }

  // ---------------------------------------------------------------- Aktionen

  function wert(id) { const el = document.getElementById(id); return el ? el.value.trim() : ""; }

  function morgenSchrittFertig(status) {
    const lauf = S.morgen.lauf;
    const s = laufSchritte(lauf)[lauf.index];
    if (s) lauf.ergebnisse[s.id] = status;
    lauf.index += 1;
    flow.ansicht = "";
    speichern();
    render();
  }

  function laufAbschliessen() {
    const lauf = S.morgen.lauf;
    if (!lauf) return;
    const werte = Object.values(lauf.ergebnisse);
    S.morgen.laeufe.push({ datum: lauf.datum, modus: lauf.modus, schritte: werte.filter(v => v !== "zuviel" && v !== "hilfe").length, ergebnisse: lauf.ergebnisse });
    S.morgen.laeufe = S.morgen.laeufe.slice(-60);
    S.morgen.lauf = null;
  }

  function erkenntnisMerken(quelle) {
    const notiz = wert("rueck-notiz");
    const chips = (flow.hilfreich || []).filter(c => c !== "Weiß ich nicht");
    const text = [chips.join(", "), notiz].filter(Boolean).join(": ");
    if (text) S.hilfe.erkenntnisse.push({ id: neueId(), datum: new Date().toISOString(), quelle, text });
    return text;
  }

  const AKTIONEN = {
    "geh": z => geh(z || "heute"),
    "einr-weiter": () => { einrichtungSchritt += 1; render(); },
    "einr-fertig": () => { S.profil.eingerichtet = true; speichern(); geh("heute"); },
    "look": z => { S.profil.look = z; speichern(); render(); },

    // Morgen
    "morgen-start": z => {
      S.morgen.lauf = { datum: new Date().toISOString(), modus: z === "mini" ? "mini" : "morgen", index: 0, ergebnisse: {} };
      speichern(); starteFlow({ art: "morgen", ansicht: "" });
    },
    "morgen-weiter": () => starteFlow({ art: "morgen", ansicht: "" }),
    "morgen-mini": () => { flow.ansicht = "mini"; render(); },
    "morgen-rueck": z => {
      // Bei "Gerade zu viel" erst den kleineren Schritt anbieten, aber nur
      // einmal. Wer danach noch "zu viel" sagt, geht ohne Umweg weiter.
      const s = laufSchritte(S.morgen.lauf)[S.morgen.lauf.index];
      if (z === "zuviel" && s && s.mini && flow.ansicht !== "mini" && flow.ansicht !== "grund") { flow.ansicht = "mini"; render(); return; }
      morgenSchrittFertig(z);
    },
    "morgen-pause": () => { speichern(); flow = null; geh("heute"); },
    "morgen-abschluss": () => {
      const werte = Object.values(S.morgen.lauf.ergebnisse);
      laufAbschliessen(); speichern();
      flow = { art: "morgen", ansicht: "rueck", hilfreich: [], werte };
      render();
    },
    "morgen-merken": z => {
      const text = z === "ja" ? erkenntnisMerken("morgen") : "";
      speichern();
      const werte = flow.werte || [];
      const astId = werte.includes("hilfe") ? "hilfe" : werte.includes("zuviel") ? "grenzen" : "selbst";
      const etappe = aktuelleEtappe();
      knospeAnbieten({ ast: astId, text: text ? "Morgen geschafft. Geholfen hat: " + text : "Ich habe meinen Morgen selbst angefangen.", quelle: "morgen" });
      if (etappe) flow.danach = "schule";
    },

    // Schule
    "schule-start": z => starteFlow({ art: "schule", etappeId: z, ansicht: "" }),
    "schule-rueck": z => {
      S.schule.versuche.push({ id: neueId(), datum: new Date().toISOString(), etappeId: flow.etappeId, status: z });
      speichern();
      flow.status = z;
      flow.ansicht = z === "geschafft" ? "abhaken" : "rueck";
      flow.hilfreich = [];
      render();
    },
    "schule-abhaken": z => {
      if (z === "ja") { const e = S.schule.etappen.find(x => x.id === flow.etappeId); if (e) { e.erledigt = true; e.datum = new Date().toISOString(); } speichern(); }
      flow.ansicht = "rueck"; render();
    },
    "schule-merken": z => {
      const text = z === "ja" ? erkenntnisMerken("schule") : "";
      const e = S.schule.etappen.find(x => x.id === flow.etappeId);
      const st = flow.status;
      speichern();
      knospeAnbieten({ ast: st === "hilfe" ? "hilfe" : st === "zuviel" ? "grenzen" : "mut", text: (e ? e.text : "Schul-Etappe") + (st === "geschafft" ? ": geschafft" : st === "zuviel" ? ": gemerkt, dass es heute zu viel war" : ": versucht") + (text ? ". Geholfen hat: " + text : ""), quelle: "schule" });
    },

    // Gemeinsam für Morgen und Schule
    "flow-ansicht": z => { flow.ansicht = z; render(); },
    "flow-schritt": () => { flow.ansicht = ""; render(); },
    "flow-zurueck": () => {
      if (flow.art === "steck") {
        if (flow.hilfe != null) flow.hilfe = null; else if (flow.hindernis != null) flow.hindernis = null; else { flow = null; geh("hilfe"); return; }
      } else flow.ansicht = flow.ansicht === "grund" ? "steck" : "";
      render();
    },
    "flow-ende": () => {
      const danach = flow && flow.danach;
      const ziel = flow && flow.danachZiel;
      flow = null;
      if (danach === "schule") geh("missionen/schule"); else if (ziel) geh("missionen/zukunft/ziel/" + ziel); else geh("heute");
    },
    "steck-grund": z => { flow.ansicht = "grund"; flow.grund = z; render(); },
    "skill-kurz": z => {
      const sk = skill(z);
      if (!sk) return;
      zeigeDialog(`<h2>${esc(sk.name)}</h2>${sk.absprache ? `<p class="warnung">${esc(I.HINWEIS_ABSPRACHE)}</p>` : ""}<ol class="schritte">${(sk.schritte || []).map(x => `<li>${esc(x)}</li>`).join("")}</ol>`);
    },

    // Ich stecke fest
    "steck-start": z => starteFlow({ art: "steck", situation: z, hindernis: null, hilfe: null }),
    "steck-hindernis": z => { flow.hindernis = Number(z); render(); },
    "steck-hilfe": z => { flow.hilfe = Number(z); render(); },
    "steck-gemacht": () => { flow.ansicht = "rueck"; flow.hilfreich = []; render(); },
    "steck-merken": z => {
      const text = z === "ja" ? erkenntnisMerken("steck") : "";
      speichern();
      const sit = I.SITUATIONEN.find(s => s.id === flow.situation);
      const x = sit.hindernisse[flow.hindernis].hilfen[flow.hilfe];
      knospeAnbieten({ ast: x.art === "kontakt" ? "hilfe" : x.art === "neustart" ? "neustart" : x.art === "skill" ? "fuersorge" : "selbst", text: "Feststeckt bei „" + sit.titel + "“ und trotzdem einen Schritt gemacht" + (text ? ". Geholfen hat: " + text : "."), quelle: "steck" });
    },
    "hilfreich": z => {
      flow.hilfreich = flow.hilfreich || [];
      const i = flow.hilfreich.indexOf(z);
      if (i >= 0) flow.hilfreich.splice(i, 1); else flow.hilfreich.push(z);
      const n = wert("rueck-notiz"); flow.notiz = n;
      document.querySelectorAll('[data-a="hilfreich"]').forEach(b => b.classList.toggle("aktiv", flow.hilfreich.includes(b.dataset.z)));
    },

    // Neustart
    "neustart-start": () => starteFlow({ art: "neustart", schritt: 0, antworten: {} }),
    "neustart-chip": z => { const q = NEUSTART_FRAGEN[flow.schritt]; flow.antworten[q.id] = z; render(); },
    "neustart-weiter": z => {
      const q = NEUSTART_FRAGEN[flow.schritt];
      const t = z === "leer" ? "" : wert("ns-text");
      if (t) flow.antworten[q.id] = t;
      flow.schritt += 1; render();
    },
    "neustart-fertig": () => {
      S.hilfe.neustarts.push({ id: neueId(), datum: new Date().toISOString(), antworten: flow.antworten });
      speichern();
      knospeAnbieten({ ast: "neustart", text: flow.antworten.schritt ? "Neu angefangen mit: " + flow.antworten.schritt : "Nach einem Rückschlag neu angefangen.", quelle: "neustart" });
    },

    // Skills
    "ziel": z => { filterZiel = z; render(); },
    "koffer": z => {
      const i = S.skills.favoriten.indexOf(z);
      if (i >= 0) { S.skills.favoriten.splice(i, 1); S.skills.sos = S.skills.sos.filter(x => x !== z); } else S.skills.favoriten.push(z);
      speichern(); render();
    },
    "sos": z => {
      const i = S.skills.sos.indexOf(z);
      if (i >= 0) S.skills.sos.splice(i, 1);
      else {
        if (S.skills.sos.length >= 3) { zeigeDialog(`<h2>Schon drei</h2><p>Für starke Anspannung reichen drei Skills. Nimm erst einen anderen heraus.</p>`); return; }
        S.skills.sos.push(z);
        if (!S.skills.favoriten.includes(z)) S.skills.favoriten.push(z);
      }
      speichern(); render();
    },
    "skill-anlegen": () => {
      const name = wert("es-name");
      if (!name) { document.getElementById("es-name").focus(); return; }
      const id = "eigen-" + neueId();
      S.skills.eigene.push({ id, name, wann: wert("es-wann"), dauer: "", material: "", schritte: wert("es-schritte").split("\n").map(x => x.trim()).filter(Boolean), ziele: [], eigen: true });
      S.skills.favoriten.push(id);
      speichern(); geh("skills/s/" + id);
    },
    "skill-loeschen": z => {
      zeigeDialog(`<h2>Skill löschen?</h2><p>Deine Testergebnisse dazu bleiben erhalten.</p>`, "Löschen", () => {
        S.skills.eigene = S.skills.eigene.filter(s => s.id !== z);
        S.skills.favoriten = S.skills.favoriten.filter(x => x !== z);
        S.skills.sos = S.skills.sos.filter(x => x !== z);
        speichern(); geh("skills");
      });
    },
    "test-start": z => starteFlow({ art: "test", skillId: z, schritt: 0, situation: "", vorher: null, nachher: null, wirkung: {}, ergebnisse: [] }),
    "test-situation": z => { flow.situation = flow.situation === z ? "" : z; render(); },
    "test-weiter": () => {
      if (flow.schritt === 1 && flow.vorher == null) flow.vorher = 50;
      if (flow.schritt === 3 && flow.nachher == null) flow.nachher = flow.vorher;
      flow.schritt += 1; render();
    },
    "wirkung": z => {
      const [k, v] = z.split(":");
      flow.wirkung[k] = flow.wirkung[k] === v ? undefined : v;
      flow.notiz = wert("test-notiz"); render();
    },
    "test-ergebnis": z => {
      flow.ergebnisse = flow.ergebnisse || [];
      const i = flow.ergebnisse.indexOf(z);
      if (i >= 0) flow.ergebnisse.splice(i, 1); else flow.ergebnisse.push(z);
      flow.notiz = wert("test-notiz"); render();
    },
    "test-speichern": () => {
      const s = skill(flow.skillId);
      if (S.skills.gruppenAufgabe && S.skills.gruppenAufgabe.skillId === flow.skillId) S.skills.gruppenAufgabe = null;
      S.skills.versuche.push({ id: neueId(), skillId: flow.skillId, datum: new Date().toISOString(), situation: flow.situation, vorher: flow.vorher, nachher: flow.nachher, wirkung: flow.wirkung, ergebnisse: flow.ergebnisse, notiz: wert("test-notiz") });
      speichern();
      const half = flow.wirkung.wieder === "ja" || (flow.vorher != null && flow.nachher != null && flow.nachher < flow.vorher);
      knospeAnbieten({ ast: half ? "fuersorge" : "neugier", text: (half ? "Skill ausprobiert, der mir geholfen hat: " : "Skill ausprobiert und etwas über mich gelernt: ") + (s ? s.name : ""), quelle: "skill" });
    },

    // Challenges
    "challenge-waehlen": z => { const c = B.challenges[Number(z)]; if (c) starteFlow({ art: "challenge", ansicht: "start", text: c.text, welt: c.welt, stufe: c.stufe }); },
    "challenge-los": () => {
      S.challenges.laufend = { text: flow.text, welt: flow.welt, stufe: flow.stufe, vorher: wert("ch-vorher"), datum: new Date().toISOString() };
      speichern();
      flow.ansicht = "los"; render();
    },
    "challenge-auswerten": () => { const c = S.challenges.laufend; if (c) starteFlow({ art: "challenge", ansicht: "wie", ...c }); },
    "challenge-abbrechen": () => { S.challenges.laufend = null; speichern(); render(); },
    "challenge-wie": z => { flow.ergebnis = z; flow.ansicht = "nachher"; render(); },
    "challenge-fertig": () => {
      const nachher = wert("ch-nachher");
      S.challenges.erledigt.push({ text: flow.text, welt: flow.welt, stufe: flow.stufe, vorher: flow.vorher || "", nachher, ergebnis: flow.ergebnis, datum: new Date().toISOString() });
      S.challenges.laufend = null;
      speichern();
      if (flow.ergebnis === "nicht") { flow = null; zeigeDialog(`<h2>Okay.</h2><p>Vielleicht passt eine kleinere Challenge besser. Du entscheidest das Tempo.</p>`); geh("missionen/challenge"); return; }
      const astId = flow.ergebnis === "abgebrochen" ? "grenzen" : (I.WELT_AST[flow.welt] || "mut");

    d.addEventListener("click", e => {
      const b = e.target.closest("[data-d]");
      if (!b && e.target !== d) return;
      d.remove();
      if (b && b.dataset.d === "ja" && onOk) onOk();
    });
    document.body.appendChild(d);
    const k = d.querySelector('[data-d="ja"]') || d.querySelector("[data-d]");
    if (k) k.focus();

    else if (f === "suche") { suche = el.value; const l = document.getElementById("skill-liste"); if (l) l.innerHTML = skillListeHtml(); }
    else if (f === "stufe") { S.hilfe.stufen[el.dataset.z] = el.value; speichern(); }
    else if (f === "planb") { S.schule.planB[el.dataset.z] = el.value; speichern(); }
    else if (f === "brief") { S.selbst.brief.text = el.value; S.selbst.brief.datum = new Date().toISOString(); speichern(); }
    else if (f === "regler") { const v = Number(el.value); flow[el.dataset.z] = v; const r = document.getElementById("rw-" + el.dataset.z); if (r) r.textContent = v; }
  });

  document.addEventListener("change", e => {
    const el = e.target;
    const f = el.dataset && el.dataset.f;
    if (f === "mutmacher") { S.profil.mutmacherAn = el.checked; speichern(); }
    if (f === "teilen") { const z = el.dataset.z; teilenAuswahl = teilenAuswahl.filter(x => x !== z); if (el.checked) teilenAuswahl.push(z); }
    if (f === "ziel-vor") { const [id, i] = el.dataset.z.split(":"); const ziel = S.zukunft.ziele.find(x => x.id === id); if (ziel && ziel.voraussetzungen[Number(i)]) { ziel.voraussetzungen[Number(i)].ok = el.checked; speichern(); } }
    if (f === "laden" && el.files && el.files[0]) {
      const r = new FileReader();
      r.onload = () => {
        try {
          const roh = JSON.parse(r.result);
          const daten = roh && roh.app === "NEXT" ? roh.daten : roh;
          if (!daten || typeof daten !== "object" || !daten.profil) throw new Error("kein Rucksack");
          const toene = roh && roh.toene && typeof roh.toene === "object" ? roh.toene : {};
          zeigeDialog(`<h2>Rucksack laden?</h2><p>Was auf diesem Gerät steht, wird durch die Datei ersetzt.</p>`, "Laden", async () => {
            S = ergaenzen(daten); S.profil.eingerichtet = true; speichern();
            for (const [id, d] of Object.entries(toene)) { try { await tonSchreiben(id, await textZuBlob(d)); } catch (e) { /* weiter */ } }
            geh("heute");
          });
        } catch (err) {
          zeigeDialog(`<h2>Das hat nicht geklappt</h2><p>Die Datei ist kein NEXT-Rucksack.</p>`);
        }
      };
      r.readAsText(el.files[0]);
      el.value = "";
    }
  });

  // Enter im Einzeiler löst den Knopf daneben aus, statt nichts zu tun.
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
    const el = e.target;
    const passt = el.parentElement.classList.contains("formular") || el.id === "pin" || el.dataset.f === "einr-name";
    const knopf = passt && el.parentElement.querySelector("button[data-a]");
    if (knopf) { e.preventDefault(); knopf.click(); }
  });

    ];

    z.hilfe.stufen = { gut: "Musik, Hund ausführen, Basketball dienstags", warn: "Mama Bescheid sagen, 5-4-3-2-1, raus gehen", schwer: "Termin bei meiner Therapeutin vorziehen", notfall: "Mama anrufen. Wenn sie nicht rangeht: 112." };
    z.post = [{ id: "p1", datum: tage(0), text: "Heute hast du dich in der Gruppe getraut, deine Meinung zu sagen.", ast: "mut", von: "Dein Team von Station 3", gelesen: false, behalten: false }];

  // ---------------------------------------------------------------- Start

  S = laden();

})();
