  function sym(name, extra) {
    return `<svg class="sym ${extra || ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">${SYM[name] || ""}</svg>`;
  }

  // ---------------------------------------------------------------- Vorlesen

  const KANN_VORLESEN = typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined";

  function sprich(text) {
    if (!KANN_VORLESEN || !text) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text));
      u.lang = "de-DE";
      u.rate = S.profil.tempo || 0.9;
      u.pitch = 1;
      const de = speechSynthesis.getVoices().find(v => /^de/i.test(v.lang));
      if (de) u.voice = de;
      speechSynthesis.speak(u);
    } catch (e) {
      // Sprachausgabe nicht verfügbar, still ignorieren.
    }
  }

  function stillsein() {
    if (KANN_VORLESEN) {
      try { speechSynthesis.cancel(); } catch (e) { /* ignorieren */ }
    }
  }

  // ---------------------------------------------------------------- Navigation

  let seitenFolge = [];
  let aktuelleBearbeiten = false;
  let sucheText = "";
  let filterOffen = false;
  let filterKategorien = new Set();
  let filterBereiche = new Set();
  let filterKanaele = new Set();
  let filterOrte = new Set();
  let filterDauer = new Set();
  let filterOhneMaterial = false;
  let filterStandKoffer = false;
  let filterStandNeu = false;
  let wissensVorauswahl = null;
  let zeigeAuswahlHinweis = false;
  let schrittIndex = 0;
  let schrittSkillId = null;
  let testFlow = null;
  let kofferBereichFilter = "";
  let erfahrungsBereichFilter = "alle";
  let erfahrungsSituationFilter = "alle";
  let kontaktForm = { name: "", rolle: "", telefon: "" };
  let uebungZustand = null;
  let spannungWert = null;
  let fachSuche = "";

  function weg() {
    const teile = (location.hash || "#start").slice(1).split("/");
    return {
      bereich: teile[0] || "start",
      seite: teile[1] || "",
      // param ist alles nach dem Bereich: "#skill/54321" -> "54321".
      param: decodeURIComponent(teile.slice(1).join("/"))
    };
  }

  function geh(ziel, merken = true) {
    if (location.hash === "#" + ziel) {
      render();
      return;
    }
    if (merken) seitenFolge.push(location.hash.replace(/^#/, "") || "start");
    location.hash = ziel;
  }

  function aktionZurueck() {
    // Bei Zurück sprechen wir nicht erneut, nur die Seite wechseln.
    if (seitenFolge.length > 0) {
      seitenFolge.pop();
      history.back();
    } else {
      geh("start", false);
    }
  }

  window.addEventListener("hashchange", () => {
    stillsein();
    if (uebungZustand) {
      if (uebungZustand.timer) clearTimeout(uebungZustand.timer);
      if (uebungZustand.fallbackTimer) clearTimeout(uebungZustand.fallbackTimer);
      uebungZustand = null;
    }
    if (location.hash.replace(/^#/, "").split("/")[0] !== "schritte") {
      schrittIndex = 0;
      schrittSkillId = null;
    }
    nachObenScrollen = true;
    render();
  });

  // ---------------------------------------------------------------- Kopf und Bausteine

  function kopf(titel, istStart) {
    const links = istStart
      ? `<span class="kopf-titel">NEXT Skills</span>`
      : `<button class="kopf-knopf" data-a="zurueck" data-t="zurueck" aria-label="Zurück">${sym("zurueck")}</button>`;
    let rechts = `<button class="kopf-hilfe" data-a="geh" data-z="hilfe" data-t="hilfe-knopf" aria-label="Hilfe und Kontakte">${sym("telefon")}Hilfe</button>`;
    if (istStart) {
      rechts = `<button class="kopf-knopf" data-a="geh" data-z="einstellungen" data-t="nav-einstellungen" aria-label="Einstellungen">${sym("zahnrad")}</button>` + rechts;
    }
    return `<header class="kopf">${links}<h1>${esc(titel)}</h1>${rechts}</header>`;
  }

  function karte(inhalt, klasse) {
    return `<section class="karte ${klasse || ""}">${inhalt}</section>`;
  }

  function zeile(titel, unter, aktion, z, symbol) {
    return `<button class="zeile" data-a="${aktion}" data-z="${esc(z || "")}">
      ${symbol ? `<span class="zeile-sym">${sym(symbol)}</span>` : ""}
      <span class="zeile-text"><b>${esc(titel)}</b>${unter ? `<small>${esc(unter)}</small>` : ""}</span>
      ${sym("weiter", "klein")}
    </button>`;
  }

  function leer(text) {
    return `<p class="leer">${esc(text)}</p>`;
  }

  function erfahrungBenennen(e) {
    if (e.uebungId) {
      const u = (I.UEBUNGEN || []).find(x => x.id === e.uebungId);
      return u ? u.titel : "Übung";
    }
    if (e.skillId) {
      const sk = (I.SKILLS || []).find(x => x.id === e.skillId);
      if (sk) return sk.title;
      if (I.ALT_NAMEN && I.ALT_NAMEN[e.skillId]) return I.ALT_NAMEN[e.skillId];
      return "Früherer Skill";
    }
    return "Eintrag";
  }

  function erfahrungsArtText(mode) {
    const map = {
      quick: "Schnell bewertet",
      afterPractice: "Nach dem Ausprobieren",
      retrospective: "Rückblick"
    };
    return map[mode] || mode;
  }

  function hilfreichText(wert) {
    const map = {
      geholfen: "Hat geholfen",
      teilweise: "Teilweise",
      nicht: "Nicht hilfreich",
      ungetestet: "Noch nicht getestet",
      unklar: "Weiß ich nicht mehr"
    };
    return map[wert] || "";
  }

  function erfahrungsEintragHtml(e) {
    const titel = erfahrungBenennen(e);
    const art = erfahrungsArtText(e.entryMode);
    const bewertung = e.helpfulness ? hilfreichText(e.helpfulness) : "";
    const spannung = (e.tensionBefore != null && e.tensionAfter != null)
      ? `Anspannung ${e.tensionBefore} → ${e.tensionAfter}`
      : "";
    const situation = e.situationTag ? `Situation: ${e.situationTag}` : "";
    const notiz = e.note ? e.note : "";
    return `<li data-t="verlauf-eintrag">
      <b>${esc(titel)}</b>
      <small>${esc(datumKurz(e.timestamp))} · ${esc(art)}</small>
      ${bewertung ? `<p>${esc(bewertung)}</p>` : ""}
      ${spannung ? `<p>${esc(spannung)}</p>` : ""}
      ${situation ? `<p>${esc(situation)}</p>` : ""}
      ${notiz ? `<p class="notiz">${esc(notiz)}</p>` : ""}
      <button class="text-knopf" data-a="erfahrung-loeschen" data-z="${e.id}" aria-label="Eintrag löschen">${sym("x", "klein")}</button>
    </li>`;
  }

  // ---------------------------------------------------------------- Render

  function app() { return document.getElementById("app"); }

  // Kopfzeilentitel je Route. Die Kopfzeile mit Zurück und Hilfe steht auf jeder Ansicht.
  function seitenTitel(w) {
    const T = {
      einstieg: "", start: "", alle: "Alle Skills", skill: "Skill", schritte: "Schritt für Schritt",
      test: "Erfahrung festhalten", kette: "Skillskette", "kette-start": "Skillskette", eigen: "Eigener Skill",
      vorlagen: "Vorlagen", waehlen: "Auswählen", spannung: "Spannungsmesser", wissen: "Wissen",
      uebungen: "Übungen", uebung: "Übung", interaktiv: "Selbst erarbeiten", karte: "Meine Karte",
      zeigen: "Groß zeigen", einstellungen: "Einstellungen", fach: "Für Fachkräfte"
    };
    if (w.bereich === "koffer") {
      return ({ aktuelle: "Meine aktuellen", bewaehrt: "Hilft mir oft", testen: "Ausprobieren", ketten: "Skillsketten", eigene: "Meine eigenen", erfahrungen: "Erfahrungen" })[w.seite] || "Mein Koffer";
    }
    if (w.bereich === "hilfe") return ({ kontakte: "Meine Menschen", plan: "Mein Krisenplan" })[w.seite] || "Kontakte & Hilfe";
    if (w.bereich === "arbeitsblatt") {
      const ia = (I.INTERAKTIV || []).find(x => x.id === w.param);
      return ia ? ia.titel : "Arbeitsblatt";
    }
    return Object.prototype.hasOwnProperty.call(T, w.bereich) ? T[w.bereich] : "NEXT Skills";
  }

  // Sprachausgabe und Übungszustand werden nur beim Seitenwechsel beendet
  // (hashchange), nicht bei jedem Neuzeichnen, sonst bricht die Übung ab.
  let nachObenScrollen = true;
  function render() {

    // Look anwenden.
    document.documentElement.removeAttribute("data-look");
    if (S.profil.look === "hell") document.documentElement.dataset.look = "hell";
    else if (S.profil.look === "dunkel") document.documentElement.dataset.look = "dunkel";

    const w = weg();

    let html;
    try {
      html = kopf(seitenTitel(w), w.bereich === "start" || w.bereich === "einstieg");
      if (w.bereich === "einstieg" && S.profil.eingerichtet) {
        geh("start", false);
        return;
      }
      // Der Einstieg erscheint nur auf seiner eigenen Adresse. Andere Seiten,
      // vor allem Hilfe, sind nie hinter dem Einstieg gesperrt (T15).
      if (w.bereich === "einstieg") {
        html += seiteEinrichtung();
      } else {
        html += seite(w);
      }
    } catch (e) {
      console.error(e);
      html = kopf("Hoppla", false) + `<main>${karte(`<p>Da ist etwas schiefgelaufen. Deine Einträge sind sicher gespeichert.</p><button class="knopf" data-a="geh" data-z="start">Zur Startseite</button>`)}</main>`;
    }

    if (speicherKaputt) html += `<div class="hinweis-leiste">Speichern klappt auf diesem Gerät gerade nicht.</div>`;
    app().innerHTML = html;
    // Nur bei neuer Seite nach oben, sonst springt die Ansicht bei jedem Tipp.
    if (nachObenScrollen) window.scrollTo(0, 0);
    nachObenScrollen = false;
  }

  // ---------------------------------------------------------------- Ansichten

  function seiteEinrichtung() {
    const tex = I.TEXTE || {};
    return `<main class="einstieg">
      <h2>${esc(tex.willkommen || "")}</h2>
      <p>${esc(tex.willkommenUnter || "")}</p>
      <div class="knopf-reihe senkrecht">
        <button class="knopf haupt" data-a="einstieg-auswaehlen" data-t="einstieg-auswaehlen">Meine Skills auswählen</button>
        <button class="knopf" data-a="einstieg-umsehen" data-t="einstieg-umsehen">Erstmal umsehen</button>
      </div>
      <p class="klein">${esc(tex.prototypKurz || "")}</p>
    </main>`;
  }

  // Spannungsregler: beim Ziehen nur Zahl und Bereich aktualisieren (flüssig),
  // beim Loslassen die Ansicht für den Bereich neu aufbauen (bei „hoch“ nur
  // Hilfe und eigene Hochstress-Einträge). Fokus bleibt auf dem Regler.
  document.addEventListener("change", e => {
    const el = e.target;
    if (!el || !el.dataset || el.dataset.feld !== "spannung-regler") return;
    spannungWert = zahl(el.value);
    render();
    const neu = document.querySelector('[data-t="spannung-regler"]');
    if (neu) neu.focus({ preventScroll: true });
  });

  // ---------------------------------------------------------------- Start

  function seiteStart() {
    const tex = I.TEXTE || {};
    const anzahl = S.profil.anzahlAktuelle;
    const aktive = S.aktuelle.filter(ref => eintrag(ref));

    let kachelnHtml = "";
    for (let i = 0; i < anzahl; i++) {
      const ref = aktive[i];
      if (ref) {
        const e = eintrag(ref);
        kachelnHtml += `<div class="aktuell-kachel" data-t="aktuell-kachel" data-ref="${esc(ref)}">
          <button class="aktuell-kachel-knopf" data-a="oeffne-verweis" data-z="${esc(ref)}">
            <b>${esc(e.titel)}</b>
            <small>${esc(e.zweck || "")}</small>
          </button>
          ${aktuelleBearbeiten ? `<div class="aktuell-werkzeuge">
            <button data-a="aktuell-hoch" data-z="${i}" aria-label="Nach oben" ${i === 0 ? "disabled" : ""}>${sym("hoch", "klein")}</button>
            <button data-a="aktuell-runter" data-z="${i}" aria-label="Nach unten" ${i >= aktive.length - 1 ? "disabled" : ""}>${sym("runter", "klein")}</button>
            <button data-a="aktuell-weg" data-z="${esc(ref)}" aria-label="Entfernen">${sym("x", "klein")}</button>
          </div>` : ""}
        </div>`;
      } else {
        kachelnHtml += `<button class="aktuell-frei" data-a="geh" data-z="waehlen/aktuell">Platz frei: Skill wählen</button>`;
      }
    }

    let bearbeitenBlock = "";
    if (aktuelleBearbeiten) {
      bearbeitenBlock = `<div class="anzahl-wahl">
        <span>Wie viele?</span>
        ${[3, 4, 5].map(n => `<button class="chip ${S.profil.anzahlAktuelle === n ? "aktiv" : ""}" data-a="anzahl" data-z="${n}" data-t="anzahl-${n}" aria-pressed="${S.profil.anzahlAktuelle === n}">${n}</button>`).join("")}
      </div>`;
    }

    let fachSkill = "";
    if (S.fach.skillDerWoche) {
      const sk = (I.SKILLS || []).find(x => x.id === S.fach.skillDerWoche);
      if (sk) {
        fachSkill = karte(`<h3>Skill der Woche aus deiner Gruppe</h3>
          <button class="text-knopf" data-a="geh" data-z="skill/${sk.id}">${esc(sk.title)}</button>`, "klein");
      }
    }

    const navListe = [
      { z: "alle", titel: "Alle Skills", unter: `${(I.SKILLS || []).length} Ideen, suchen und bewerten`, sym: "liste", t: "nav-alle" },
      { z: "koffer", titel: "Mein Koffer", unter: "", sym: "koffer", t: "nav-koffer" },
      { z: "uebungen", titel: "Achtsamkeit & geführte Übungen", unter: "", sym: "blatt", t: "nav-uebungen" },
      { z: "spannung", titel: "Anspannung verstehen", unter: "", sym: "welle", t: "nav-spannung" },
      { z: "interaktiv", titel: "Selbst erarbeiten", unter: "Held des Alltags und mehr", sym: "stift", t: "nav-interaktiv" },
      { z: "wissen", titel: "Wissen", unter: "", sym: "buch", t: "nav-wissen" },
      { z: "hilfe", titel: "Kontakte & Hilfe", unter: "", sym: "telefon", t: "nav-hilfe", klasse: "hilfe-zeile" }
    ];

    return `<main class="start">
      <section class="abschnitt">
        <div class="abschnitt-kopf">
          <h2>Meine aktuellen Skills</h2>
          <button class="text-knopf" data-a="aktuelle-bearbeiten" data-t="aktuelle-bearbeiten" aria-pressed="${aktuelleBearbeiten}">${aktuelleBearbeiten ? "Fertig" : "Bearbeiten"}</button>
        </div>
        <div class="aktuell-kacheln">${kachelnHtml}</div>
        ${bearbeitenBlock}
      </section>
      ${fachSkill}
      <nav class="nav-liste">
        ${navListe.map(n => `<button class="zeile ${n.klasse || ""}" data-a="geh" data-z="${n.z}" data-t="${n.t}">
          ${sym(n.sym, "zeile-sym")}
          <span class="zeile-text"><b>${esc(n.titel)}</b>${n.unter ? `<small>${esc(n.unter)}</small>` : ""}</span>
          ${sym("weiter", "klein")}
        </button>`).join("")}
      </nav>
      <p class="klein">${esc(tex.startUnter || "")}</p>
    </main>`;
  }

  // ---------------------------------------------------------------- Alle Skills

  function skillsGefiltert() {
    const alle = I.SKILLS || [];
    return alle.filter(sk => {
      if (sucheText) {
        const such = normiereSuche(sucheText);
        const felder = [sk.title, sk.shortPurpose].concat(sk.keywords || [], sk.instructions || []);
        if (!felder.some(f => normiereSuche(f).includes(such))) return false;
      }
      if (wissensVorauswahl && wissensVorauswahl.ids && wissensVorauswahl.ids.length > 0) {
        if (!wissensVorauswahl.ids.includes(sk.id)) return false;
      }
      if (wissensVorauswahl && wissensVorauswahl.kategorien && wissensVorauswahl.kategorien.length > 0) {
        if (!wissensVorauswahl.kategorien.some(k => (sk.categoryIds || []).includes(k))) return false;
      }
      if (wissensVorauswahl && wissensVorauswahl.bereiche && wissensVorauswahl.bereiche.length > 0) {
        if (!wissensVorauswahl.bereiche.some(b => (sk.tensionTags || []).includes(b))) return false;
      }
      if (filterKategorien.size > 0 && ![...filterKategorien].some(k => (sk.categoryIds || []).includes(k))) return false;
      if (filterBereiche.size > 0 && ![...filterBereiche].some(b => (sk.tensionTags || []).includes(b))) return false;
      if (filterKanaele.size > 0 && ![...filterKanaele].some(k => (sk.sensoryChannels || []).includes(k))) return false;
      if (filterOrte.size > 0 && ![...filterOrte].some(o => (sk.places || []).includes(o))) return false;
      if (filterDauer.size > 0) {
        const passt = [...filterDauer].some(d => {
          const dau = (I.DAUER || []).find(x => x.id === d);
          if (!dau) return false;
          const sek = sk.durationSeconds == null ? 0 : Number(sk.durationSeconds);
          return sek >= dau.von && (dau.bis === null || sek <= dau.bis);
        });
        if (!passt) return false;
      }
      if (filterOhneMaterial && (sk.material || []).length > 0) return false;
      if (filterStandKoffer && !istImKoffer(sk.id)) return false;
      if (filterStandNeu && !istUnbewertet(sk.id)) return false;
      return true;
    });
  }

  function skillZeileHtml(sk) {
    const e = S.einstellungen[sk.id] || { koffer: "nicht", fazit: null, bereiche: [], notiz: "", sort: 0 };
    const fazit = e.fazit || "";
    const kofferStatus = e.koffer || "nicht";
    const istAktuell = S.aktuelle.includes(sk.id);
    const dauer = dauerText(sk.durationSeconds);

    const fazitOptionen = [
      { w: "", l: "Erfahrung wählen" },
      { w: "geholfen", l: "Hat geholfen" },
      { w: "teilweise", l: "Teilweise" },
      { w: "nicht", l: "Nicht hilfreich" },
      { w: "ungetestet", l: "Noch nicht getestet" },
      { w: "unklar", l: "Weiß ich nicht mehr" }
    ];

    return `<article class="skill-zeile" data-t="zeile" data-id="${esc(sk.id)}">
      <button class="zeile-kopf" data-a="aufklappen" data-z="${esc(sk.id)}" aria-expanded="false">
        <b>${esc(sk.title)}</b>
        <small>${esc(sk.shortPurpose || "")}</small>
      </button>
      <div class="zeile-mehr" hidden>
        <ol class="schritte">
          ${(sk.instructions || []).map(s => `<li>${esc(s)}</li>`).join("")}
        </ol>
        <p class="klein">Dauer: ${esc(dauer)}</p>
        <button class="text-knopf" data-a="geh" data-z="skill/${sk.id}">Alles zum Skill</button>
      </div>
      <div class="zeile-aktionen">
        <select class="fazit-wahl" data-t="fazit-wahl" aria-label="Erfahrung mit ${esc(sk.title)}">
          ${fazitOptionen.map(o => `<option value="${o.w}" ${fazit === o.w ? "selected" : ""}>${esc(o.l)}</option>`).join("")}
        </select>
        <div class="fazit-knoepfe" role="group" aria-label="Erfahrung mit ${esc(sk.title)}">
          ${fazitOptionen.filter(o => o.w !== "").map(o => `<button class="chip ${fazit === o.w ? "aktiv" : ""}" data-a="fazit" data-z="${esc(sk.id)}:${o.w}" data-t="fazit-${o.w}" aria-pressed="${fazit === o.w}">${esc(o.l)}</button>`).join("")}
        </div>
        <button class="koffer-knopf" data-a="koffer" data-z="${esc(sk.id)}" data-status="${kofferStatus}" aria-label="Koffer: ${kofferStatusText(kofferStatus)}. Tippen ändert.">
          ${sym(kofferStatus === "bewaehrt" ? "koffer-voll" : "koffer", "klein")}${kofferStatusText(kofferStatus)}
        </button>
        ${istAktuell ? `<span class="aktuell-markierung" aria-label="In meinen aktuellen Skills">${sym("stern", "klein")}</span>` : ""}
      </div>
    </article>`;
  }

  function filterFeldHtml() {
    return `<div class="filter-gruppe">
        <b>Fachkategorie</b>
        <div class="chips">${(I.KATEGORIEN || []).map(k => `<button class="chip ${filterKategorien.has(k.id) ? "aktiv" : ""}" data-a="filter-kategorie" data-z="${k.id}" data-t="filter-kategorie-${k.id}" aria-pressed="${filterKategorien.has(k.id)}">${esc(k.name)}</button>`).join("")}</div>
      </div>
      <div class="filter-gruppe">
        <b>Anspannung</b>
        <div class="chips">${(I.BEREICHE || []).map(b => `<button class="chip ${filterBereiche.has(b.id) ? "aktiv" : ""}" data-a="filter-bereich" data-z="${b.id}" data-t="filter-bereich-${b.id}" aria-pressed="${filterBereiche.has(b.id)}">${esc(b.name)}</button>`).join("")}</div>
      </div>
      <div class="filter-gruppe">
        <b>Sinn</b>
        <div class="chips">${(I.KANAELE || []).map(k => `<button class="chip ${filterKanaele.has(k.id) ? "aktiv" : ""}" data-a="filter-kanal" data-z="${k.id}" data-t="filter-kanal-${k.id}" aria-pressed="${filterKanaele.has(k.id)}">${esc(k.name)}</button>`).join("")}</div>
      </div>
      <div class="filter-gruppe">
        <b>Ort</b>
        <div class="chips">${(I.ORTE || []).map(o => `<button class="chip ${filterOrte.has(o.id) ? "aktiv" : ""}" data-a="filter-ort" data-z="${o.id}" data-t="filter-ort-${o.id}" aria-pressed="${filterOrte.has(o.id)}">${esc(o.name)}</button>`).join("")}</div>
      </div>
      <div class="filter-gruppe">
        <b>Dauer</b>
        <div class="chips">${(I.DAUER || []).map(d => `<button class="chip ${filterDauer.has(d.id) ? "aktiv" : ""}" data-a="filter-dauer" data-z="${d.id}" data-t="filter-dauer-${d.id}" aria-pressed="${filterDauer.has(d.id)}">${esc(d.name)}</button>`).join("")}</div>
      </div>
      <div class="filter-gruppe">
        <b>Mein Stand</b>
        <div class="chips">
          <button class="chip ${filterOhneMaterial ? "aktiv" : ""}" data-a="filter-ohne-material" data-t="filter-ohne-material" aria-pressed="${filterOhneMaterial}">Ohne Material</button>
          <button class="chip ${filterStandKoffer ? "aktiv" : ""}" data-a="filter-stand-koffer" data-t="filter-stand-koffer" aria-pressed="${filterStandKoffer}">Im Koffer</button>
          <button class="chip ${filterStandNeu ? "aktiv" : ""}" data-a="filter-stand-neu" data-t="filter-stand-neu" aria-pressed="${filterStandNeu}">Noch nicht bewertet</button>
        </div>
      </div>
      <button class="text-knopf" data-a="filter-zuruecksetzen" data-t="filter-zuruecksetzen">Filter zurücksetzen</button>`;
  }

  function seiteAlle() {
    const gefiltert = skillsGefiltert();
    const aktiveFilter = filterKategorien.size + filterBereiche.size + filterKanaele.size + filterOrte.size + filterDauer.size + (filterOhneMaterial ? 1 : 0) + (filterStandKoffer ? 1 : 0) + (filterStandNeu ? 1 : 0);

    let vorauswahlChip = "";
    if (zeigeAuswahlHinweis) {
      vorauswahlChip = `<section class="karte hinweis" data-t="auswahl-hinweis">${esc((I.TEXTE || {}).auswahlHinweis || "")}</section>`;
    }
    if (wissensVorauswahl) {
      vorauswahlChip += `<div class="chip vorauswahl">Auswahl: ${esc(wissensVorauswahl.titel)}
        <button data-a="filter-wissensweg" aria-label="Auswahl entfernen">${sym("x", "klein")}</button>
      </div>`;
    }

    return `<main class="alle">
      ${vorauswahlChip}
      <div class="suche-zeile">
        <input type="search" data-feld="suche" data-t="suche" aria-label="Skills durchsuchen" placeholder="Suchen, z. B. 5-4-3-2-1" value="${esc(sucheText)}">
        <button class="knopf text-knopf" data-a="filter-knopf" data-t="filter-knopf" aria-expanded="${filterOffen}">${sym("filter", "klein")} Filter${aktiveFilter > 0 ? ` (${aktiveFilter})` : ""}</button>
      </div>
      <div class="filter-feld" ${filterOffen ? "" : "hidden"}>${filterFeldHtml()}</div>
      <p class="treffer" data-t="treffer">${gefiltert.length} Skills</p>
      <div id="treffer-liste" data-t="treffer-liste">${gefiltert.map(sk => skillZeileHtml(sk)).join("")}</div>
    </main>`;
  }

  function updateTrefferListe() {
    const liste = document.getElementById("treffer-liste");
    const treffer = document.querySelector('[data-t="treffer"]');
    const gefiltert = skillsGefiltert();
    if (liste) liste.innerHTML = gefiltert.map(sk => skillZeileHtml(sk)).join("");
    if (treffer) treffer.textContent = gefiltert.length + " Skills";
  }

  function updateFilterFeld() {
    const feld = document.querySelector(".filter-feld");
    if (feld) feld.innerHTML = filterFeldHtml();
  }

  function updateZeile(skId) {
    const zeile = document.querySelector(`.skill-zeile[data-id="${skId}"]`);
    if (!zeile) return;
    const e = S.einstellungen[skId] || { koffer: "nicht", fazit: null, bereiche: [], notiz: "", sort: 0 };
    const fazit = e.fazit || "";
    const select = zeile.querySelector(".fazit-wahl");
    if (select) select.value = fazit;
    const chips = zeile.querySelectorAll(".fazit-knoepfe .chip");
    chips.forEach(c => {
      const wert = c.dataset.t.replace("fazit-", "");
      const aktiv = wert === fazit;
      c.classList.toggle("aktiv", aktiv);
      c.setAttribute("aria-pressed", aktiv ? "true" : "false");
    });
    const kofferBtn = zeile.querySelector(".koffer-knopf");
    if (kofferBtn) {
      const status = e.koffer || "nicht";
      kofferBtn.dataset.status = status;
      kofferBtn.setAttribute("aria-label", "Koffer: " + kofferStatusText(status) + ". Tippen ändert.");
      kofferBtn.innerHTML = sym(status === "bewaehrt" ? "koffer-voll" : "koffer", "klein") + kofferStatusText(status);
    }
  }

  function setzeFazit(id, wert, modus) {
    if (!S.einstellungen[id]) S.einstellungen[id] = { koffer: "nicht", fazit: null, bereiche: [], notiz: "", sort: 0 };
    S.einstellungen[id].fazit = wert || null;
    if (wert) {
      S.erfahrungen.push({
        id: neueId(),
        skillId: id,
        uebungId: null,
        timestamp: new Date().toISOString(),
        entryMode: modus || "quick",
        helpfulness: wert,
        tensionBefore: null,
        tensionAfter: null,
        pleasantness: null,
        functionalBenefit: null,
        situationTag: "",
        note: ""
      });
    }
    speichern();
    toast("Gespeichert");
  }

  function setzeKoffer(id, status) {
    if (!S.einstellungen[id]) S.einstellungen[id] = { koffer: "nicht", fazit: null, bereiche: [], notiz: "", sort: 0 };
    S.einstellungen[id].koffer = status;
    speichern();
    toast("Gespeichert: " + kofferStatusText(status));
  }

  function kofferWechsel(id) {
    const e = S.einstellungen[id] || { koffer: "nicht" };
    const aktuell = e.koffer || "nicht";
    let neu;
    if (aktuell === "nicht") neu = "testen";
    else if (aktuell === "testen") neu = "bewaehrt";
    else neu = "nicht";
    setzeKoffer(id, neu);
    updateZeile(id);
  }

  // ---------------------------------------------------------------- Skill-Detail

  function seiteSkill(id) {
    const sk = (I.SKILLS || []).find(x => x.id === id);
    if (!sk) return seiteUnbekannt();
    const tex = I.TEXTE || {};
    const e = S.einstellungen[id] || { koffer: "nicht", fazit: null, bereiche: [], notiz: "", sort: 0 };
    const kofferStatus = e.koffer || "nicht";
    const istAktuell = S.aktuelle.includes(id);
    const dauer = dauerText(sk.durationSeconds);
    const materialText = (sk.material || []).length ? (sk.material || []).join(", ") : "ohne Material";
    const orteText = (sk.places || []).map(p => (I.ORTE || []).find(o => o.id === p)).filter(Boolean).map(o => o.name).join(", ");
    const sinneText = (sk.sensoryChannels || []).map(k => (I.KANAELE || []).find(kk => kk.id === k)).filter(Boolean).map(kk => kk.name).join(", ");
    const katText = (sk.categoryIds || []).map(k => (I.KATEGORIEN || []).find(kk => kk.id === k)).filter(Boolean).map(kk => kk.name).join(", ");
    const spannText = (sk.tensionTags || []).map(b => bereichName(b)).join(", ");

    const uebung = sk.uebungId ? (I.UEBUNGEN || []).find(u => u.id === sk.uebungId) : null;
    const interaktiv = sk.interaktivId ? interaktivesBlatt(sk.interaktivId) : null;

    const erfahrungen = S.erfahrungen.filter(x => x.skillId === id).sort((a, b) => b.timestamp.localeCompare(a.timestamp));

    const fazitOptionen = [
      { w: "geholfen", l: "Hat geholfen" },
      { w: "teilweise", l: "Teilweise" },
      { w: "nicht", l: "Nicht hilfreich" },
      { w: "ungetestet", l: "Noch nicht getestet" },
      { w: "unklar", l: "Weiß ich nicht mehr" }
    ];

    return `<main class="detail" data-t="detail">
      <h2>${esc(sk.title)}</h2>
      <p class="art-zeile">${esc(sk.isDbtSkill ? (tex.dbt || "") : (tex.ergaenzend || ""))}${sk.offen ? " " + esc(tex.offenHinweis || "") : ""}</p>
      <p class="wofuer">${esc(sk.shortPurpose || "")}</p>
      <div class="knopf-reihe">
        <button class="knopf haupt" data-a="geh" data-z="schritte/${sk.id}" data-t="schritte-start">Schritt für Schritt</button>
        ${KANN_VORLESEN ? `<button class="knopf" data-a="vorlesen-skill" data-z="${sk.id}">Anleitung anhören</button>` : ""}
        ${uebung ? `<button class="knopf" data-a="geh" data-z="uebung/${uebung.id}">Geführte Übung</button>` : ""}
        ${interaktiv ? `<button class="knopf" data-a="geh" data-z="arbeitsblatt/${interaktiv.id}">Selbst erarbeiten</button>` : ""}
      </div>
      <h3>So geht's</h3>
      <ol class="schritte">
        ${(sk.instructions || []).map(s => `<li>${esc(s)}</li>`).join("")}
      </ol>
      <h3>Beispiel</h3>
      <section class="karte beispiel">${esc(sk.exampleTeen || "")}</section>
      <div class="info-chips">
        <span>Dauer: ${esc(dauer)}</span>
        <span>Material: ${esc(materialText)}</span>
        <span>Orte: ${esc(orteText)}</span>
        <span>Sinne: ${esc(sinneText)}</span>
        <span>Kategorien: ${esc(katText)}</span>
        <span>Anspannung: passt eher bei: ${esc(spannText)} (Orientierung)</span>
      </div>
      <section class="karte sicherheit">
        <h3>Gut zu wissen</h3>
        ${(sk.contraindicationNotes || []).map(n => `<p>${esc(n)}</p>`).join("")}
        <p>Wenn es unangenehm ist, probier lieber:</p>
        <div>
          ${(sk.safeAlternativeIds || []).map(aid => {
            const ask = (I.SKILLS || []).find(x => x.id === aid);
            return ask ? `<button class="text-knopf" data-a="geh" data-z="skill/${ask.id}">${esc(ask.title)}</button>` : "";
          }).join(" ")}
        </div>
      </section>
      <h3>Hast du das schon ausprobiert?</h3>
      <div class="chips detail-fazit" role="group" aria-label="Erfahrung mit ${esc(sk.title)}">
        ${fazitOptionen.map(o => `<button class="chip ${e.fazit === o.w ? "aktiv" : ""}" data-a="detail-fazit" data-z="${sk.id}:${o.w}" data-t="detail-fazit-${o.w}" aria-pressed="${e.fazit === o.w}">${esc(o.l)}</button>`).join("")}
      </div>
      <h3>Mein Koffer</h3>
      <div class="segment-wahl">
        <button class="chip ${kofferStatus === "nicht" ? "aktiv" : ""}" data-a="detail-koffer" data-z="${sk.id}:nicht" data-t="detail-koffer-nicht" aria-pressed="${kofferStatus === "nicht"}">Nicht im Koffer</button>
        <button class="chip ${kofferStatus === "testen" ? "aktiv" : ""}" data-a="detail-koffer" data-z="${sk.id}:testen" data-t="detail-koffer-testen" aria-pressed="${kofferStatus === "testen"}">Möchte ich testen</button>
        <button class="chip ${kofferStatus === "bewaehrt" ? "aktiv" : ""}" data-a="detail-koffer" data-z="${sk.id}:bewaehrt" data-t="detail-koffer-bewaehrt" aria-pressed="${kofferStatus === "bewaehrt"}">Bewährt</button>
      </div>
      <button class="knopf text-knopf" data-a="aktuell-umschalten" data-z="${sk.id}" data-t="aktuell-umschalten">${istAktuell ? "Aus aktuellen Skills nehmen" : "Als aktuellen Skill festlegen"}</button>
      <h3>Passt für mich bei</h3>
      <div class="chips">
        ${(I.BEREICHE || []).map(b => `<button class="chip ${(e.bereiche || []).includes(b.id) ? "aktiv" : ""}" data-a="eignung" data-z="${sk.id}:${b.id}" aria-pressed="${(e.bereiche || []).includes(b.id)}">${esc(b.name)}</button>`).join("")}
      </div>
      <label class="notiz-feld">
        <span>Meine Notiz</span>
        <textarea data-feld="notiz" data-z="${sk.id}" rows="3">${esc(e.notiz || "")}</textarea>
      </label>
      <h3>Meine Erfahrungen</h3>
      <button class="knopf" data-a="geh" data-z="test/${sk.id}" data-t="test-start">Erfahrung genauer festhalten</button>
      <ul class="verlauf" data-t="verlauf">
        ${erfahrungen.map(e => erfahrungsEintragHtml(e)).join("") || '<li class="leer">Noch keine Einträge.</li>'}
      </ul>
      <p class="klein">Jeder Versuch bleibt einzeln stehen. Dein Fazit kannst du jederzeit ändern.</p>
      <button class="text-knopf" data-a="geh" data-z="alle">Anderen Skill ausprobieren</button>
    </main>`;
  }

  // ---------------------------------------------------------------- Schritt für Schritt

  function seiteSchritte(id) {
    if (schrittSkillId !== id) {
      schrittSkillId = id;
      schrittIndex = 0;
    }
    const sk = (I.SKILLS || []).find(x => x.id === id);
    if (!sk) return seiteUnbekannt();
    const schritte = sk.instructions || [];
    if (schrittIndex >= schritte.length) {
      return `<main class="schritt-ende">
        <h2>Geschafft. Wie war es?</h2>
        <div class="knopf-reihe">
          <button class="knopf" data-a="schritt-fazit" data-z="${sk.id}:geholfen">Hat geholfen</button>
          <button class="knopf" data-a="schritt-fazit" data-z="${sk.id}:teilweise">Teilweise</button>
          <button class="knopf" data-a="schritt-fazit" data-z="${sk.id}:nicht">Nicht hilfreich</button>
        </div>
        <button class="knopf" data-a="geh" data-z="test/${sk.id}">Genauer festhalten</button>
        <button class="knopf haupt" data-a="geh" data-z="skill/${sk.id}">Fertig</button>
      </main>`;
    }

    return `<main class="schritte">
      <div class="schritt-gross">
        <p class="klein">Schritt ${schrittIndex + 1} von ${schritte.length}</p>
        <p>${esc(schritte[schrittIndex])}</p>
      </div>
      <div class="knopf-reihe">
        <button class="knopf" data-a="schritt-zurueck">Zurück</button>
        <button class="knopf haupt" data-a="schritt-weiter">Weiter</button>
        ${KANN_VORLESEN ? `<button class="knopf" data-a="vorlesen-schritt" data-z="${schrittIndex}">Vorlesen</button>` : ""}
      </div>
    </main>`;
  }

  // ---------------------------------------------------------------- Skill testen

  function seiteTest(id) {
    const sk = (I.SKILLS || []).find(x => x.id === id);
    if (!sk) return seiteUnbekannt();
    if (!testFlow || testFlow.skillId !== id) {
      testFlow = {
        skillId: id,
        schritt: 0,
        vorher: null,
        situation: "",
        nachher: null,
        hilfreich: "",
        angenehm: "",
        funktional: "",
        kommentar: "",
        fazit: ""
      };
    }
    const tf = testFlow;
    const e = S.einstellungen[id] || { koffer: "nicht", fazit: null, bereiche: [], notiz: "", sort: 0 };
    const berVorher = tf.vorher != null ? bereichName(bereichVon(tf.vorher)) : "nicht eingestellt";
    const berNachher = tf.nachher != null ? bereichName(bereichVon(tf.nachher)) : "nicht eingestellt";
    const abbrechenKnopf = `<button class="text-knopf" data-a="test-abbrechen" data-t="test-abbrechen">Abbrechen</button>`;

    let inhalt = "";
    if (tf.schritt === 0) {
      inhalt = `<h2>Vorher: Wie geht's dir?</h2>
        <p class="klein">Schritt 1 von 3</p>
        <div class="regler-zeile">
          <input type="range" min="0" max="100" step="5" data-feld="test-vorher" data-t="test-vorher" value="${tf.vorher != null ? tf.vorher : 50}">
          <span class="regler-wert" id="regler-vorher-anzeige">${tf.vorher != null ? tf.vorher : "nicht eingestellt"}</span>
          <span>${esc(berVorher)}</span>
        </div>
        <div class="chips">
          ${(I.TEST_SITUATIONEN || []).map((s, i) => `<button class="chip ${tf.situation === s ? "aktiv" : ""}" data-a="test-situation" data-z="${i}" aria-pressed="${tf.situation === s}">${esc(s)}</button>`).join("")}
        </div>
        <div class="knopf-reihe">${abbrechenKnopf}<button class="knopf haupt" data-a="test-weiter" data-t="test-weiter">Weiter</button></div>`;
    } else if (tf.schritt === 1) {
      inhalt = `<h2>Ausprobieren</h2>
        <p class="klein">Schritt 2 von 3</p>
        <ol class="schritte">${(sk.instructions || []).map(s => `<li>${esc(s)}</li>`).join("")}</ol>
        ${KANN_VORLESEN ? `<button class="knopf" data-a="vorlesen-skill" data-z="${sk.id}">Vorlesen</button>` : ""}
        <div class="knopf-reihe">${abbrechenKnopf}<button class="knopf haupt" data-a="test-weiter" data-t="test-weiter">Fertig, weiter</button></div>`;
    } else {
      const fazitOptionen = [
        { w: "geholfen", l: "Hat geholfen" },
        { w: "teilweise", l: "Teilweise" },
        { w: "nicht", l: "Nicht hilfreich" },
        { w: "ungetestet", l: "Noch nicht getestet" },
        { w: "unklar", l: "Weiß ich nicht mehr" }
      ];
      const vorwahlFazit = tf.fazit || e.fazit || tf.hilfreich || "";
      inhalt = `<h2>Danach: Was war hilfreich?</h2>
        <p class="klein">Schritt 3 von 3</p>
        <div class="regler-zeile">
          <input type="range" min="0" max="100" step="5" data-feld="test-nachher" data-t="test-nachher" value="${tf.nachher != null ? tf.nachher : 50}">
          <span class="regler-wert" id="regler-nachher-anzeige">${tf.nachher != null ? tf.nachher : "nicht eingestellt"}</span>
          <span>${esc(berNachher)}</span>
        </div>
        <h3>Hat es geholfen?</h3>
        <div class="chips">
          ${["geholfen", "teilweise", "nicht"].map(w => `<button class="chip ${tf.hilfreich === w ? "aktiv" : ""}" data-a="test-hilfreich" data-z="${w}" data-t="test-hilfreich-${w}" aria-pressed="${tf.hilfreich === w}">${esc({geholfen: "Geholfen", teilweise: "Teilweise", nicht: "Nicht"}[w] || w)}</button>`).join("")}
        </div>
        <h3>War es angenehm?</h3>
        <div class="chips">
          ${["ja", "etwas", "nein"].map(w => `<button class="chip ${tf.angenehm === w ? "aktiv" : ""}" data-a="test-angenehm" data-z="${w}" aria-pressed="${tf.angenehm === w}">${esc({ja: "Ja", etwas: "Etwas", nein: "Nein"}[w] || w)}</button>`).join("")}
        </div>
        <h3>Konntest du danach gut weitermachen?</h3>
        <div class="chips">
          ${["ja", "etwas", "nein"].map(w => `<button class="chip ${tf.funktional === w ? "aktiv" : ""}" data-a="test-funktional" data-z="${w}" aria-pressed="${tf.funktional === w}">${esc({ja: "Ja", etwas: "Etwas", nein: "Nein"}[w] || w)}</button>`).join("")}
        </div>
        <label class="notiz-feld">
          <span>Kommentar</span>
          <textarea data-feld="test-kommentar" rows="2">${esc(tf.kommentar)}</textarea>
        </label>
        <h3>Mein Fazit zu diesem Skill</h3>
        <div class="fazit-knoepfe" role="group" aria-label="Mein Fazit">
          ${fazitOptionen.map(o => `<button class="chip ${vorwahlFazit === o.w ? "aktiv" : ""}" data-a="test-fazit" data-z="${o.w}" aria-pressed="${vorwahlFazit === o.w}">${esc(o.l)}</button>`).join("")}
        </div>
        <div class="knopf-reihe">${abbrechenKnopf}<button class="knopf haupt" data-a="test-speichern" data-t="test-speichern">Speichern</button></div>`;
    }

    return `<main class="test">${inhalt}</main>`;
  }

  // ---------------------------------------------------------------- Koffer

  function anzahlKofferStatus(status) {
    let n = 0;
    for (const id in S.einstellungen) {
      if (S.einstellungen[id] && S.einstellungen[id].koffer === status) n++;
    }
    for (const e of S.eigene) {
      if (e.koffer === status) n++;
    }
    return n;
  }

  function seiteKoffer() {
    const tex = I.TEXTE || {};
    const anzAkt = S.aktuelle.filter(ref => eintrag(ref)).length;
    const anzBew = anzahlKofferStatus("bewaehrt");
    const anzTest = anzahlKofferStatus("testen");
    const anzKetten = S.ketten.length;
    const anzEigen = S.eigene.length;
    const anzErf = S.erfahrungen.length;

    return `<main class="koffer">
      <p>${esc(tex.kofferIntro || "")}</p>
      <div class="nav-liste">
        ${zeile("Meine aktuellen Skills", anzAkt, "geh", "koffer/aktuelle", "koffer")}
        ${zeile("Das hilft mir oft", anzBew, "geh", "koffer/bewaehrt", "koffer-voll")}
        ${zeile("Möchte ich ausprobieren", anzTest, "geh", "koffer/testen", "koffer")}
        ${zeile("Meine Skillsketten", anzKetten, "geh", "koffer/ketten", "kette")}
        ${zeile("Meine eigenen Skills", anzEigen, "geh", "koffer/eigene", "stift")}
        ${zeile("Alle meine Erfahrungen", anzErf, "geh", "koffer/erfahrungen", "herz")}
      </div>
    </main>`;
  }

  function seiteKofferAktuelle() {
    const aktive = S.aktuelle.filter(ref => eintrag(ref));
    const anzahl = S.profil.anzahlAktuelle;
    let kachelnHtml = "";
    for (let i = 0; i < anzahl; i++) {
      const ref = aktive[i];
      if (ref) {
        const e = eintrag(ref);
        kachelnHtml += `<div class="aktuell-kachel" data-t="aktuell-kachel" data-ref="${esc(ref)}">
          <button class="aktuell-kachel-knopf" data-a="oeffne-verweis" data-z="${esc(ref)}">
            <b>${esc(e.titel)}</b><small>${esc(e.zweck || "")}</small>
          </button>
          <div class="aktuell-werkzeuge">
            <button data-a="aktuell-hoch" data-z="${i}" aria-label="Nach oben" ${i === 0 ? "disabled" : ""}>${sym("hoch", "klein")}</button>
            <button data-a="aktuell-runter" data-z="${i}" aria-label="Nach unten" ${i >= aktive.length - 1 ? "disabled" : ""}>${sym("runter", "klein")}</button>
            <button data-a="aktuell-weg" data-z="${esc(ref)}" aria-label="Entfernen">${sym("x", "klein")}</button>
          </div>
        </div>`;
      } else {
        kachelnHtml += `<button class="aktuell-frei" data-a="geh" data-z="waehlen/aktuell">Platz frei: Skill wählen</button>`;
      }
    }
    return `<main class="koffer-teil">
      <h2>Meine aktuellen Skills</h2>
      <div class="aktuell-kacheln">${kachelnHtml}</div>
      <div class="anzahl-wahl">
        <span>Wie viele?</span>
        ${[3, 4, 5].map(n => `<button class="chip ${S.profil.anzahlAktuelle === n ? "aktiv" : ""}" data-a="anzahl" data-z="${n}" data-t="anzahl-${n}" aria-pressed="${S.profil.anzahlAktuelle === n}">${n}</button>`).join("")}
      </div>
      <button class="knopf haupt" data-a="geh" data-z="waehlen/aktuell">Skill hinzufügen</button>
    </main>`;
  }

  function seiteKofferBewaehrtOderTesten(status) {
    const tex = I.TEXTE || {};
    const alle = [];
    for (const id in S.einstellungen) {
      if (S.einstellungen[id] && S.einstellungen[id].koffer === status) {
        const sk = (I.SKILLS || []).find(x => x.id === id);
        if (sk) alle.push({ id, typ: "skill", title: sk.title, kurz: sk.shortPurpose, sort: S.einstellungen[id].sort || 0, bereiche: S.einstellungen[id].bereiche || [] });
      }
    }
    for (const e of S.eigene) {
      if (e.koffer === status) alle.push({ id: "eigen:" + e.id, typ: "eigen", title: e.title, kurz: e.shortPurpose, sort: e.sort || 0, bereiche: e.bereiche || [] });
    }
    if (kofferBereichFilter) {
      alle = alle.filter(x => x.bereiche.includes(kofferBereichFilter));
    }
    alle.sort((a, b) => (a.sort || 0) - (b.sort || 0) || a.title.localeCompare(b.title));

    const zielStatus = status === "bewaehrt" ? "testen" : "bewaehrt";
    const zielText = status === "bewaehrt" ? "Nach Testen" : "Nach Bewährt";

    return `<main class="koffer-teil">
      <h2>${status === "bewaehrt" ? "Das hilft mir oft" : "Möchte ich ausprobieren"}</h2>
      <div class="chips">
        ${["niedrig", "mittel", "hoch"].map(b => `<button class="chip ${kofferBereichFilter === b ? "aktiv" : ""}" data-a="koffer-bereich-filter" data-z="${b}" aria-pressed="${kofferBereichFilter === b}">${esc(bereichName(b))}</button>`).join("")}
        ${kofferBereichFilter ? `<button class="chip" data-a="koffer-bereich-filter" data-z="">Alle</button>` : ""}
      </div>
      ${alle.length === 0 ? `
        <p class="leer">${esc(tex.leerKoffer || "Noch nichts im Koffer.")}</p>
        <button class="knopf haupt" data-a="geh" data-z="alle">Zu allen Skills</button>
      ` : alle.map((x, i) => `
        <div class="koffer-zeile" data-id="${esc(x.id)}">
          <button class="zeile-kopf" data-a="oeffne-verweis" data-z="${esc(x.id)}"><b>${esc(x.title)}</b><small>${esc(x.kurz || "")}</small></button>
          <div class="zeile-aktionen">
            <button data-a="koffer-sort-hoch" data-z="${esc(x.id)}" aria-label="Nach oben" ${i === 0 ? "disabled" : ""}>${sym("hoch", "klein")}</button>
            <button data-a="koffer-sort-runter" data-z="${esc(x.id)}" aria-label="Nach unten" ${i >= alle.length - 1 ? "disabled" : ""}>${sym("runter", "klein")}</button>
            <button class="text-knopf" data-a="koffer-status-wechsel" data-z="${esc(x.id)}">${esc(zielText)}</button>
            <div class="chips">
              ${["niedrig", "mittel", "hoch"].map(b => `<button class="chip ${x.bereiche.includes(b) ? "aktiv" : ""}" data-a="koffer-bereich" data-z="${esc(x.id)}:${b}" aria-pressed="${x.bereiche.includes(b)}">${esc(bereichName(b))}</button>`).join("")}
            </div>
          </div>
        </div>
      `).join("")}
    </main>`;
  }

  function seiteKofferKetten() {
    const tex = I.TEXTE || {};
    return `<main class="koffer-teil">
      <h2>Meine Skillsketten</h2>
      <p class="klein">${esc(tex.ketteHinweis || "")}</p>
      ${S.ketten.map(k => `
        <div class="koffer-zeile">
          <button class="zeile-kopf" data-a="geh" data-z="kette/${k.id}"><b>${esc(k.title)}</b><small>${esc(bereichName(k.bereich) || "Kein Bereich")} · ${k.steps.length} Schritte</small></button>
          <div class="zeile-aktionen">
            <button class="knopf" data-a="geh" data-z="kette-start/${k.id}">Starten</button>
            <button class="text-knopf" data-a="geh" data-z="kette/${k.id}">Bearbeiten</button>
          </div>
        </div>
      `).join("")}
      <button class="knopf haupt" data-a="neue-kette">Neue Skillskette</button>
      <button class="text-knopf" data-a="geh" data-z="arbeitsblatt/kette">Mit Assistent erarbeiten</button>
    </main>`;
  }

  function seiteKofferEigene() {
    return `<main class="koffer-teil">
      <h2>Meine eigenen Skills</h2>
      ${S.eigene.map(e => `
        <div class="koffer-zeile">
          <button class="zeile-kopf" data-a="geh" data-z="eigen/${e.id}"><b>${esc(e.title)}</b><small>${esc(e.shortPurpose || "")}</small></button>
          <div class="zeile-aktionen">
            <span class="chip ${e.koffer === "bewaehrt" ? "aktiv" : ""}">Bewährt</span>
            <span class="chip ${e.koffer === "testen" ? "aktiv" : ""}">Testen</span>
          </div>
        </div>
      `).join("")}
      ${S.karten.filter(k => k.savedToKoffer).map(k => `
        <div class="koffer-zeile">
          <button class="zeile-kopf" data-a="geh" data-z="karte/${k.id}"><b>${esc(interaktiverTitel(k))}</b><small>Gespeicherte Karte</small></button>
        </div>
      `).join("")}
      <button class="knopf haupt" data-a="geh" data-z="eigen/neu">Eigenen Skill aufschreiben</button>
      <button class="text-knopf" data-a="geh" data-z="vorlagen">Aus Vorlage</button>
      <button class="text-knopf" data-a="geh" data-z="interaktiv">Selbst erarbeiten</button>
    </main>`;
  }

  function seiteKofferErfahrungen() {
    const tex = I.TEXTE || {};
    let liste = [...S.erfahrungen].sort((a, b) => b.timestamp.localeCompare(a.timestamp));

    const bereiche = ["niedrig", "mittel", "hoch"];
    const situationen = [...new Set(S.erfahrungen.map(e => e.situationTag).filter(Boolean))];

    if (erfahrungsBereichFilter !== "alle") {
      if (erfahrungsBereichFilter === "ohne") {
        liste = liste.filter(e => e.tensionBefore == null);
      } else {
        liste = liste.filter(e => e.tensionBefore != null && bereichVon(e.tensionBefore) === erfahrungsBereichFilter);
      }
    }
    if (erfahrungsSituationFilter !== "alle") {
      liste = liste.filter(e => e.situationTag === erfahrungsSituationFilter);
    }

    return `<main class="koffer-teil">
      <h2>Alle meine Erfahrungen</h2>
      <div class="chips">
        <button class="chip ${erfahrungsBereichFilter === "alle" ? "aktiv" : ""}" data-a="erfahrung-filter-bereich" data-z="alle" aria-pressed="${erfahrungsBereichFilter === "alle"}">Alle Bereiche</button>
        ${bereiche.map(b => `<button class="chip ${erfahrungsBereichFilter === b ? "aktiv" : ""}" data-a="erfahrung-filter-bereich" data-z="${b}" aria-pressed="${erfahrungsBereichFilter === b}">${esc(bereichName(b))}</button>`).join("")}
        <button class="chip ${erfahrungsBereichFilter === "ohne" ? "aktiv" : ""}" data-a="erfahrung-filter-bereich" data-z="ohne" aria-pressed="${erfahrungsBereichFilter === "ohne"}">ohne Zahl</button>
      </div>
      ${situationen.length > 0 ? `<div class="chips">
        <button class="chip ${erfahrungsSituationFilter === "alle" ? "aktiv" : ""}" data-a="erfahrung-filter-situation" data-z="alle" aria-pressed="${erfahrungsSituationFilter === "alle"}">Alle Situationen</button>
        ${situationen.map(s => `<button class="chip ${erfahrungsSituationFilter === s ? "aktiv" : ""}" data-a="erfahrung-filter-situation" data-z="${esc(s)}" aria-pressed="${erfahrungsSituationFilter === s}">${esc(s)}</button>`).join("")}
      </div>` : ""}
      <ul class="verlauf" data-t="verlauf">
        ${liste.map(e => erfahrungsEintragHtml(e)).join("") || `<li class="leer">${esc(tex.leerErfahrungen || "Noch keine Erfahrungen.")}</li>`}
      </ul>
    </main>`;
  }

  // ---------------------------------------------------------------- Kette

  function neueKette() {
    const k = {
      id: neueId(),
      title: "",
      purpose: "",
      bereich: "",
      steps: [],
      wennNicht: "",
      trustedContacts: "",
      reviewedWithTeam: false,
      lastEditedAt: new Date().toISOString()
    };
    S.ketten.push(k);
    speichern();
    geh("kette/" + k.id);
  }

  function seiteKette(id) {
    const k = S.ketten.find(x => x.id === id);
    if (!k) return seiteUnbekannt();
    const istAktuell = S.aktuelle.includes("kette:" + id);

    return `<main class="kette">
      <h2>Skillskette bearbeiten</h2>
      <label class="feld">
        <span>Name</span>
        <input type="text" data-feld="kette-name" data-z="${k.id}" value="${esc(k.title)}">
      </label>
      <label class="feld">
        <span>Wofür / wann</span>
        <input type="text" data-feld="kette-zweck" data-z="${k.id}" value="${esc(k.purpose)}">
      </label>
      <div class="feld">
        <span>Bereich</span>
        <div class="chips">
          ${["", "niedrig", "mittel", "hoch"].map(b => `<button class="chip ${k.bereich === b ? "aktiv" : ""}" data-a="kette-bereich" data-z="${k.id}:${b}" aria-pressed="${k.bereich === b}">${b === "" ? "Keiner" : esc(bereichName(b))}</button>`).join("")}
        </div>
      </div>
      <h3>Schritte</h3>
      <div class="schritte-liste">
        ${k.steps.map((s, i) => {
          const titel = s.typ === "skill" ? (eintrag(s.ref) ? eintrag(s.ref).titel : "Gelöschter Skill") : s.typ === "text" ? (s.text || "Textschritt") : "Hilfe und Kontakte öffnen";
          return `<div class="schritt-zeile">
            <span>${i + 1}. ${esc(titel)}</span>
            <div class="schritt-werkzeuge">
              <button data-a="kette-schritt-hoch" data-z="${k.id}:${i}" aria-label="Nach oben" ${i === 0 ? "disabled" : ""}>${sym("hoch", "klein")}</button>
              <button data-a="kette-schritt-runter" data-z="${k.id}:${i}" aria-label="Nach unten" ${i >= k.steps.length - 1 ? "disabled" : ""}>${sym("runter", "klein")}</button>
              <button data-a="kette-schritt-weg" data-z="${k.id}:${i}" aria-label="Entfernen">${sym("x", "klein")}</button>
            </div>
          </div>`;
        }).join("") || '<p class="leer">Noch keine Schritte.</p>'}
      </div>
      <div class="knopf-reihe">
        <button class="knopf" data-a="geh" data-z="waehlen/kette-${k.id}">Skill hinzufügen</button>
        <button class="knopf" data-a="kette-eigener-schritt" data-z="${k.id}">Eigenen Schritt</button>
        <button class="knopf" data-a="kette-hilfe-schritt" data-z="${k.id}">Hilfe öffnen als Schritt</button>
      </div>
      <label class="feld">
        <span>Wenn es nicht reicht</span>
        <input type="text" data-feld="kette-wenn-nicht" data-z="${k.id}" value="${esc(k.wennNicht)}">
      </label>
      <label class="feld">
        <span>Wer kann helfen</span>
        <input type="text" data-feld="kette-kontakte" data-z="${k.id}" value="${esc(k.trustedContacts)}">
      </label>
      <label class="check">
        <input type="checkbox" data-feld="kette-team" data-z="${k.id}" ${k.reviewedWithTeam ? "checked" : ""}>
        <span>Mit meinem Team abgesprochen</span>
      </label>
      <div class="knopf-reihe">
        <button class="knopf haupt" data-a="geh" data-z="kette-start/${k.id}">Kette starten</button>
        <button class="knopf" data-a="kette-aktuell" data-z="${k.id}">${istAktuell ? "Aus aktuellen Skills nehmen" : "Als aktuellen Skill festlegen"}</button>
        <button class="knopf gefahr" data-a="kette-loeschen" data-z="${k.id}">Kette löschen</button>
      </div>
    </main>`;
  }

  function seiteKetteStart(id) {
    const k = S.ketten.find(x => x.id === id);
    if (!k) return seiteUnbekannt();
    const schritte = k.steps || [];
    const index = ketteStartIndex !== undefined && ketteStartIndex < schritte.length ? ketteStartIndex : 0;

    let schrittHtml = "";
    if (index >= schritte.length) {
      const endeMitWenNicht = k.wennNicht ? `<div class="schritt-gross"><p>Wenn es nicht reicht: ${esc(k.wennNicht)}</p></div>` : "";
      schrittHtml = `<div class="schritt-gross"><p>${esc((I.TEXTE || {}).ketteEnde || "")}</p></div>
        ${endeMitWenNicht}
        <button class="knopf haupt" data-a="geh" data-z="start">Zur Startseite</button>`;
    } else {
      const s = schritte[index];
      if (s.typ === "skill") {
        const e = eintrag(s.ref);
        if (e) {
          const sk = (I.SKILLS || []).find(x => x.id === s.ref);
          const anleitung = sk ? (sk.instructions || []).slice(0, 3) : [];
          schrittHtml = `<div class="schritt-gross">
            <p class="klein">Schritt ${index + 1} von ${schritte.length}</p>
            <h2>${esc(e.titel)}</h2>
            ${anleitung.length > 0 ? `<ol class="schritte">${anleitung.map(a => `<li>${esc(a)}</li>`).join("")}</ol>` : ""}
            <button class="text-knopf" data-a="geh" data-z="skill/${esc(s.ref)}">Ganze Anleitung</button>
          </div>`;
        } else {
          schrittHtml = `<div class="schritt-gross"><p class="klein">Schritt ${index + 1} von ${schritte.length}</p><p>Dieser Schritt ist nicht mehr verfügbar.</p></div>`;
        }
      } else if (s.typ === "text") {
        schrittHtml = `<div class="schritt-gross"><p class="klein">Schritt ${index + 1} von ${schritte.length}</p><p>${esc(s.text || "")}</p></div>`;
      } else {
        schrittHtml = `<div class="schritt-gross"><p class="klein">Schritt ${index + 1} von ${schritte.length}</p>
          <button class="knopf notfall" data-a="geh" data-z="hilfe">Kontakte und Hilfe öffnen</button></div>`;
      }
      schrittHtml += `<div class="knopf-reihe">
        <button class="knopf haupt" data-a="kette-start-weiter">Nächster Schritt</button>
        <button class="knopf hilfe-holen" data-a="geh" data-z="hilfe">Hilfe holen</button>
      </div>`;
    }

    return `<main class="kette-start">${schrittHtml}</main>`;
  }

  let ketteStartIndex = 0;

  // ---------------------------------------------------------------- Eigener Skill

  function neuerEigener() {
    const e = {
      id: neueId(),
      title: "",
      shortPurpose: "",
      instructions: [],
      bereiche: [],
      koffer: "testen",
      sort: S.eigene.length,
      erstellt: new Date().toISOString()
    };
    S.eigene.push(e);
    speichern();
    history.replaceState(null, "", "#eigen/" + e.id);
    render();
  }

  function seiteEigen(id) {
    if (id === "neu") {
      neuerEigener();
      return "";
    }
    const e = S.eigene.find(x => x.id === id);
    if (!e) return seiteUnbekannt();
    const schritteText = (e.instructions || []).join("\n");
    const istAktuell = S.aktuelle.includes("eigen:" + id);

    return `<main class="eigen">
      <h2>Eigener Skill</h2>
      <label class="feld">
        <span>Name</span>
        <input type="text" data-feld="eigen-name" data-z="${e.id}" value="${esc(e.title)}">
      </label>
      <label class="feld">
        <span>Wofür (ein Satz)</span>
        <input type="text" data-feld="eigen-zweck" data-z="${e.id}" value="${esc(e.shortPurpose)}">
      </label>
      <label class="feld">
        <span>Schritte (eine Zeile je Schritt)</span>
        <textarea data-feld="eigen-schritte" data-z="${e.id}" rows="5">${esc(schritteText)}</textarea>
      </label>
      <div class="feld">
        <span>Bereich</span>
        <div class="chips">
          ${["niedrig", "mittel", "hoch"].map(b => `<button class="chip ${(e.bereiche || []).includes(b) ? "aktiv" : ""}" data-a="eigen-bereich" data-z="${e.id}:${b}" aria-pressed="${(e.bereiche || []).includes(b)}">${esc(bereichName(b))}</button>`).join("")}
        </div>
      </div>
      <div class="feld">
        <span>Kofferstatus</span>
        <div class="chips">
          <button class="chip ${e.koffer === "testen" ? "aktiv" : ""}" data-a="eigen-koffer" data-z="${e.id}:testen" aria-pressed="${e.koffer === "testen"}">Testen</button>
          <button class="chip ${e.koffer === "bewaehrt" ? "aktiv" : ""}" data-a="eigen-koffer" data-z="${e.id}:bewaehrt" aria-pressed="${e.koffer === "bewaehrt"}">Bewährt</button>
        </div>
      </div>
      <div class="knopf-reihe">
        <button class="knopf" data-a="eigen-aktuell" data-z="${e.id}">${istAktuell ? "Aus aktuellen Skills nehmen" : "Als aktuellen Skill festlegen"}</button>
        <button class="knopf haupt" data-a="geh" data-z="koffer/eigene">Fertig</button>
        <button class="knopf gefahr" data-a="eigen-loeschen" data-z="${e.id}">Löschen</button>
      </div>
    </main>`;
  }

  // ---------------------------------------------------------------- Vorlagen

  function seiteVorlagen() {
    return `<main class="vorlagen">
      <h2>Vorlagen für eigene Skills</h2>
      ${(I.VORLAGEN || []).map(v => `
        <div class="koffer-zeile">
          <button class="zeile-kopf" data-a="vorlage" data-z="${v.id}"><b>${esc(v.titel)}</b><small>${esc(v.text || "")}</small></button>
        </div>
      `).join("")}
    </main>`;
  }

  // ---------------------------------------------------------------- Wählen

  function seiteWaehlen(param) {
    const zweck = param;
    const istAktuell = zweck === "aktuell";
    const istBereich = zweck.startsWith("bereich-");
    const istKette = zweck.startsWith("kette-");
    const bereichZiel = istBereich ? zweck.replace("bereich-", "") : "";
    const ketteId = istKette ? zweck.replace("kette-", "") : "";

    const kofferRefs = [];
    for (const id in S.einstellungen) {
      const e = S.einstellungen[id];
      if (e && (e.koffer === "bewaehrt" || e.koffer === "testen")) {
        const sk = (I.SKILLS || []).find(x => x.id === id);
        if (sk) kofferRefs.push({ ref: id, typ: "skill", titel: sk.title, zweck: sk.shortPurpose, koffer: e.koffer });
      }
    }
    S.eigene.forEach(e => kofferRefs.push({ ref: "eigen:" + e.id, typ: "eigen", titel: e.title, zweck: e.shortPurpose, koffer: e.koffer }));
    S.ketten.forEach(k => kofferRefs.push({ ref: "kette:" + k.id, typ: "kette", titel: k.title, zweck: k.purpose, koffer: "bewaehrt" }));
    S.karten.filter(k => k.savedToKoffer).forEach(k => kofferRefs.push({ ref: "karte:" + k.id, typ: "karte", titel: interaktiverTitel(k), zweck: "Gespeicherte Karte", koffer: "bewaehrt" }));

    const alleSkills = (I.SKILLS || []).map(sk => ({ ref: sk.id, typ: "skill", titel: sk.title, zweck: sk.shortPurpose, koffer: S.einstellungen[sk.id]?.koffer || "nicht" }));

    const gefiltertKoffer = kofferRefs.filter(x => {
      if (!sucheText) return true;
      const such = normiereSuche(sucheText);
      return [x.titel, x.zweck].some(f => normiereSuche(f).includes(such));
    });
    const gefiltertAlle = alleSkills.filter(sk => {
      if (!sucheText) return true;
      const such = normiereSuche(sucheText);
      const s = (I.SKILLS || []).find(x => x.id === sk.ref);
      const felder = [sk.titel, sk.zweck].concat(s ? (s.keywords || []).concat(s.instructions || []) : []);
      return felder.some(f => normiereSuche(f).includes(such));
    });

    const kopfText = istAktuell ? "Skill für meine aktuellen wählen" : istKette ? "Skill zur Kette hinzufügen" : `Skills für ${bereichName(bereichZiel)} zuordnen`;

    return `<main class="waehlen">
      <h2>${esc(kopfText)}</h2>
      <input type="search" data-feld="waehlen-suche" aria-label="Skills durchsuchen" placeholder="Suchen" value="${esc(sucheText)}">
      <div id="waehlen-liste">
        <h3>Aus meinem Koffer</h3>
        ${gefiltertKoffer.map(x => waehlenZeileHtml(x, zweck, bereichZiel)).join("") || '<p class="leer">Nichts gefunden.</p>'}
        <h3>Alle Skills</h3>
        ${gefiltertAlle.map(x => waehlenZeileHtml(x, zweck, bereichZiel)).join("") || '<p class="leer">Nichts gefunden.</p>'}
      </div>
      ${istBereich ? `<button class="knopf haupt" data-a="waehlen-fertig" data-z="${bereichZiel}">Fertig</button>` : ""}
    </main>`;
  }

  function waehlenZeileHtml(x, zweck, bereichZiel) {
    const istBereich = zweck.startsWith("bereich-");
    const istAktiv = istBereich && eintrag(x.ref) && bereichVonEintrag(x.ref, bereichZiel);
    return `<button class="zeile" data-a="waehlen-tipp" data-z="${esc(x.ref)}:${esc(zweck)}">
      ${sym("haken", "klein")}
      <span class="zeile-text"><b>${esc(x.titel)}</b><small>${esc(x.zweck || "")}</small></span>
      ${istBereich ? `<span class="haken-markierung" aria-pressed="${!!istAktiv}">${istAktiv ? sym("haken", "klein") : ""}</span>` : sym("weiter", "klein")}
    </button>`;
  }

  function bereichVonEintrag(ref, bereich) {
    const e = eintrag(ref);
    if (!e) return false;
    if (e.typ === "skill") {
      const ein = S.einstellungen[ref];
      return !!ein && (ein.bereiche || []).includes(bereich);
    }
    if (e.typ === "eigen") {
      const eig = S.eigene.find(x => x.id === ref.slice(6));
      return !!eig && (eig.bereiche || []).includes(bereich);
    }
    if (e.typ === "kette") {
      const k = S.ketten.find(x => x.id === ref.slice(6));
      return !!k && k.bereich === bereich;
    }
    return false;
  }

  // ---------------------------------------------------------------- Spannung

  function seiteSpannung() {
    const tex = I.TEXTE || {};
    const wert = spannungWert;
    let bereich = null;
    if (wert != null) bereich = bereichVon(wert);
    const g1 = S.spannung.grenze1;
    const g2 = S.spannung.grenze2;

    let anzeigeBereich = "";
    if (bereich) {

        anzeigeBereich = `<section class="hoch-bereich">
          <button class="knopf notfall" data-a="geh" data-z="hilfe" data-t="hilfe-holen">Hilfe holen</button>
          <p>${esc(tex.hochHinweis || "")}</p>

            <button class="zeile" data-a="oeffne-verweis" data-z="${esc(v.ref)}">

              ${v.typ === "kette" ? `<button class="knopf" data-a="geh" data-z="kette-start/${v.ref.slice(6)}">Starten</button>` : sym("weiter", "klein")}
            </button>
          `).join("") : `<p class="leer">${esc(tex.hochLeer || "")}</p>`}

      } else {

      </div>

        ${["niedrig", "mittel", "hoch"].map(b => {
          const von = b === "niedrig" ? 0 : b === "mittel" ? g1 : g2;
          const bis = b === "niedrig" ? g1 : b === "mittel" ? g2 : 100;
          const breite = bis - von;
          return `<div class="skala-feld ${bereich === b ? "aktiv" : ""}" style="width:${breite}%">

      </div>
      <div class="zone-anzeige" data-t="zone" data-zone="${bereich || "unbekannt"}">

        <div class="regler-zeile">

        <summary>Meine Frühwarnzeichen</summary>
        <p class="klein">Das sind nur Beispiele. Du entscheidest, was zu dir passt.</p>
        ${zeichenBereiche.map(b => {
          const zeichen = S.spannung.fruehwarn[b] || [];
          return `<div class="warn-gruppe">
            <h3>${esc(bereichName(b))}</h3>

            <div class="formular">

  function verweiseFuerBereich(bereich) {
    const ergebnis = [];
    for (const id in S.einstellungen) {
      const e = S.einstellungen[id];
      if (e && (e.koffer === "bewaehrt" || e.koffer === "testen") && (e.bereiche || []).includes(bereich)) {
        const sk = (I.SKILLS || []).find(x => x.id === id);
        if (sk) {
          const info = eintrag(id);
          if (info) ergebnis.push(info);
        }
      }
    }
    S.eigene.forEach(e => {
      if ((e.bereiche || []).includes(bereich)) {
        const info = eintrag("eigen:" + e.id);
        if (info) ergebnis.push(info);
      }
    });
    S.ketten.forEach(k => {
      if (k.bereich === bereich) {
        const info = eintrag("kette:" + k.id);
        if (info) ergebnis.push(info);
      }
    });
    return ergebnis.sort((a, b) => {
      const aBewahrt = a.typ === "skill" && S.einstellungen[a.ref] && S.einstellungen[a.ref].koffer === "bewaehrt";
      const bBewahrt = b.typ === "skill" && S.einstellungen[b.ref] && S.einstellungen[b.ref].koffer === "bewaehrt";
      if (aBewahrt !== bBewahrt) return bBewahrt ? 1 : -1;
      return a.titel.localeCompare(b.titel);
    });
  }

  // ---------------------------------------------------------------- Übungen

  function seiteUebungen() {

  function seiteUebung(id) {
    const u = (I.UEBUNGEN || []).find(x => x.id === id);
    if (!u) return seiteUnbekannt();

    const pausiert = l && l.pausiert;
    const index = l ? l.index : 0;
    const statusText = l ? (l.beendet ? "Beendet" : (l.pausiert ? "Pausiert" : (l.textmodus ? `Teil ${index + 1} von ${segmente.length} (Text)` : `Teil ${index + 1} von ${segmente.length}`))) : "Bereit";
    const bewertung = l ? l.bewertung : "";

    return `<main class="uebung" data-t="uebung">
      <h2>${esc(u.titel)}</h2>
      <p>${esc(u.wofuer || "")}</p>

      <section class="karte hinweis">${esc(tex.uebungAbbrechen || "")} ${esc(u.hinweis || "")}</section>
      <div class="uebung-leiste">
        ${!gestartet ? `<button class="knopf haupt" data-a="uebung-start" data-z="${esc(u.id)}" data-t="uebung-start">Anhören starten</button>` : ""}
        ${gestartet && l.textmodus ? `<button class="knopf haupt" data-a="uebung-weiter" data-t="uebung-weiter">Nächster Teil</button>` : ""}
        ${gestartet && !l.textmodus && !pausiert ? `<button class="knopf" data-a="uebung-pause" data-t="uebung-pause">Pause</button>` : ""}
        ${gestartet && !l.textmodus && pausiert ? `<button class="knopf" data-a="uebung-fortsetzen" data-t="uebung-fortsetzen">Fortsetzen</button>` : ""}
        ${gestartet ? `<button class="knopf" data-a="uebung-stopp" data-t="uebung-stopp">Stopp</button>` : ""}
        <button class="knopf text-knopf" data-a="geh" data-z="uebungen" data-t="uebung-wechseln">Andere Übung</button>
      </div>
      <p class="uebung-status" data-t="uebung-status" aria-live="polite">${esc(statusText)}</p>
      ${gestartet && l.textmodus ? `<p class="karte hinweis">${esc(tex.keinAudio || "")}</p>` : ""}
      <ol class="segmente">
        ${segmente.map((s, i) => `<li data-t="uebung-segment" class="${l && i === index && !l.beendet ? "jetzt" : ""}" ${l && i === index && !l.beendet ? 'aria-current="step"' : ""}>${esc(s.text)}</li>`).join("")}
      </ol>
      <div class="uebung-ende" ${!l || !l.beendet ? "hidden" : ""}>
        <h3>Wie war die Übung?</h3>
