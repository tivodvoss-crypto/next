          <button class="knopf" data-a="uebung-bewertung" data-z="okay" data-t="uebung-bewertung-okay">War okay</button>
          <button class="knopf" data-a="uebung-bewertung" data-z="unangenehm" data-t="uebung-bewertung-unangenehm">War unangenehm</button>
        </div>
        ${u.skillId ? `<button class="knopf" data-a="uebung-koffer" data-t="uebung-koffer">In meinen Koffer</button>` : ""}
        ${bewertung === "unangenehm" ? `
          <section class="karte hinweis">${esc(tex.unangenehm || "")}</section>
          <button class="knopf" data-a="uebung-alternative" data-t="uebung-alternative">Alternative Außenfokus-Übung</button>
          <button class="knopf" data-a="geh" data-z="hilfe">Hilfe und Kontakte</button>
        ` : ""}
      </div>
    </main>`;
  }

  function uebungStart(id) {
    const u = (I.UEBUNGEN || []).find(x => x.id === id);
    if (!u || !KANN_VORLESEN) {
      // Ohne Sprachausgabe in den Textmodus wechseln.
      uebungZustand = { uebungId: id, index: 0, textmodus: true, pausiert: false, beendet: false, timer: null, fallbackTimer: null, bewertung: "" };
      render();
      return;
    }
    stillsein();
    uebungZustand = { uebungId: id, index: 0, textmodus: false, pausiert: false, beendet: false, timer: null, fallbackTimer: null, bewertung: "" };
    uebungSprecheSegment(0);
    render();
  }

  function uebungSprecheSegment(index) {
    const z = uebungZustand;
    if (!z || z.pausiert || z.beendet) return;
    const u = (I.UEBUNGEN || []).find(x => x.id === z.uebungId);
    if (!u) return;
    const segmente = u.segmente || [];
    if (index >= segmente.length) {
      z.beendet = true;
      render();
      return;
    }
    z.index = index;
    const segment = segmente[index];
    const utterance = new SpeechSynthesisUtterance(segment.text);
    utterance.lang = "de-DE";
    utterance.rate = S.profil.tempo || 0.9;
    utterance.pitch = 1;
    const de = speechSynthesis.getVoices().find(v => /^de/i.test(v.lang));
    if (de) utterance.voice = de;

    let onstartKam = false;
    const startTimeout = setTimeout(() => {
      if (!onstartKam) {
        // Sprachausgabe startet nicht, in den Textmodus wechseln.
        z.textmodus = true;
        speechSynthesis.cancel();
        render();
      }
    }, 2500);

    utterance.onstart = () => {
      onstartKam = true;
      clearTimeout(startTimeout);
    };
    utterance.onerror = (e) => {
      clearTimeout(startTimeout);
      if (!e.error || (e.error !== "interrupted" && e.error !== "canceled")) {
        z.textmodus = true;
        render();
      }
    };
    utterance.onend = () => {
      clearTimeout(startTimeout);
      if (z.fallbackTimer) clearTimeout(z.fallbackTimer);
      if (z.pausiert || z.beendet) return;
      const pause = segment.pause || 0;
      if (pause > 0) {
        z.timer = setTimeout(() => {
          uebungSprecheSegment(index + 1);
        }, pause * 1000);
      } else {
        uebungSprecheSegment(index + 1);
      }
      uebungUpdateStatus();
    };

    speechSynthesis.speak(utterance);
    uebungUpdateStatus();

    // Sicherheitsnetz, falls onend nie kommt.
    const textlaenge = (segment.text || "").length;
    const maxWarte = Math.max(4000, textlaenge * 90 + 4000);
    z.fallbackTimer = setTimeout(() => {
      if (!z.beendet && !z.pausiert && z.index === index) {
        speechSynthesis.cancel();
        z.textmodus = true;
        render();
      }
    }, maxWarte);
  }

  function uebungPause() {
    if (!uebungZustand || uebungZustand.pausiert || uebungZustand.beendet) return;
    speechSynthesis.cancel();
    if (uebungZustand.timer) clearTimeout(uebungZustand.timer);
    if (uebungZustand.fallbackTimer) clearTimeout(uebungZustand.fallbackTimer);
    uebungZustand.pausiert = true;
    render();
  }

  function uebungFortsetzen() {
    if (!uebungZustand || !uebungZustand.pausiert || uebungZustand.beendet) return;
    uebungZustand.pausiert = false;
    if (uebungZustand.textmodus) {
      render();
    } else {
      uebungSprecheSegment(uebungZustand.index);
      render();
    }
  }

  function uebungStopp() {
    speechSynthesis.cancel();
    if (uebungZustand) {
      if (uebungZustand.timer) clearTimeout(uebungZustand.timer);
      if (uebungZustand.fallbackTimer) clearTimeout(uebungZustand.fallbackTimer);
      uebungZustand.beendet = true;
      uebungZustand.pausiert = false;
    }
    render();
  }

  function uebungWeiterText() {
    if (!uebungZustand || !uebungZustand.textmodus || uebungZustand.beendet) return;
    const u = (I.UEBUNGEN || []).find(x => x.id === uebungZustand.uebungId);
    if (!u) return;
    uebungZustand.index++;
    if (uebungZustand.index >= (u.segmente || []).length) {
      uebungZustand.beendet = true;
    }
    uebungUpdateStatus();
    render();
  }

  function uebungUpdateStatus() {
    const statusEl = document.querySelector('[data-t="uebung-status"]');
    if (!statusEl || !uebungZustand) return;
    const u = (I.UEBUNGEN || []).find(x => x.id === uebungZustand.uebungId);
    const segmente = u ? (u.segmente || []) : [];
    const text = uebungZustand.beendet ? "Beendet" : (uebungZustand.pausiert ? "Pausiert" : `Teil ${uebungZustand.index + 1} von ${segmente.length}`);
    statusEl.textContent = text;
    const items = document.querySelectorAll('[data-t="uebung-segment"]');
    items.forEach((li, i) => {
      const aktiv = i === uebungZustand.index && !uebungZustand.beendet;
      li.classList.toggle("jetzt", aktiv);
      if (aktiv) li.setAttribute("aria-current", "step");
      else li.removeAttribute("aria-current");
    });
  }

  // ---------------------------------------------------------------- Interaktiv

  function seiteInteraktiv() {
    const tex = I.TEXTE || {};
    const held = (I.INTERAKTIV || []).find(x => x.id === "held");
    const andere = (I.INTERAKTIV || []).filter(x => x.id !== "held");

    return `<main class="interaktiv">
      <p>${esc(tex.interaktivIntro || "")}</p>
      ${held ? `<section class="karte ia-held">
        <h2>${esc(held.titel)}</h2>
        <p>${esc(held.kurz || "")}</p>
        <button class="knopf haupt" data-a="geh" data-z="arbeitsblatt/${held.id}" data-t="ia-held">Starten</button>
      </section>` : ""}
      ${andere.map(ia => `<button class="zeile" data-a="geh" data-z="arbeitsblatt/${ia.id}"><b>${esc(ia.titel)}</b><small>${esc(ia.kurz || "")}</small>${sym("weiter", "klein")}</button>`).join("")}
      <h2>Meine Karten</h2>
      ${S.karten.map(k => `<button class="zeile" data-a="geh" data-z="karte/${k.id}"><b>${esc(interaktiverTitel(k))}</b><small>${esc(datumKurz(k.lastEditedAt))}</small>${sym("weiter", "klein")}</button>`).join("") || '<p class="leer">Noch keine Karten.</p>'}
    </main>`;
  }

  function seiteArbeitsblatt(interaktivId) {
    const ia = interaktivesBlatt(interaktivId);
    if (!ia) return seiteUnbekannt();
    const tex = I.TEXTE || {};
    const entwurf = S.entwuerfe[interaktivId] || { schritt: 0, answers: {}, kartenId: null };
    const schritt = entwurf.schritt || 0;
    const schritte = ia.schritte || [];
    const aktuellerSchritt = schritte[schritt] || null;

    let entwurfHinweis = "";
    if (Object.keys(entwurf.answers || {}).length > 0) {
      entwurfHinweis = `<section class="karte hinweis">Du hast hier schon angefangen.
        <button class="text-knopf" data-a="ia-neu" data-z="${ia.id}">Neu anfangen</button>
      </section>`;
    }

    if (!aktuellerSchritt) {
      return seiteUnbekannt();
    }

    const felderHtml = (aktuellerSchritt.felder || []).map(f => {
      const wert = entwurf.answers[f.id] || "";
      switch (f.art) {
        case "text":
          return `<label class="feld"><span>${esc(f.label)}</span><input type="text" data-t="feld-${f.id}" data-feld="ia-text" data-z="${ia.id}:${f.id}" value="${esc(wert)}" placeholder="${esc(f.platzhalter || "")}"></label>`;
        case "textlang":
          return `<label class="feld"><span>${esc(f.label)}</span><textarea data-t="feld-${f.id}" data-feld="ia-text" data-z="${ia.id}:${f.id}" rows="3" placeholder="${esc(f.platzhalter || "")}">${esc(wert)}</textarea></label>`;
        case "chips": {
          const ausgewaehlt = (wert && wert.wahl) || [];
          const eigenerText = (wert && wert.text) || "";
          return `<div class="feld"><span>${esc(f.label)}</span>
            <div class="chips">
              ${(f.optionen || []).map((o, i) => `<button class="chip ${ausgewaehlt.includes(o) ? "aktiv" : ""}" data-a="ia-chip" data-z="${ia.id}:${f.id}:${i}" data-t="chip-${f.id}-${i}" aria-pressed="${ausgewaehlt.includes(o)}">${esc(o)}</button>`).join("")}
            </div>
            ${f.mitText ? `<input type="text" data-t="feld-${f.id}" data-feld="ia-chip-text" data-z="${ia.id}:${f.id}" value="${esc(eigenerText)}" placeholder="${esc(f.platzhalter || "Eigene Antwort")}" aria-label="${esc(f.label)}: eigene Antwort">` : ""}
          </div>`;
        }
        case "skills": {
          const ausgewaehlt = Array.isArray(wert) ? wert : [];
          return `<div class="feld"><span>${esc(f.label)}</span>
            <ul>${ausgewaehlt.map((ref, i) => {
              const e = eintrag(ref);
              return `<li>${e ? esc(e.titel) : "Gelöscht"} <button data-a="ia-skill-weg" data-z="${ia.id}:${f.id}:${i}" aria-label="Entfernen">${sym("x", "klein")}</button>
                <button data-a="ia-skill-hoch" data-z="${ia.id}:${f.id}:${i}" aria-label="Nach oben" ${i === 0 ? "disabled" : ""}>${sym("hoch", "klein")}</button>
                <button data-a="ia-skill-runter" data-z="${ia.id}:${f.id}:${i}" aria-label="Nach unten" ${i >= ausgewaehlt.length - 1 ? "disabled" : ""}>${sym("runter", "klein")}</button>
              </li>`;
            }).join("") || '<li class="leer">Noch keine gewählt</li>'}</ul>
            <input type="search" data-feld="ia-skill-suche" data-z="${ia.id}:${f.id}" placeholder="Skill suchen">
            <div class="ia-treffer" id="ia-treffer-${f.id}"></div>
          </div>`;
        }
        case "bereich":
          return `<div class="feld"><span>${esc(f.label)}</span>
            <div class="chips">
              ${["niedrig", "mittel", "hoch"].map(b => `<button class="chip ${wert === b ? "aktiv" : ""}" data-a="ia-bereich" data-z="${ia.id}:${f.id}:${b}" aria-pressed="${wert === b}">${esc(bereichName(b))}</button>`).join("")}
            </div>
          </div>`;
        default:
          return "";
      }
    }).join("");

    const letzter = schritt === schritte.length - 1;
    let vorschau = "";
    if (letzter && ia.ergebnis === "karte") {
      const satz = (ia.karte && ia.karte.satz) ? ia.karte.satz : "";
      const eingesetzt = satz.replace(/\{(\w+)\}/g, (m, key) => {
        const wert = entwurf.answers[key];
        if (wert === undefined || wert === null || wert === "") return "…";
        if (Array.isArray(wert)) return wert.map(ref => { const e = eintrag(ref); return e ? e.titel : "Gelöscht"; }).join(", ");
        if (typeof wert === "object") {
          const teile = (wert.wahl || []).concat(wert.text ? [wert.text] : []);
          return teile.join(", ");
        }
        return String(wert);
      });
      const felder = (ia.karte && ia.karte.felder) || [];
      vorschau = `<section class="karte karte-vorschau">
        <h3>Vorschau</h3>
        <p class="satz-vorschau">${esc(eingesetzt)}</p>
        ${felder.map(f => {
          const wert = entwurf.answers[f.id];
          const text = wert === undefined || wert === null || wert === "" ? "noch offen" : (Array.isArray(wert) ? wert.map(ref => { const e = eintrag(ref); return e ? e.titel : "Gelöscht"; }).join(", ") : (typeof wert === "object" ? ((wert.wahl || []).concat(wert.text ? [wert.text] : [])).join(", ") : String(wert)));
          return `<p><b>${esc(f.label)}</b> ${esc(text)}</p>`;
        }).join("")}
      </section>`;
    }

    return `<main class="arbeitsblatt">
      ${entwurfHinweis}
      <p class="klein">Schritt ${schritt + 1} von ${schritte.length}</p>
      ${schritt === 0 && ia.einleitung ? `<section class="karte szene">${esc(ia.einleitung)}</section>` : ""}
      ${ia.hinweis ? `<section class="karte hinweis">${esc(ia.hinweis)}</section>` : ""}
      <h2>${esc(aktuellerSchritt.titel)}</h2>
      ${aktuellerSchritt.hilfe ? `<p class="klein">${esc(aktuellerSchritt.hilfe)}</p>` : ""}
      ${felderHtml}
      ${vorschau}
      <div class="knopf-reihe">
        <button class="knopf" data-a="ia-zurueck" data-z="${ia.id}" data-t="ia-zurueck">Zurück</button>
        <button class="text-knopf" data-a="geh" data-z="interaktiv">Später weitermachen</button>
        ${letzter
          ? `<button class="knopf haupt" data-a="ia-speichern" data-z="${ia.id}" data-t="ia-speichern">Karte speichern</button>`
          : `<button class="knopf haupt" data-a="ia-weiter" data-z="${ia.id}" data-t="ia-weiter">Weiter</button>`}
      </div>
    </main>`;
  }

  function iaSpeichern(interaktivId) {
    const ia = interaktivesBlatt(interaktivId);
    if (!ia) return;
    const entwurf = S.entwuerfe[interaktivId] || { schritt: 0, answers: {}, kartenId: null };
    const answers = entwurf.answers || {};

    if (ia.ergebnis === "kette") {
      const title = answers.titel || "Meine Skillskette";
      const bereich = answers.bereich || "";
      const skills = Array.isArray(answers.skills) ? answers.skills : [];
      const steps = skills.map(ref => ({ typ: "skill", ref }));
      if (answers.wennNicht) steps.push({ typ: "text", text: answers.wennNicht });
      steps.push({ typ: "hilfe" });
      const k = {
        id: neueId(),
        title: String(title),
        purpose: "",
        bereich: bereich,
        steps: steps,
        wennNicht: String(answers.wennNicht || ""),
        trustedContacts: String(answers.helfer || ""),
        reviewedWithTeam: !!(answers.team && Array.isArray(answers.team.wahl) && answers.team.wahl.includes("Mit meinem Team abgesprochen")),
        lastEditedAt: new Date().toISOString()
      };
      S.ketten.push(k);
      delete S.entwuerfe[interaktivId];
      speichern();
      toast("Kette gespeichert");
      geh("kette/" + k.id);
      return;
    }

    // Ergebnis karte oder Standard.
    const kartenId = entwurf.kartenId || neueId();
    const befand = S.karten.findIndex(k => k.id === kartenId);
    const karteData = {
      id: kartenId,
      type: interaktivId,
      answers: answers,
      lastEditedAt: new Date().toISOString(),
      savedToKoffer: befand >= 0 ? S.karten[befand].savedToKoffer : false
    };
    if (befand >= 0) S.karten[befand] = karteData;
    else S.karten.push(karteData);
    delete S.entwuerfe[interaktivId];
    speichern();
    toast("Karte gespeichert");
    geh("karte/" + kartenId);
  }

  // ---------------------------------------------------------------- Karte

    const satz = (ia && ia.karte && ia.karte.satz) ? ia.karte.satz : "";
    const satzEingesetzt = satz.replace(/\{(\w+)\}/g, (m, key) => {
      const wert = k.answers[key];
      if (wert === undefined || wert === null || wert === "") return "…";
      if (Array.isArray(wert)) return wert.map(ref => { const e = eintrag(ref); return e ? e.titel : "Gelöscht"; }).join(", ");
      if (typeof wert === "object") {
        const teile = (wert.wahl || []).concat(wert.text ? [wert.text] : []);
        return teile.join(", ");
      }
      return String(wert);

    return `<main class="karte-ansicht" data-t="karte">
      <h2>${esc(ia ? ia.titel : k.type)}</h2>

        return `<p><b>${esc(f.label)}</b> ${esc(text)}</p>`;
      }).join("")}
      <p class="klein">zuletzt geändert: ${esc(datumKurz(k.lastEditedAt))}</p>
      <div class="knopf-reihe">
        <button class="knopf" data-a="karte-bearbeiten" data-z="${k.id}" data-t="karte-bearbeiten">Bearbeiten</button>
        <button class="knopf" data-a="karte-koffer" data-z="${k.id}" data-t="karte-koffer" aria-pressed="${k.savedToKoffer}">${k.savedToKoffer ? "Im Koffer" : "In meinen Koffer"}</button>
        <button class="knopf" data-a="karte-aktuell" data-z="${k.id}" data-t="karte-aktuell">${istAktuell ? "Aus aktuellen Skills nehmen" : "Als aktuellen Skill festlegen"}</button>
        ${zeigbar ? `<button class="knopf haupt" data-a="geh" data-z="zeigen/${k.id}">Groß zeigen</button>` : ""}
        <button class="knopf gefahr" data-a="karte-loeschen" data-z="${k.id}">Löschen</button>
      </div>
    </main>`;
  }

  function seiteZeigen(id) {
    const k = S.karten.find(x => x.id === id);

    const ia = interaktivesBlatt(k.type);
    const satz = (ia && ia.karte && ia.karte.satz) ? ia.karte.satz : "";
    const satzEingesetzt = satz.replace(/\{(\w+)\}/g, (m, key) => {
      const wert = k.answers[key];
      if (wert === undefined || wert === null || wert === "") return "…";
      if (Array.isArray(wert)) return wert.map(ref => { const e = eintrag(ref); return e ? e.titel : "Gelöscht"; }).join(", ");
      if (typeof wert === "object") {
        const teile = (wert.wahl || []).concat(wert.text ? [wert.text] : []);
        return teile.join(", ");
      }
      return String(wert);
    });

    return `<main class="zeigen">
      <p class="zeigen-satz">${esc(satzEingesetzt)}</p>
      <button class="knopf" data-a="zurueck">Schließen</button>
    </main>`;
  }

  function seiteFach() {
    const tex = I.TEXTE || {};
    const gefiltert = (I.SKILLS || []).filter(sk => {
      if (!fachSuche) return true;
      const such = normiereSuche(fachSuche);
      return [sk.title, sk.shortPurpose].concat(sk.keywords || []).some(f => normiereSuche(f).includes(such));
    });

    return `<main class="fach">
      <h2>Skill der Woche</h2>
      <section class="karte">${esc(tex.fachHinweis || "")}</section>

    if (i <= 0 || i >= aktive.length) return;
    const von = S.aktuelle.indexOf(aktive[i]);
    const nach = S.aktuelle.indexOf(aktive[i - 1]);
    const tmp = S.aktuelle[von];
    S.aktuelle[von] = S.aktuelle[nach];
    S.aktuelle[nach] = tmp;

  function waehlenTipp(ref, zweck) {
    if (zweck.startsWith("bereich-")) {
      const bereich = zweck.replace("bereich-", "");
      const e = eintrag(ref);
      if (!e) return;
      if (e.typ === "skill") {
        if (!S.einstellungen[ref]) S.einstellungen[ref] = { koffer: "nicht", fazit: null, bereiche: [], notiz: "", sort: 0 };
        if (!S.einstellungen[ref].bereiche) S.einstellungen[ref].bereiche = [];
        if (S.einstellungen[ref].bereiche.includes(bereich)) S.einstellungen[ref].bereiche = S.einstellungen[ref].bereiche.filter(b => b !== bereich);
        else S.einstellungen[ref].bereiche.push(bereich);
        render();
        return;
      }
      if (e.typ === "eigen") {
        const eig = S.eigene.find(x => x.id === ref.slice(6));
        if (eig) {
          if (!eig.bereiche) eig.bereiche = [];
          if (eig.bereiche.includes(bereich)) eig.bereiche = eig.bereiche.filter(b => b !== bereich);
          else eig.bereiche.push(bereich);
        }
        render();
        return;
      }
      if (e.typ === "kette") {
        const k = S.ketten.find(x => x.id === ref.slice(6));
        if (k) {
          k.bereich = k.bereich === bereich ? "" : bereich;
        }
        render();
        return;
      }
      return;
    }

    // aktuell oder kette
    if (zweck === "aktuell") {
      const anzahl = S.profil.anzahlAktuelle;
      if (S.aktuelle.includes(ref)) {
        toast("Bereits in deinen aktuellen Skills");
        return;
      }
      if (S.aktuelle.filter(r => eintrag(r)).length >= anzahl) {
        dialog(`<p>Du hast schon ${anzahl} aktuelle Skills. Nimm erst einen heraus oder erhöhe die Anzahl in den Einstellungen.</p>`, "Zu Einstellungen", () => geh("einstellungen"));
        return;
      }
      S.aktuelle.push(ref);
      speichern();
      toast("Hinzugefügt");
      history.back();
      return;
    }

    if (zweck.startsWith("kette-")) {
      const ketteId = zweck.replace("kette-", "");
      const k = S.ketten.find(x => x.id === ketteId);
      if (!k) return;
      k.steps.push({ typ: "skill", ref: ref });
      k.lastEditedAt = new Date().toISOString();
      speichern();
      toast("Schritt hinzugefügt");
      history.back();
      return;
    }
  }

  function exportUserData() {
    const daten = tiefeKopie(S);
    const paket = { format: "next-skills", version: 1, exportiertAm: new Date().toISOString(), daten: daten };
    const blob = new Blob([JSON.stringify(paket, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const d = new Date();
    const datum = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    a.download = "next-skills-" + datum + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    toast("Datei erstellt");
  }

  function importDatei(datei) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const roh = JSON.parse(reader.result);
        const daten = roh && typeof roh === "object" && roh.daten && typeof roh.daten === "object" ? roh.daten : roh;
        if (!daten || typeof daten !== "object" || !daten.version) {
          throw new Error("keine gültige Datei");
        }
        dialog("<p>" + esc((I.TEXTE || {}).importFrage || "Datei laden? Der aktuelle Stand wird ersetzt.") + "</p>", "Laden", () => {
          S = ergaenzen(daten);
          S.profil.eingerichtet = true;
          speichern();
          toast("Daten geladen");
          geh("start");
        });
      } catch (e) {
        dialog("<p>Diese Datei kann ich nicht lesen.</p>");
      }
    };
    reader.readAsText(datei);
  }

  function iaChip(interaktivId, feldId, index) {
    const ia = interaktivesBlatt(interaktivId);
    if (!ia) return;
    const schritt = (S.entwuerfe[interaktivId] && S.entwuerfe[interaktivId].schritt) || 0;
    const felder = ia.schritte && ia.schritte[schritt] ? (ia.schritte[schritt].felder || []) : [];
    const feld = felder.find(f => f.id === feldId);
    if (!feld) return;
    const entwurf = S.entwuerfe[interaktivId] || { schritt: schritt, answers: {}, kartenId: null };
    const answers = entwurf.answers || {};
    const wert = answers[feldId] || { wahl: [], text: "" };
    const optionen = feld.optionen || [];
    const option = optionen[Number(index)];
    if (option === undefined) return;
    if (feld.mehrfach) {
      if (wert.wahl.includes(option)) wert.wahl = wert.wahl.filter(o => o !== option);
      else wert.wahl.push(option);
    } else {
      // Einfachauswahl: nochmal tippen nimmt die Auswahl wieder weg.
      wert.wahl = wert.wahl[0] === option ? [] : [option];
    }
    answers[feldId] = wert;
    entwurf.answers = answers;
    S.entwuerfe[interaktivId] = entwurf;
    speichern();
    render();
  }

  function iaBereich(interaktivId, feldId, bereich) {

  function iaSkillWeg(interaktivId, feldId, index) {
    const entwurf = S.entwuerfe[interaktivId] || { schritt: 0, answers: {}, kartenId: null };
    const answers = entwurf.answers || {};
    const liste = Array.isArray(answers[feldId]) ? answers[feldId] : [];
    liste.splice(Number(index), 1);

  function iaSkillHoch(interaktivId, feldId, index) {
    const entwurf = S.entwuerfe[interaktivId] || { schritt: 0, answers: {}, kartenId: null };
    const answers = entwurf.answers || {};
    const liste = Array.isArray(answers[feldId]) ? answers[feldId] : [];
    const i = Number(index);
    if (i <= 0 || i >= liste.length) return;
    const tmp = liste[i];
    liste[i] = liste[i - 1];
    liste[i - 1] = tmp;
    answers[feldId] = liste;
    entwurf.answers = answers;
    S.entwuerfe[interaktivId] = entwurf;
    speichern();
    render();

    const answers = entwurf.answers || {};
    const liste = Array.isArray(answers[feldId]) ? answers[feldId] : [];
    const i = Number(index);
    if (i < 0 || i >= liste.length - 1) return;
    const tmp = liste[i];
    liste[i] = liste[i + 1];
    liste[i + 1] = tmp;
    answers[feldId] = liste;
    entwurf.answers = answers;

    speichern();
    render();
  }

  function kofferSortHoch(ref) {
    const e = eintrag(ref);
    if (!e) return;
    const alle = [];
    for (const id in S.einstellungen) {
      if (S.einstellungen[id] && (S.einstellungen[id].koffer === "bewaehrt" || S.einstellungen[id].koffer === "testen")) {
        alle.push(id);
      }
    }
    S.eigene.forEach(e => alle.push("eigen:" + e.id));
    const index = alle.indexOf(ref);
    if (index <= 0) return;
    const andere = alle[index - 1];
    const sortA = getSort(ref);
    const sortB = getSort(andere);
    setSort(ref, sortB);
    setSort(andere, sortA);
    speichern();
    render();
  }

  function kofferSortRunter(ref) {
    const e = eintrag(ref);
    if (!e) return;
    const alle = [];
    for (const id in S.einstellungen) {
      if (S.einstellungen[id] && (S.einstellungen[id].koffer === "bewaehrt" || S.einstellungen[id].koffer === "testen")) {
        alle.push(id);
      }
    }
    S.eigene.forEach(e => alle.push("eigen:" + e.id));
    const index = alle.indexOf(ref);
    if (index < 0 || index >= alle.length - 1) return;
    const andere = alle[index + 1];
    const sortA = getSort(ref);
    const sortB = getSort(andere);
    setSort(ref, sortB);
    setSort(andere, sortA);
    speichern();
    render();
  }

  function getSort(ref) {
    if (ref.startsWith("eigen:")) {
      const e = S.eigene.find(x => x.id === ref.slice(6));
      return e ? (e.sort || 0) : 0;
    }
    const ein = S.einstellungen[ref];
    return ein ? (ein.sort || 0) : 0;
  }

  function setSort(ref, wert) {
    if (ref.startsWith("eigen:")) {
      const e = S.eigene.find(x => x.id === ref.slice(6));
      if (e) e.sort = wert;
    } else {
      if (!S.einstellungen[ref]) S.einstellungen[ref] = { koffer: "nicht", fazit: null, bereiche: [], notiz: "", sort: 0 };
      S.einstellungen[ref].sort = wert;
    }
  }

  function kofferStatusWechsel(ref) {
    const e = eintrag(ref);
    if (!e) return;
    const aktuell = ref.startsWith("eigen:") ? (S.eigene.find(x => x.id === ref.slice(6))?.koffer || "testen") : (S.einstellungen[ref]?.koffer || "testen");
    const neu = aktuell === "bewaehrt" ? "testen" : "bewaehrt";
    if (ref.startsWith("eigen:")) {
      const eig = S.eigene.find(x => x.id === ref.slice(6));

    } else {
      if (!S.einstellungen[ref]) S.einstellungen[ref] = { koffer: "nicht", fazit: null, bereiche: [], notiz: "", sort: 0 };

      const eig = S.eigene.find(x => x.id === ref.slice(6));

  }

          const [id, bereich] = z.split(":");
          eigenBereich(id, bereich);
        }
        break;
      case "eigen-koffer":
        {
          const [id, status] = z.split(":");
          eigenKoffer(id, status);
        }
        break;
      case "eigen-aktuell":
        eigenAktuell(z);
        break;
      case "eigen-loeschen":
        eigenLoeschen(z);
        break;
      case "vorlage":
        vorlageAusfuehren(z);
        break;
      case "waehlen-tipp":
        {
          const [ref, zweck] = z.split(":");
          waehlenTipp(ref, zweck);
        }
        break;
      case "waehlen-fertig":
        waehlenFertig(z);
        break;
      case "grenzen-zuruecksetzen":
        grenzenZuruecksetzen();
        break;
      case "warn-hinzu":
        warnHinzu(z);
        break;
      case "warn-weg":
        {
          const [bereich, index] = z.split(":");
          warnWeg(bereich, index);
        }
        break;
      case "warn-beispiel":
        {
          const [bereich, text] = z.split(":");
          warnBeispiel(bereich, text);
        }
        break;
      case "wissen-vorauswahl":
        wissenVorauswahl(z);
        break;
      case "uebung-start":
        uebungStart(z);
        break;
      case "uebung-pause":
        uebungPause();
        break;
      case "uebung-fortsetzen":
        uebungFortsetzen();
        break;
      case "uebung-stopp":
        uebungStopp();
        break;
      case "uebung-weiter":
        uebungWeiterText();
        break;
      case "uebung-bewertung":
        uebungBewertung(z);
        break;
      case "uebung-koffer":
        uebungKoffer();
        break;
      case "uebung-alternative":
        uebungAlternative();
        break;
      case "ia-weiter":
        iaWeiter(z);
        break;
      case "ia-zurueck":
        iaZurueck(z);
        break;
      case "ia-neu":
        iaNeu(z);
        break;
      case "ia-chip":
        {
          const [iaId, feldId, index] = z.split(":");
          iaChip(iaId, feldId, index);
        }
        break;
      case "ia-bereich":
        {
          const [iaId, feldId, bereich] = z.split(":");
          iaBereich(iaId, feldId, bereich);
        }
        break;
      case "ia-skill-weg":
        {
          const [iaId, feldId, index] = z.split(":");
          iaSkillWeg(iaId, feldId, index);
        }
        break;
      case "ia-skill-hoch":
        {
          const [iaId, feldId, index] = z.split(":");
          iaSkillHoch(iaId, feldId, index);
        }
        break;
      case "ia-skill-runter":
        {
          const [iaId, feldId, index] = z.split(":");
          iaSkillRunter(iaId, feldId, index);
        }
        break;
      case "ia-speichern":
        iaSpeichern(z);
        break;
      case "karte-bearbeiten":
        karteBearbeiten(z);
        break;
      case "karte-koffer":
        karteKoffer(z);
        break;
      case "karte-aktuell":
        karteAktuell(z);
        break;
      case "karte-loeschen":
        karteLoeschen(z);
        break;
      case "kontakt-weg":
        kontaktWeg(z);
        break;
      case "kontakt-hinzu":
        kontaktHinzu();
        break;
      case "look":
        lookSetzen(z);
        break;
      case "tempo":
        tempoSetzen(z);
        break;
      case "export":
        exportUserData();
        break;
      case "loeschen":
        allesLoeschen();
        break;
      case "beispiel-laden":
        beispielLaden();
        break;
      case "probe-hoeren":
        probeHoeren();
        break;
      case "fach-skill":
        fachSkillSetzen(z);
        break;
      case "fach-keiner":
        fachKeiner();
        break;
      case "koffer-bereich-filter":
        kofferBereichFilter = z;
        render();
        break;
      case "koffer-sort-hoch":
        kofferSortHoch(z);
        break;
      case "koffer-sort-runter":
        kofferSortRunter(z);
        break;
      case "koffer-status-wechsel":
        kofferStatusWechsel(z);
        break;
      case "koffer-bereich":
        {
          const [ref, bereich] = z.split(":");
          kofferBereichUmschalten(ref, bereich);
        }
        break;
      case "erfahrung-filter-bereich":
        erfahrungFilterBereich(z);
        break;
      case "erfahrung-filter-situation":
        erfahrungFilterSituation(z);
        break;
      default:
        break;
    }
  }

  // ---------------------------------------------------------------- Ereignisse

  document.addEventListener("click", function (e) {
    const el = e.target.closest("[data-a]");
    if (!el) return;
    if (el.closest(".dialog-grund")) return;
    e.preventDefault();
    const aktion = el.dataset.a;
    const z = el.dataset.z || "";
    handleAktion(aktion, z, el);
  });

  document.addEventListener("input", function (e) {
    const el = e.target;
    const feld = el.dataset && el.dataset.feld;
    if (!feld) return;

    if (feld === "suche") {
      sucheText = el.value;
      updateTrefferListe();
      return;
    }
    if (feld === "waehlen-suche") {
      sucheText = el.value;
      const liste = document.getElementById("waehlen-liste");
      if (liste) {
        const zweck = weg().param;
        liste.innerHTML = seiteWaehlenInhalt(zweck);
      }
      return;
    }
    if (feld === "notiz") {
      const id = el.dataset.z;
      if (!S.einstellungen[id]) S.einstellungen[id] = { koffer: "nicht", fazit: null, bereiche: [], notiz: "", sort: 0 };
      S.einstellungen[id].notiz = el.value;
      speichern();
      return;
    }
    if (feld === "test-vorher") {
      if (testFlow) {
        testFlow.vorher = el.value ? zahl(el.value) : null;
        el.value = testFlow.vorher != null ? testFlow.vorher : 50;
        const anzeige = document.getElementById("regler-vorher-anzeige");
        if (anzeige) anzeige.textContent = testFlow.vorher != null ? testFlow.vorher : "nicht eingestellt";
      }
      return;
    }
    if (feld === "test-nachher") {
      if (testFlow) {
        testFlow.nachher = el.value ? zahl(el.value) : null;
        el.value = testFlow.nachher != null ? testFlow.nachher : 50;
        const anzeige = document.getElementById("regler-nachher-anzeige");
        if (anzeige) anzeige.textContent = testFlow.nachher != null ? testFlow.nachher : "nicht eingestellt";
      }
      return;
    }
    if (feld === "test-kommentar") {
      if (testFlow) testFlow.kommentar = el.value;
      return;
    }
    if (feld === "spannung-regler") {
      spannungWert = el.value ? zahl(el.value) : null;
      if (spannungWert != null) {
        const bereich = bereichVon(spannungWert);
        const anzeige = document.getElementById("spannung-wert");
        if (anzeige) anzeige.textContent = spannungWert;
        el.setAttribute("aria-valuetext", spannungWert + ", " + bereichName(bereich));
        const zone = document.querySelector('[data-t="zone"]');
        if (zone) {
          zone.dataset.zone = bereich || "unbekannt";
          zone.textContent = bereich ? bereichName(bereich) : "Noch kein Bereich ausgewählt";
        }
        const felder = document.querySelectorAll(".skala-feld");
        felder.forEach(f => {
          f.classList.toggle("aktiv", f.textContent.trim() === (bereich ? bereichName(bereich) : ""));
        });
      }
      return;
    }
    if (feld === "grenze1") {
      let v = Number(el.value);
      v = Math.max(5, Math.min(90, v));
      S.spannung.grenze1 = v;
      if (S.spannung.grenze1 >= S.spannung.grenze2 - 4) {
        S.spannung.grenze2 = Math.min(95, S.spannung.grenze1 + 5);
      }
      speichern();
      render();
      return;
    }
    if (feld === "grenze2") {
      let v = Number(el.value);
      v = Math.max(10, Math.min(95, v));
      S.spannung.grenze2 = v;
      if (S.spannung.grenze1 >= S.spannung.grenze2 - 4) {
        S.spannung.grenze1 = Math.max(5, S.spannung.grenze2 - 5);
      }
      speichern();
      render();
      return;
    }
    if (feld === "warn-neu") {
      // Nichts speichern, nur der Wert bleibt im Feld.
      return;
    }
    if (feld === "kette-name") {
      const k = S.ketten.find(x => x.id === el.dataset.z);
      if (k) { k.title = el.value; k.lastEditedAt = new Date().toISOString(); speichern(); }
      return;
    }
    if (feld === "kette-zweck") {
      const k = S.ketten.find(x => x.id === el.dataset.z);
      if (k) { k.purpose = el.value; k.lastEditedAt = new Date().toISOString(); speichern(); }
      return;
    }
    if (feld === "kette-wenn-nicht") {
      const k = S.ketten.find(x => x.id === el.dataset.z);
      if (k) { k.wennNicht = el.value; k.lastEditedAt = new Date().toISOString(); speichern(); }
      return;
    }
    if (feld === "kette-kontakte") {
      const k = S.ketten.find(x => x.id === el.dataset.z);
      if (k) { k.trustedContacts = el.value; k.lastEditedAt = new Date().toISOString(); speichern(); }
      return;
    }
    if (feld === "kette-team") {
      const k = S.ketten.find(x => x.id === el.dataset.z);
      if (k) { k.reviewedWithTeam = el.checked; k.lastEditedAt = new Date().toISOString(); speichern(); }
      return;
    }
    if (feld === "eigen-name") {
      const e = S.eigene.find(x => x.id === el.dataset.z);
      if (e) { e.title = el.value; speichern(); }
      return;
    }
    if (feld === "eigen-zweck") {
      const e = S.eigene.find(x => x.id === el.dataset.z);
      if (e) { e.shortPurpose = el.value; speichern(); }
      return;
    }
    if (feld === "eigen-schritte") {
      const e = S.eigene.find(x => x.id === el.dataset.z);
      if (e) { e.instructions = el.value.split("\n").map(s => s.trim()).filter(Boolean); speichern(); }
      return;
    }
    if (feld === "kontakt-name") {
      kontaktForm.name = el.value;
      return;
    }
    if (feld === "kontakt-rolle") {
      kontaktForm.rolle = el.value;
      return;
    }
    if (feld === "kontakt-telefon") {
      kontaktForm.telefon = el.value;
      return;
    }
    if (feld.startsWith("plan-")) {
      const id = feld.replace("plan-", "");
      if (!S.hilfe.plan) S.hilfe.plan = {};
      S.hilfe.plan[id] = el.value;
      speichern();
      return;
    }
    if (feld.startsWith("ia-text")) {
      const [iaId, feldId] = el.dataset.z.split(":");
      const entwurf = S.entwuerfe[iaId] || { schritt: 0, answers: {}, kartenId: null };
      const answers = entwurf.answers || {};
      answers[feldId] = el.value;
      entwurf.answers = answers;
      S.entwuerfe[iaId] = entwurf;
      speichern();
      return;
    }
    if (feld === "ia-chip-text") {
      const [iaId, feldId] = el.dataset.z.split(":");
      const entwurf = S.entwuerfe[iaId] || { schritt: 0, answers: {}, kartenId: null };
      const answers = entwurf.answers || {};
      const wert = answers[feldId] || { wahl: [], text: "" };
      wert.text = el.value;
      answers[feldId] = wert;
      entwurf.answers = answers;
      S.entwuerfe[iaId] = entwurf;
      speichern();
      return;
    }
    if (feld === "ia-skill-suche") {
      const [iaId, feldId] = el.dataset.z.split(":");
      const such = normiereSuche(el.value);
      const treffer = document.getElementById("ia-treffer-" + feldId);
      if (treffer) {
        const kofferSkills = [];
        for (const id in S.einstellungen) {
          if (S.einstellungen[id] && (S.einstellungen[id].koffer === "bewaehrt" || S.einstellungen[id].koffer === "testen")) {
            const sk = (I.SKILLS || []).find(x => x.id === id);
            if (sk) kofferSkills.push(sk);
          }
        }
        const alle = [...kofferSkills, ...(I.SKILLS || []).filter(sk => !kofferSkills.find(k => k.id === sk.id))];
        const gefiltert = alle.filter(sk => {
          if (!such) return true;
          return [sk.title, sk.shortPurpose].concat(sk.keywords || [], sk.instructions || []).some(f => normiereSuche(f).includes(such));
        });
        treffer.innerHTML = gefiltert.map(sk => `<button class="chip" data-a="ia-skill-waehlen" data-z="${iaId}:${feldId}:${sk.id}">${esc(sk.title)}</button>`).join("");
      }
      return;
    }
    if (feld === "fach-suche") {
      fachSuche = el.value;
      render();
      return;
    }
    if (feld === "fach-hinweis") {
      S.fach.hinweis = el.value;
      speichern();
      return;
    }
    if (feld === "import") {
      if (el.files && el.files[0]) {
        importDatei(el.files[0]);
        el.value = "";
      }
      return;
    }
  });

  document.addEventListener("change", function (e) {
    const el = e.target;
    if (el.matches(".fazit-wahl")) {
      const zeile = el.closest(".skill-zeile");
      if (!zeile) return;
      const id = zeile.dataset.id;
      setzeFazit(id, el.value, "quick");
      updateZeile(id);
      return;
    }
    if (el.type === "file" && el.dataset && el.dataset.feld === "import") {
      if (el.files && el.files[0]) {
        importDatei(el.files[0]);
        el.value = "";
      }
    }
  });

  // Enter im Einzeiler löst den Knopf daneben aus.
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
    const el = e.target;
    if (el.dataset && el.dataset.feld === "warn-neu") {
      const bereich = el.dataset.z;
      const container = el.parentElement;
      const knopf = container && container.querySelector('button[data-a="warn-hinzu"][data-z="' + bereich + '"]');
      if (knopf) { e.preventDefault(); knopf.click(); }
    }
  });

  // ---------------------------------------------------------------- Beispiele und Brücke

  function getQuickSkills() {
    return S.aktuelle.filter(ref => eintrag(ref)).slice(0, S.profil.anzahlAktuelle).map(ref => {
      const e = eintrag(ref);
      return { ref: e.ref, typ: e.typ, titel: e.titel, zweck: e.zweck };
    });
  }

  function getPersonalSkillsBySituation(x) {
    const ergebnis = [];
    const dazu = (ref) => {
      const e = eintrag(ref);
      if (!e) return;
      if (ergebnis.find(v => v.ref === ref)) return;
      ergebnis.push({ ref: e.ref, typ: e.typ, titel: e.titel, zweck: e.zweck });
    };

    let bereich = null;
    if (typeof x === "number") {
      bereich = bereichVon(x);
    } else if (typeof x === "string") {
      if (x === "niedrig" || x === "mittel" || x === "hoch") bereich = x;
      else {
        const sk = (I.SKILLS || []).find(s => (s.situationTags || []).includes(x));
        if (sk) bereich = null;
      }
    }

    const bewaehrt = [];
    const testen = [];
    for (const id in S.einstellungen) {
      const e = S.einstellungen[id];
      if (!e || (e.koffer !== "bewaehrt" && e.koffer !== "testen")) continue;
      const sk = (I.SKILLS || []).find(s => s.id === id);
      if (!sk) continue;
      const passtBereich = !bereich || (e.bereiche || []).includes(bereich);
      const passtSituation = typeof x === "string" && x !== "niedrig" && x !== "mittel" && x !== "hoch" ? (sk.situationTags || []).includes(x) : true;
      if (passtBereich && passtSituation) {
        if (e.koffer === "bewaehrt") bewaehrt.push(id);
        else testen.push(id);
      }
    }
    S.eigene.forEach(e => {
      if (!e || !e.koffer || (e.koffer !== "bewaehrt" && e.koffer !== "testen")) return;
      const passtBereich = !bereich || (e.bereiche || []).includes(bereich);
      if (passtBereich) {
        if (e.koffer === "bewaehrt") bewaehrt.push("eigen:" + e.id);
        else testen.push("eigen:" + e.id);
      }
    });
    S.ketten.forEach(k => {
      const passtBereich = !bereich || k.bereich === bereich;
      if (passtBereich) bewaehrt.push("kette:" + k.id);
    });

    bewaehrt.forEach(dazu);
    testen.forEach(dazu);
    return ergebnis;
  }

  function startSkill(ref) {
    const e = eintrag(ref);
    if (!e || !e.ziel) return false;
    geh(e.ziel.replace(/^#/, ""));
    return true;
  }

  function saveExperience(obj) {
    if (!obj || typeof obj !== "object") return null;
    if (!obj.skillId && !obj.uebungId) return null;
    const erlaubteHilfreich = [null, "geholfen", "teilweise", "nicht", "ungetestet", "unklar"];
    const erlaubteAngenehm = [null, "ja", "etwas", "nein", "gut", "okay", "unangenehm"];
    const erlaubteFunktional = [null, "ja", "etwas", "nein"];
    if (obj.helpfulness !== undefined && obj.helpfulness !== null && !erlaubteHilfreich.includes(obj.helpfulness)) return null;
    if (obj.pleasantness !== undefined && obj.pleasantness !== null && !erlaubteAngenehm.includes(obj.pleasantness)) return null;
    if (obj.functionalBenefit !== undefined && obj.functionalBenefit !== null && !erlaubteFunktional.includes(obj.functionalBenefit)) return null;
    if (obj.tensionBefore !== undefined && obj.tensionBefore !== null) {
      const n = zahl(obj.tensionBefore);
      if (n === null) return null;
      obj.tensionBefore = n;
    }
    if (obj.tensionAfter !== undefined && obj.tensionAfter !== null) {
      const n = zahl(obj.tensionAfter);
      if (n === null) return null;
      obj.tensionAfter = n;
    }
    const eintragNeu = {
      id: neueId(),
      skillId: obj.skillId || null,
      uebungId: obj.uebungId || null,
      timestamp: obj.timestamp || new Date().toISOString(),
      entryMode: "retrospective",
      helpfulness: obj.helpfulness || null,
      tensionBefore: obj.tensionBefore !== undefined ? obj.tensionBefore : null,
      tensionAfter: obj.tensionAfter !== undefined ? obj.tensionAfter : null,
      pleasantness: obj.pleasantness || null,
      functionalBenefit: obj.functionalBenefit || null,
      situationTag: String(obj.situationTag || ""),
      note: String(obj.note || "")
    };
    S.erfahrungen.push(eintragNeu);
    speichern();
    return JSON.parse(JSON.stringify(eintragNeu));
  }

  function getPersonalSafetyPlan() {
    return {
      kontakte: JSON.parse(JSON.stringify(S.hilfe.kontakte)),
      plan: JSON.parse(JSON.stringify(S.hilfe.plan)),
      notruf: JSON.parse(JSON.stringify(I.NOTRUF || []))
    };
  }

  function exportBridge() {
    return exportUserDataInner();
  }

  function exportUserDataInner() {
    const daten = tiefeKopie(S);
    return { format: "next-skills", version: 1, exportiertAm: new Date().toISOString(), daten: daten };
  }

  function deleteBridge() {
    return deleteUserData();
  }

  window.NEXTSkills = {
    getQuickSkills,
    getPersonalSkillsBySituation,
    startSkill,
    saveExperience,
    getPersonalSafetyPlan,
    exportUserData: exportBridge,
    deleteUserData: deleteBridge
  };

  // ---------------------------------------------------------------- Routing

  function seite(w) {
    switch (w.bereich) {
      case "start":
        return seiteStart();
      case "alle":
        return seiteAlle();
      case "skill":
        return seiteSkill(w.param);
      case "schritte":
        return seiteSchritte(w.param);
      case "test":
        return seiteTest(w.param);
      case "koffer":
        if (w.seite) return seiteKofferTeil(w.seite);
        return seiteKoffer();
      case "kette":
        return seiteKette(w.param);
      case "kette-start":
        return seiteKetteStart(w.param);
      case "eigen":
        return seiteEigen(w.param);
      case "vorlagen":
        return seiteVorlagen();
      case "waehlen":
        return seiteWaehlen(w.param);
      case "spannung":
        return seiteSpannung();
      case "wissen":
        if (w.seite) return seiteWissenSeite(w.seite);
        return seiteWissen();
      case "uebungen":
        return seiteUebungen();
      case "uebung":
        return seiteUebung(w.param);
      case "interaktiv":
        return seiteInteraktiv();
      case "arbeitsblatt":
        return seiteArbeitsblatt(w.param);
      case "karte":
        return seiteKarte(w.param);
      case "zeigen":
        return seiteZeigen(w.param);
      case "hilfe":
        if (w.seite === "kontakte") return seiteHilfeKontakte();
        if (w.seite === "plan") return seiteHilfePlan();
        return seiteHilfe();
      case "einstellungen":
        return seiteEinstellungen();
      case "fach":
        return seiteFach();
      default:
        return seiteUnbekannt();
    }
  }

  function seiteKofferTeil(teil) {
    switch (teil) {
      case "aktuelle": return seiteKofferAktuelle();
      case "bewaehrt": return seiteKofferBewaehrtOderTesten("bewaehrt");
      case "testen": return seiteKofferBewaehrtOderTesten("testen");
      case "ketten": return seiteKofferKetten();
      case "eigene": return seiteKofferEigene();
      case "erfahrungen": return seiteKofferErfahrungen();
      default: return seiteUnbekannt();
    }
  }

  // ---------------------------------------------------------------- Start

  laden();
  speichern();
  if (!location.hash || location.hash === "#" || location.hash === "#einstieg") {
    if (!S.profil.eingerichtet) {
      location.hash = "einstieg";
    } else {
      location.hash = "start";
    }
  }
  render();
})();

</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');</script>
