<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="NEXT Skills & Achtsamkeit, Prototyp ohne Klinikfreigabe">
<title>NEXT Skills</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* NEXT Modul "Skills & Achtsamkeit", ruhige, moderne Oberfläche.
   Mobile App für Jugendliche von 13 bis 18 Jahren in einer Kinder-
   und Jugendpsychiatrie. Systemschrift, kräftige Kontraste, große
   Touchflächen. Keine Verläufe, kein Neon, kaum Animationen. */

:root {
  --grund: #f6f5f1;
  --flaeche: #ffffff;
  --flaeche2: #eeece6;
  --text: #1c2321;
  --leise: #4f5754;
  --linie: #d6d2c8;
  --akzent: #0f766e;
  --akzent-text: #ffffff;
  --akzent-hell: #d7efe9;
  --notfall: #b4233a;
  --warnung-grund: #fff4dc;
  --warnung-text: #6b4400;
  --skala-mittel: #fde7b0;
  --skala-hoch: #f6c9cf;
  --skala-mittel-dunkel: #4a3b12;
  --skala-hoch-dunkel: #4a1d24;
  --dialog-overlay: rgba(0, 0, 0, 0.45);
  --rund: 18px;
  color-scheme: light;
}

:root[data-look="dunkel"] {
  --grund: #10151a;
  --flaeche: #19212a;
  --flaeche2: #222c37;
  --text: #eef2f1;
  --leise: #a9b6b4;
  --linie: #33414e;
  --akzent: #5eead4;
  --akzent-text: #062b27;
  --akzent-hell: #163a37;
  --notfall: #fca5a5;
  --warnung-grund: #3a2e14;
  --warnung-text: #fcd58a;
  --skala-mittel: #4a3b12;
  --skala-hoch: #4a1d24;
  --dialog-overlay: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-look="hell"]) {
    --grund: #10151a;
    --flaeche: #19212a;
    --flaeche2: #222c37;
    --text: #eef2f1;
    --leise: #a9b6b4;
    --linie: #33414e;
    --akzent: #5eead4;
    --akzent-text: #062b27;
    --akzent-hell: #163a37;
    --notfall: #fca5a5;
    --warnung-grund: #3a2e14;
    --warnung-text: #fcd58a;
    --skala-mittel: #4a3b12;
    --skala-hoch: #4a1d24;
    --dialog-overlay: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--grund);
  color: var(--text);
  font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-wrap: anywhere;
}

#app {
  max-width: 640px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 96px;
}

main {
  padding: 4px 16px 32px;
}

h1,
h2,
h3,
p {
  margin: 0 0 10px;
}

h1 {
  font-size: 18px;
  margin: 0;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.3;
}

h2 {
  font-size: 22px;
  line-height: 1.3;
  margin: 6px 0 12px;
  letter-spacing: -0.01em;
}

h3 {
  font-size: 17px;
  font-weight: 700;
  margin: 20px 0 8px;
  line-height: 1.4;
}

p {
  margin: 0 0 10px;
}

small {
  font-size: 16px;
  color: var(--leise);
  line-height: 1.45;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
a,
select,
input,
textarea,
summary {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

button {
  border: none;
  background: none;
}

/* Mindestgröße für alle interaktiven Elemente */
button,
a,
select,
input,
textarea,
summary,
.chip,
.koffer-knopf,
.text-knopf {
  min-height: 44px;
  min-width: 44px;
}

/* Ausnahme: Range-Regler haben eigene große Trefferfläche */
input[type="range"] {
  height: 44px;
  min-width: 0;
  accent-color: var(--akzent);
}

:focus-visible {
  outline: 3px solid var(--akzent);
  outline-offset: 2px;
}

[hidden] {
  display: none !important;
}

/* Symbole */
.sym {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}

.sym.klein {
  width: 18px;
  height: 18px;
  color: var(--leise);
}

img,
svg {
  max-width: 100%;
}

/* Kopfzeile */
.kopf {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 12px 10px;
  position: sticky;
  top: 0;
  background: var(--grund);
  border-bottom: 1px solid var(--linie);
  z-index: 20;
  padding-top: calc(14px + env(safe-area-inset-top));
}

.kopf h1 {
  flex: 1;
  text-align: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 18px;
}

.kopf-knopf {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: transparent;
  color: var(--text);
}

.kopf-hilfe {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  min-width: 44px;
  padding: 8px 12px;
  border: 1px solid var(--notfall);
  border-radius: 14px;
  background: transparent;
  color: var(--notfall);
  font-weight: 600;
  font-size: 16px;
  white-space: nowrap;
}

.kopf-hilfe .sym {
  width: 20px;
  height: 20px;
  stroke: currentColor;
}

.kopf-titel {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}

/* Karten und generische Inhalte */
.karte {
  background: var(--flaeche);
  border-radius: var(--rund);
  padding: 18px;
  margin: 12px 0;
  border: 1px solid var(--linie);
}

.hinweis,
.sicherheit {
  background: var(--warnung-grund);
  color: var(--warnung-text);
  border-radius: 14px;
  padding: 16px;
  margin: 12px 0;
  border: 1px solid transparent;
}

.szene {
  background: var(--akzent-hell);
  border-radius: 14px;
  padding: 16px;
  margin: 12px 0;
  font-style: italic;
  color: var(--text);
}

.mini-uebung {
  background: var(--flaeche2);
  border-radius: 14px;
  padding: 16px;
  margin: 12px 0;
  border: 1px solid var(--linie);
}

.beispiel {
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-radius: 14px;
  padding: 16px;
  margin: 12px 0;
}

.prototyp {
  border: 1px solid var(--leise);
  border-radius: 14px;
  padding: 16px;
  margin: 12px 0;
  background: var(--flaeche);
}

.karte-vorschau,
.karte-ansicht {
  background: var(--flaeche);
  border: 2px solid var(--akzent);
  border-radius: 18px;
  padding: 20px;
  margin: 16px 0;
}

.satz-vorschau {
  font-size: 19px;
  font-weight: 600;
  line-height: 1.45;
  margin-bottom: 12px;
}

/* Knöpfe */
.knopf {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 52px;
  padding: 12px 16px;
  margin: 8px 0;
  border-radius: 14px;
  border: 1px solid var(--linie);
  background: var(--flaeche);
  font-weight: 600;
  font-size: 17px;
  text-align: center;
  color: var(--text);
}

.knopf:active {
  background: var(--flaeche2);
}

.knopf.haupt {
  background: var(--akzent);
  color: var(--akzent-text);
  border-color: var(--akzent);
  min-height: 56px;
  font-size: 17px;
}

.knopf.notfall {
  background: var(--notfall);
  border-color: var(--notfall);
  color: #ffffff;
  min-height: 60px;
  font-size: 18px;
}

:root[data-look="dunkel"] .knopf.notfall {
  color: #2a0909;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-look="hell"]) .knopf.notfall {
    color: #2a0909;
  }
}

.knopf.gefahr {
  color: var(--notfall);
  border: 1px solid var(--notfall);
  background: transparent;
}

.knopf.hilfe-holen {
  border: 1px solid var(--notfall);
  color: var(--notfall);
  background: transparent;
}

.text-knopf {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  min-width: 44px;
  padding: 10px 14px;
  margin: 8px 0;
  background: none;
  border: none;
  color: var(--akzent);
  font-weight: 600;
  font-size: 16px;
  text-align: center;
}

.knopf-reihe {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0;
}

.knopf-reihe .knopf {
  flex: 1 1 auto;
}

.knopf-reihe.senkrecht {
  flex-direction: column;
}

.datei-knopf {
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  padding: 12px 16px;
  margin: 8px 0;
  border-radius: 14px;
  border: 1px solid var(--linie);
  background: var(--flaeche);
  font-weight: 600;
  font-size: 17px;
  text-align: center;
  color: var(--text);
  min-width: 100%;
}

/* Chips */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0 14px;
}

.chip {
  border: 1px solid var(--linie);
  background: var(--flaeche);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 16px;
  min-height: 44px;
  min-width: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin: 0;
  color: var(--text);
  cursor: pointer;
}

.chip.aktiv,
.chip[aria-pressed="true"] {
  background: var(--akzent);
  border-color: var(--akzent);
  color: var(--akzent-text);
  font-weight: 600;
}

.chip.vorauswahl {
  background: var(--akzent-hell);
  border-color: var(--akzent);
  color: var(--text);
  margin: 4px 4px 4px 0;
}

.chip.vorauswahl button {
  min-height: 32px;
  min-width: 32px;
  padding: 0 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  color: inherit;
}

/* Zeilen (Navigationsliste, Auswahl) */
.zeile {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-radius: 14px;
  padding: 14px;
  margin: 8px 0;
  min-height: 64px;
  color: var(--text);
}

.zeile-sym {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--akzent-hell);
  color: var(--akzent);
  flex: none;
}

.zeile-text {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.zeile-text b {
  font-weight: 700;
  font-size: 17px;
  line-height: 1.4;
}

.zeile-text small {
  color: var(--leise);
  font-size: 16px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hilfe-zeile .zeile-sym {
  background: var(--notfall);
  color: #ffffff;
}

:root[data-look="dunkel"] .hilfe-zeile .zeile-sym {
  color: #2a0909;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-look="hell"]) .hilfe-zeile .zeile-sym {
    color: #2a0909;
  }
}

/* Startseite */
.abschnitt {
  margin-top: 4px;
}

.abschnitt-kopf {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 8px 0;
}

.aktuell-kacheln {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.aktuell-kachel {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 72px;
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-left: 4px solid var(--akzent);
  border-radius: 14px;
  padding: 16px;
}

.aktuell-kachel-knopf {
  background: transparent;
  border: none;
  text-align: left;
  color: var(--text);
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 72px;
  width: 100%;
  cursor: pointer;
}

.aktuell-kachel-knopf b {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.3;
}

.aktuell-kachel-knopf small {
  font-size: 16px;
  color: var(--leise);
}

.aktuell-frei {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 72px;
  padding: 12px 16px;
  border: 1px dashed var(--linie);
  border-radius: 14px;
  background: transparent;
  color: var(--leise);
  font-size: 16px;
  text-align: center;
}

.aktuell-werkzeuge {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.aktuell-werkzeuge button,
.schritt-werkzeuge button,
.koffer-zeile .zeile-aktionen button,
.warn-gruppe .text-knopf,
.ia-treffer .chip {
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--linie);
  border-radius: 10px;
  background: var(--flaeche);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  cursor: pointer;
}

.aktuell-werkzeuge button[disabled],
.schritt-werkzeuge button[disabled] {
  opacity: 0.5;
  pointer-events: none;
}

.anzahl-wahl {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 16px 0;
  flex-wrap: wrap;
}

.anzahl-wahl span {
  font-size: 16px;
  font-weight: 600;
}

.nav-liste {
  margin-top: 16px;
}

/* Alle Skills, Liste */
.skill-zeile {
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-radius: 14px;
  margin: 8px 0;
  padding: 0;
  overflow: hidden;
}

.zeile-kopf {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: transparent;
  border: none;
  text-align: left;
  padding: 16px;
  color: var(--text);
  cursor: pointer;
  min-height: 72px;
}

.zeile-kopf b {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.4;
}

.zeile-kopf small {
  font-size: 16px;
  color: var(--leise);
}

.zeile-mehr {
  padding: 16px;
  border-top: 1px solid var(--linie);
  margin-left: 16px;
  border-left: 1px solid var(--linie);
}

.zeile-aktionen {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--linie);
  align-items: center;
}

.fazit-wahl {
  flex: 1 1 160px;
  min-width: 0;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid var(--linie);
  border-radius: 10px;
  background: var(--flaeche2);
  font-size: 16px;
  color: var(--text);
}

.fazit-knoepfe {
  display: none;
  flex-wrap: wrap;
  gap: 8px;
}

.koffer-knopf {
  flex: 0 0 auto;
  min-width: 120px;
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 10px;
  border: 1px solid var(--linie);
  background: var(--flaeche);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
}

.koffer-knopf[data-status="testen"] {
  background: var(--akzent-hell);
  border-color: var(--akzent);
  color: var(--akzent);
}

.koffer-knopf[data-status="bewaehrt"] {
  background: var(--akzent);
  border-color: var(--akzent);
  color: var(--akzent-text);
}

.aktuell-markierung {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  color: var(--akzent);
}

/* Filter */
.suche-zeile {
  display: flex;
  gap: 8px;
  margin: 12px 0;
  align-items: center;
}

/* Suchfeld nimmt den Platz, der Filter-Knopf bleibt so schmal wie nötig. */
.suche-zeile input {
  flex: 1 1 auto;
  min-width: 0;
}

.suche-zeile button {
  flex: 0 0 auto;
  width: auto;
}

.filter-feld {
  background: var(--flaeche);
  border: 1px solid var(--linie);
  border-radius: 14px;
  padding: 16px;
  margin: 12px 0;
}

.filter-gruppe {
  margin-bottom: 16px;
}

.filter-gruppe b {
  display: block;
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 8px;
}

.treffer {
  font-size: 16px;
  color: var(--leise);
  margin: 8px 0;
}

/* Formulare */
input,
select,
textarea {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--linie);
  background: var(--flaeche);
  font-size: 17px;
  color: var(--text);
  margin: 6px 0;
}

textarea {
  min-height: 96px;
  resize: vertical;
}

input::placeholder,
textarea::placeholder {
  color: var(--leise);
  opacity: 1;
}

.feld {
  display: block;
  margin: 12px 0;
  font-weight: 600;
  font-size: 16px;
}

.feld span {
  display: block;
  font-weight: 700;
}

.feld small {
  display: block;
  color: var(--leise);
  font-weight: 400;
  font-size: 16px;
}

.notiz-feld {
  display: block;
  margin: 12px 0;
}

.notiz-feld span {
  display: block;
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 6px;
}

.check {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 16px 0;
  font-size: 16px;
}

.check input[type="checkbox"] {
  width: 22px;
  height: 22px;
  min-width: 22px;
  min-height: 22px;
  accent-color: var(--akzent);
}

/* Skill-Listen und Details */
.schritte {
  padding-left: 22px;
  margin: 8px 0 16px;
}

.schritte li {
  margin: 8px 0;
  padding-left: 4px;
  line-height: 1.5;
}

.schritt-gross {
  font-size: 22px;
  line-height: 1.4;
  margin: 8px 0 18px;
}

.info-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}

.info-chips span {
  background: var(--flaeche2);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 16px;
  color: var(--text);
}

.art-zeile,
.wofuer {
  margin: 4px 0;
  color: var(--leise);
  font-size: 16px;
}

.verlauf {
  list-style: none;
  padding: 0;
  margin: 6px 0;
}

.verlauf li {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px 0;
  border-bottom: 1px solid var(--linie);
  font-size: 16px;
}

.verlauf li .text-knopf {
  align-self: flex-start;
}

/* Übungen */
.uebung-leiste {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}

.uebung-status {
  font-size: 16px;
  color: var(--leise);
  margin: 8px 0;
}

.segmente {
  list-style: decimal;
  padding-left: 24px;
  margin: 16px 0;
}

.segmente li {
  margin: 12px 0;
  padding: 12px 14px;
  border-left: 4px solid transparent;
  border-radius: 0 12px 12px 0;
  line-height: 1.5;
  font-size: 17px;
}

.segmente li.jetzt,
.segmente li[aria-current="step"] {
  background: var(--akzent-hell);
  border-left-color: var(--akzent);
  font-weight: 700;
}

.uebung-ende {
  margin-top: 16px;
}

/* Spannung */
.spannungs-skala {
  display: flex;
  flex-wrap: nowrap;
  gap: 4px;
  margin: 16px 0;
}

.skala-feld {
  /* Breite kommt als Prozent inline; schrumpfen erlaubt, damit die Lücken passen. */
  flex: 0 1 auto;
  min-width: 0;
  overflow-wrap: anywhere;
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  padding: 8px;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  background: var(--flaeche2);
  border: 2px solid transparent;
  text-align: center;
}

.skala-feld:nth-child(1) {
  background: var(--akzent-hell);
}

.skala-feld:nth-child(2) {
  background: var(--skala-mittel);
}

.skala-feld:nth-child(3) {
  background: var(--skala-hoch);
}

:root[data-look="dunkel"] .skala-feld:nth-child(2) {
  background: var(--skala-mittel-dunkel);
}

:root[data-look="dunkel"] .skala-feld:nth-child(3) {
  background: var(--skala-hoch-dunkel);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-look="hell"]) .skala-feld:nth-child(2) {
    background: var(--skala-mittel-dunkel);
  }
  :root:not([data-look="hell"]) .skala-feld:nth-child(3) {
    background: var(--skala-hoch-dunkel);
  }
}

.skala-feld.aktiv {
  border-color: var(--text);
  border-width: 3px;
}

.zone-anzeige {
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  margin: 16px 0;
}

.regler-zeile {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 12px 0;
  flex-wrap: wrap;
}

.regler-zeile input[type="range"] {
  flex: 1 1 200px;
}

.regler-wert {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  min-width: 44px;
  text-align: center;
}

/* Bereichs-Infos */
.hoch-bereich,
.bereich-infos {
  margin: 16px 0;
}

/* Hilfe */
.notruf {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px 14px;
  margin: 8px 0;
  border-radius: 14px;
  background: var(--flaeche);
  border: 1px solid var(--linie);
  color: var(--text);
  text-decoration: none;
}

.notruf-kopf {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: 12px;
}

.notruf b {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.3;
}

.notruf span {
  font-size: 16px;
  font-weight: 600;
}

.notruf small {
  font-size: 16px;
  color: var(--leise);
}

.notruf.notfall {
  background: var(--notfall);
  border-color: var(--notfall);
  color: #ffffff;
}

/* Im Notfall-Feld erbt auch der Zweck die helle Schrift, sonst zu wenig Kontrast. */
.notruf.notfall small,
.notruf.notfall span {
  color: inherit;
}

:root[data-look="dunkel"] .notruf.notfall {
  color: #2a0909;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-look="hell"]) .notruf.notfall {
    color: #2a0909;
  }
}

/* Zeigen */
.zeigen,
.zeigen-satz {
  font-size: 32px;
  line-height: 1.3;
  font-weight: 600;
  text-align: center;
  margin: 32px 16px;
  color: var(--text);
}

/* Toast */
.toast {
  position: fixed;
  bottom: calc(16px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--grund);
  padding: 12px 20px;
  border-radius: 999px;
  font-size: 16px;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  max-width: calc(100vw - 32px);
  text-align: center;
}

.toast.sichtbar {
  opacity: 1;
}

/* Dialog */
.dialog-grund {
  position: fixed;
  inset: 0;
  background: var(--dialog-overlay);
  display: grid;
  place-items: center;
  z-index: 80;
  padding: 16px;
}

.dialog[role="dialog"] {
  background: var(--flaeche);
  color: var(--text);
  border-radius: 18px;
  padding: 20px;
  width: 100%;
  max-width: 420px;
  max-height: 85vh;
  overflow: auto;
}

/* Details */
details.details-feld {
  border: 1px solid var(--linie);
  border-radius: 14px;
  padding: 4px 16px;
  margin: 12px 0;
  background: var(--flaeche);
}

summary {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 0;
  font-weight: 600;
  font-size: 17px;
  color: var(--text);
  cursor: pointer;
  list-style: none;
}

summary::-webkit-details-marker {
  display: none;
}

summary::before {
  content: "";
  width: 0;
  height: 0;
  border-left: 6px solid var(--akzent);
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
  margin-right: 4px;
  transition: transform 0.2s ease;
}

details[open] summary::before {
  transform: rotate(90deg);
}

/* Warnhinweis-Leiste */
.hinweis-leiste {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: var(--warnung-grund);
  color: var(--warnung-text);
  padding: 8px 16px;
  font-size: 16px;
  text-align: center;
  z-index: 90;
}

/* Responsive Anpassungen */
@media (min-width: 600px) {
  .aktuell-kacheln {
    grid-template-columns: 1fr 1fr;
  }

  .fazit-knoepfe {
    display: flex;
  }

  .fazit-wahl {
    display: none;
  }
}

@media (max-width: 599px) {
  .fazit-wahl {
    display: block;
  }

  .fazit-knoepfe {
    display: none;
  }
}

/* Reduzierte Bewegung */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Nachträge nach Sichtprüfung der Bildschirmfotos */
/* Stern „aktueller Skill“ oben rechts in der Zeile statt in eigener Reihe. */
.skill-zeile { position: relative; }
.skill-zeile .aktuell-markierung { position: absolute; top: 6px; right: 6px; }
.skill-zeile .zeile-kopf { padding-right: 52px; }
/* Symbol im Koffer-Knopf in Knopffarbe, sonst zu blass auf gefülltem Grund. */
.koffer-knopf .sym, .koffer-knopf .sym.klein { color: inherit; }
/* Zeilen, in denen Titel und Unterzeile direkt im Knopf stehen (ohne .zeile-text):
   untereinander statt nebeneinander, Pfeil rechts. */
.zeile:has(> b) {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  column-gap: 12px;
  align-items: center;
  text-align: left;
}
.zeile:has(> b) > b { grid-column: 1; }
.zeile:has(> b) > small { grid-column: 1; color: var(--leise); }
.zeile:has(> b) > .sym { grid-column: 2; grid-row: 1 / span 2; }

<script>
// NEXT Modul "Skills & Achtsamkeit", Fassung 1.
//
// Eine Einzeldatei ohne Bibliotheken, ohne Netz, ohne fetch, ohne CDN.
// Sie wird nach inhalte-skills.js geladen, das window.NEXT_SKILLS_INHALT
// setzt. Die App rendert HTML-Strings in <div id="app"></div> und nutzt
// Hash-Navigation, damit die Zurück-Taste des Handys funktioniert.
//
// Wichtige Grundsätze:
//   - Jede Ansicht hat EINE Hauptaktion, alles andere bleibt ruhiger.
//   - Nichts verlangt eine Bewertung, nichts zieht Punkte ab.
//   - Hilfe ist nie gesperrt: Der Hilfe-Knopf steht in der Kopfzeile.
//   - Alle sichtbaren Texte sind Deutsch, Du-Form, kurz, sachlich, ohne
//     Emojis, ohne Punkte oder Level, ohne Ausrufezeichen-Rhetorik.
//   - Der Zustand liegt in localStorage unter dem Schlüssel next-skills-v1.

(function () {
  "use strict";

  const I = window.NEXT_SKILLS_INHALT;
  const SPEICHER = "next-skills-v1";
  const ALT_SPEICHER = "next-v4";

  // ---------------------------------------------------------------- Zustand

  function leererZustand() {
    return {
      version: 1,
      profil: { eingerichtet: false, look: "auto", anzahlAktuelle: 3, tempo: 0.9 },
      aktuelle: [],
      einstellungen: {},
      erfahrungen: [],
      eigene: [],
      ketten: [],
      karten: [],
      entwuerfe: {},
      spannung: { grenze1: 30, grenze2: 70, fruehwarn: { niedrig: [], mittel: [], hoch: [] } },
      hilfe: { kontakte: [], plan: { warnsignale: "", selbst: "", kontakt: "", unsicher: "", wege: "" } },
      fach: { skillDerWoche: "", hinweis: "" },
      migriertAus: null
    };
  }

  let S = null;
  let speicherKaputt = false;

  // Fehlende oder falsch typisierte Felder aus dem leeren Zustand nachtragen,
  // damit ältere Sicherungen oder halbe Importe nie zum Absturz führen.
  function ergaenzen(z) {
    const leer = leererZustand();
    if (!z || typeof z !== "object") return leer;
    if (z.version !== 1) z.version = 1;

    // Zwei Ebenen tief auffüllen, aber nur wenn der Typ nicht passt oder fehlt.
    for (const k of Object.keys(leer)) {
      if (z[k] === undefined || z[k] === null || typeof z[k] !== typeof leer[k]) {
        z[k] = leer[k];
        continue;
      }
      if (typeof leer[k] === "object" && !Array.isArray(leer[k]) && leer[k] !== null) {
        for (const k2 of Object.keys(leer[k])) {
          if (z[k][k2] === undefined || z[k][k2] === null || typeof z[k][k2] !== typeof leer[k][k2]) {
            z[k][k2] = leer[k][k2];
          }
        }
      }
    }

    // Profil-Grenzen setzen.
    if (!z.profil) z.profil = { eingerichtet: false, look: "auto", anzahlAktuelle: 3, tempo: 0.9 };
    if (z.profil.anzahlAktuelle === undefined) z.profil.anzahlAktuelle = 3;
    z.profil.anzahlAktuelle = Math.max(3, Math.min(5, Number(z.profil.anzahlAktuelle) || 3));
    if (z.profil.tempo === undefined) z.profil.tempo = 0.9;

    // Spannungsgrenzen klemmen und Reihenfolge sichern.
    if (!z.spannung) z.spannung = { grenze1: 30, grenze2: 70, fruehwarn: { niedrig: [], mittel: [], hoch: [] } };
    z.spannung.grenze1 = Math.max(5, Math.min(90, Number(z.spannung.grenze1) || 30));
    z.spannung.grenze2 = Math.max(10, Math.min(95, Number(z.spannung.grenze2) || 70));
    if (z.spannung.grenze1 >= z.spannung.grenze2 - 4) {
      z.spannung.grenze1 = Math.max(5, z.spannung.grenze2 - 5);
    }
    if (!z.spannung.fruehwarn) z.spannung.fruehwarn = { niedrig: [], mittel: [], hoch: [] };
    for (const b of ["niedrig", "mittel", "hoch"]) {
      if (!Array.isArray(z.spannung.fruehwarn[b])) z.spannung.fruehwarn[b] = [];
    }

    if (!Array.isArray(z.aktuelle)) z.aktuelle = [];
    if (!Array.isArray(z.erfahrungen)) z.erfahrungen = [];
    if (!Array.isArray(z.eigene)) z.eigene = [];
    if (!Array.isArray(z.ketten)) z.ketten = [];
    if (!Array.isArray(z.karten)) z.karten = [];
    if (!z.entwuerfe || typeof z.entwuerfe !== "object") z.entwuerfe = {};
    if (!z.einstellungen || typeof z.einstellungen !== "object") z.einstellungen = {};
    if (!z.hilfe) z.hilfe = { kontakte: [], plan: { warnsignale: "", selbst: "", kontakt: "", unsicher: "", wege: "" } };
    if (!Array.isArray(z.hilfe.kontakte)) z.hilfe.kontakte = [];
    if (!z.hilfe.plan) z.hilfe.plan = { warnsignale: "", selbst: "", kontakt: "", unsicher: "", wege: "" };
    if (!z.fach) z.fach = { skillDerWoche: "", hinweis: "" };

    return z;
  }

  // Übernahme aus der älteren Fassung next-v4. Defensiv prüfen, nie abstürzen.
  function uebernehmeV4(z, alt) {
    if (!alt || typeof alt !== "object") return;

    // Profil-Look: "ruhig" war hell, "nacht"/"neon" war dunkel.
    if (alt.profil && alt.profil.look) {
      const l = String(alt.profil.look);
      if (l === "ruhig") z.profil.look = "hell";
      else if (l === "nacht" || l === "neon") z.profil.look = "dunkel";
    }

    // Favoriten aus alt.skills.favoriten.
    const altSkills = alt.skills || {};
    const favoriten = Array.isArray(altSkills.favoriten) ? altSkills.favoriten : [];
    for (const id of favoriten) {
      const sk = (I.SKILLS || []).find(s => s.id === id);
      if (sk) {
        if (!z.einstellungen[id]) z.einstellungen[id] = { koffer: "nicht", fazit: null, bereiche: [], notiz: "", sort: 0 };
        z.einstellungen[id].koffer = "bewaehrt";
      }
    }

    // SOS-Ids nach aktuelle und bereiche "hoch".
    const sos = Array.isArray(altSkills.sos) ? altSkills.sos : [];
    const gueltigeSos = sos.filter(id => (I.SKILLS || []).some(s => s.id === id));
    for (const id of gueltigeSos) {
      if (!z.einstellungen[id]) z.einstellungen[id] = { koffer: "nicht", fazit: null, bereiche: [], notiz: "", sort: 0 };
      if (!z.einstellungen[id].bereiche) z.einstellungen[id].bereiche = [];
      if (!z.einstellungen[id].bereiche.includes("hoch")) z.einstellungen[id].bereiche.push("hoch");
      // Ein Notfall-Skill aus NEXT 4 war erprobt, also gehört er zu „bewährt“.
      if (z.einstellungen[id].koffer === "nicht") z.einstellungen[id].koffer = "bewaehrt";
      if (!z.aktuelle.includes(id)) z.aktuelle.push(id);
    }
    if (z.aktuelle.length > 5) z.aktuelle = z.aktuelle.slice(0, 5);
    if (z.aktuelle.length > 0) {
      z.profil.anzahlAktuelle = Math.max(3, Math.min(5, z.aktuelle.length));
    }

    // Eigene Skills und Team-Skills übernehmen.
    const alteEigene = [].concat(altSkills.eigene || [], altSkills.team || []);
    for (const ae of alteEigene) {
      if (!ae || typeof ae !== "object" || !ae.id) continue;
      z.eigene.push({
        id: neueId(),
        title: String(ae.name || "Eigener Skill"),
        shortPurpose: String(ae.wann || ""),
        instructions: Array.isArray(ae.schritte) ? ae.schritte.map(s => String(s)) : [],
        bereiche: [],
        koffer: "bewaehrt",
        sort: z.eigene.length,
        erstellt: new Date().toISOString()
      });
    }

    // Versuche nach Erfahrungen.
    const versuche = Array.isArray(altSkills.versuche) ? altSkills.versuche : [];
    for (const v of versuche) {
      if (!v || typeof v !== "object" || !v.id) continue;
      const wirkung = v.wirkung || {};
      const helpfulnessMap = { ja: "geholfen", etwas: "teilweise", nein: "nicht" };
      const pleasantnessMap = { ja: "ja", etwas: "etwas", nein: "nein" };
      z.erfahrungen.push({
        id: neueId(),
        skillId: v.skillId || null,
        uebungId: null,
        timestamp: v.datum || new Date().toISOString(),
        entryMode: "retrospective",
        helpfulness: helpfulnessMap[wirkung.wieder] || null,
        tensionBefore: zahl(v.vorher),
        tensionAfter: zahl(v.nachher),
        pleasantness: pleasantnessMap[wirkung.angenehm] || null,
        functionalBenefit: helpfulnessMap[wirkung.weitermachen] || null,
        situationTag: String(v.situation || ""),
        note: String(v.notiz || "")
      });
    }

    // Fazit aus dem letzten Versuch je Skill setzen.
    for (const v of z.erfahrungen) {
      if (!v.skillId || !v.helpfulness) continue;
      const vorhanden = z.erfahrungen.filter(e => e.skillId === v.skillId).sort((a, b) => a.timestamp.localeCompare(b.timestamp));
      const letzter = vorhanden[vorhanden.length - 1];
      if (letzter && letzter.id === v.id && letzter.helpfulness) {
        if (!z.einstellungen[v.skillId]) z.einstellungen[v.skillId] = { koffer: "nicht", fazit: null, bereiche: [], notiz: "", sort: 0 };
        z.einstellungen[v.skillId].fazit = letzter.helpfulness;
      }
    }

    // Kontakte übernehmen.
    const alteKontakte = alt.hilfe && Array.isArray(alt.hilfe.kontakte) ? alt.hilfe.kontakte : [];
    for (const c of alteKontakte) {
      if (c && c.name) {
        z.hilfe.kontakte.push({ id: neueId(), name: String(c.name), rolle: String(c.rolle || ""), telefon: String(c.telefon || "") });
      }
    }

    // Warnzeichen nach Selbst-Teil des Plans.
    const warnzeichen = alt.hilfe && Array.isArray(alt.hilfe.warnzeichen) ? alt.hilfe.warnzeichen : [];
    z.hilfe.plan.warnsignale = warnzeichen.filter(x => typeof x === "string").join(", ");

    // Stufen nach Plan übernehmen.
    if (alt.hilfe && alt.hilfe.stufen) {
      const st = alt.hilfe.stufen;
      if (st.warn) z.hilfe.plan.selbst = String(st.warn);
      if (st.schwer) z.hilfe.plan.kontakt = String(st.schwer);
      if (st.notfall) z.hilfe.plan.unsicher = String(st.notfall);
    }
  }

  function laden() {
    let roh = null;
    try { roh = localStorage.getItem(SPEICHER); } catch (e) { speicherKaputt = true; }
    if (roh) {
      try {
        const z = JSON.parse(roh);
        const erg = ergaenzen(z);
        S = erg;
        return;
      } catch (e) {
        // Kaputtes JSON: neu anfangen, ohne die alten Daten zu lesen.
        S = leererZustand();
        return;
      }
    }

    const z = leererZustand();
    try {
      const alt = localStorage.getItem(ALT_SPEICHER);
      if (alt) {
        const altDaten = JSON.parse(alt);
        uebernehmeV4(z, altDaten);
        z.migriertAus = "next-v4";
        z.profil.eingerichtet = true;
      }
    } catch (e) {
      // Alte Daten unlesbar, dann ohne sie starten.
    }
    S = z;
    if (z.migriertAus) speichern();
  }

  function speichern() {
    try {
      localStorage.setItem(SPEICHER, JSON.stringify(S));
      speicherKaputt = false;
    } catch (e) {
      speicherKaputt = true;
    }
  }

  // ---------------------------------------------------------------- Helfer

  function neueId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function zahl(x) {
    const n = Number(x);
    return Number.isFinite(n) ? Math.max(0, Math.min(100, Math.round(n))) : null;
  }
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function dauerText(sek) {
    const s = Number(sek);
    if (!s || s < 60) return "unter 1 Min.";
    return "ca. " + Math.round(s / 60) + " Min.";
  }
  function bereichVon(wert) {
    const n = Number(wert);
    if (!Number.isFinite(n)) return null;
    if (n < S.spannung.grenze1) return "niedrig";
    if (n < S.spannung.grenze2) return "mittel";
    return "hoch";
  }
  function bereichName(id) {
    const b = (I.BEREICHE || []).find(x => x.id === id);
    return b ? b.name : id;
  }
  function normiereSuche(s) {
    return String(s || "").toLowerCase().replace(/[\s\-_]/g, "");
  }
  function datumKurz(iso) {
    try {
      return new Date(iso).toLocaleDateString("de-DE", { day: "numeric", month: "short" });
    } catch (e) {
      return "";
    }
  }
  function telLink(nummer) {
    return "tel:" + String(nummer || "").replace(/[^0-9+]/g, "");
  }

  // Liefert für einen Verweis {ref, typ, titel, zweck, ziel} oder null.
  // Verweise auf gelöschte Einträge werden still übersprungen.
  function eintrag(ref) {
    if (!ref) return null;
    const s = String(ref);

    if (s.startsWith("eigen:")) {
      const id = s.slice(6);
      const e = S.eigene.find(x => x.id === id);
      if (!e) return null;
      return { ref: s, typ: "eigen", titel: e.title, zweck: e.shortPurpose, ziel: "#eigen/" + id };
    }
    if (s.startsWith("kette:")) {
      const id = s.slice(6);
      const k = S.ketten.find(x => x.id === id);
      if (!k) return null;
      return { ref: s, typ: "kette", titel: k.title, zweck: k.purpose, ziel: "#kette-start/" + id };
    }
    if (s.startsWith("karte:")) {
      const id = s.slice(6);
      const k = S.karten.find(x => x.id === id);
      if (!k) return null;
      return { ref: s, typ: "karte", titel: interaktiverTitel(k), zweck: "Gespeicherte Karte", ziel: "#karte/" + id };
    }

    const sk = (I.SKILLS || []).find(x => x.id === s);
    if (!sk) return null;
    return { ref: s, typ: "skill", titel: sk.title, zweck: sk.shortPurpose, ziel: "#skill/" + s };
  }

  function interaktivesBlatt(id) {
    return (I.INTERAKTIV || []).find(x => x.id === id) || null;
  }

  function interaktiverTitel(k) {
    const ia = interaktivesBlatt(k && k.type);
    const titel = ia ? ia.titel : (k && k.type ? k.type : "Karte");
    const werte = Object.values((k && k.answers) || {});
    const erst = werte.find(v => {
      if (Array.isArray(v)) return v.length > 0;
      if (typeof v === "object" && v !== null) {
        return (Array.isArray(v.wahl) && v.wahl.length > 0) || (typeof v.text === "string" && v.text.trim() !== "");
      }
      return typeof v === "string" && v.trim() !== "";
    });
    if (erst !== undefined) {
      const text = Array.isArray(erst) ? erst.join(", ") : (typeof erst === "object" ? ((erst.wahl || []).concat(erst.text ? [erst.text] : []).join(", ")) : String(erst));
      if (text) return titel + ": " + text;
    }
    return titel;
  }

  function kofferStatusText(status) {
    const st = status || "nicht";
    if (st === "testen") return "Testen";
    if (st === "bewaehrt") return "Bewährt";
    return "Merken";
  }

  function istImKoffer(id) {
    const e = S.einstellungen[id];
    return !!e && (e.koffer === "testen" || e.koffer === "bewaehrt");
  }

  function istUnbewertet(id) {
    const e = S.einstellungen[id];
    return !e || !e.fazit;
  }

  // ---------------------------------------------------------------- Toast und Dialog

  function toast(text) {
    let el = document.querySelector(".toast");
    if (!el) {
      el = document.createElement("div");
      el.className = "toast";
      el.setAttribute("role", "status");
      el.setAttribute("aria-live", "polite");
      el.setAttribute("data-t", "toast");
      document.body.appendChild(el);
    }
    el.textContent = text;
    el.classList.add("sichtbar");
    setTimeout(() => el.classList.remove("sichtbar"), 1800);
  }

  function dialog(inhalt, jaText, beiJa, neinText) {
    const d = document.createElement("div");
    d.className = "dialog-grund";
    d.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">
      ${inhalt}
      <div class="knopf-reihe">
        ${jaText
          ? `<button class="knopf" data-t="dialog-nein">${esc(neinText || "Abbrechen")}</button>
             <button class="knopf haupt" data-t="dialog-ja">${esc(jaText)}</button>`
          : `<button class="knopf haupt" data-t="dialog-nein">Okay</button>`}
      </div>
    </div>`;
    d.addEventListener("click", e => {
      if (e.target === d) { d.remove(); return; }
      const b = e.target.closest("[data-t]");
      if (!b) return;
      if (b.dataset.t === "dialog-ja") { d.remove(); if (beiJa) beiJa(); }
      if (b.dataset.t === "dialog-nein") { d.remove(); }
    });
    d.addEventListener("keydown", e => {
      if (e.key === "Escape") d.remove();
    });
    document.body.appendChild(d);
    const k = d.querySelector('[data-t="dialog-ja"]') || d.querySelector('[data-t="dialog-nein"]');
    if (k) k.focus();
  }

  // ---------------------------------------------------------------- Symbole

  const SYM = {
    zurueck: '<path d="M15 18l-6-6 6-6"/>',
    weiter: '<path d="M9 18l6-6-6-6"/>',
